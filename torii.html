<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torii lab</title>
<!--
  TORII LAB — the test bed for the winter scene's torii gates (step 9a), before they go into newwinter.html.
  The trodden snow path and the snow ground round it are newwinter.html's own (winterpath.js, winterlake.js, the
  same values and the same camera: the eye 3 m above the snow, the 22° lens), so what is tuned here fits there.
  The gates are wintertorii.js. The sky here is only a plain stand-in.
  Views: "Close-up" stands the same camera nearer the gates, turned to look up the path; "As in the winter scene" is
  exactly newwinter.html's view (the path in the lower left, the horizon at 2/3).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d4dae6; font: 14px/1.35 system-ui, sans-serif; }
  canvas#c { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; }
  #sp { position: fixed; right: 10px; top: 10px; width: 330px; max-height: calc(100vh - 20px); overflow: auto; background: rgba(255,255,255,0.92);
        border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.25); padding: 0 12px 12px; }
  #sp.min { width: auto; } #sp.min .body { display: none; }
  #sp .head { position: sticky; top: 0; background: rgba(255,255,255,0.97); padding: 10px 0 6px; display: flex; gap: 6px; align-items: center; }
  #sp .head b { flex: 1; }
  #sp button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #aab; background: #f4f5f9; }
  #sp h4 { margin: 12px 0 4px; font-size: 13px; color: #534; border-top: 1px solid #ddd; padding-top: 8px; }
  #sp label { display: block; margin: 6px 0 2px; font-size: 12.5px; color: #333; }
  #sp label span { float: right; color: #666; font-variant-numeric: tabular-nums; }
  #sp input[type=range] { width: 100%; height: 26px; }
  #sp select { width: 100%; font: inherit; padding: 4px; }
  #msg { position: fixed; left: 10px; bottom: 10px; background: rgba(255,255,255,0.85); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
</style>
<script src="winterpath.js"></script>
<script src="winterlake.js"></script>
<script src="wintertorii.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="sp"><div class="head"><b>Torii lab</b><button id="copy">Copy values</button><button id="reset">Reset</button><button id="fold">–</button></div><div class="body" id="body"></div></div>
<script>
'use strict';
var PI = Math.PI;
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

/* ============================================================
   1. VALUES. The scene's (light, snow ground, path) are newwinter.html's defaults; the gates' are new.
   ============================================================ */

  moonLight: 0.45, blueShade: 0.6,

  fieldHaze: 1, fieldHazeDist: 260, fieldGlow: 0.6,

  trail1X: 0.1578, trail1Y: 0.9931, trail2X: 0.1036, trail2Y: 0.8862, trail3X: 0.1138, trail3Y: 0.7944, trail4X: 0.1678, trail4Y: 0.7387,
  trail5X: 0.2329, trail5Y: 0.7187, trailWidth: 4, trailDepth: 0.3, trailWall: 0.22, trailBerm: 0.03, trailWobble: 0.45, trailTrod: 1,
  trailGrey: 0.5, trailShadow: 1, trailBounce: 0.65,
  // the gates
  gates: 3, gateFirst: 29, gateGap: 28, gateClear: 0.25, gateHeight: 1.45, gateDia: 0.11, gateLean: 1.5, gateSori: 0.045,
  gateOverhang: 0.39, gateNuki: 0.73, gateNemaki: 0.13, gateDaiwa: false, gateKusabi: true, gatePlaque: false, gateKasagiBlack: true,
  gateWeather: 1, gateVivid: 0.5, gateSoft: 0.35, gateHaze: 1, gateShadow: 1, gateFootShade: 1, gateFootSnow: 1, gateAir: 0, gateDof: 0, gateArrange: false,

/* ============================================================
   2. THE LIGHT (newwinter.html's sceneLight and shadeColour)
   ============================================================ */
var COND_SUN = { clear: 1, partly: 0.85, thin: 0.7, cloudy: 0.3, mist: 0.5, snow: 0.22 };
function isNight() { return V.timeOfDay === 'night'; }
function light(c) {

}
var LT = null, SHADE = null;
function sceneLight() {
  var tod = V.timeOfDay, el = V.sunElevation, sun = [255, 247, 236], sky = [178, 196, 226], sS = V.sunStrength, amb = V.ambient;
  if (tod === 'evening') { sun = [255, 156, 96]; sky = [164, 152, 198]; el = V.eveningElevation; }
  else if (tod === 'night') { sun = [150, 168, 225]; sky = [64, 76, 124]; el = 36; sS *= V.moonLight; amb *= 0.8; }
  var cs = COND_SUN[V.condition]; if (cs === undefined) cs = 1;

  return { el: el, vis: cs * (tod === 'night' ? 0.45 : 1), dir: [Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)],

}
function shadeColour() {
  var sk = LT.sky, L = (sk[0] + sk[1] + sk[2]) / 3, b = V.blueShade, sn = hex(V.colours.snow);
  var c = [sk[0] + (L * 0.8 - sk[0]) * b, sk[1] + (L * 0.94 - sk[1]) * b, sk[2] + (L * 1.2 - sk[2]) * b];
  return [clamp(sn[0] * c[0] * LT.amb * 0.92, 0, 255), clamp(sn[1] * c[1] * LT.amb * 0.92, 0, 255), clamp(sn[2] * c[2] * LT.amb * 0.92, 0, 255)];
}
function groundHaze() { return light(mix(hex(V.colours.mist), [214, 224, 242], 0.85)); }

/* ============================================================
   3. THE CAMERA, THE PATH AND WHERE THE GATES STAND
   The path is newwinter.html's: its five points on that screen, put on the snow through that camera (m: x right of
   the eye, z away from it), on 14 m back toward you, and on beyond the last point (where newwinter.html's runs on to
   the hall). The close-up stands the same camera (same eye height, same lens) nearer the gates, turned up the path.
   ============================================================ */
var cv = document.getElementById('c'), ctx = cv.getContext('2d');

function lensF() { return H / (2 * Math.tan(V.lens * PI / 360)); }
function sceneY(f) { var h = V.sceneHorizon, R = 0.655; return f <= R ? f * h / R : h + (f - R) * (1 - h) / (1 - R); }   // newwinter's blkY
function pathWorld() {
  var hy = H * V.sceneHorizon, F = lensF(), pts = [];
  for (var n = 1; n <= 5; n++) {
    var px = V['trail' + n + 'X'] * W, py = sceneY(V['trail' + n + 'Y']) * H, dd = Math.max(4, py - hy), z = V.eyeHeight * F / dd;
    pts.push([(px - W / 2) * z / F, z]);

  pts.unshift([pts[0][0] + dx / dl * 14, Math.max(2, pts[0][1] + dz / dl * 14)]);
  var a = pts[pts.length - 2], b = pts[pts.length - 1], ex = b[0] - a[0], ez = b[1] - a[1], el = Math.hypot(ex, ez) || 1;
  pts.push([b[0] + ex / el * 10, b[1] + ez / el * 10], [b[0] + ex / el * 24, b[1] + ez / el * 24]);

}
function pathOpts(pts) {
  return { pts: pts, width: V.trailWidth, depth: V.trailDepth, wall: V.trailWall, berm: V.trailBerm, wobble: V.trailWobble, trod: V.trailTrod, endHalf: 0, seed: V.seed * 13 + 5 };
}
var VIEW = null;
/* The gates behind the first are moved a little along the path (up to 12 m either way, half a metre at a time) to where,
   seen from this camera, no part of one peeps out from behind a nearer gate as a thin sliver (a strip of its black top
   beam just under the tie beam in front, a beam's tip beside a pillar), and none of its uprights (pillars, centre post)
   lines up with or just grazes one of a nearer gate (two in a line read as one piece). Each candidate place: the gate's
   outline drawn into a small mask, compared with the nearer gates' outlines; the least such trouble wins, the smallest
   move breaking ties. Gate 1 stays where it is. */
function arrangeGates(TW, gates, toCam, dirCam, hy, F) {

  var cam = { W: W, H: H, hy: hy, F: F, eye: V.eyeHeight }, sc = 0.5, mw = Math.ceil(W * sc), mh = Math.ceil(H * sc);
  var cnv = document.createElement('canvas'); cnv.width = mw; cnv.height = mh;
  var c = cnv.getContext('2d', { willReadFrequently: true });

    var q = TW.at(s), q0 = TW.at(s - 1.5), q1 = TW.at(s + 1.5), tx = q1[0] - q0[0], tz = q1[1] - q0[1], tl = Math.hypot(tx, tz) || 1;
    var w = { x: q[0], z: q[1], fx: tx / tl, fz: tz / tl, s: s }, p = toCam(w.x, w.z), f = dirCam(w.fx, w.fz);

  // gate behind peeping out just under or beside one in front

      for (dn = 1; dn <= TH; dn++) { var j2 = k + dn * mw; if (!m[j2] || near[j2]) { od = near[j2] === 1; break; } }
      for (l = 1; l <= TH; l++) { var j3 = k - l; if (!m[j3] || near[j3]) { ol = near[j3] === 1; break; } }
      for (r = 1; r <= TH; r++) { var j4 = k + r; if (!m[j4] || near[j4]) { orr = near[j4] === 1; break; } }

  // either hidden or show at least three quarters of its height (a band of black peeping out under a tie beam in front)
  function peep(km) {

    var KT = 0, VT = 0;
    for (var i = 0; i < km.length; i++) if (km[i]) { KT++; if (!near[i]) VT++; }

    var cost = 0;

      nearMem.forEach(function (b) {
        var ov = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
        if (ov < -6) return;                                                   // a clear gap between: fine
        var inside = a.x0 >= b.x0 - 0.5 && a.x1 <= b.x1 + 0.5 && a.y0 >= b.y0 - 2 && a.y1 <= b.y1 + 2;   // wholly behind it: hidden
        if (inside) return;

  // does, each gate behind is moved on its own
  var GS = gates.map(function (g, k) { return gateShape(k); });

    near.fill(0); nearMem.length = 0;

      for (var i = 0; i < near.length; i++) if (m[i]) near[i] = 1;

        var pl = placeAt(s); if (pl.cam.z < 2) continue;

var ARR = [];
function setupView() {

  for (var s = 0; s < TW.length; s += 0.25) { var p = TW.at(s), e = Math.abs(p[1] - V.gateFirst); if (e < best) { best = e; s0 = s; } }

    var q = TW.at(sg), q0 = TW.at(sg - 1.5), q1 = TW.at(sg + 1.5), tx = q1[0] - q0[0], tz = q1[1] - q0[1], tl = Math.hypot(tx, tz) || 1;

/* ============================================================
   4. THE SNOW GROUND WITH THE PATH (winterlake.js, as newwinter.html bakes it), a few rows a frame
   ============================================================ */
function mk() { var c = document.createElement('canvas'); return { cnv: c, c: c.getContext('2d') }; }
var FIELD = mk(), FIELDN = mk(), FJ = null, fieldOK = false, FT0 = 0, fieldMs = 0;
function startField() {
  var hy = VIEW.hy, F = VIEW.F;
  var shore = WinterLake.shore([[W + 40, H + 40], [W + 90, H + 40], [W + 90, H + 90], [W + 40, H + 90]],
                               { W: W, H: H, hy: hy, F: F, eye: V.eyeHeight, drop: 0.25, wobble: 0, seed: V.seed });   // (no lake: off the screen)
  var Lc = VIEW.Lc, sunX = Lc[2] > 0.05 ? clamp(W / 2 + F * Lc[0] / Lc[2], -W, 2 * W) : (Lc[0] < 0 ? -W : 2 * W);
  var T = WinterPath.build(pathOpts(VIEW.pts));
  var o = { W: W, H: H, PR: PR, hy: hy, F: F, eye: V.eyeHeight, res: 0.6, shore: shore,
    light: { dir: [Lc[0], Lc[1], -Lc[2]], sun: LT.sun, vis: LT.vis }, snow: hex(V.colours.snow), shade: SHADE, mist: light(hex(V.colours.mist)),
    groundMist: groundHaze(), earth: light(hex(V.colours.bankEarth)), sunX: sunX, sunRGB: LT.sunRGB,
    swell: V.fieldSwell, drifts: V.fieldDrifts, grain: V.fieldGrain, sparkle: V.fieldSparkle * (isNight() ? 0.15 : 1),
    haze: V.fieldHaze, hazeM: V.fieldHazeDist, glow: V.fieldGlow * (isNight() ? 0 : 1), seed: V.seed,
    path: T, pathLook: { grey: V.trailGrey, shadow: V.trailShadow, bounce: V.trailBounce } };
