<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torii lab</title>
<!--
  TORII LAB — the test bed for the winter scene's torii gates (step 9a), before they go into newwinter.html.
  The trodden snow path and the snow ground round it are newwinter.html's own (winterpath.js, winterlake.js, the
  same values and the same camera: the eye 3 m above the snow, the 22° lens), so what is tuned here fits there.
  The gates are wintertorii.js. The sky here is only a plain stand-in.
  The shrine hall is newwinter.html's own (winterhall.js, the same values, the same place on the screen), and the path is
  that page's path exactly: the same five points, curvature and width, on into the hall's steps up the rise it stands on.
  Views: "As in the winter scene" is exactly newwinter.html's view (the path in the lower left, the horizon at 2/3, the
  hall); "Close-up" stands the same camera nearer the gates, turned to look up the path (the hall is drawn only in the
  winter scene's view: winterhall.js draws it through that camera alone).
  Each gate has its own controls (panel "Each gate"): shown or not, moved along the path, turned, leaned, its height;
  and "Turn / lean a gate" on the panel's title bar: tap a gate, drag its rings (the flat ring turns it, the upright one
  leans it).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d4dae6; font: 14px/1.35 system-ui, sans-serif; }
  canvas#c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }   /* (100%, not 100vh: on a tablet's Chrome 100vh is the taller viewport with the address bar hidden, which stretched the whole scene; newwinter.html's canvases are 100% too) */
  #sp { position: fixed; right: 10px; top: 10px; width: 330px; max-height: calc(100% - 20px); overflow: auto; background: rgba(255,255,255,0.92);
        border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.25); padding: 0 12px 12px; }
  #sp.min { width: auto; } #sp.min .body { display: none; }
  #sp .head { position: sticky; top: 0; background: rgba(255,255,255,0.97); padding: 10px 0 6px; display: flex; gap: 6px; align-items: center; }
  #sp .head b { flex: 1; }
  #sp button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #aab; background: #f4f5f9; }
  #sp h4 { margin: 12px 0 4px; font-size: 13px; color: #534; border-top: 1px solid #ddd; padding-top: 8px; }
  #sp label { display: block; margin: 6px 0 2px; font-size: 12.5px; color: #333; }
  #sp label span { float: right; color: #666; font-variant-numeric: tabular-nums; }
  #sp input[type=range] { width: 100%; height: 26px; }
  #sp select { width: 100%; font: inherit; padding: 4px; }
  #ax { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: none; touch-action: none; }
  #axbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; gap: 8px; align-items: center;
           background: rgba(255,255,255,0.95); padding: 8px 10px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.3); font-size: 15px; }
  #axbar button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid #aab; background: #f4f5f9; }
  #axbar button.go { background: #2f7d3a; color: #fff; border-color: #2f7d3a; }
  #axbar span { min-width: 210px; text-align: center; font-variant-numeric: tabular-nums; }
  #msg { position: fixed; left: 10px; bottom: 10px; background: rgba(255,255,255,0.85); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
</style>
<script src="winterpath.js"></script>
<script src="winterlake.js"></script>
<script src="winterhill.js"></script>
<script src="winterhall.js"></script>
<script src="wintertorii.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<canvas id="ax"></canvas>
<div id="axbar"><span id="axtxt">Tap a gate</span><button id="axundo">Undo</button><button id="axzero">Straighten this gate</button><button id="axdone" class="go">✓ Done</button></div>
<div id="sp"><div class="head"><b>Torii lab</b><button id="axopen">⟲ Turn / lean a gate</button><button id="copy">Copy values</button><button id="reset">Reset</button><button id="fold">–</button></div><div class="body" id="body"></div></div>
<script>
'use strict';
var PI = Math.PI;
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function scale(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
function hex(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function rgb(c, a) { return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + (a === undefined ? 1 : a) + ')'; }

/* ============================================================
   1. VALUES. The scene's (light, snow ground, path) are newwinter.html's defaults; the gates' are new.
   ============================================================ */
var V_DEFAULTS = {
  view: 'scene', closeHorizon: 0.52, closeBack: 38, closeSide: 2.5,
  // the light (newwinter.html's sceneLight values)
  timeOfDay: 'day', condition: 'partly', sunAzimuth: -60, sunElevation: 22, eveningElevation: 5, sunStrength: 0.85, ambient: 0.9,
  moonLight: 0.45, blueShade: 0.6,
  // the camera and the snow ground (newwinter.html)
  eyeHeight: 3, lens: 22, sceneHorizon: 0.667, seed: 7, fieldSwell: 1.75, fieldDrifts: 1.2, fieldGrain: 1, fieldSparkle: 1.35,
  fieldHaze: 1, fieldHazeDist: 260, fieldGlow: 0.6,
  // the path (newwinter.html's, the user's points)
  trail1X: 0.1578, trail1Y: 0.9931, trail2X: 0.1036, trail2Y: 0.8862, trail3X: 0.1138, trail3Y: 0.7944, trail4X: 0.1678, trail4Y: 0.7387,
  trail5X: 0.2329, trail5Y: 0.7187, trailBend: 1, trailToHall: true, trailWidth: 4, trailDepth: 0.3, trailWall: 0.22, trailBerm: 0.03, trailWobble: 0.45, trailTrod: 1,
  trailGrey: 0.5, trailShadow: 1, trailBounce: 0.65,
  // the shrine hall (newwinter.html's values; its place: the layout's "Hall" across / up / size about its foot)
  hallShow: true, hallX: 0, hallY: 0, hallSize: 1.3, hallTurn: 15, hallSnow: 1, hallEave: 1, hallRoof: 1, hallSori: 1, hallHaze: 0,
  hallFootMist: 0.39, hallShadow: 1, hallLamps: 1, hallSpill: 1, hallWeather: 1.35, hallRidge: true, hallRailing: true, hallRope: true,
  hallVivid: 0.9, hallRiseFront: 60, hallDof: false, hallFocus: 200, hallDofStrength: 1, hallDofMax: 3,
  // (the seven frosted trees beside it in newwinter.html: here only for the rise of snow they stand on, which the hall
  // draws as far as they reach; the trees themselves are not drawn here)
  ftShrine: true, ftSSize: 1.07,
  ftS1Show: true, ftS1X: 0.386, ftS1Foot: 0.665, ftS1H: 4.1, ftS2Show: true, ftS2X: 0.398, ftS2Foot: 0.666, ftS2H: 4.27,
  ftS3Show: true, ftS3X: 0.409, ftS3Foot: 0.664, ftS3H: 4.87, ftS4Show: true, ftS4X: 0.418, ftS4Foot: 0.665, ftS4H: 4,
  ftS5Show: true, ftS5X: 0.456, ftS5Foot: 0.664, ftS5H: 4.24, ftS6Show: true, ftS6X: 0.5035, ftS6Foot: 0.6628, ftS6H: 4.35,
  ftS7Show: true, ftS7X: 0.532, ftS7Foot: 0.663, ftS7H: 3.95,
  // the gates
  gates: 3, gateFirst: 29, gateGap: 28, gateClear: 0.25, gateHeight: 1.45, gateDia: 0.11, gateLean: 1.5, gateSori: 0.045,
  gateOverhang: 0.39, gateNuki: 0.73, gateNemaki: 0.13, gateDaiwa: false, gateKusabi: true, gatePlaque: false, gateKasagiBlack: true,
  gateWeather: 1, gateVivid: 0.5, gateSoft: 0.35, gateHaze: 1, gateShadow: 1, gateFootShade: 1, gateFootSnow: 1, gateAir: 0, gateDof: 0, gateArrange: false,
  gateH1: 1, gateH2: 0.88, gateH3: 0.66, gateH4: 0.6, gateH5: 0.55, gateH6: 0.5,
  // each gate's own (1 the front one): shown, moved across the path (m, + to the right looking up the path), moved along the path (m), turned (°, + its right end toward you), leaned (°, + its top toward you)
  gate1Show: true, gate1Size: 1, gate1Across: 0, gate1Along: 0, gate1Turn: 0, gate1Tilt: 0, gate2Show: true, gate2Size: 1, gate2Across: 0, gate2Along: 0, gate2Turn: 0, gate2Tilt: 0,
  gate3Show: true, gate3Size: 1, gate3Across: 0, gate3Along: 0, gate3Turn: 0, gate3Tilt: 0, gate4Show: true, gate4Size: 1, gate4Across: 0, gate4Along: 0, gate4Turn: 0, gate4Tilt: 0,
  gate5Show: true, gate5Size: 1, gate5Across: 0, gate5Along: 0, gate5Turn: 0, gate5Tilt: 0, gate6Show: true, gate6Size: 1, gate6Across: 0, gate6Along: 0, gate6Turn: 0, gate6Tilt: 0,
  gateSnowShow: true, gateSnow: 1, gateCrevice: 1, gatePlaster: 1, gateSnowVary: 0.6, gateFall: true, gateFallRate: 8, gatePowder: 1,
  colours: { snow: '#FAFAFC', mist: '#ffffff', bankEarth: '#4D4038', toriiRed: '#D8401E', toriiBlack: '#2A2523',
             hallPlaster: '#FFF8E8', hallTimber: '#F23A12', hallStone: '#A8A8A0', hallRed: '#F23A12', hallGreen: '#1FA67A', hallSoffit: '#E0360F', flame: '#FFAA5A' }
};
var V = JSON.parse(JSON.stringify(V_DEFAULTS));
try { var sv = JSON.parse(localStorage.getItem('toriiLab-1') || 'null'); if (sv && !(sv.ver >= 2)) { delete sv.gateAir; delete sv.gateDof; } if (sv && !(sv.ver >= 3)) delete sv.gateArrange; if (sv && !(sv.ver >= 4)) delete sv.view; if (sv && !(sv.ver >= 5)) { delete sv.gate3Across; delete sv.gate4Across; }   /* (set while the view was stretched on the tablet: they pushed the far gates 5 m left to look on the path; now 0 is on the path) */ if (sv) for (var k in sv) if (k in V) { if (k === 'colours') Object.assign(V.colours, sv.colours); else V[k] = sv[k]; } } catch (e) {}
function saveAll() { try { var o = JSON.parse(JSON.stringify(V)); o.ver = 5; localStorage.setItem('toriiLab-1', JSON.stringify(o)); } catch (e) {} }

/* ============================================================
   2. THE LIGHT (newwinter.html's sceneLight and shadeColour)
   ============================================================ */
var COND_SUN = { clear: 1, partly: 0.85, thin: 0.7, cloudy: 0.3, mist: 0.5, snow: 0.22 };
function isNight() { return V.timeOfDay === 'night'; }
function light(c) {
  if (V.timeOfDay === 'evening') return scale(mix(c, [255, 176, 85], 0.16), 0.97);
  if (isNight()) return scale(mix(c, [60, 66, 112], 0.18), 0.8);
  return c;
}
var LT = null, SHADE = null;
function sceneLight() {
  var tod = V.timeOfDay, el = V.sunElevation, sun = [255, 247, 236], sky = [178, 196, 226], sS = V.sunStrength, amb = V.ambient;
  if (tod === 'evening') { sun = [255, 156, 96]; sky = [164, 152, 198]; el = V.eveningElevation; }
  else if (tod === 'night') { sun = [150, 168, 225]; sky = [64, 76, 124]; el = 36; sS *= V.moonLight; amb *= 0.8; }
  var cs = COND_SUN[V.condition]; if (cs === undefined) cs = 1;
  sS *= cs; amb *= lerp(1.15, 1, cs);
  sky = mix(sky, tod === 'night' ? [80, 84, 110] : [214, 214, 226], (1 - cs) * 0.6);
  var a = V.sunAzimuth * PI / 180, e = el * PI / 180;
  return { el: el, vis: cs * (tod === 'night' ? 0.45 : 1), dir: [Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)],
           sunRGB: sun, skyRGB: sky, sS: sS, amb: amb, sun: scale(sun, sS / 255), sky: scale(sky, 1 / 255) };
}
function shadeColour() {
  var sk = LT.sky, L = (sk[0] + sk[1] + sk[2]) / 3, b = V.blueShade, sn = hex(V.colours.snow);
  var c = [sk[0] + (L * 0.8 - sk[0]) * b, sk[1] + (L * 0.94 - sk[1]) * b, sk[2] + (L * 1.2 - sk[2]) * b];
  return [clamp(sn[0] * c[0] * LT.amb * 0.92, 0, 255), clamp(sn[1] * c[1] * LT.amb * 0.92, 0, 255), clamp(sn[2] * c[2] * LT.amb * 0.92, 0, 255)];
}
function groundHaze() { return light(mix(hex(V.colours.mist), [214, 224, 242], 0.85)); }

/* ============================================================
   3. THE CAMERA, THE PATH AND WHERE THE GATES STAND
   The path is newwinter.html's: its five points on that screen, put on the snow through that camera (m: x right of
   the eye, z away from it), on 14 m back toward you, and on beyond the last point (where newwinter.html's runs on to
   the hall). The close-up stands the same camera (same eye height, same lens) nearer the gates, turned up the path.
   ============================================================ */
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W = 0, H = 0, PR = 1;
function lensF() { return H / (2 * Math.tan(V.lens * PI / 360)); }
function sceneY(f) { var h = V.sceneHorizon, R = 0.655; return f <= R ? f * h / R : h + (f - R) * (1 - h) / (1 - R); }   // newwinter's blkY
/* --- newwinter.html's layout of an element (blkPlace): moved across / up and sized about its foot (BLK_ANCHOR) --- */
var BLK_ANCHOR = { hall: [0.31, 0.657], path: [0.15, 1.0] };
var BLK_HALL = { eave0: 0.222, eave1: 0.389, top: 0.533, base: 0.662 };          // newwinter.html's BLK.hall (measured on the reference)
function blkPlace(g) {
  var A = BLK_ANCHOR[g], dx = V[g + 'X'] || 0, dy = V[g + 'Y'] || 0, sz = V[g + 'Size'] || 1;
  return { X: function (f) { return (A[0] + (f - A[0]) * sz + dx) * W; }, Y: function (f) { return sceneY(A[1] + (f - A[1]) * sz - dy) * H; }, sz: sz };
}
function hallCam() { return WinterHill.camera(W, H, H * V.sceneHorizon, V.lens); }
function hallLight() { return { sun: LT.dir, sunCol: LT.sun, skyCol: LT.sky, amb: LT.amb, haze: light(hex(V.colours.mist)) }; }
/* the seven frosted trees beside the hall (newwinter.html's shrineHallFirs): only where each stands and how tall it is,
   for the rise of snow they stand on */
function shrineHallFirs(pl) {
  var out = [];
  if (!V.ftShrine || !V.hallShow) return out;
  for (var n = 1; n <= 7; n++) {
    if (!V['ftS' + n + 'Show']) continue;
    out.push({ n: n, x: pl.X(V['ftS' + n + 'X']), foot: pl.Y(V['ftS' + n + 'Foot']), h: 0, hm: Math.max(0.5, V['ftS' + n + 'H'] * V.ftSSize), seed: 0, haze: 0 });
  }
  return out;
}
/* where the hall's steps are (newwinter.html's trailHall: only the hall's place is worked out, nothing drawn) */
function trailHallOpts() {
  var pl = blkPlace('hall'), Hb = BLK_HALL;
  return { locateOnly: true, W: W, H: H, PR: hallPR(), cam: hallCam(),
    place: { x0: pl.X(Hb.eave0), x1: pl.X(Hb.eave1), top: pl.Y(Hb.top), foot: pl.Y(Hb.base) },
    yaw: V.hallTurn * PI / 180, eye: V.eyeHeight, riseFront: V.hallRiseFront, snow: V.hallSnow, eave: V.hallEave, roof: V.hallRoof, sori: V.hallSori,
    firs: shrineHallFirs(pl), firLook: { width: 1.3 }, light: hallLight() };
}
function trailHall() { return typeof WinterHall === 'undefined' ? null : WinterHall.job(trailHallOpts()); }
/* --- the path: newwinter.html's trailScreen, trailGround, trailPointsM, trailLineM, trailBuild, line for line (scene
   space, m: x right of the winter scene's eye, z away from it) --- */
function trailScreen(n) { var P = blkPlace('path'); return [P.X(V['trail' + n + 'X']), P.Y(V['trail' + n + 'Y'])]; }
function trailGround(p) {
  var hy = H * V.sceneHorizon, F = lensF(), d = Math.max(4, p[1] - hy), z = V.eyeHeight * F / d;
  return [(p[0] - W / 2) * z / F, z];
}
function trailPointsM(bend) {
  var pts = [];
  for (var n = 1; n <= 5; n++) pts.push(trailGround(trailScreen(n)));
  var hall = V.trailToHall && V.hallShow ? trailHall() : null;
  var A = hall ? hall.foot(7) : pts[4];
  var ax = pts[0][0], az = pts[0][1], bx = A[0] - ax, bz = A[1] - az, bl = bx * bx + bz * bz || 1;
  for (var i = 1; i < pts.length; i++) {
    if (!hall && i === pts.length - 1) break;
    var t = ((pts[i][0] - ax) * bx + (pts[i][1] - az) * bz) / bl, qx = ax + bx * t, qz = az + bz * t;
    pts[i] = [qx + (pts[i][0] - qx) * bend, qz + (pts[i][1] - qz) * bend];
  }
  return { pts: pts, hall: hall, A: A };
}
function trailLineM(PM) {
  var pts = PM.pts.slice(), hall = PM.hall;
  var dx = pts[0][0] - pts[1][0], dz = pts[0][1] - pts[1][1], dl = Math.hypot(dx, dz) || 1;
  pts.unshift([pts[0][0] + dx / dl * 14, Math.max(2, pts[0][1] + dz / dl * 14)]);
  if (hall) pts.push(hall.foot(2.5), hall.steps, hall.under);
  return pts;
}
var TRAIL = { pts: null, hall: null, T: null };
function trailBuild() {
  var PM = trailPointsM(V.trailBend), hall = PM.hall;
  TRAIL.pts = trailLineM(PM); TRAIL.hall = hall;
  TRAIL.T = WinterPath.build(pathOpts(TRAIL.pts));
  return TRAIL;
}
function pathOpts(pts) {
  return { pts: pts, width: V.trailWidth, depth: V.trailDepth, wall: V.trailWall, berm: V.trailBerm, wobble: V.trailWobble, trod: V.trailTrod,
           endHalf: TRAIL.hall ? TRAIL.hall.stepW + 0.2 : 0, seed: V.seed * 13 + 5 };
}
var VIEW = null;
/* The gates behind the first are moved a little along the path (up to 12 m either way, half a metre at a time) to where,
   seen from this camera, no part of one peeps out from behind a nearer gate as a thin sliver (a strip of its black top
   beam just under the tie beam in front, a beam's tip beside a pillar), and none of its uprights (pillars, centre post)
   lines up with or just grazes one of a nearer gate (two in a line read as one piece). Each candidate place: the gate's
   outline drawn into a small mask, compared with the nearer gates' outlines; the least such trouble wins, the smallest
   move breaking ties. Gate 1 stays where it is. */
function arrangeGates(TW, gates, toCam, dirCam, hy, F) {
  if (!V.gateArrange || gates.length < 2 || typeof WinterTorii.silhouette !== 'function') return gates;
  var cam = { W: W, H: H, hy: hy, F: F, eye: V.eyeHeight }, sc = 0.5, mw = Math.ceil(W * sc), mh = Math.ceil(H * sc);
  var cnv = document.createElement('canvas'); cnv.width = mw; cnv.height = mh;
  var c = cnv.getContext('2d', { willReadFrequently: true });
  function placeAt(s) {
    var q = TW.at(s), q0 = TW.at(s - 1.5), q1 = TW.at(s + 1.5), tx = q1[0] - q0[0], tz = q1[1] - q0[1], tl = Math.hypot(tx, tz) || 1;
    var w = { x: q[0], z: q[1], fx: tx / tl, fz: tz / tl, s: s }, p = toCam(w.x, w.z), f = dirCam(w.fx, w.fz);
    return { world: w, cam: { x: p[0], z: p[1], fx: f[0], fz: f[1] } };
  }
  function mask(G, pl, only) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, mw, mh); c.setTransform(sc, 0, 0, sc, 0, 0); c.fillStyle = '#fff';
    WinterTorii.silhouette(c, G, pl, cam, only);
    var D = c.getImageData(0, 0, mw, mh).data, m = new Uint8Array(mw * mh);
    for (var i = 0; i < m.length; i++) m[i] = D[i * 4 + 3] > 110 ? 1 : 0;
    return m;
  }
  var near = new Uint8Array(mw * mh), nearMem = [], out = [];
  // pixels of it seen only as a strip up to about 16 px thick (on the screen) wedged against a nearer gate: a beam of the
  // gate behind peeping out just under or beside one in front
  var TH = 4;
  function sliver(m) {
    var n = 0;
    for (var y = TH; y < mh - TH; y++) for (var x = TH; x < mw - TH; x++) {
      var k = y * mw + x; if (!m[k] || near[k]) continue;
      var u = 0, dn = 0, l = 0, r = 0, ou = false, od = false, ol = false, orr = false;
      for (u = 1; u <= TH; u++) { var j = k - u * mw; if (!m[j] || near[j]) { ou = near[j] === 1; break; } }
      for (dn = 1; dn <= TH; dn++) { var j2 = k + dn * mw; if (!m[j2] || near[j2]) { od = near[j2] === 1; break; } }
      for (l = 1; l <= TH; l++) { var j3 = k - l; if (!m[j3] || near[j3]) { ol = near[j3] === 1; break; } }
      for (r = 1; r <= TH; r++) { var j4 = k + r; if (!m[j4] || near[j4]) { orr = near[j4] === 1; break; } }
      var thinV = u + dn <= 2 * TH && (ou || od), thinH = l + r <= 2 * TH && (ol || orr);
      if (thinV || thinH) n++;
    }
    return n;
  }
  // its black top beam (with the snow on it) partly hidden behind a nearer gate: in each column of the screen it must be
  // either hidden or show at least three quarters of its height (a band of black peeping out under a tie beam in front)
  function peep(km) {
    var n = 0;
    for (var x = 0; x < mw; x++) {
      var K = 0, Vv = 0;
      for (var y = 0; y < mh; y++) { var k = y * mw + x; if (km[k]) { K++; if (!near[k]) Vv++; } }
      if (K > 0 && Vv > 0 && Vv < K * 0.75) n += K;
    }
    // and as a whole: almost all of it seen, or none (else its ends poke out either side of a tie beam in front)
    var KT = 0, VT = 0;
    for (var i = 0; i < km.length; i++) if (km[i]) { KT++; if (!near[i]) VT++; }
    if (KT > 0 && VT > KT * 0.03 && VT < KT * 0.9) n += (KT - VT) + 200;
    return n;
  }
  function lined(M) {                                    // its uprights against the nearer gates' uprights
    var cost = 0;
    M.forEach(function (a) {

function axDist(P, x, y) {

function axArrows(c, P, col) {                                   // an arrowhead at each end of the ring's front half, as in a gizmo
  [[2, 0], [P.length - 3, P.length - 1]].forEach(function (pr) {

}
function axDraw() {
  axx.setTransform(1, 0, 0, 1, 0, 0); axx.clearRect(0, 0, axc.width, axc.height); axx.setTransform(PR, 0, 0, PR, 0, 0);

    axx.fillStyle = 'rgba(255,140,20,0.45)'; WinterTorii.silhouette(axx, R.G, R.pl, axCam());
  }

  axx.lineWidth = 3; axx.strokeStyle = 'rgba(200,20,20,0.35)'; axx.beginPath(); R.flat.forEach(function (q, k) { k ? axx.lineTo(q[0], q[1]) : axx.moveTo(q[0], q[1]); }); axx.stroke();
  var front = R.flat.slice(0, 33);
  axx.lineWidth = AX.mode === 'turn' ? 6 : 4; axx.strokeStyle = '#d01818'; axx.beginPath(); front.forEach(function (q, k) { k ? axx.lineTo(q[0], q[1]) : axx.moveTo(q[0], q[1]); }); axx.stroke();
  axArrows(axx, front, '#d01818');
  axx.lineWidth = AX.mode === 'tilt' ? 6 : 4; axx.strokeStyle = '#1858d0'; axx.beginPath(); R.up.forEach(function (q, k) { k ? axx.lineTo(q[0], q[1]) : axx.moveTo(q[0], q[1]); }); axx.stroke();
  axArrows(axx, R.up.slice(8, 25), '#1858d0');
  axx.font = '600 14px system-ui, sans-serif'; axx.fillStyle = '#d01818'; axx.fillText('turn', front[front.length - 1][0] + 10, front[front.length - 1][1] + 4);
  axx.fillStyle = '#1858d0'; axx.fillText('lean', R.up[0][0] + 8, R.up[0][1] - 6);

// which gate is under (x, y): the nearest whose outline holds the point
function axPick(x, y) {
  var m = document.createElement('canvas'); m.width = W; m.height = H; var mc = m.getContext('2d', { willReadFrequently: true });
  var order = VIEW.gates.slice().sort(function (a, b) { return a.z - b.z; });

    var g = order[k]; mc.clearRect(0, 0, W, H); mc.fillStyle = '#000';

function axSync() {

    for (var n = 1; n <= 6; n++) { var k = 'gate' + n + s2, C = CTL[k]; if (C) { C.inp.value = V[k]; C.sp.textContent = fmt(V[k], C.ct.step); } }
  });

axc.addEventListener('pointerdown', function (e) {
  var x = e.clientX, y = e.clientY;

axc.addEventListener('pointermove', function (e) {

  else V['gate' + n + 'Tilt'] = Math.round(clamp(AX.v0 - (e.clientY - AX.y0) * 0.02, -5, 5) * 100) / 100;                // 50 px a degree, in 0.01° steps

function axUp() {

}
axc.addEventListener('pointerup', axUp); axc.addEventListener('pointercancel', axUp);
document.getElementById('axopen').onclick = function () {
  AX.on = true; AX.sel = -1; AX.undo = [];
  axc.width = Math.round(W * PR); axc.height = Math.round(H * PR);

};
document.getElementById('axdone').onclick = function () {
  AX.on = false; AX.mode = null; axc.style.display = 'none'; axbar.style.display = 'none'; document.getElementById('sp').style.display = ''; document.getElementById('msg').style.display = ''; axSync();
};
document.getElementById('axundo').onclick = function () {
  var u = AX.undo.pop(); if (!u) return;
  V['gate' + u.n + 'Turn'] = u.turn; V['gate' + u.n + 'Tilt'] = u.tilt; AX.sel = u.n - 1; axSync(); changed(); axDraw();
};
document.getElementById('axzero').onclick = function () {
  if (AX.sel < 0) return;
  var n = AX.sel + 1; AX.undo.push({ n: n, turn: V['gate' + n + 'Turn'], tilt: V['gate' + n + 'Tilt'] });
  V['gate' + n + 'Turn'] = 0; V['gate' + n + 'Tilt'] = 0; axSync(); changed(); axDraw();
};
window.toriiLab.ax = function () { return AX; };

resize();
requestAnimationFrame(loop);
