<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmospheric Landscape</title>
    <style>
        :root {
            --sky-top: #42718f;
            --sky-bottom: #a5c2d1;
            --mist-color: #a5c2d1;
            --water: #6ba3b8;
            --grass-base: #5e7f54;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--sky-bottom);
            font-family: sans-serif;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- SKY --- */
        .sky {
            position: absolute;
            top: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
            z-index: 1;
        }

        /* --- DISTANT BIRDS --- */
        .birds {
            position: absolute;
            top: 15%;
            width: 100%;
            height: 20%;
            z-index: 2;
            pointer-events: none;
        }

        .bird {
            position: absolute;
            animation: fly linear forwards;
        }

        .bird svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.6);
            stroke-width: 1.5;
            animation: flap 0.8s ease-in-out infinite alternate;
        }

        @keyframes fly {
            0% { transform: translate(105vw, 10vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(-10vw, -5vh); opacity: 0; }
        }

        @keyframes flap {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.3); }
        }

        /* --- MOUNTAINS & MIST --- */
        .horizon-container {
            position: absolute;
            top: 55%;
            width: 100%;
            height: 20%;
            z-index: 3;
        }

        .mountains-back {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            filter: blur(6px);
        }

        .mountains-front {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            filter: blur(3px);
        }

        .mountains-back svg, .mountains-front svg {
            width: 100%;
            height: 100%;
            preserveAspectRatio: none;
        }

        .mist {
            position: absolute;
            bottom: -20%;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(165, 194, 209, 0) 0%, rgba(165, 194, 209, 0.9) 80%, var(--mist-color) 100%);
            z-index: 4;
        }

        /* --- WATER --- */
        .water {
            position: absolute;
            top: 65%;
            width: 100%;
            height: 20%;
            background: linear-gradient(to bottom, #80b8ce 0%, var(--water) 50%, #5a8e9f 100%);
            z-index: 5;
            overflow: hidden;
        }

        /* Soft horizontal water ripples */
        .water::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.05) 100%);
            background-size: 200% 100%;
            animation: shimmer 15s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* --- FOREGROUND GRASS (SVG for organic curve) --- */
        .foreground-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25%;
            z-index: 6;
        }

        .foreground-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* --- GRASS BLADES --- */
        #grass-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            z-index: 7;
            overflow: hidden;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }

        .blade {
            width: 2px;
            background-color: #729165;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom;
            animation: sway ease-in-out infinite alternate;
            position: absolute;
            bottom: 0;
        }

        @keyframes sway {
            0% { transform: rotate(-3deg) skewX(0deg); }
            100% { transform: rotate(12deg) skewX(5deg); }
        }

        /* --- THE FIGURE --- */
        .figure-container {
            position: absolute;
            bottom: 12%;
            right: 28%;
            width: 120px;
            height: 250px;
            z-index: 10;
        }

        .figure-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15));
        }

        /* Animations for clothing and hair */
        .hair {
            transform-origin: 75px 30px;
            animation: wind-hair 3s ease-in-out infinite alternate;
        }

        .coat {
            transform-origin: 65px 90px;
            animation: wind-coat 3.5s ease-in-out infinite alternate;
        }

        @keyframes wind-hair {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(8deg) translateX(3px); }
        }

        @keyframes wind-coat {
            0% { transform: rotate(0deg) skewX(0deg); }
            100% { transform: rotate(4deg) skewX(-3deg); }
        }

    </style>
</head>
<body>

<div class="scene">
    <!-- Sky -->
    <div class="sky"></div>

    <!-- Birds -->
    <div class="birds">
        <div class="bird" style="animation-duration: 20s; animation-delay: 2s; top: 20%;">
            <svg viewBox="0 0 20 10"><path d="M 0 5 Q 5 0 10 5 Q 15 0 20 5" /></svg>
        </div>
        <div class="bird" style="animation-duration: 25s; animation-delay: 5s; top: 10%;">
            <svg viewBox="0 0 20 10"><path d="M 0 5 Q 5 0 10 5 Q 15 0 20 5" /></svg>
        </div>
        <div class="bird" style="animation-duration: 18s; animation-delay: 1s; top: 30%;">
            <svg viewBox="0 0 20 10"><path d="M 0 5 Q 5 0 10 5 Q 15 0 20 5" /></svg>
        </div>
    </div>

    <!-- Horizon / Mountains -->
    <div class="horizon-container">
        <div class="mountains-back">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0,100 L0,60 Q15,45 30,65 T60,55 T100,70 L100,100 Z" fill="#5c8a96"></path>
            </svg>
        </div>
        <div class="mountains-front">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0,100 L0,75 Q25,55 45,75 T80,65 T100,85 L100,100 Z" fill="#4a7885"></path>
            </svg>
        </div>
        <div class="mist"></div>
    </div>

    <!-- Water -->
    <div class="water"></div>

    <!-- Foreground Base -->
    <div class="foreground-container">
        <svg class="foreground-svg" preserveAspectRatio="none" viewBox="0 0 100 100">
            <path d="M0,100 L0,30 Q20,10 50,20 T100,15 L100,100 Z" fill="var(--grass-base)"></path>
            <!-- Slight color variation overlay -->
            <path d="M0,100 L0,40 Q30,20 60,30 T100,25 L100,100 Z" fill="#688a5d" opacity="0.6"></path>
        </svg>
    </div>

    <!-- Dynamic Grass Blades -->
    <div id="grass-container"></div>

    <!-- The Person -->
    <div class="figure-container">
        <svg class="figure-svg" viewBox="0 0 100 200">
            <!-- Shadow -->
            <ellipse cx="45" cy="195" rx="20" ry="4" fill="rgba(0,0,0,0.2)"></ellipse>
            
            <!-- Back Leg (Pants) -->
            <path d="M 55 120 L 60 190 L 50 190 L 48 120 Z" fill="#cbbdb3"></path>
            <!-- Front Leg (Pants) -->
            <path d="M 45 120 L 40 190 L 30 190 L 38 120 Z" fill="#dcd0c6"></path>
            
            <!-- Body/Shoulders (hidden mostly by coat) -->
            <path d="M 35 60 Q 45 55 55 60 L 50 120 L 40 120 Z" fill="#d4c5e3"></path>
            
            <!-- Hair (Animated) -->
            <g class="hair">
                <path d="M 42 30 Q 55 30 58 50 Q 60 65 55 75 Q 50 60 48 45 Q 45 35 42 30 Z" fill="#887467"></path>
            </g>

            <!-- Head & Neck -->
            <circle cx="42" cy="30" r="9" fill="#e8d0b9"></circle>
            <path d="M 38 38 L 46 38 L 45 50 L 37 50 Z" fill="#e8d0b9"></path>

            <!-- The Purple Coat (Animated) -->
            <g class="coat">
                <!-- Main coat body -->
                <path d="M 35 55 Q 45 50 52 55 L 58 130 Q 45 135 32 128 Z" fill="#9d8bcc"></path>
                <!-- Coat Fold / Shading -->
                <path d="M 45 55 L 50 125 Q 48 128 42 130 L 38 55 Z" fill="#8a75bf" opacity="0.4"></path>
                <!-- Arm holding the coat closed -->
                <path d="M 38 60 L 30 95 Q 32 98 36 96 L 45 65 Z" fill="#9d8bcc"></path>
                <!-- Hand -->
                <circle cx="32" cy="96" r="3" fill="#e8d0b9"></circle>
                <!-- Coat collar -->
                <path d="M 38 50 Q 42 55 45 50 L 48 60 Q 42 58 35 62 Z" fill="#8a75bf"></path>
            </g>
        </svg>
    </div>

</div>

<script>
    // Generate dense, realistic grass blades
    const grassContainer = document.getElementById('grass-container');
    const numBlades = 150; // Much denser than before

    const colors = ['#5c7a50', '#6a8a5c', '#7a9c6a', '#4e6843'];

    for (let i = 0; i < numBlades; i++) {
        const blade = document.createElement('div');
        blade.classList.add('blade');
        
        // Randomize visual properties
        const height = Math.random() * 40 + 10; // 10px to 50px
        const width = Math.random() * 2 + 1;    // 1px to 3px
        const left = Math.random() * 100;       // 0% to 100%
        const duration = Math.random() * 2 + 2.5; // 2.5s to 4.5s
        const delay = Math.random() * -5; 
        
        // Apply styles
        blade.style.height = `${height}px`;
        blade.style.width = `${width}px`;
        blade.style.left = `${left}%`;
        blade.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        blade.style.animationDuration = `${duration}s`;
        blade.style.animationDelay = `${delay}s`;
        
        // Add slight opacity variations
        blade.style.opacity = Math.random() * 0.5 + 0.5;

        grassContainer.appendChild(blade);
    }
</script>

</body>
</html>
