<!DOCTYPE html>
<html lang="ja" data-theme="autumn" data-time="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFDF9">
<title>Bamboo Grove Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Yuji+Mai&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&family=Zen+Antique&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  /* ============================================================
     BAMBOO LAB — a copy of landscape.html, used as the test bed for
     a bamboo grove in the autumn scene, in the day phase (the bamboo is
     only for the day). Preview only.
     Everything from landscape.html is still here and runs on its
     approved values (mountains, Fuji, mist, fallen leaves, the two
     trees, the owl, the deer and the tanuki), but none of it has
     controls any more. New: a dense grove of bamboo shooting in from the
     side of the screen behind the smaller (far) tree, taller than it but
     never past the top of the screen, softened and hazed for its depth,
     swaying in the wind and pushed by the gusts (section 6b). The
     control panel has only the bamboo values. Nothing in app.js is used
     or changed.
     ============================================================ */
  html, body { overflow: hidden; height: 100%; }
  body { padding-bottom: 0; }

  /* The real app fades the canvases in after the intro; here they are always on. */
  .dyn-canvas.dyn-back,
  .dyn-canvas.dyn-ground,
  .dyn-canvas.dyn-near { opacity: 1; }
  .lab-status { font-size: 12px; color: #6E5A55; min-height: 2.8em; }
  .lab-now button { padding: 6px 10px; }

  /* One message panel in this preview instead of six. */
  .track { width: 100%; }
  .panel { width: 100%; }

  /* ---------- Control panel (demo only) ---------- */
  .lab {
    position: fixed; top: 108px; right: 14px; z-index: 1000;
    width: 330px; max-height: calc(100vh - 128px); overflow-y: auto;
    background: rgba(255, 253, 249, 0.90);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(222, 192, 172, 0.7); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(68, 52, 48, 0.16);
    padding: 14px 16px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 13px; line-height: 1.4; color: #241C1A;
    -webkit-user-select: none; user-select: none;
    touch-action: pan-y;
  }
  .lab.collapsed { width: auto; padding: 8px 12px; overflow: hidden; }
  .lab.collapsed .lab-body { display: none; }
  .lab-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-head h3 { margin: 0; font-size: 15px; color: #882E47; }
  .lab button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 7px 12px; cursor: pointer;
    border: 1px solid #DEC0AC; background: #FBECE0; color: #443430;
  }
  .lab button.primary { background: #E66826; border-color: #C44E10; color: #FFFDF9; }
  .lab-row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .lab-sec { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(222, 192, 172, 0.6); }
  .lab-sec > h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #9E7D75; }
  .lab-ctl { margin: 8px 0; }
  .lab-ctl label { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; color: #443430; }
  .lab-ctl label span.v { font-variant-numeric: tabular-nums; color: #C44E10; font-weight: 700; }
  .lab-ctl input[type=range] { width: 100%; accent-color: #E66826; margin: 4px 0 0; }
  .lab-ctl .hint { font-size: 11px; color: #9E7D75; margin-top: 2px; }
  .lab-ctl select { width: 100%; font: inherit; padding: 5px; border-radius: 8px; border: 1px solid #DEC0AC; background: #FFFDF9; margin-top: 4px; }
  .lab-chk { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #443430; margin: 8px 0; }
  .lab-chk input { width: 18px; height: 18px; accent-color: #E66826; }
  .lab-colours { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .lab-colour { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #443430; }
  .lab-colour input { width: 34px; height: 26px; padding: 0; border: 1px solid #DEC0AC; border-radius: 6px; background: none; }

  .lab-out {
    position: fixed; left: 50%; top: 120px; transform: translateX(-50%); z-index: 1001;
    width: min(720px, calc(100vw - 32px)); max-height: 60vh; display: none; flex-direction: column;
    background: rgba(255, 253, 249, 0.97); border: 1px solid #DEC0AC; border-radius: 14px;
    box-shadow: 0 12px 36px rgba(68, 52, 48, 0.22);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; font-size: 13px; color: #241C1A;
  }
  .lab-out.shown { display: flex; }
  .lab-out-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #EED2C0; }
  .lab-out-head b { color: #882E47; }
  .lab-out-head button { font: inherit; border: 1px solid #DEC0AC; background: #FBECE0; border-radius: 8px; padding: 4px 10px; }
  .lab-out pre {
    margin: 0; padding: 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
    -webkit-user-select: text; user-select: text;
  }
</style>
</head>
<body class="info-visible">

</div>

<!-- ============ The scene (the real canvases, as in index.html) ============
     #dynBack   behind everything: mountains, Fuji, mist, the ground of
                fallen leaves, trees, falling leaves.
     #dynGround the strip along the bottom edge, above the page content: the
                loose leaves lying in front, the leaves that land there, and
                the band of near leaves at the very bottom that the text and
                table scroll in behind.
     #dynNear   above the page content (as in the app): the nearer falling
                leaves, so a leaf that lands is seen landing, and one that is
                lifted or blown away is seen leaving. -->
<canvas class="dyn-canvas dyn-back" id="dynSky" aria-hidden="true"></canvas>
<canvas class="dyn-canvas dyn-back" id="dynBack" aria-hidden="true"></canvas>
<canvas class="dyn-canvas dyn-ground" id="dynGround" aria-hidden="true"></canvas>
<canvas class="dyn-canvas dyn-near" id="dynNear" aria-hidden="true"></canvas>

<!-- ============ One real message panel ============ -->
<div class="stage" id="stage">
  <div class="track" id="track">
    <div class="panel active" data-panel="0">
      <div class="panel-inner">
        <div class="panel-content">
          <p><span class="therapist-name">桜庭さん</span>、初めまして。</p>
          <p>シンガポールから参りました、Eze（エズ）と申します。</p>
          <p class="msg-3">お読みいただきたいメッセージを用意してまいりました。急ぎませんので、どうぞごゆっくりお読みになってください。</p>
          <p>本日はよろしくお願いいたします。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ Controls (demo only) ============ -->
<div class="lab" id="lab">
  <div class="lab-head">
    <h3>🎋 Bamboo Lab</h3>
    <button type="button" id="labToggle">Hide</button>
  </div>
  <div class="lab-body" id="labBody">
    <div class="lab-status" id="labStatus"></div>
    <div class="lab-row-btns">
      <button type="button" class="primary" id="btnCopy">Copy values</button>
      <button type="button" id="btnReset">Reset</button>
    </div>
    <div class="lab-sec"><h4>Do it now</h4><div class="lab-row-btns lab-now" id="labNow"></div></div>
    <div id="labControls"></div>
  </div>
</div>

<div class="lab-out" id="labOut">
  <div class="lab-out-head"><b id="labOutTitle">Copied to clipboard</b><button type="button" id="labOutClose">Close</button></div>
  <pre id="labOutText"></pre>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   1. VALUES — every control on the panel. DEFAULTS are the
   values approved on the tablet (night, Fuji at 0.73, a 17px band of
   loose leaves …), plus the new band of near leaves at the bottom.
   ============================================================ */
var DEFAULTS = {
  seed: 7,
  nearSide: 'left',
  timeOfDay: 'day',          // the bamboo is for the day only
  wind: 1,
  gustEvery: 9,
  gustStrength: 1,
  // mountains
  showMountains: true,
  ridges: 3,
  horizon: 0.86,
  mtnHeight: 0.2,
  mtnStrength: 1,
  mtnHaze: 0.67,
  mtnBlur: 2.5,
  mist: 0.82,
  mistDrift: 0.6,
  treeLine: true,
  // Fuji
  showFuji: true,
  fujiX: 0.73,
  fujiHeight: 0.34,
  fujiWidth: 2.6,
  fujiSnow: 0.1,
  // ground of fallen leaves
  groundStrength: 1,
  carpetDensity: 1.1,
  carpetSize: 1,
  leafAge: 0.35,
  groundHaze: 0.5,
  bedLeaves: 110,
  bedDepth: 17,
  tremble: 1,
  // near leaves at the very bottom
  showNear: true,
  nearHeight: 32,
  nearDensity: 0.9,
  nearSize: 1.2,
  nearShade: 0.15,
  nearBlur: 0,
  nearCover: 1,
  nearShadow: 0.73,
  nearShadowSize: 4.5,
  // falling leaves
  falling: 41,
  landShare: 0.7,
  pileMax: 60,
  colours: {
    mtnFar: '#B4B8CC', mtnMid: '#9198B2', mtnNear: '#737C95', fujiSnow: '#F7F3EC',
    mist: '#FBECE0', treeLine: '#5F6B48',
    soil: '#4A2A20', litterBrown: '#7E4A30', litterTan: '#B7814F'
  }
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
var V = clone(DEFAULTS);       // the scene is fixed; only the owl has controls (section 2)

/* The trees and falling leaves exactly as tuned on koyo.html (KOYO in app.js). */
var TREE = {
  treeSize: 0.94, twigDepth: 6, maxWidth: 30, season: 0.7, fullness: 0.8, leafDensity: 1, leafSize: 1,
  mixRed: 0.55, mixOrange: 0.25, mixGold: 0.12, mixGreen: 0.05, mixEvergreen: 0.03,
  patchiness: 0.39, shadeDepth: 0.55, lightFrom: -0.4, nearOpacity: 0.88, farOpacity: 0.76,
  farHaze: 0.09, branchOpacity: 0.5, showFar: true, fallTop: 0.6, fallBlur: 1, nightGlow: 0.7,
  colours: {
    shadeDeep: '#7A1F1F', shadePlum: '#882E47',
    red: '#C8321E', redOrange: '#E2552A', orange: '#E66826', orangeLit: '#F08A30',
    gold: '#F2B33A', goldLit: '#E8C547', green: '#B5BE4A', evergreen: '#3E5A3A',
    bark: '#3A2624'
  }
};

/* The owl, deer and tanuki run on these approved values; they have no
   controls on this page. */
var LOOKS = [['fukurou', 'フクロウ (Ural owl): round head, dark eyes'], ['konohazuku', 'コノハズク (scops owl): ear tufts, orange eyes']];
var OWL_COLOURS = {
  fukurou:    { back: '#8B6B52', wing: '#6A4E3C', spot: '#F1E2CC', chest: '#EFE2CF', streak: '#6A4632', face: '#DCCDB9',
                rim: '#5A3F2E', eye: '#1C130F', beak: '#F2C661', feet: '#E6D8C2', under: '#F3E9DA' },
  konohazuku: { back: '#8E7556', wing: '#6B563F', spot: '#E8D5B2', chest: '#D3BE9C', streak: '#3B2C20', face: '#C4AC88',
                rim: '#3E2E22', eye: '#F7A21B', beak: '#4C4038', feet: '#CDBA98', under: '#E6D6B8' }
};
var COLOUR_NAMES = [['back', 'Back'], ['wing', 'Wings'], ['spot', 'Pale markings'], ['chest', 'Chest'], ['streak', 'Streaks'], ['face', 'Face'],
                    ['rim', 'Face rim'], ['eye', 'Eyes'], ['beak', 'Beak'], ['feet', 'Feet'], ['under', 'Under the wings']];
/* The deer and tanuki colours (section 12). */
var ANIMAL_COLOURS = {
  hind:   { coat: '#8E6446', back: '#6B4A33', belly: '#DCC9B0', spot: '#EFE2CC', rump: '#F5EFE6', rim: '#2A1E18',
            leg: '#7A5A42', hoof: '#2A221E', nose: '#1E1715', eye: '#140E0C', ear: '#D2B3A2' },
  stag:   { coat: '#5E4636', back: '#46342A', belly: '#BFAE98', spot: '#D8C8B0', rump: '#F2ECE2', rim: '#221813',
            leg: '#54402F', hoof: '#221C18', nose: '#1A1412', eye: '#120C0A', ear: '#B89C8C', antler: '#DCCBAA', mane: '#3A2C24' },
  tanuki: { fur: '#86684A', tip: '#E0CCA6', dark: '#2A211C', mask: '#211915', pale: '#EDE0CB', nose: '#141010', eye: '#120D0B' }
};
var ODEF = {
  // look
  look: 'fukurou', size: 0.085, strength: 0.95, vivid: 1.15, lampGlow: 0.8, colours: clone(OWL_COLOURS),
  // the branch it sits on
  branchHeight: 0.3, branchLength: 0.2, branchAngle: 8, perchAt: 0.7, branchLeaves: 3, branchBounce: 1, owlWeight: 1,
  // timing
  perchMin: 40, perchMax: 120, awayTime: 60, landNear: 0.5,
  // flight
  flyAwayTime: 7, returnTime: 8, flapHz: 2.4, flapBeats: 4, glideTime: 0.7, vanishHeight: 0.12, vanishSpread: 0.5,
  // depth of field
  farthest: 0.08, farBlur: 0.9, maxBlur: 2.6, haze: 0.55, fadeFrom: 0.2,
  // blinking
  blinkMin: 3, blinkMax: 8, blinkTime: 0.2, doubleBlink: 0.2,
  // extras
  headTurn: false, headEvery: 12, hoot: false, hootEvery: 40, hootVolume: 0.6, hootPitch: 0,
  // deer
  deerOn: true, deerEvery: 60, herdMin: 2, herdMax: 3, stagChance: 0.85, deerSize: 0.115, deerWalk: 0.55, grazeEvery: 7,
  grazeMin: 4, grazeMax: 11, deerLook: 0.5, runChance: 0.5, deerRun: 4.5, deerFar: 0.42, deerNear: 0.95,
  // tanuki
  tanukiOn: true, tanukiEvery: 45, kitChance: 0.85, tanukiSize: 0.058, tanukiSpeed: 2, tanukiStops: 0.7, tanukiLook: 0.5,
  lookTime: 2.5, tanukiFar: 0.7, tanukiNear: 0.9,
  // both
  animStrength: 0.95, animHaze: 0.5, animColours: clone(ANIMAL_COLOURS)
};
var O = clone(ODEF);

/* ============================================================
   2. BAMBOO LAB — every control on the panel is for the bamboo groves
   (section 6b). A change to the shape or colour of the groves rebuilds
   them; the sway values and the strength work at once. Values are kept
   in this browser; "Copy values" gives them in words and as JSON.
   ============================================================ */
var BAMBOO_COLOURS = {
  culm: '#9DBE78', culmLit: '#DDEBB4', culmShade: '#4E6E3C', node: '#55703F', ring: '#E9F0D2',
  yellow: '#C9C98A', leaf: '#6FA83E', leafDark: '#355F2A', twig: '#7C8F55'
};
var BAMBOO_COLOUR_NAMES = [['culm', 'Stems'], ['culmLit', 'Stem highlight'], ['culmShade', 'Stem shadow'], ['node', 'Joints'],
                           ['ring', 'Pale ring at joints'], ['yellow', 'Older stems'], ['leaf', 'Leaves'], ['leafDark', 'Shaded leaves'],
                           ['twig', 'Twigs']];
var BDEF = {
  // the grove
  culms: 50, seed: 1, entryTop: 0.3, entryBottom: 0.85, heightMin: 1.15, heightMax: 1.5, topMargin: 0.04,
  lean: 24, leanVariety: 0.5, arch: 0.35,
  // stems
  thickness: 14, taper: 0.35, nodeSpacing: 0.08, nodeMark: 0.7, highlight: 0.6, colourVariety: 0.45, colours: clone(BAMBOO_COLOURS),
  // leaves
  leafiness: 1.5, leafFrom: 0.3, leafSize: 1.2, leafDroop: 1,
  // depth of field
  blurNear: 1.6, blurFar: 3, haze: 0.28, depthHaze: 0.32, strength: 0.9,
  // sway
  swayAmount: 1, swaySpeed: 1, swayVariety: 0.6, tipWhip: 2, gustResponse: 1, gustSpring: 1, leafFlutter: 1
};
var STORE_KEY = 'bambooLabValues2';   // 2: one grove, from the side, behind the far tree
var B = clone(BDEF);
try {
  var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && typeof saved === 'object') for (var sk in saved) {
    if (sk === 'colours') { for (var ck in saved.colours) if (ck in B.colours) B.colours[ck] = saved.colours[ck]; }
    else if (sk in B) B[sk] = saved[sk];
  }
} catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(B)); } catch (e) {} }

var GROUPS = [
  { title: 'The grove (behind the far tree)', ctls: [
    { k: 'culms', label: 'Stems', min: 5, max: 90, step: 1, re: 'grove' },
    { k: 'seed', label: 'Arrangement', min: 1, max: 99, step: 1, re: 'grove', hint: 'Each number places the stems differently.' },
    { k: 'entryTop', label: 'Stems come in from the side between … (× screen height from the top)', min: 0.1, max: 1, step: 0.01, re: 'grove' },
    { k: 'entryBottom', label: '… and (× screen height from the top)', min: 0.1, max: 1.1, step: 0.01, re: 'grove',
      hint: 'Where the stems cross the edge of the screen. 1 = the bottom.' },
    { k: 'heightMin', label: 'Lowest tops (× the far tree\'s height)', min: 1, max: 2, step: 0.01, re: 'grove',
      hint: 'Above 1 = taller than the far tree. Measured from its root.' },
    { k: 'heightMax', label: 'Highest tops (× the far tree\'s height)', min: 1, max: 2, step: 0.01, re: 'grove' },
    { k: 'topMargin', label: 'Gap kept above the tops (× screen height)', min: 0, max: 0.3, step: 0.01, re: 'grove',
      hint: 'Nothing, not even the leaves at the tops, goes higher than this below the top of the screen.' },
    { k: 'lean', label: 'Lean toward the middle (degrees)', min: 0, max: 60, step: 1, re: 'grove', hint: 'More lean = they reach further in.' },
    { k: 'leanVariety', label: 'Difference in lean between stems', min: 0, max: 1, step: 0.05, re: 'grove' },
    { k: 'arch', label: 'How much the tops bend over', min: 0, max: 1, step: 0.05, re: 'grove',
      hint: 'As in the photo: the tops curve in over the path.' }
  ]},
  { title: 'Stems', ctls: [
    { k: 'thickness', label: 'Thickness at the edge (px, nearest stems)', min: 3, max: 30, step: 0.5, re: 'grove' },
    { k: 'taper', label: 'Thinner toward the top', min: 0, max: 0.85, step: 0.05, re: 'grove', hint: '0 = the same thickness all the way up.' },
    { k: 'nodeSpacing', label: 'Joints every (× stem length)', min: 0.03, max: 0.2, step: 0.005, re: 'grove' },
    { k: 'nodeMark', label: 'How clearly the joints show', min: 0, max: 1, step: 0.05, re: 'grove' },
    { k: 'highlight', label: 'Shine down one side of each stem', min: 0, max: 1, step: 0.05, re: 'grove' },
    { k: 'colourVariety', label: 'Difference in colour between stems', min: 0, max: 1, step: 0.05, re: 'grove',
      hint: 'Some stems older and yellower, some darker.' },
    { type: 'colours', re: 'grove' }
  ]},
  { title: 'Leaves', ctls: [
    { k: 'leafiness', label: 'How leafy', min: 0, max: 2.5, step: 0.05, re: 'grove', hint: '0 = bare stems.' },
    { k: 'leafFrom', label: 'Leaves start this far along (0 the edge … 1 the top)', min: 0, max: 0.9, step: 0.01, re: 'grove' },
    { k: 'leafSize', label: 'Leaf size', min: 0.4, max: 2.5, step: 0.05, re: 'grove' },
    { k: 'leafDroop', label: 'How much the leaves hang down', min: 0.2, max: 1.8, step: 0.05, re: 'grove' }
  ]},
  { title: 'Depth of field', ctls: [

/* ============================================================

var mistBlobs = [];

  var C = cols(), hy = H * V.horizon, mistC = light(C.mist);

/* ============================================================
   8. THE GROUND — a floor of fallen leaves instead of grass.
   GRD (baked, behind the trees): a dark leaf-litter base from the

   flatter and hazier toward the horizon. Redrawn only when a value or
   the time of day changes.

function bakeGround() {

  grdTop = Math.max(0, Math.floor(hy - 8));

  var c = GRD.c;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, GRD.cnv.width, GRD.cnv.height);

  c.save();

  for (var x = -10; x <= W + 10; x += 8) c.lineTo(x, hy + 2 * Math.sin(x * 0.004 + ph1) + 1.5 * Math.sin(x * 0.013 + ph2));

  var F = families(), warm = F.red[0];                             // the base leans toward the leaf colours

  g.addColorStop(0.35, rgb(light(mix(mix(litterRamp(0.45), warm, 0.3), C.mist, V.groundHaze * 0.3))));
  g.addColorStop(1, rgb(light(mix(litterRamp(0.2), warm, 0.35))));

    var tones = F[fam];
    var tone = mix(tones[0], tones[2], r());
    if (r() < V.leafAge) tone = mix(tone, litterRamp(0.2 + r() * 0.8), lerp(0.4, 0.85, r()));
    tone = scale(tone, lerp(0.74, 1.05, r()));                      // some lie in shade
    tone = mix(tone, C.mist, V.groundHaze * Math.pow(1 - u, 2) * 0.8);
    list.push({ x: r() * (W + 40) - 20, y: hy + 2 + (depthPx - 2) * u,
                s: lerp(4.5, 18, Math.pow(u, 1.2)) * V.carpetSize * lerp(0.75, 1.25, r()),
                rot: r() * TAU, sy: lerp(0.35, 0.6, r()) * lerp(0.6, 1, u), col: rgb(light(tone)) });
  }

  for (var j = 0; j < list.length; j++) {
    var L = list[j];
    c.setTransform(PR, 0, 0, PR * L.sy, L.x * PR, (L.y - grdTop) * PR);
    leafPathLo(c, L.s, L.rot);
    c.fillStyle = L.col;
    c.fill();
    if (j % 3 === 0) {
      gl.setTransform(PR, 0, 0, PR * L.sy, L.x * PR, (L.y - grdTop) * PR);

      gl.fillStyle = L.col;

  gl.setTransform(PR, 0, 0, PR, 0, -grdTop * PR);

  gl.globalCompositeOperation = 'source-over';

NEAR.h = 0;

    var tones = F[fam], tone = mix(tones[0], tones[2], r());
    if (r() < V.leafAge) tone = mix(tone, litterRamp(0.2 + r() * 0.8), lerp(0.4, 0.85, r()));

  animals = animals.filter(function (x) { return !x.gone; });
  if (animals.length < before) {
    var keep = {};                                    // free the frames of those that have gone
    animals.forEach(function (x) { keep[x.set.key] = animSets[x.set.key]; });
    animSets = keep;
    animQueue = animQueue.filter(function (q) { return keep[q[0].key] === q[0]; });
    if (anyDeer && !animals.some(function (x) { return x.kind === 'deer'; })) deerNext = t + O.deerEvery * rnd(0.6, 1.4);
    if (anyTanuki && !animals.some(function (x) { return x.kind === 'tanuki'; })) tanukiNext = t + O.tanukiEvery * rnd(0.6, 1.4);
  }
}
/* Those in this slot ('A' behind the far tree, 'B' between the trees, 'C'
   in front of the near tree), further back first: a soft shadow on the
   ground, the animal, then the leaves round its feet over its hooves. */
function drawAnimals(c, slot) {
  if (!animals.length) return;
  var list = animals.filter(function (a) { return a.state !== 'prep' && owlSlot(a.k) === slot; }).sort(function (a, b) { return a.k - b.k; });
  for (var i = 0; i < list.length; i++) {
    var a = list[i], S = a.set, spr = S.frames[a.frame] || S.frames.stand || S.frames.stand0;
    if (!spr) continue;
    var fy = groundY(a.k), sc = a.unit / animUnitPx(S.kind, S.variant, S.k), deer = a.kind === 'deer';
    var hz = animHaze(a.k), sx = a.unit * (deer ? 0.8 : 0.7), sy = a.unit * 0.08;
    c.setTransform(PR, 0, 0, PR, 0, 0);
    c.save();
    c.translate(a.x + a.dir * a.unit * (deer ? 0.05 : 0), fy + 1); c.scale(sx, sy);
    var g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, 'rgba(30,16,20,' + (0.3 * (1 - hz)).toFixed(3) + ')'); g.addColorStop(1, 'rgba(30,16,20,0)');
    c.fillStyle = g; c.fillRect(-1, -1, 2, 2);
    c.restore();
    c.setTransform(PR * a.dir * sc, 0, 0, PR * sc, a.x * PR, fy * PR);
    c.drawImage(spr.cv, -spr.ox, -spr.oy, spr.w, spr.h);
    // the fallen leaves just in front of its feet
    var x0 = Math.max(0, Math.floor((a.x - a.unit * 1.2) * PR)), x1 = Math.min(GRDL.cnv.width, Math.ceil((a.x + a.unit * 1.2) * PR));
    var y0 = Math.max(0, Math.floor((fy - a.unit * 0.05 - grdTop) * PR)), y1 = Math.min(GRDL.cnv.height, Math.ceil((fy + 4 - grdTop) * PR));
    if (x1 > x0 && y1 > y0) {
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(GRDL.cnv, x0, y0, x1 - x0, y1 - y0, x0, y0 + Math.round(grdTop * PR), x1 - x0, y1 - y0);
    }
  }
  c.setTransform(1, 0, 0, 1, 0, 0);
}
function animStatus() {
  var deer = animals.filter(function (a) { return a.kind === 'deer'; }), tan = animals.filter(function (a) { return a.kind === 'tanuki'; });
  var WORDS = { prep: 'getting ready', walk: 'walking', lower: 'grazing', graze: 'grazing', raise: 'looking up', look: 'looking',
                alarm: 'startled', run: 'running', trot: 'scurrying', sniff: 'sniffing', stand: 'standing' };
  function doing(list) {
    var c = {};
    list.forEach(function (a) { var w = WORDS[a.state] || a.state; c[w] = (c[w] || 0) + 1; });
    return Object.keys(c).map(function (w) { return c[w] + ' ' + w; }).join(', ');
  }
  return 'Deer: ' + (deer.length ? doing(deer) : (O.deerOn ? 'next herd in ' + Math.max(0, Math.ceil(deerNext - nowT)) + ' s' : 'off')) +
         ' · Tanuki: ' + (tan.length ? doing(tan) : (O.tanukiOn ? 'next in ' + Math.max(0, Math.ceil(tanukiNext - nowT)) + ' s' : 'off'));
}

/* ============================================================
   11. FRAME
   ============================================================ */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  PR = Math.min(window.devicePixelRatio || 1, 2.5) * 0.75;   // the app renders at 0.75
  SR = PR * SCN_RES;
  cv.width = Math.round(W * PR); cv.height = Math.round(H * PR);
  GH = cvG.clientHeight || 150;
  cvG.width = Math.round(W * PR); cvG.height = Math.round(GH * PR);
  cvN.width = cv.width; cvN.height = cv.height;
  NB.cnv.width = NL.cnv.width = cv.width; NB.cnv.height = NL.cnv.height = cv.height;
  FL.cnv.width = FBR.cnv.width = Math.round(W * PR * FAR_RES);
  FL.cnv.height = FBR.cnv.height = Math.round(H * PR * FAR_RES);
  SCN.cnv.width = MTN.cnv.width = TMP.cnv.width = Math.round(W * SR);
  SCN.cnv.height = MTN.cnv.height = TMP.cnv.height = Math.round(H * SR);
  paintSky();
}
function rebuildAll() {
  if (!W) resize();
  trees = [buildTree(false)];
  if (TREE.showFar) trees.push(buildTree(true));
  bakeFallSprites();
  falling = [];
  for (var i = 0; i < Math.round(V.falling * 0.5); i++) spawnFalling(true);
  for (var p = 0; p < pile.length; p++) pile[p].spr = fallSprites[pile[p].si][pile[p].tier];   // re-baked for the new light
  bakeScenery();
  bakeGround();
  bakeNear();
  if (!pile.length) buildBed(); else placeFloor();
  bakeOwlSprites();
  resetAnimSets();
  buildGroves();
}

var last = 0, statusT = -1;
function frame(now) {
  var t = now / 1000, dt = last ? Math.min(0.05, t - last) : 0.016;
  last = t;
  nowT = t;
  updateGusts(dt);
  updateField(t);
  trees.forEach(function (T) { swayTree(T, t, dt); });
  swayGroves(dt);
  if (falling.length < V.falling && Math.random() < 0.08) spawnFalling(false);
  moveFalling(t, dt);
  updateOwl(t, dt);
  updateAnimals(t, dt);
  bakeOwlQueue(6);                              // the small flying owl sprites, a few at a time
  bakeAnimQueue(owlQueue.length ? 2 : 6);       // the deer and tanuki frames, the same way
  if (t - statusT > 0.25) { statusT = t; document.getElementById('labStatus').textContent = animStatus(); }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, cv.width, cv.height);

  // Mountains and Fuji (baked), then the mist drifting along the ridges.
  ctx.drawImage(SCN.cnv, 0, 0, cv.width, cv.height);
  if (V.showMountains && V.mistDrift > 0) {
    ctx.setTransform(PR, 0, 0, PR, 0, 0);
    ctx.globalAlpha = V.mistDrift * 0.5;
    for (var m = 0; m < mistBlobs.length; m++) {
      var Bm = mistBlobs[m];
      Bm.x += Bm.v * dt * (0.5 + 0.5 * V.wind);
      if (Bm.x - Bm.w / 2 > W + 50) Bm.x = -Bm.w / 2 - 40;
      if (Bm.x + Bm.w / 2 < -50) Bm.x = W + Bm.w / 2 + 40;
      ctx.drawImage(MIST.cnv, Bm.x - Bm.w / 2, Bm.y - Bm.h / 2, Bm.w, Bm.h);
    }
    ctx.globalAlpha = 1;
  }

  // The ground of fallen leaves (baked).
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(GRD.cnv, 0, Math.round(grdTop * PR));

  // The owl when it is further away than the far tree: behind both trees.
  drawAnimals(ctx, 'A');
  drawOwl(ctx, 'A');

  // The bamboo groves: behind the far tree, on a soft layer of their own.
  drawBamboo(t);

  // Far tree: branches and foliage on half-size layers, scaled up (soft).
  // The branches are solid; only the foliage is laid down weaker.
  var far = trees[1];
  if (far) {
    nightGlow(far, 0.6);
    var fl = FL.c;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    fl.setTransform(1, 0, 0, 1, 0, 0);
    fl.clearRect(0, 0, FL.cnv.width, FL.cnv.height);
    fl.setTransform(PR * FAR_RES, 0, 0, PR * FAR_RES, 0, 0);
    drawClumps(fl, far, t);
    var fb = FBR.c;
    fb.setTransform(1, 0, 0, 1, 0, 0);
    fb.clearRect(0, 0, FBR.cnv.width, FBR.cnv.height);
    fb.setTransform(PR * FAR_RES, 0, 0, PR * FAR_RES, 0, 0);
    drawBranches(fb, far, TREE.branchOpacity * TREE.farOpacity);
    ctx.drawImage(FBR.cnv, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = TREE.farOpacity;
    ctx.drawImage(FL.cnv, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
  }

  // The owl on the far tree's branch, or flying between the two trees.
  drawAnimals(ctx, 'B');
  drawOwl(ctx, 'B');

  // Leaves further back fall behind the near tree.
  drawFalling(ctx, t, -1, MID_Z);

  // Near tree: branches on one layer, foliage on another.
  var near = trees[0];
  nightGlow(near, 1);
  var nb = NB.c, nl2 = NL.c;
  nb.setTransform(1, 0, 0, 1, 0, 0); nb.clearRect(0, 0, NB.cnv.width, NB.cnv.height);
  nb.setTransform(PR, 0, 0, PR, 0, 0);
  drawBranches(nb, near, TREE.branchOpacity);
  nl2.setTransform(1, 0, 0, 1, 0, 0); nl2.clearRect(0, 0, NL.cnv.width, NL.cnv.height);
  nl2.setTransform(PR, 0, 0, PR, 0, 0);
  drawClumps(nl2, near, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(NB.cnv, 0, 0);
  ctx.globalAlpha = TREE.nearOpacity;
  ctx.drawImage(NL.cnv, 0, 0);
  ctx.globalAlpha = 1;

  // The owl on the near tree's branch, or just leaving it / about to land on it.
  drawAnimals(ctx, 'C');
  drawOwl(ctx, 'C');

  // Mid-depth leaves: in front of the near tree, but still behind the text and table.
  drawFalling(ctx, t, MID_Z, NEAR_Z);

  // The nearest leaves fall in front of everything, on #dynNear (above the text and table).
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, cvN.width, cvN.height);
  drawFalling(nctx, t, NEAR_Z, 2);

  // Ground strip: the loose leaves and every leaf that landed, lying on the near band's ground.
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.globalAlpha = 1;
  gctx.clearRect(0, 0, cvG.width, cvG.height);
  gctx.setTransform(PR, 0, 0, PR, 0, -(H - GH) * PR);
  drawPile(gctx, t);
  groundGlow(gctx, H);
  // the near band goes underneath them (it has its own night glow baked in)
  if (NEAR.h) {
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'destination-over';
    gctx.drawImage(NEAR.cnv, 0, Math.round((GH - NEAR.h) * PR));
    gctx.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(frame);
}

var _rz = null;
window.addEventListener('resize', function () {
  clearTimeout(_rz);
  _rz = setTimeout(function () { resize(); pile = []; rebuildAll(); }, 200);
});

buildControls();
resize();
rebuildAll();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
