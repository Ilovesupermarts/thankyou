<!DOCTYPE html>
<html lang="ja" data-theme="autumn" data-time="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFDF9">
<title>Owl Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Yuji+Mai&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&family=Zen+Antique&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  /* ============================================================
     LANDSCAPE LAB — now the OWL test bed (night). Preview only.
     The page around the scene is the real app: main.css with the real
     class names (ambient wash, mist, Shippō mosaic, toolbar, the
     one message panel) and the real #dynSky / #dynBack / #dynGround
     canvases, all in the night phase (data-time="night", the night text
     colour, the app's night sky).
     The scene: faint blurred mountains with a Fuji-like peak, mist between
     the ridges, and a low strip of ground covered in fallen leaves, with
     the falling leaves landing on it. The trees are the ones tuned on
     koyo.html (the KOYO values in app.js), each now with a bare branch
     sticking out toward the middle of the screen. An owl sits on one of
     the branches, blinks, flies off into the distance at a random moment
     and comes back after a set time to either branch (section 11). The
     bird flocks are gone. The control panel only has owl values. Nothing
     in app.js is used or changed.
     ============================================================ */
  html, body { overflow: hidden; height: 100%; }
  body { padding-bottom: 0; }

  /* The real app fades the canvases in after the intro; here they are always on. */
  .dyn-canvas.dyn-back,
  .dyn-canvas.dyn-ground,
  .dyn-canvas.dyn-near { opacity: 1; }
  .lab-status { font-size: 12px; color: #6E5A55; min-height: 2.8em; }
  .lab-now button { padding: 6px 10px; }

  /* One message panel in this preview instead of six. */
  .track { width: 100%; }
  .panel { width: 100%; }

  /* ---------- Control panel (demo only) ---------- */
  .lab {
    position: fixed; top: 108px; right: 14px; z-index: 1000;
    width: 330px; max-height: calc(100vh - 128px); overflow-y: auto;
    background: rgba(255, 253, 249, 0.90);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(222, 192, 172, 0.7); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(68, 52, 48, 0.16);
    padding: 14px 16px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 13px; line-height: 1.4; color: #241C1A;
    -webkit-user-select: none; user-select: none;
    touch-action: pan-y;
  }
  .lab.collapsed { width: auto; padding: 8px 12px; overflow: hidden; }
  .lab.collapsed .lab-body { display: none; }
  .lab-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-head h3 { margin: 0; font-size: 15px; color: #882E47; }
  .lab button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 7px 12px; cursor: pointer;
    border: 1px solid #DEC0AC; background: #FBECE0; color: #443430;
  }
  .lab button.primary { background: #E66826; border-color: #C44E10; color: #FFFDF9; }
  .lab-row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .lab-sec { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(222, 192, 172, 0.6); }
  .lab-sec > h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #9E7D75; }
  .lab-ctl { margin: 8px 0; }
  .lab-ctl label { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; color: #443430; }
  .lab-ctl label span.v { font-variant-numeric: tabular-nums; color: #C44E10; font-weight: 700; }
  .lab-ctl input[type=range] { width: 100%; accent-color: #E66826; margin: 4px 0 0; }
  .lab-ctl .hint { font-size: 11px; color: #9E7D75; margin-top: 2px; }
  .lab-ctl select { width: 100%; font: inherit; padding: 5px; border-radius: 8px; border: 1px solid #DEC0AC; background: #FFFDF9; margin-top: 4px; }
  .lab-chk { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #443430; margin: 8px 0; }
  .lab-chk input { width: 18px; height: 18px; accent-color: #E66826; }
  .lab-colours { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .lab-colour { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #443430; }
  .lab-colour input { width: 34px; height: 26px; padding: 0; border: 1px solid #DEC0AC; border-radius: 6px; background: none; }

  .lab-out {
    position: fixed; left: 50%; top: 120px; transform: translateX(-50%); z-index: 1001;
    width: min(720px, calc(100vw - 32px)); max-height: 60vh; display: none; flex-direction: column;
    background: rgba(255, 253, 249, 0.97); border: 1px solid #DEC0AC; border-radius: 14px;
    box-shadow: 0 12px 36px rgba(68, 52, 48, 0.22);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; font-size: 13px; color: #241C1A;
  }
  .lab-out.shown { display: flex; }
  .lab-out-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #EED2C0; }
  .lab-out-head b { color: #882E47; }
  .lab-out-head button { font: inherit; border: 1px solid #DEC0AC; background: #FBECE0; border-radius: 8px; padding: 4px 10px; }
  .lab-out pre {
    margin: 0; padding: 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
    -webkit-user-select: text; user-select: text;
  }
</style>
</head>

<!-- ============ The scene (the real canvases, as in index.html) ============
     #dynBack   behind everything: mountains, Fuji, mist, the ground of
                fallen leaves, trees, falling leaves.
     #dynGround the strip along the bottom edge, above the page content: the
                loose leaves lying in front, the leaves that land there, and
                the band of near leaves at the very bottom that the text and
                table scroll in behind.
     #dynNear   above the page content (as in the app): the nearer falling
                leaves, so a leaf that lands is seen landing, and one that is
                lifted or blown away is seen leaving. -->
<canvas class="dyn-canvas dyn-back" id="dynSky" aria-hidden="true"></canvas>
<canvas class="dyn-canvas dyn-back" id="dynBack" aria-hidden="true"></canvas>
<canvas class="dyn-canvas dyn-ground" id="dynGround" aria-hidden="true"></canvas>
<canvas class="dyn-canvas dyn-near" id="dynNear" aria-hidden="true"></canvas>

<!-- ============ One real message panel ============ -->
<div class="stage" id="stage">
  <div class="track" id="track">
    <div class="panel active" data-panel="0">
      <div class="panel-inner">
        <div class="panel-content">
          <p><span class="therapist-name">桜庭さん</span>、初めまして。</p>
          <p>シンガポールから参りました、Eze（エズ）と申します。</p>
          <p class="msg-3">お読みいただきたいメッセージを用意してまいりました。急ぎませんので、どうぞごゆっくりお読みになってください。</p>
          <p>本日はよろしくお願いいたします。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ Controls (demo only) ============ -->
<div class="lab" id="lab">
  <div class="lab-head">
    <h3>🦉 Owl Lab</h3>
    <button type="button" id="labToggle">Hide</button>
  </div>
  <div class="lab-body" id="labBody">
    <div class="lab-status" id="labStatus"></div>
    <div class="lab-row-btns">
      <button type="button" class="primary" id="btnCopy">Copy values</button>
      <button type="button" id="btnReset">Reset</button>

<div class="lab-out" id="labOut">

  <pre id="labOutText"></pre>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   1. VALUES — every control on the panel. DEFAULTS are the
   values approved on the tablet (night, Fuji at 0.73, a 17px band of
   loose leaves …), plus the new band of near leaves at the bottom.
   ============================================================ */
var DEFAULTS = {
  seed: 7,
  nearSide: 'left',
  timeOfDay: 'night',        // the owl comes out at night
  wind: 1,
  gustEvery: 9,
  gustStrength: 1,
  // mountains
  showMountains: true,
  ridges: 3,
  horizon: 0.86,
  mtnHeight: 0.2,
  mtnStrength: 1,
  mtnHaze: 0.67,
  mtnBlur: 2.5,
  mist: 0.82,
  mistDrift: 0.6,
  treeLine: true,
  // Fuji
  showFuji: true,
  fujiX: 0.73,
  fujiHeight: 0.34,
  fujiWidth: 2.6,
  fujiSnow: 0.1,
  // ground of fallen leaves
  groundStrength: 1,
  carpetDensity: 1.1,
  carpetSize: 1,
  leafAge: 0.35,
  groundHaze: 0.5,
  bedLeaves: 110,
  bedDepth: 17,
  tremble: 1,
  // near leaves at the very bottom
  showNear: true,
  nearHeight: 32,
  nearDensity: 0.9,
  nearSize: 1.2,
  nearShade: 0.15,
  nearBlur: 0,
  nearCover: 1,
  nearShadow: 0.73,
  nearShadowSize: 4.5,
  // falling leaves
  falling: 41,
  landShare: 0.7,
  pileMax: 60,
  colours: {
    mtnFar: '#B4B8CC', mtnMid: '#9198B2', mtnNear: '#737C95', fujiSnow: '#F7F3EC',
    mist: '#FBECE0', treeLine: '#5F6B48',
    soil: '#4A2A20', litterBrown: '#7E4A30', litterTan: '#B7814F'
  }
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
var V = clone(DEFAULTS);       // the scene is fixed; only the owl has controls (section 2)

/* The trees and falling leaves exactly as tuned on koyo.html (KOYO in app.js). */
var TREE = {
  treeSize: 0.94, twigDepth: 6, maxWidth: 30, season: 0.7, fullness: 0.8, leafDensity: 1, leafSize: 1,
  mixRed: 0.55, mixOrange: 0.25, mixGold: 0.12, mixGreen: 0.05, mixEvergreen: 0.03,
  patchiness: 0.39, shadeDepth: 0.55, lightFrom: -0.4, nearOpacity: 0.88, farOpacity: 0.76,
  farHaze: 0.09, branchOpacity: 0.5, showFar: true, fallTop: 0.6, fallBlur: 1, nightGlow: 0.7,
  colours: {
    shadeDeep: '#7A1F1F', shadePlum: '#882E47',
    red: '#C8321E', redOrange: '#E2552A', orange: '#E66826', orangeLit: '#F08A30',
    gold: '#F2B33A', goldLit: '#E8C547', green: '#B5BE4A', evergreen: '#3E5A3A',
    bark: '#3A2624'
  }
};

/* ============================================================
   2. OWL LAB — every control on the panel. A change to the owl
   re-bakes its sprites; a change to the branch rebuilds the trees.
   Values are kept in this browser; "Copy values" gives them in words
   and as JSON.
   ============================================================ */
var LOOKS = [['fukurou', 'フクロウ (Ural owl): round head, dark eyes'], ['konohazuku', 'コノハズク (scops owl): ear tufts, orange eyes']];
var OWL_COLOURS = {
  fukurou:    { back: '#8B6B52', wing: '#6A4E3C', spot: '#F1E2CC', chest: '#EFE2CF', streak: '#6A4632', face: '#DCCDB9',
                rim: '#5A3F2E', eye: '#1C130F', beak: '#F2C661', feet: '#E6D8C2', under: '#F3E9DA' },
  konohazuku: { back: '#8E7556', wing: '#6B563F', spot: '#E8D5B2', chest: '#D3BE9C', streak: '#3B2C20', face: '#C4AC88',
                rim: '#3E2E22', eye: '#F7A21B', beak: '#4C4038', feet: '#CDBA98', under: '#E6D6B8' }
};
var COLOUR_NAMES = [['back', 'Back'], ['wing', 'Wings'], ['spot', 'Pale markings'], ['chest', 'Chest'], ['streak', 'Streaks'], ['face', 'Face'],
                    ['rim', 'Face rim'], ['eye', 'Eyes'], ['beak', 'Beak'], ['feet', 'Feet'], ['under', 'Under the wings']];
var ODEF = {
  // look
  look: 'fukurou', size: 0.085, strength: 0.95, vivid: 1.15, lampGlow: 0.8, colours: clone(OWL_COLOURS),
  // the branch it sits on
  branchHeight: 0.3, branchLength: 0.2, branchAngle: 8, perchAt: 0.7, branchLeaves: 3, branchBounce: 1, owlWeight: 1,
  // timing
  perchMin: 40, perchMax: 120, awayTime: 60, landNear: 0.5,
  // flight
  flyAwayTime: 7, returnTime: 8, flapHz: 2.4, flapBeats: 4, glideTime: 0.7, vanishHeight: 0.12, vanishSpread: 0.5,
  // depth of field
  farthest: 0.08, farBlur: 0.9, maxBlur: 2.6, haze: 0.55, fadeFrom: 0.2,
  // blinking
  blinkMin: 3, blinkMax: 8, blinkTime: 0.2, doubleBlink: 0.2,
  // extras
  headTurn: false, headEvery: 12, hoot: false, hootEvery: 40, hootVolume: 0.6, hootPitch: 0
};
var STORE_KEY = 'owlLabValues2';   // 2: the 3D owl (new colours and values)
var O = clone(ODEF);
try {
  var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && typeof saved === 'object') for (var sk in saved) {
    if (sk === 'colours') {
      for (var lk in saved.colours) if (O.colours[lk]) for (var ck in saved.colours[lk]) if (ck in O.colours[lk]) O.colours[lk][ck] = saved.colours[lk][ck];
    } else if (sk in O) O[sk] = saved[sk];
  }
} catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(O)); } catch (e) {} }

var GROUPS = [
  { title: 'Look', ctls: [
    { k: 'look', label: 'Kind of owl', type: 'select', opts: LOOKS, re: 'owl', panel: true, hint: 'Each kind keeps its own colours (below).' },
    { k: 'size', label: 'Size on the near branch (× screen height)', min: 0.03, max: 0.15, step: 0.005, re: 'trees',
      hint: 'Its height sitting. On the far tree it is 0.6 of this, like the tree itself.' },
    { k: 'strength', label: 'Strength against the paper', min: 0.3, max: 1, step: 0.05, re: 'owl',
      hint: 'Lower = paler and softer, like the trunks (which are 0.5).' },
    { k: 'vivid', label: 'Colour richness', min: 0.6, max: 1.8, step: 0.05, re: 'owl', hint: '1 = the colours as picked; higher = richer.' },
    { k: 'lampGlow', label: 'Warm lamp light from below', min: 0, max: 1.5, step: 0.05, re: 'owl' },
    { type: 'colours', re: 'owl' }
  ]},
  { title: 'The branch it sits on', ctls: [
    { k: 'branchHeight', label: 'Height on the tree (× tree height)', min: 0.15, max: 0.8, step: 0.01, re: 'trees',
      hint: 'It grows from the limb at this height nearest the middle. Under the leaves (about 0.45 and below) the owl sits in the open.' },
    { k: 'branchLength', label: 'Length (× tree height)', min: 0.1, max: 0.4, step: 0.01, re: 'trees',
      hint: 'At least long enough for the owl to sit clear of the leaves.' },
    { k: 'branchAngle', label: 'Angle (degrees above level)', min: -20, max: 35, step: 1, re: 'trees' },
    { k: 'perchAt', label: 'Where the owl sits (0 base … 1 tip)', min: 0.3, max: 0.95, step: 0.01, re: 'trees' },
    { k: 'branchLeaves', label: 'Leaves at the tip', min: 0, max: 6, step: 1, re: 'trees' },
    { k: 'branchBounce', label: 'Bounce when it lands or leaves', min: 0, max: 2.5, step: 0.05 },
    { k: 'owlWeight', label: 'Sag under the owl', min: 0, max: 3, step: 0.05 }
  ]},
  { title: 'Timing', ctls: [
    { k: 'perchMin', label: 'Sits for at least (s)', min: 5, max: 300, step: 5 },
    { k: 'perchMax', label: 'Sits for at most (s)', min: 5, max: 600, step: 5, hint: 'It flies off at a random moment between the two.' },
    { k: 'awayTime', label: 'Away for (s)', min: 5, max: 300, step: 5,
      hint: 'The set time from when it disappears to when it appears again in the distance.' },
    { k: 'landNear', label: 'Chance it lands on the near tree', min: 0, max: 1, step: 0.05,
      hint: '0.5 = either tree at random; 0 = always the far tree; 1 = always the near tree.' }
  ]},
  { title: 'Flight', ctls: [
    { k: 'flyAwayTime', label: 'Flying away takes (s)', min: 3, max: 15, step: 0.5 },
    { k: 'returnTime', label: 'Coming back takes (s)', min: 3, max: 15, step: 0.5 },
    { k: 'flapHz', label: 'Wingbeats a second', min: 1, max: 5, step: 0.1 },
    { k: 'flapBeats', label: 'Wingbeats between glides', min: 1, max: 12, step: 1 },
    { k: 'glideTime', label: 'Glide (s)', min: 0, max: 2, step: 0.1, hint: '0 = it never glides.' },
    { k: 'vanishHeight', label: 'Disappears this far above the horizon (× screen height)', min: 0, max: 0.6, step: 0.01,
      hint: 'It also comes back from there.' },
    { k: 'vanishSpread', label: 'Spread of that spot across the middle', min: 0, max: 1, step: 0.05 }
  ]},
  { title: 'Depth of field', ctls: [
    { k: 'farthest', label: 'Size when it disappears (× near size)', min: 0.03, max: 0.3, step: 0.01, re: 'owl' },
    { k: 'farBlur', label: 'Blur at the far tree (px)', min: 0, max: 3, step: 0.05, re: 'owl',
      hint: 'To match the far tree\'s softness. Sharp (0) on the near tree.' },
    { k: 'maxBlur', label: 'Blur when it disappears (px)', min: 0, max: 6, step: 0.1, re: 'owl' },
    { k: 'haze', label: 'Night haze when it disappears', min: 0, max: 1, step: 0.05, re: 'owl' },
    { k: 'fadeFrom', label: 'Starts to fade below this size (× near size)', min: 0.05, max: 0.6, step: 0.01 }
  ]},
  { title: 'Blinking', ctls: [
    { k: 'blinkMin', label: 'Blinks every … at least (s)', min: 0.5, max: 20, step: 0.5 },
    { k: 'blinkMax', label: '… at most (s)', min: 0.5, max: 30, step: 0.5 },
    { k: 'blinkTime', label: 'One blink takes (s)', min: 0.08, max: 0.8, step: 0.01 },
    { k: 'doubleBlink', label: 'Chance of a double blink', min: 0, max: 1, step: 0.05 }
  ]},
  { title: 'Extras (off to start with)', ctls: [
    { k: 'headTurn', label: 'Turns its head now and then', type: 'check' },
    { k: 'headEvery', label: 'A head turn every (s)', min: 3, max: 60, step: 1 },
    { k: 'hoot', label: 'Hoots now and then', type: 'check', hint: 'The browser starts sound only after your first tap on the page.' },
    { k: 'hootEvery', label: 'A hoot every (s)', min: 5, max: 180, step: 5 },
    { k: 'hootVolume', label: 'Hoot volume', min: 0, max: 1.5, step: 0.05 },
    { k: 'hootPitch', label: 'Hoot pitch (cents, 100 = a semitone)', min: -1200, max: 1200, step: 25 }
  ]}
];
function fmt(ctl, v) { return ctl.step >= 1 ? String(v) : Number(v).toFixed(ctl.step < 0.01 ? 3 : 2); }
function buildControls() {
  var host = document.getElementById('labControls');
  host.innerHTML = '';
  GROUPS.forEach(function (g) {
    var sec = document.createElement('div');
    sec.className = 'lab-sec';
    sec.innerHTML = '<h4>' + g.title + '</h4>';
    g.ctls.forEach(function (ctl) {
      var wrap = document.createElement('div');
      if (ctl.type === 'colours') {
        wrap.className = 'lab-colours';
        COLOUR_NAMES.forEach(function (cn) {
          var lb = document.createElement('label'); lb.className = 'lab-colour';

/* The floor leaves on #dynGround: nearer (lower) ones are a little bigger. */

    flapOwl(dt, O.flapHz * (tt < 1.2 ? 1.3 : 1));
    if (tt < 0.5) o.bob *= tt / 0.5;
    // it turns right round to fly away from us, opening its wings as it drops off the branch
    var yaw = o.inward * PI * smooth(0.12, 0.85, tt);
    o.view = Math.cos(yaw) < 0 ? 'back' : 'front';
    o.live = o.k >= KLIVE || tt < 1;
    o.pose3 = { yaw: yaw, elev: lerp(0.02, OWL_ELEV, smooth(0.05, 0.6, tt)), pitch: lerp(0.38, 1.2, smooth(0.05, 0.7, tt)), headYaw: 0, eyes: 0,
                spread: smooth(0, 0.25, tt), ph: o.ph, glide: o.glide > 0, land: 1 - smooth(0.05, 0.4, tt),
                legs: 1 - smooth(0.1, 0.5, tt), perch: false, lod: owlLod(o.k) };
    o.x = p[0]; o.y = p[1] + o.bob; o.rot = bank(dt);
    o.pose = 'fly'; o.alpha = owlAlpha(o.k); o.slot = owlSlot(o.k);
    if (u >= 1) { o.state = 'gone'; o.until = t + (o.quick ? 1 : O.awayTime); o.quick = false; }
  } else if (o.state === 'gone') {
    o.alpha = 0;
    if (t >= o.until) comeBack(t);
  } else if (o.state === 'return') {
    T = trees[o.ti]; inward = T.left ? 1 : -1;
    var sp2 = seat(T);
    tt = t - o.t0; u = clamp(tt / o.dur, 0, 1); s = u * u * (3 - 2 * u);
    // from far over the mountains, round to the inner side of the branch, and in to land
    p = bez([o.sx, o.sy, o.sx, o.sy - H * 0.04, sp2.x + inward * W * 0.16, sp2.y - H * 0.08, sp2.x, sp2.y], s);
    o.k = Math.exp(lerp(Math.log(O.farthest), Math.log(o.kT), clamp(s / 0.85, 0, 1)));
    var lb = smooth(o.dur - 0.8, o.dur - 0.05, tt);   // the last moment: body up, wings high and braking, legs out
    flapOwl(dt, O.flapHz * (1 + lb * 0.4));
    o.bob *= 1 - lb;
    o.view = 'front';
    o.x = p[0]; o.y = p[1] + o.bob; o.rot = bank(dt) * (1 - lb);
    o.yaw = lerp(o.yaw || 0, clamp(o.vx * 0.0012, -0.45, 0.45) * smooth(KLIVE, 0.6, o.k) * (1 - lb), Math.min(1, dt * 3));
    o.live = o.k >= KLIVE;
    o.pose3 = { yaw: o.yaw, elev: lerp(-OWL_ELEV, -0.08, lb), pitch: lerp(1.2, 0.3, lb), headYaw: 0, eyes: 0, spread: 1, ph: o.ph, glide: o.glide > 0 && lb < 0.5,
                land: lb, legs: smooth(o.dur - 1.0, o.dur - 0.3, tt), perch: false, lod: owlLod(o.k) };
    o.pose = 'fly'; o.alpha = owlAlpha(o.k); o.slot = owlSlot(o.k);
    if (u >= 1) land(t);
  }
}
/* slot 'A': further than the far tree (drawn behind it); 'B': between the
   two trees; 'C': in front of the near tree. */
function drawOwl(c, slot) {
  if (!owl || owl.slot !== slot || owl.alpha <= 0.003 || !owlSit.length) return;
  var spr = null, sc = 1;
  if (owl.live && owl.pose3) {                     // drawn afresh, every other frame (the wingbeat at 30 a second)
    owlLiveN++;
    if (!owlLiveSpr || owlLiveN % 2) owlLiveSpr = bakeOwl(owl.k, FLY_BOX, owlPaletteCached(owl.k), owl.pose3, OWLOUT.cnv);
    spr = owlLiveSpr;
  } else if (owl.pose === 'sit') {
    owlLiveSpr = null;
    spr = owlSit[owl.ti === 0 ? 0 : 1].poses[owl.key];
  } else {
    owlLiveSpr = null;
    var st = owlFly[flyStep(owl.k)];
    spr = st && (owl.view === 'back' ? st.back : st.front)[owl.frame];
    if (spr) sc = owl.k / st.k;
    else spr = bakeOwl(owl.k, FLY_BOX, owlPaletteCached(owl.k), flyPose(owl.k, owl.view, owl.frame), OWLOUT.cnv);   // not baked yet
  }
  if (!spr) return;
  c.setTransform(PR, 0, 0, PR, owl.x * PR, owl.y * PR);
  c.rotate(owl.rot);
  c.scale(sc * owl.fx, sc * owl.fy);
  c.globalAlpha = owl.alpha;
  c.drawImage(spr.cv, -spr.ox, -spr.oy, spr.w, spr.h);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
}
function owlStatus(t) {
  var o = owl;
  if (!o) return '';
  var nx = o.next === undefined ? 'either tree (random)' : 'the ' + TREE_NAMES[o.next];
  var txt;
  if (o.state === 'perch') txt = 'Sitting on the ' + TREE_NAMES[o.ti] + ' · flies off in ' + Math.max(0, Math.ceil(o.until - t)) + ' s';
  else if (o.state === 'leave') txt = 'Flying away into the distance';
  else if (o.state === 'gone') txt = 'Away · back in ' + Math.max(0, Math.ceil(o.until - t)) + ' s, to ' + nx;
  else txt = 'Coming back to the ' + TREE_NAMES[o.ti];
  if (o.state !== 'gone') txt += ' · next landing: ' + nx;
  if (O.hoot && !(actx && actx.state === 'running')) txt += ' · tap the page once to hear the hoot';
  return txt;
}

/* ---------- The hoot (off unless switched on) ---------- */
var actx = null, amaster = null;
function ensureAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      amaster = actx.createGain(); amaster.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
document.addEventListener('pointerdown', ensureAudio, true);
/* Notes: [start s, length s, from Hz, to Hz]. */
var HOOTS = {
  // フクロウ: "hoo … hoo, go-ro-suke hoo-hoo", low and soft
  fukurou: [[0, 0.42, 420, 398], [0.62, 0.42, 412, 388], [1.6, 0.15, 404, 392], [1.82, 0.15, 400, 388],
            [2.04, 0.2, 404, 384], [2.45, 0.36, 408, 388], [2.95, 0.48, 398, 372]],
  // コノハズク: "bu-ppō-sō" (仏法僧), higher and shorter
  konohazuku: [[0, 0.1, 1120, 1090], [0.24, 0.17, 1290, 1240], [0.56, 0.3, 1150, 1040]]
};
function hoot() {
  if (!actx || actx.state !== 'running' || !owl) return;
  var p = Math.pow(2, O.hootPitch / 1200), t0 = actx.currentTime + 0.03;
  var out = actx.createGain(); out.gain.value = O.hootVolume * lerp(0.35, 1, clamp(owl.k, 0, 1));
  if (actx.createStereoPanner) {
    var pan = actx.createStereoPanner(); pan.pan.value = clamp(owl.x / W * 2 - 1, -1, 1) * 0.8;
    out.connect(pan); pan.connect(amaster);
  } else out.connect(amaster);
  var lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800 * p; lp.connect(out);
  (HOOTS[O.look] || HOOTS.fukurou).forEach(function (n) {
    var t = t0 + n[0], d = n[1];
    var osc = actx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(n[2] * p, t); osc.frequency.linearRampToValueAtTime(n[3] * p, t + d);
    var env = actx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.linearRampToValueAtTime(0.4, t + Math.min(0.07, d * 0.4));
    env.gain.setValueAtTime(0.4, t + d * 0.6);
    env.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.12);
    osc.connect(env); env.connect(lp);
    osc.start(t); osc.stop(t + d + 0.2);
  });
}
function hootNow() { ensureAudio(); if (actx) actx.resume().then(hoot); }

/* The night sky, as the app's #dynSky draws it at night (drawSky in app.js:
   the night tint and the darkening, sky tint 0.8). Drawn once per resize. */
function paintSky() {
  cvS.width = Math.max(1, Math.round(W * PR * 0.25)); cvS.height = Math.max(1, Math.round(H * PR * 0.25));
  if (!isNight()) return;
  sctx.setTransform(PR * 0.25, 0, 0, PR * 0.25, 0, 0);
  var g = sctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(70,85,127,0.250)');
  g.addColorStop(1, 'rgba(70,85,127,0.125)');
  sctx.fillStyle = g; sctx.fillRect(0, 0, W, H);
  sctx.fillStyle = 'rgba(35,40,70,0.168)'; sctx.fillRect(0, 0, W, H);
}
/* ============================================================
   11. FRAME
   ============================================================ */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  PR = Math.min(window.devicePixelRatio || 1, 2.5) * 0.75;   // the app renders at 0.75
  SR = PR * SCN_RES;
  cv.width = Math.round(W * PR); cv.height = Math.round(H * PR);
  GH = cvG.clientHeight || 150;
  cvG.width = Math.round(W * PR); cvG.height = Math.round(GH * PR);
  cvN.width = cv.width; cvN.height = cv.height;
  NB.cnv.width = NL.cnv.width = cv.width; NB.cnv.height = NL.cnv.height = cv.height;
  FL.cnv.width = FBR.cnv.width = Math.round(W * PR * FAR_RES);
  FL.cnv.height = FBR.cnv.height = Math.round(H * PR * FAR_RES);
  SCN.cnv.width = MTN.cnv.width = TMP.cnv.width = Math.round(W * SR);
  SCN.cnv.height = MTN.cnv.height = TMP.cnv.height = Math.round(H * SR);
  paintSky();
}
function rebuildAll() {
  if (!W) resize();
  trees = [buildTree(false)];
  if (TREE.showFar) trees.push(buildTree(true));
  bakeFallSprites();
  falling = [];
  for (var i = 0; i < Math.round(V.falling * 0.5); i++) spawnFalling(true);
  for (var p = 0; p < pile.length; p++) pile[p].spr = fallSprites[pile[p].si][pile[p].tier];   // re-baked for the new light
  bakeScenery();
  bakeGround();
  bakeNear();
  if (!pile.length) buildBed(); else placeFloor();
  bakeOwlSprites();
}

var last = 0, statusT = -1;
function frame(now) {
  var t = now / 1000, dt = last ? Math.min(0.05, t - last) : 0.016;
  last = t;
  nowT = t;
  updateGusts(dt);
  updateField(t);
  trees.forEach(function (T) { swayTree(T, t, dt); });
  if (falling.length < V.falling && Math.random() < 0.08) spawnFalling(false);
  moveFalling(t, dt);
  updateOwl(t, dt);
  bakeOwlQueue(6);                              // the small flying owl sprites, a few at a time
  if (t - statusT > 0.25) { statusT = t; document.getElementById('labStatus').textContent = owlStatus(t); }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, cv.width, cv.height);

  // Mountains and Fuji (baked), then the mist drifting along the ridges.
  ctx.drawImage(SCN.cnv, 0, 0, cv.width, cv.height);
  if (V.showMountains && V.mistDrift > 0) {
    ctx.setTransform(PR, 0, 0, PR, 0, 0);
    ctx.globalAlpha = V.mistDrift * 0.5;
    for (var m = 0; m < mistBlobs.length; m++) {
      var Bm = mistBlobs[m];
      Bm.x += Bm.v * dt * (0.5 + 0.5 * V.wind);
      if (Bm.x - Bm.w / 2 > W + 50) Bm.x = -Bm.w / 2 - 40;
      if (Bm.x + Bm.w / 2 < -50) Bm.x = W + Bm.w / 2 + 40;
      ctx.drawImage(MIST.cnv, Bm.x - Bm.w / 2, Bm.y - Bm.h / 2, Bm.w, Bm.h);
    }
    ctx.globalAlpha = 1;
  }

  // The ground of fallen leaves (baked).
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(GRD.cnv, 0, Math.round(grdTop * PR));

  // The owl when it is further away than the far tree: behind both trees.
  drawOwl(ctx, 'A');

  // Far tree: branches and foliage on half-size layers, scaled up (soft).
  // The branches are solid; only the foliage is laid down weaker.
  var far = trees[1];
  if (far) {
    nightGlow(far, 0.6);
    var fl = FL.c;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    fl.setTransform(1, 0, 0, 1, 0, 0);
    fl.clearRect(0, 0, FL.cnv.width, FL.cnv.height);
    fl.setTransform(PR * FAR_RES, 0, 0, PR * FAR_RES, 0, 0);
    drawClumps(fl, far, t);
    var fb = FBR.c;
    fb.setTransform(1, 0, 0, 1, 0, 0);
    fb.clearRect(0, 0, FBR.cnv.width, FBR.cnv.height);
    fb.setTransform(PR * FAR_RES, 0, 0, PR * FAR_RES, 0, 0);
    drawBranches(fb, far, TREE.branchOpacity * TREE.farOpacity);
    ctx.drawImage(FBR.cnv, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = TREE.farOpacity;
    ctx.drawImage(FL.cnv, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
  }

  // The owl on the far tree's branch, or flying between the two trees.
  drawOwl(ctx, 'B');

  // Leaves further back fall behind the near tree.
  drawFalling(ctx, t, -1, MID_Z);

  // Near tree: branches on one layer, foliage on another.
  var near = trees[0];
  nightGlow(near, 1);
  var nb = NB.c, nl2 = NL.c;
  nb.setTransform(1, 0, 0, 1, 0, 0); nb.clearRect(0, 0, NB.cnv.width, NB.cnv.height);
  nb.setTransform(PR, 0, 0, PR, 0, 0);
  drawBranches(nb, near, TREE.branchOpacity);
  nl2.setTransform(1, 0, 0, 1, 0, 0); nl2.clearRect(0, 0, NL.cnv.width, NL.cnv.height);
  nl2.setTransform(PR, 0, 0, PR, 0, 0);
  drawClumps(nl2, near, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(NB.cnv, 0, 0);
  ctx.globalAlpha = TREE.nearOpacity;
  ctx.drawImage(NL.cnv, 0, 0);
  ctx.globalAlpha = 1;

  // The owl on the near tree's branch, or just leaving it / about to land on it.
  drawOwl(ctx, 'C');

  // Mid-depth leaves: in front of the near tree, but still behind the text and table.
  drawFalling(ctx, t, MID_Z, NEAR_Z);

  // The nearest leaves fall in front of everything, on #dynNear (above the text and table).
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, cvN.width, cvN.height);
  drawFalling(nctx, t, NEAR_Z, 2);

  // Ground strip: the loose leaves and every leaf that landed, lying on the near band's ground.
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.globalAlpha = 1;
  gctx.clearRect(0, 0, cvG.width, cvG.height);
  gctx.setTransform(PR, 0, 0, PR, 0, -(H - GH) * PR);
  drawPile(gctx, t);
  groundGlow(gctx, H);
  // the near band goes underneath them (it has its own night glow baked in)
  if (NEAR.h) {
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'destination-over';
    gctx.drawImage(NEAR.cnv, 0, Math.round((GH - NEAR.h) * PR));
    gctx.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(frame);
}

var _rz = null;
window.addEventListener('resize', function () {
  clearTimeout(_rz);
  _rz = setTimeout(function () { resize(); pile = []; rebuildAll(); }, 200);
});

buildControls();
resize();
rebuildAll();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
