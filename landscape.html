<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFDF9">
<title>Bird Sound Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Yuji+Mai&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&family=Zen+Antique&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     LANDSCAPE LAB — now the BIRD SOUND test bed. Preview only.
     The page around the scene is the real app: main.css with the real
     class names (ambient wash, mist, Shippō mosaic, toolbar, the
     one message panel) and the real #dynBack / #dynGround canvases.
     New here: faint blurred mountains with a Fuji-like peak, mist between
     the ridges, and a low strip of ground covered in fallen leaves (no
     grass), with the falling leaves landing on it. The trees are the ones tuned on
     koyo.html (the KOYO values in app.js). The scene is fixed; the control
     panel only has bird sound values. The flocks are the app's own (copied
     from app.js), each species with its own call. Nothing in app.js is used
     or changed.
     ============================================================ */
  html, body { overflow: hidden; height: 100%; }
  body { padding-bottom: 0; }

  /* The real app fades the canvases in after the intro; here they are always on. */
  .dyn-canvas.dyn-back,
  .dyn-canvas.dyn-ground,
  .dyn-canvas.dyn-near { opacity: 1; }

  /* One message panel in this preview instead of six. */
  .track { width: 100%; }
  .panel { width: 100%; }

  /* ---------- Control panel (demo only) ---------- */
  .lab {
    position: fixed; top: 108px; right: 14px; z-index: 1000;
    width: 330px; max-height: calc(100vh - 128px); overflow-y: auto;
    background: rgba(255, 253, 249, 0.90);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(222, 192, 172, 0.7); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(68, 52, 48, 0.16);
    padding: 14px 16px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 13px; line-height: 1.4; color: #241C1A;
    -webkit-user-select: none; user-select: none;
    touch-action: pan-y;
  }
  .lab.collapsed { width: auto; padding: 8px 12px; overflow: hidden; }
  .lab.collapsed .lab-body { display: none; }
  .lab-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lab-head h3 { margin: 0; font-size: 15px; color: #882E47; }
  .lab button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 7px 12px; cursor: pointer;
    border: 1px solid #DEC0AC; background: #FBECE0; color: #443430;
  }
  .lab button.primary { background: #E66826; border-color: #C44E10; color: #FFFDF9; }
  .lab-row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .lab-sec { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(222, 192, 172, 0.6); }
  .lab-sec > h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #9E7D75; }
  .lab-ctl { margin: 8px 0; }
  .lab-ctl label { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; color: #443430; }
  .lab-ctl label span.v { font-variant-numeric: tabular-nums; color: #C44E10; font-weight: 700; }
  .lab-ctl input[type=range] { width: 100%; accent-color: #E66826; margin: 4px 0 0; }
  .lab-ctl .hint { font-size: 11px; color: #9E7D75; margin-top: 2px; }
  .lab-ctl select { width: 100%; font: inherit; padding: 5px; border-radius: 8px; border: 1px solid #DEC0AC; background: #FFFDF9; margin-top: 4px; }
  .lab-chk { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #443430; margin: 8px 0; }
  .lab-chk input { width: 18px; height: 18px; accent-color: #E66826; }
  .lab-colours { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .lab-colour { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #443430; }
  .lab-colour input { width: 34px; height: 26px; padding: 0; border: 1px solid #DEC0AC; border-radius: 6px; background: none; }

  .lab-out {
    position: fixed; left: 50%; top: 120px; transform: translateX(-50%); z-index: 1001;
    width: min(720px, calc(100vw - 32px)); max-height: 60vh; display: none; flex-direction: column;
    background: rgba(255, 253, 249, 0.97); border: 1px solid #DEC0AC; border-radius: 14px;
    box-shadow: 0 12px 36px rgba(68, 52, 48, 0.22);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; font-size: 13px; color: #241C1A;
  }
  .lab-out.shown { display: flex; }
  .lab-out-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #EED2C0; }
  .lab-out-head b { color: #882E47; }
  .lab-out-head button { font: inherit; border: 1px solid #DEC0AC; background: #FBECE0; border-radius: 8px; padding: 4px 10px; }
  .lab-out pre {
    margin: 0; padding: 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
    -webkit-user-select: text; user-select: text;
  }
</style>
</head>

                the band of near leaves at the very bottom that the text and

<script>
(function () {
'use strict';

/* ============================================================
   1. VALUES — every control on the panel. DEFAULTS are the
   values approved on the tablet (night, Fuji at 0.73, a 17px band of
   loose leaves …), plus the new band of near leaves at the bottom.
   ============================================================ */
var DEFAULTS = {
  seed: 7,
  nearSide: 'left',
  timeOfDay: 'day',          // the birds fly by day in the app
  wind: 1,
  gustEvery: 9,
  gustStrength: 1,
  // mountains
  showMountains: true,
  ridges: 3,
  horizon: 0.86,
  mtnHeight: 0.2,
  mtnStrength: 1,
  mtnHaze: 0.67,
  mtnBlur: 2.5,
  mist: 0.82,
  mistDrift: 0.6,
  treeLine: true,
  // Fuji
  showFuji: true,
  fujiX: 0.73,
  fujiHeight: 0.34,
  fujiWidth: 2.6,
  fujiSnow: 0.1,
  // ground of fallen leaves
  groundStrength: 1,
  carpetDensity: 1.1,
  carpetSize: 1,
  leafAge: 0.35,
  groundHaze: 0.5,
  bedLeaves: 110,
  bedDepth: 17,
  tremble: 1,
  // near leaves at the very bottom
  showNear: true,
  nearHeight: 32,
  nearDensity: 0.9,
  nearSize: 1.2,
  nearShade: 0.15,
  nearBlur: 0,
  nearCover: 1,
  nearShadow: 0.73,
  nearShadowSize: 4.5,
  // falling leaves
  falling: 41,
  landShare: 0.7,
  pileMax: 60,
  colours: {
    mtnFar: '#B4B8CC', mtnMid: '#9198B2', mtnNear: '#737C95', fujiSnow: '#F7F3EC',
    mist: '#FBECE0', treeLine: '#5F6B48',
    soil: '#4A2A20', litterBrown: '#7E4A30', litterTan: '#B7814F'
  }
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
var V = clone(DEFAULTS);       // the scene is fixed; only the bird sound has controls (section 2)

/* The trees and falling leaves exactly as tuned on koyo.html (KOYO in app.js). */
var TREE = {
  treeSize: 0.94, twigDepth: 6, maxWidth: 30, season: 0.7, fullness: 0.8, leafDensity: 1, leafSize: 1,
  mixRed: 0.55, mixOrange: 0.25, mixGold: 0.12, mixGreen: 0.05, mixEvergreen: 0.03,
  patchiness: 0.39, shadeDepth: 0.55, lightFrom: -0.4, nearOpacity: 0.88, farOpacity: 0.76,
  farHaze: 0.09, branchOpacity: 0.5, showFar: true, fallTop: 0.6, fallBlur: 1, nightGlow: 0.7,
  colours: {
    shadeDeep: '#7A1F1F', shadePlum: '#882E47',
    red: '#C8321E', redOrange: '#E2552A', orange: '#E66826', orangeLit: '#F08A30',
    gold: '#F2B33A', goldLit: '#E8C547', green: '#B5BE4A', evergreen: '#3E5A3A',
    bark: '#3A2624'
  }
};

/* ============================================================
   2. BIRD SOUND LAB — every control on the panel. Nothing here
   redraws the scene: a change is heard on the next call.
   Three sets of voices (A natural, B soft, C bright and
   chime-like) are built in section 11b; each species picks one.
   ============================================================ */
var KINDS = [['onaga', 'オナガ'], ['mejiro', 'メジロ'], ['ruri', 'オオルリ']];
var VOICE_OPTS = [['A', 'A) Natural'], ['B', 'B) Soft'], ['C', 'C) Bright, chime-like']];
var BDEF = {
  flocksOn: true, flockEvery: 8, flockSize: 1,
  onagaOn: true, mejiroOn: true, ruriOn: true,
  soundOn: true, volume: 0.8, callEvery: 2.5, farQuiet: 0.5
};
KINDS.forEach(function (K) {
  BDEF[K[0] + 'Voice'] = 'A'; BDEF[K[0] + 'Vol'] = 1; BDEF[K[0] + 'Pitch'] = 0;
  BDEF[K[0] + 'Speed'] = 1; BDEF[K[0] + 'Var'] = 0.5;
});
var STORE_KEY = 'birdSoundLabValues1';
var B = clone(BDEF);
try {
  var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && typeof saved === 'object') for (var k in saved) if (k in B) B[k] = saved[k];
} catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(B)); } catch (e) {} }

var GROUPS = [
  { title: 'Flocks flying in', ctls: [
    { k: 'flocksOn', label: 'Flocks fly in by themselves', type: 'check', hint: 'Off = only the "Send a flock now" buttons.' },
    { k: 'flockEvery', label: 'A new flock every (seconds)', min: 2, max: 60, step: 1, hint: 'On average; each gap is 65–135% of this. The app uses 5–10.' },
    { k: 'flockSize', label: 'Flock size (× the app\'s birds)', min: 0.5, max: 2, step: 0.1, hint: '1 = the app\'s 5–8 オナガ, 6–10 メジロ, 4–6 オオルリ.' }
  ]},
  { title: 'Which species fly in', ctls: [
    { k: 'onagaOn', label: 'オナガ (azure-winged magpie)', type: 'check' },
    { k: 'mejiroOn', label: 'メジロ (white-eye)', type: 'check' },
    { k: 'ruriOn', label: 'オオルリ (blue-and-white flycatcher)', type: 'check', hint: 'Each flock is one species, never the same as the one before.' }
  ]},
  { title: 'Sound (all birds)', ctls: [
    { k: 'soundOn', label: 'Bird sound on', type: 'check', hint: 'The browser starts sound only after your first tap on the page.' },
    { k: 'volume', label: 'Master volume', min: 0, max: 1.5, step: 0.05 },
    { k: 'callEvery', label: 'Each bird calls every (seconds)', min: 0.5, max: 8, step: 0.1, hint: 'On average; every bird in a flock calls on its own timing.' },
    { k: 'farQuiet', label: 'Far birds\' volume (× near)', min: 0, max: 1, step: 0.05, hint: 'The small far birds sound further away; the middle ones halfway.' }
  ]}
];
KINDS.forEach(function (K) {
  var n = K[0];
  GROUPS.push({ title: K[1] + ' — one voice for the whole species', ctls: [
    { k: n + 'Voice', label: 'Voice', type: 'select', opts: VOICE_OPTS },
    { k: n + 'Vol', label: 'Volume', min: 0, max: 2, step: 0.05 },
    { k: n + 'Pitch', label: 'Pitch (cents, 100 = a semitone)', min: -1200, max: 1200, step: 25 },
    { k: n + 'Speed', label: 'Speed of the call', min: 0.6, max: 1.6, step: 0.05, hint: 'Higher = quicker, shorter calls.' },
    { k: n + 'Var', label: 'Variation between calls', min: 0, max: 1, step: 0.05, hint: '0 = the same call every time; 1 = very different each time.' },
    { type: 'button', label: '▶ Hear one ' + K[1], act: function () { previewCall(n); } }
  ]});
});
function fmt(ctl, v) { return ctl.step >= 1 ? String(v) : Number(v).toFixed(2); }
function buildControls() {
  var host = document.getElementById('labControls');
  host.innerHTML = '';
  GROUPS.forEach(function (g) {
    var sec = document.createElement('div');
    sec.className = 'lab-sec';
    sec.innerHTML = '<h4>' + g.title + '</h4>';
    g.ctls.forEach(function (ctl) {
      var wrap = document.createElement('div');
      if (ctl.type === 'button') {
        wrap.className = 'lab-ctl';
        var bt = document.createElement('button'); bt.type = 'button'; bt.textContent = ctl.label;
        bt.addEventListener('click', ctl.act);
        wrap.appendChild(bt);
      } else if (ctl.type === 'check') {
        wrap.className = 'lab-chk';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = !!B[ctl.k];
        cb.addEventListener('change', function () { B[ctl.k] = cb.checked; changed(); });
        var lb = document.createElement('span'); lb.textContent = ctl.label;
        wrap.appendChild(cb); wrap.appendChild(lb);
      } else {
        wrap.className = 'lab-ctl';
        var label = document.createElement('label');
        var name = document.createElement('span'); name.textContent = ctl.label;
        label.appendChild(name);
        var el;
        if (ctl.type === 'select') {
          el = document.createElement('select');
          ctl.opts.forEach(function (o) {
            var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; el.appendChild(op);
          });
          el.value = B[ctl.k];
          el.addEventListener('change', function () { B[ctl.k] = el.value; changed(); });
        } else {
          var val = document.createElement('span'); val.className = 'v'; val.textContent = fmt(ctl, B[ctl.k]);
          label.appendChild(val);
          el = document.createElement('input');
          el.type = 'range'; el.min = ctl.min; el.max = ctl.max; el.step = ctl.step; el.value = B[ctl.k];
          el.addEventListener('input', function () { B[ctl.k] = parseFloat(el.value); val.textContent = fmt(ctl, B[ctl.k]); changed(); });
        }
        wrap.appendChild(label); wrap.appendChild(el);
        if (ctl.hint) { var h = document.createElement('div'); h.className = 'hint'; h.textContent = ctl.hint; wrap.appendChild(h); }
      }
      if (ctl.type === 'check' && ctl.hint) {       // the hint goes under the tick box, not beside it
        var box = document.createElement('div'), h2 = document.createElement('div');
        box.className = 'lab-ctl'; h2.className = 'hint'; h2.textContent = ctl.hint;
        box.appendChild(wrap); box.appendChild(h2); wrap = box;
      }
      sec.appendChild(wrap);
    });
    host.appendChild(sec);
  });
  var send = document.getElementById('labSend');
  send.innerHTML = '';
  KINDS.forEach(function (K) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = K[1];
    b.addEventListener('click', function () { ensureAudio(); sendBirds(K[0]); });
    send.appendChild(b);
  });
}
function changed() { save(); applyAudio(); }

document.getElementById('labToggle').addEventListener('click', function () {
  var lab = document.getElementById('lab');
  var c = lab.classList.toggle('collapsed');
  this.textContent = c ? 'Show' : 'Hide';
});
document.getElementById('btnReset').addEventListener('click', function () {
  B = clone(BDEF); save(); buildControls(); applyAudio(); birdNext = 0;
});

/* ============================================================
   3. COPY VALUES — every bird sound value, in words and as JSON.
   ============================================================ */
function f2(x) { return Number(x).toFixed(2); }
function buildCopyText() {
  var lines = [];
  lines.push('/* Bird sound — values from landscape.html */');
  lines.push('');
  lines.push('Flocks: ' + (B.flocksOn ? 'on' : 'off') + ', a new flock every ' + B.flockEvery + 's, size ×' + f2(B.flockSize));
  lines.push('Species flying in: ' + KINDS.filter(function (K) { return B[K[0] + 'On']; }).map(function (K) { return K[1]; }).join(', '));
  lines.push('Sound: ' + (B.soundOn ? 'on' : 'off') + ', master volume ' + f2(B.volume) + ', each bird calls every ' + f2(B.callEvery) +
             's, far birds ×' + f2(B.farQuiet));
  KINDS.forEach(function (K) {
    var n = K[0];
    lines.push(K[1] + ': voice ' + B[n + 'Voice'] + ', volume ' + f2(B[n + 'Vol']) + ', pitch ' + B[n + 'Pitch'] + ' cents, speed ×' +
               f2(B[n + 'Speed']) + ', variation ' + f2(B[n + 'Var']));
  });
  lines.push('');
  lines.push('JSON:');
  lines.push(JSON.stringify(B, null, 2));
  return lines.join('\n');
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function (res, rej) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    ok ? res() : rej();
  });
}
document.getElementById('btnCopy').addEventListener('click', function () {
  var text = buildCopyText();
  document.getElementById('labOutText').textContent = text;
  document.getElementById('labOut').classList.add('shown');
  var title = document.getElementById('labOutTitle');
  copyText(text).then(function () { title.textContent = 'Copied to clipboard'; },
                      function () { title.textContent = 'Could not copy — select the text below'; });
});
document.getElementById('labOutClose').addEventListener('click', function () {
  document.getElementById('labOut').classList.remove('shown');
});

/* Toolbar date and time (Nagoya). */
function tickClock() {
  var d = new Date(Date.now() + (9 * 60 + new Date().getTimezoneOffset()) * 60000);
  var wd = '日月火水木金土'.charAt(d.getDay());
  document.getElementById('infoDate').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日(' + wd + ')';
  document.getElementById('infoTime').textContent = d.getHours() + '時' + ('0' + d.getMinutes()).slice(-2) + '分';
}
tickClock();

    if (!choices.length) choices = KINDS.map(function (K) { return K[0]; }).filter(function (n) { return B[n + 'On']; });
    if (!choices.length) return;
    kind = pick(choices);
  }
  var k = BIRD_KINDS[kind];
  birdLastKind = kind; flocksSent++;
  var dir = Math.random() < 0.5 ? -1 : 1;
  var n = Math.max(1, Math.round((k.flock[0] + Math.floor(Math.random() * (k.flock[1] - k.flock[0] + 1))) * B.flockSize));
  var y0 = H * rnd(0.08, 0.3), spd = rnd(k.speed[0], k.speed[1]);
  var vr = B[kind + 'Var'], flockPitch = 1 + rnd(-0.04, 0.04) * vr;   // this flock's own touch of pitch
  for (var i = 0; i < n; i++) {
    var r = Math.random(), ti = r < 0.3 ? 2 : (r < 0.72 ? 1 : 0), tier = BIRD_TIERS[ti];
    birdSpritesFor(kind, ti);
    // a loose group: the far birds start a little ahead, as they cross the screen more slowly
    var home = y0 + rnd(-1, 1) * H * 0.07 * (ti === 2 ? 0.6 : 1);
    birds.push({
      kind: kind, ti: ti, dir: dir,
      x: (dir > 0 ? -60 : W + 60) - dir * (i * rnd(18, 34) - (ti === 2 ? 60 : 0)),
      y: home, home: home, vy: 0,
      vx: dir * spd * tier.speed * rnd(0.94, 1.06),
      ph: rnd(0, TAU), hz: k.hz * rnd(0.9, 1.1),
      beats: Math.floor(rnd(k.beats[0], k.beats[1] + 1)), glide: 0,
      fp: flockPitch * (1 + rnd(-0.015, 0.015) * vr), callT: rnd(0.2, 1.6)
    });
  }
  birds.sort(function(a, b) { return b.ti - a.ti; });   // far first, near last
  updateStatus();
}
function updateBirds(dt, t) {
  if (B.flocksOn) {
    if (!birdNext) birdNext = t + rnd(0.5, 2);          // the first flock is in view within a few seconds
    else if (t > birdNext) { sendBirds(); birdNext = t + B.flockEvery * rnd(0.65, 1.35); }
  } else birdNext = 0;
  for (var i = birds.length - 1; i >= 0; i--) {
    var b = birds[i], k = BIRD_KINDS[b.kind];
    b.x += b.vx * dt;
    if (b.glide > 0) {                              // gliding: sinks a little
      b.glide -= dt;
      b.vy += (k.sink - b.vy) * dt * 3;
      if (b.glide <= 0) { b.beats = Math.floor(rnd(k.beats[0], k.beats[1] + 1)); b.ph = 0; }
    } else {                                        // flapping: rises a little
      var before = b.ph;
      b.ph += TAU * b.hz * dt;
      b.vy += (-k.lift - b.vy) * dt * 3;
      if (Math.floor(b.ph / TAU) > Math.floor(before / TAU) && --b.beats <= 0) {
        b.glide = rnd(k.glide[0], k.glide[1]); b.ph = 0;
      }
    }
    b.vy += (b.home - b.y) * dt * 1.2;              // keeps to the flock's line
    b.y += b.vy * dt * (b.ti === 2 ? 0.6 : 1);
    if (b.x > 0 && b.x < W) {                       // calls only while on screen
      b.callT -= dt;
      if (b.callT <= 0) { birdCall(b); b.callT = B.callEvery * rnd(0.6, 1.4); }
    }
    if (b.x < -160 || b.x > W + 160) birds.splice(i, 1);
  }
}
// layer 'far': the far birds (behind both trees); 'near': the middle and near ones
function drawBirds(c, t, layer) {
  if (!birds.length) return;
  for (var i = 0; i < birds.length; i++) {
    var b = birds[i];
    if ((b.ti === 2) !== (layer === 'far')) continue;
    var k = BIRD_KINDS[b.kind], frames = birdSpritesFor(b.kind, b.ti), f;
    if (b.glide > 0) f = k.fold ? BIRD_FOLD : BIRD_GLIDE;
    else f = Math.floor((b.ph % TAU) / TAU * BIRD_FRAMES) % BIRD_FRAMES;
    var s = frames[f];
    c.globalAlpha = BIRD_TIERS[b.ti].alpha;
    c.setTransform(PR * b.dir, 0, 0, PR, b.x * PR, b.y * PR);
    c.drawImage(s.cv, -s.ox, -s.oy, s.w, s.h);
  }
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
}

/* ============================================================
   11b. BIRD VOICES. A voice makes the notes of one call as a list
   {t, dur, gain, pts: [[0-1 along the note, Hz], …], …}. R() picks a
   random value around the middle of a range; "variation" narrows or
   widens how far it strays. The call is then scaled by the species'
   pitch and speed and played with Web Audio on its own bird's spot
   (left to right across the screen, quieter when far).
   ============================================================ */
function R(a, b, vr) { var m = (a + b) / 2; return m + (rnd(a, b) - m) * vr; }
function RI(a, b, vr) { return Math.round(R(a - 0.49, b + 0.49, vr)); }
var VOICES = {
  A: {   // natural
    onaga: function (vr) {                 // rough, nasal "gyuu, gyuu"
      var n = RI(2, 3, vr), b = R(1500, 1800, vr), s = [], t = 0;
      for (var i = 0; i < n; i++, t += 0.3)
        s.push({ t: t, dur: 0.24, gain: 0.35, type: 'sawtooth', atk: 0.03, pts: [[0, b * 1.2], [0.35, b * 1.45], [1, b * 0.85]],
                 filter: ['bandpass', b * 1.3, 2.5], vib: [38, 90] });
      return s;
    },
    mejiro: function (vr) {                // thin, quick "chi-chu-chi-chi"
      var n = RI(4, 7, vr), f = R(5800, 6800, vr), s = [], t = 0;
      for (var i = 0; i < n; i++) {
        var up = Math.random() < 0.5, d = R(0.05, 0.09, vr);
        s.push({ t: t, dur: d, gain: 0.3, atk: 0.006, pts: [[0, up ? f : f * 1.15], [1, up ? f * 1.15 : f]] });
        t += d + R(0.02, 0.07, vr);
      }
      return s;
    },
    ruri: function (vr) {                  // a singing whistle with a little trill
      var f = R(2600, 2900, vr);
      return [
        { t: 0,    dur: 0.28, gain: 0.3, atk: 0.04, pts: [[0, f], [1, f * 1.3]], h2: 0.15 },
        { t: 0.34, dur: 0.22, gain: 0.3, atk: 0.03, pts: [[0, f * 1.35], [1, f * 1.5]], h2: 0.15 },
        { t: 0.61, dur: 0.45, gain: 0.3, atk: 0.03, pts: [[0, f * 1.6], [0.6, f * 1.45], [1, f]], vib: [24, 140], h2: 0.12 }
      ];
    }
  },
  B: {   // soft
    onaga: function (vr) {
      var f = R(1300, 1500, vr);
      return [
        { t: 0,   dur: 0.3,  gain: 0.3, atk: 0.06, pts: [[0, f], [1, f * 1.25]], filter: ['lowpass', 2500, 1] },
        { t: 0.4, dur: 0.38, gain: 0.3, atk: 0.06, pts: [[0, f * 1.3], [1, f * 0.9]], filter: ['lowpass', 2500, 1] }
      ];
    },
    mejiro: function (vr) {
      var f = R(3800, 4400, vr), n = RI(3, 5, vr), s = [], t = 0;
      for (var i = 0; i < n; i++, t += R(0.12, 0.18, vr)) s.push({ t: t, dur: 0.11, gain: 0.25, atk: 0.025, pts: [[0, f], [1, f * R(0.95, 1.1, vr)]] });
      return s;
    },
    ruri: function (vr) {
      var f = R(2200, 2500, vr);
      return [
        { t: 0,   dur: 0.4,  gain: 0.28, atk: 0.08, pts: [[0, f * 1.4], [1, f]] },
        { t: 0.5, dur: 0.55, gain: 0.28, atk: 0.08, pts: [[0, f * 1.2], [1, f * 0.8]], vib: [6, 40] }
      ];
    }
  },
  C: {   // bright, chime-like (pentatonic notes with a ringing tail)
    onaga: function (vr) {
      var sc = [523, 587, 659, 784, 880], a = pick(sc) * 2, b = pick(sc) * 2;
      if (vr === 0) { a = 1318; b = 1046; }
      return [
        { t: 0,    dur: 0.35, gain: 0.3, atk: 0.004, pts: [[0, a], [1, a]], h2: 0.2 },
        { t: 0.47, dur: 0.45, gain: 0.3, atk: 0.004, pts: [[0, b], [1, b]], h2: 0.2 }
      ];
    },
    mejiro: function (vr) {
      var sc = [1568, 1760, 1976, 2349, 2637, 3136], n = RI(3, 5, vr), i0 = RI(0, 2, vr), s = [];
      for (var k = 0; k < n; k++) { var f = sc[Math.min(5, i0 + k)]; s.push({ t: k * 0.09, dur: 0.18, gain: 0.22, atk: 0.003, pts: [[0, f], [1, f]] }); }
      return s;
    },
    ruri: function (vr) {
      var f = vr === 0 ? 1319 : pick([1175, 1319, 1568]), s = [];
      [1, 1.25, 1.5, 2].forEach(function (r, i) { s.push({ t: i * 0.16, dur: 0.5, gain: 0.25, atk: 0.004, pts: [[0, f * r], [1, f * r]], h2: 0.15 }); });
      return s;
    }
  }
};

var actx = null, amaster = null;
function ensureAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      var comp = actx.createDynamicsCompressor();
      amaster = actx.createGain(); amaster.connect(comp); comp.connect(actx.destination);
      actx.onstatechange = updateStatus;
      applyAudio();
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
  updateStatus();
}
document.addEventListener('pointerdown', ensureAudio, true);
function applyAudio() { if (amaster) amaster.gain.value = B.soundOn ? B.volume : 0; }
function updateStatus() {
  var el = document.getElementById('labStatus');
  if (!el) return;
  var on = actx && actx.state === 'running';
  el.textContent = (on ? 'Sound is on.' : 'Sound is off until you tap the page once.') +
    '  Flocks so far: ' + flocksSent + (birdLastKind ? ' (last: ' + KINDS.filter(function (K) { return K[0] === birdLastKind; })[0][1] + ')' : '');
}

/* One note of a call: a sine (or other wave) gliding through pts, with a quick attack and a falling tail. */
function playNote(s, t0, out, p, sp) {
  var d = Math.max(0.02, s.dur / sp), t = t0 + s.t / sp, g = s.gain;
  var osc = actx.createOscillator(); osc.type = s.type || 'sine';
  osc.frequency.setValueAtTime(s.pts[0][1] * p, t);
  for (var i = 1; i < s.pts.length; i++) osc.frequency.linearRampToValueAtTime(s.pts[i][1] * p, t + s.pts[i][0] * d);
  var env = actx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(g, t + Math.min(d * 0.5, Math.max(0.003, (s.atk || 0.01) / sp)));
  env.gain.exponentialRampToValueAtTime(0.0001, t + d);
  var node = osc;
  if (s.vib) {
    var lfo = actx.createOscillator(), lg = actx.createGain();
    lfo.frequency.value = s.vib[0]; lg.gain.value = s.vib[1] * p;
    lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + d + 0.05);
  }
  if (s.filter) {
    var f = actx.createBiquadFilter(); f.type = s.filter[0]; f.frequency.value = s.filter[1] * p; f.Q.value = s.filter[2];
    osc.connect(f); node = f;
  }
  node.connect(env); env.connect(out);
  osc.start(t); osc.stop(t + d + 0.05);
  if (s.h2) playNote({ t: s.t, dur: s.dur, gain: g * s.h2, atk: s.atk,
                       pts: s.pts.map(function (q) { return [q[0], q[1] * 2]; }) }, t0, out, p, sp);
}
function birdCall(b) {
  if (!B.soundOn || !actx || actx.state !== 'running') return;
  var n = b.kind, vr = B[n + 'Var'];
  var spec = VOICES[B[n + 'Voice']][n](vr);
  var p = Math.pow(2, B[n + 'Pitch'] / 1200) * b.fp;
  var sp = B[n + 'Speed'] * rnd(1 - 0.08 * vr, 1 + 0.08 * vr);
  var tierGain = b.ti === 2 ? B.farQuiet : (b.ti === 1 ? (1 + B.farQuiet) / 2 : 1);
  var out = actx.createGain(); out.gain.value = B[n + 'Vol'] * tierGain * rnd(1 - 0.2 * vr, 1);
  if (actx.createStereoPanner) {
    var pan = actx.createStereoPanner(); pan.pan.value = clamp((b.x / W) * 2 - 1, -1, 1) * 0.8;
    out.connect(pan); pan.connect(amaster);
  } else out.connect(amaster);
  var t0 = actx.currentTime + 0.02;
  spec.forEach(function (s) { playNote(s, t0, out, p, sp); });
}
function previewCall(kind) {
  ensureAudio();
  if (!actx) return;
  var go = function () { birdCall({ kind: kind, ti: 0, x: W / 2, fp: 1 }); };
  if (actx.state === 'running') go(); else actx.resume().then(go);
}
/* ============================================================
   11. FRAME
   ============================================================ */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  PR = Math.min(window.devicePixelRatio || 1, 2.5) * 0.75;   // the app renders at 0.75
  SR = PR * SCN_RES;
  cv.width = Math.round(W * PR); cv.height = Math.round(H * PR);
  GH = cvG.clientHeight || 150;
  cvG.width = Math.round(W * PR); cvG.height = Math.round(GH * PR);
  cvN.width = cv.width; cvN.height = cv.height;
  NB.cnv.width = NL.cnv.width = cv.width; NB.cnv.height = NL.cnv.height = cv.height;
  FL.cnv.width = FBR.cnv.width = Math.round(W * PR * FAR_RES);
  FL.cnv.height = FBR.cnv.height = Math.round(H * PR * FAR_RES);
  SCN.cnv.width = MTN.cnv.width = TMP.cnv.width = Math.round(W * SR);
  SCN.cnv.height = MTN.cnv.height = TMP.cnv.height = Math.round(H * SR);
}
function rebuildAll() {
  if (!W) resize();
  trees = [buildTree(false)];
  if (TREE.showFar) trees.push(buildTree(true));
  bakeFallSprites();
  falling = [];
  for (var i = 0; i < Math.round(V.falling * 0.5); i++) spawnFalling(true);
  for (var p = 0; p < pile.length; p++) pile[p].spr = fallSprites[pile[p].si][pile[p].tier];   // re-baked for the new light
  bakeScenery();
  bakeGround();
  bakeNear();
  if (!pile.length) buildBed(); else placeFloor();
}

var last = 0;
function frame(now) {
  var t = now / 1000, dt = last ? Math.min(0.05, t - last) : 0.016;
  last = t;
  nowT = t;
  updateGusts(dt);
  updateField(t);
  trees.forEach(function (T) { swayTree(T, t, dt); });
  if (falling.length < V.falling && Math.random() < 0.08) spawnFalling(false);
  moveFalling(t, dt);
  updateBirds(dt, t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, cv.width, cv.height);

  // Mountains and Fuji (baked), then the mist drifting along the ridges.
  ctx.drawImage(SCN.cnv, 0, 0, cv.width, cv.height);
  if (V.showMountains && V.mistDrift > 0) {
    ctx.setTransform(PR, 0, 0, PR, 0, 0);
    ctx.globalAlpha = V.mistDrift * 0.5;
    for (var m = 0; m < mistBlobs.length; m++) {
      var Bm = mistBlobs[m];
      Bm.x += Bm.v * dt * (0.5 + 0.5 * V.wind);
      if (Bm.x - Bm.w / 2 > W + 50) Bm.x = -Bm.w / 2 - 40;
      if (Bm.x + Bm.w / 2 < -50) Bm.x = W + Bm.w / 2 + 40;
      ctx.drawImage(MIST.cnv, Bm.x - Bm.w / 2, Bm.y - Bm.h / 2, Bm.w, Bm.h);
    }
    ctx.globalAlpha = 1;
  }

  // The ground of fallen leaves (baked).
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(GRD.cnv, 0, Math.round(grdTop * PR));

  // Far birds (small, soft): behind both trees.
  drawBirds(ctx, t, 'far');
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // Far tree: branches and foliage on half-size layers, scaled up (soft).
  // The branches are solid; only the foliage is laid down weaker.
  var far = trees[1];
  if (far) {
    nightGlow(far, 0.6);
    var fl = FL.c;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    fl.setTransform(1, 0, 0, 1, 0, 0);
    fl.clearRect(0, 0, FL.cnv.width, FL.cnv.height);
    fl.setTransform(PR * FAR_RES, 0, 0, PR * FAR_RES, 0, 0);
    drawClumps(fl, far, t);
    var fb = FBR.c;
    fb.setTransform(1, 0, 0, 1, 0, 0);
    fb.clearRect(0, 0, FBR.cnv.width, FBR.cnv.height);
    fb.setTransform(PR * FAR_RES, 0, 0, PR * FAR_RES, 0, 0);
    drawBranches(fb, far, TREE.branchOpacity * TREE.farOpacity);
    ctx.drawImage(FBR.cnv, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = TREE.farOpacity;
    ctx.drawImage(FL.cnv, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
  }

  // Middle and near birds: between the far tree and the near tree.
  drawBirds(ctx, t, 'near');
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // Leaves further back fall behind the near tree.
  drawFalling(ctx, t, -1, MID_Z);

  // Near tree: branches on one layer, foliage on another.
  var near = trees[0];
  nightGlow(near, 1);
  var nb = NB.c, nl2 = NL.c;
  nb.setTransform(1, 0, 0, 1, 0, 0); nb.clearRect(0, 0, NB.cnv.width, NB.cnv.height);
  nb.setTransform(PR, 0, 0, PR, 0, 0);
  drawBranches(nb, near, TREE.branchOpacity);
  nl2.setTransform(1, 0, 0, 1, 0, 0); nl2.clearRect(0, 0, NL.cnv.width, NL.cnv.height);
  nl2.setTransform(PR, 0, 0, PR, 0, 0);
  drawClumps(nl2, near, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(NB.cnv, 0, 0);
  ctx.globalAlpha = TREE.nearOpacity;
  ctx.drawImage(NL.cnv, 0, 0);
  ctx.globalAlpha = 1;

  // Mid-depth leaves: in front of the near tree, but still behind the text and table.
  drawFalling(ctx, t, MID_Z, NEAR_Z);

  // The nearest leaves fall in front of everything, on #dynNear (above the text and table).
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, cvN.width, cvN.height);
  drawFalling(nctx, t, NEAR_Z, 2);

  // Ground strip: the loose leaves and every leaf that landed, lying on the near band's ground.
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.globalAlpha = 1;
  gctx.clearRect(0, 0, cvG.width, cvG.height);
  gctx.setTransform(PR, 0, 0, PR, 0, -(H - GH) * PR);
  drawPile(gctx, t);
  groundGlow(gctx, H);
  // the near band goes underneath them (it has its own night glow baked in)
  if (NEAR.h) {
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'destination-over';
    gctx.drawImage(NEAR.cnv, 0, Math.round((GH - NEAR.h) * PR));
    gctx.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(frame);
}

var _rz = null;
window.addEventListener('resize', function () {
  clearTimeout(_rz);
  _rz = setTimeout(function () { resize(); pile = []; rebuildAll(); }, 200);
});

buildControls();
resize();
rebuildAll();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
