<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFDF9">
<title>Koi Start Button Lab</title>

<!-- ============================================================
     koi.html — test bed for a new koi start button with no bitmap.

     The koi are drawn from code every frame on a small canvas (no
     image files): each fish has a spine of 24 points that follows the
     path its head swims, with a travelling wave down the body, so it
     bends into turns, its tail beats, its pectoral fins paddle and its
     tail fin trails behind. Colour patches are painted onto the body
     and bend with it.

     The button around it is the app's own (main.css and the real
     start-button markup), so the ring, halo, ripples, pond light and
     the koi's breath (rise and sink, blur at depth) are the app's.

     Four styles (plus the current PNG to compare):
       A 紅白・ふたり   two orange koi chasing in a circle, like today's picture
       B 錦・自由に     a kohaku and a gold ogon swimming freely in the pond
       C 墨と朱         sumi-e: ink-brush koi with a vermilion crown
       D 光の線         line drawing in the ring's own white, with a light wake

     Touch a koi: it darts away (faster beats, sharp turn).
     Swipe up on the water: the koi dives, as in the app.

     Not part of the app: not linked from index.html and not in the
     service worker's ASSETS list.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">

<style>
  html, body { height: 100%; }
  body {
    overflow: hidden; height: 100vh; padding-bottom: 0;
    background:
      radial-gradient(ellipse 70% 40% at 30% 42%, rgba(230, 104, 38, 0.10), transparent 70%),
      radial-gradient(ellipse 60% 40% at 72% 62%, rgba(136, 46, 71, 0.08), transparent 70%),
      var(--bg-base);
  }

  /* The koi canvas replaces the PNG. The pond inside the ring is 174px
     across; the canvas is larger (240px, PAD in the script) so nothing
     near the edge is cut off square. The swimming is drawn, so the
     PNG's 30s rotation is switched off. */
  .koi-canvas {
    position: absolute; z-index: 1;
    left: 50%; top: 50%;
    width: 240px; height: 240px;
    margin: -120px 0 0 -120px;
    pointer-events: none;
  }
  .koi-image.hidden, .koi-canvas.hidden { display: none; }

  /* Ring size (test bed only): the ring, glow, pond light and ripples
     are scaled together by --kl-ring; the button's box grows with them
     so the text around it makes room; the koi canvas grows too, but the
     koi stay the same size (more water, not bigger koi). */
  .blossom-screen .icon-wrapper { width: calc(200px * var(--kl-ring, 1)); height: calc(200px * var(--kl-ring, 1)); }
  .kl-ringscale { position: absolute; inset: 0; transform: scale(var(--kl-ring, 1)); transform-origin: 50% 50%; pointer-events: none; }
  .blossom-screen .koi-canvas {
    width: calc(240px * var(--kl-ring, 1)); height: calc(240px * var(--kl-ring, 1));
    margin: calc(-120px * var(--kl-ring, 1)) 0 0 calc(-120px * var(--kl-ring, 1));
  }
  html.kl-own-depth .blossom-screen.visible .blossom-char { animation: none; }
  html.kl-own-depth .koi-shadow { display: none; }
  html.kl-own-depth .start-btn.diving .koi-dive-wrap { transform: none; opacity: 1; }

  /* ---------- panel ---------- */
  .kl-panel {
    position: fixed; top: 16px; right: 16px; z-index: 1000;
    width: 330px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px); overflow-y: auto;
    background: rgba(255, 253, 249, 0.96);
    border: 1px solid var(--border-1); border-radius: 18px;
    box-shadow: 0 10px 40px rgba(68, 52, 48, 0.14);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--text-med);
    -webkit-user-select: none; user-select: none;
    touch-action: pan-y;
  }
  .kl-panel.collapsed .kl-body { display: none; }
  .kl-head {
    position: sticky; top: 0; z-index: 1; cursor: move;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; background: rgba(255, 253, 249, 0.98);
    border-bottom: 1px solid var(--border-4); border-radius: 18px 18px 0 0;
    touch-action: none;
  }
  .kl-title { flex: 1; font-weight: 600; color: var(--text-dark); }
  .kl-btn {
    border: 1px solid var(--border-2); background: transparent; border-radius: 999px;
    padding: 5px 12px; font: inherit; color: var(--text-med); cursor: pointer;
  }
  .kl-btn.on { background: var(--accent); border-color: var(--accent); color: #FFFDF9; }
  .kl-body { padding: 10px 14px 14px; }
  .kl-opts { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
  .kl-opt {
    text-align: left; border: 1px solid var(--border-2); background: #fff;
    border-radius: 12px; padding: 8px 10px; font: inherit; color: var(--text-med); cursor: pointer;
  }
  .kl-opt b { color: var(--text-dark); font-weight: 600; }
  .kl-opt small { display: block; color: var(--text-mute); font-size: 12px; line-height: 1.4; }
  .kl-opt.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(176, 74, 90, 0.18); }
  .kl-group { margin: 12px 0 4px; font-weight: 600; color: var(--text-dark); }
  .kl-row { display: grid; grid-template-columns: 1fr 48px; gap: 2px 8px; align-items: center; margin: 6px 0; }
  .kl-row label { grid-column: 1 / 3; font-size: 12px; color: var(--text-mute); }
  .kl-row input[type=range] { width: 100%; }
  .kl-row output { text-align: right; font-variant-numeric: tabular-nums; }
  .kl-seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 999px; overflow: hidden; }
  .kl-seg button { border: 0; background: transparent; padding: 5px 12px; font: inherit; color: var(--text-mute); cursor: pointer; }
  .kl-seg button.on { background: var(--accent); color: #FFFDF9; }
  .kl-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .kl-fps { font-size: 11px; color: var(--text-faint); margin-top: 8px; }

  /* ---------- side-by-side view ---------- */
  .kl-grid {
    position: fixed; inset: 0; z-index: 500; display: none;
    align-items: center; justify-content: center; gap: 28px 40px; flex-wrap: wrap;
    padding: 40px 380px 40px 40px; box-sizing: border-box;
  }
  .kl-grid.on { display: flex; }
  .kl-tile { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .kl-pond {
    position: relative; width: 230px; height: 230px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(255, 253, 249, 0.75) 0%, rgba(253, 232, 218, 0.55) 58%, rgba(240, 125, 64, 0.18) 100%);
    box-shadow: 0 0 0 6px #FFFDF9, 0 0 22px 8px rgba(255, 190, 139, 0.45), 0 0 0 1px rgba(196, 78, 16, 0.12);
  }
  .kl-pond canvas { position: absolute; left: -18.97%; top: -18.97%; width: 137.93%; height: 137.93%; }
  .kl-pond img { position: absolute; left: 14%; top: 14%; width: 72%; height: 72%; object-fit: contain; animation: swimCircle 30s linear infinite; }
  .kl-tile p { margin: 0; font-family: "Shippori Mincho", serif; font-size: 16px; color: var(--text-dark); letter-spacing: 1px; }
  .kl-grid-on .blossom-screen { visibility: hidden; }
</style>
</head>
<body>

<div class="blossom-screen visible" id="blossomScreen">
  <div class="blossom-greeting">
    <div class="blossom-greeting-time">こんばんは</div>
    <div class="blossom-greeting-name">桜庭さん</div>
  </div>

  <button type="button" class="start-btn" id="startBtn" aria-label="上へスワイプしてはじめる">
    <div class="icon-wrapper">
      <div class="kl-ringscale">
      <div class="soft-glow" aria-hidden="true"></div>
      <div class="pond-surface" aria-hidden="true">
        <div class="pond-caustic"></div>
        <div class="pond-caustic c2"></div>
      </div>
      <svg class="rings-svg" viewBox="0 0 360 360" aria-hidden="true">
        <defs>
          <filter id="bandShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5"/>
          </filter>
        </defs>
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-1" />
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-2" />
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-3" />
        <circle cx="180" cy="180" r="91" class="gold-band-shadow" />
        <circle cx="180" cy="180" r="90" class="gold-band" />
      </svg>
      <div class="pond-bubbles" aria-hidden="true"></div>
      </div>
      <div class="koi-dive-wrap" id="koiDiveWrap">
        <div class="blossom-char">
          <div class="koi-shadow" aria-hidden="true"></div>
          <img src="icons/44173_0c6eff.png" class="koi-image hidden" id="koiPng" alt="">
          <canvas class="koi-canvas" id="koiCanvas" aria-hidden="true"></canvas>
        </div>
      </div>
    </div>
  </button>

  <div class="start-hints">
    <p class="start-hint-line">水にふれると、さざなみが静かに広がります。</p>
    <p class="start-hint-line">鯉に、そっとふれてみてください。</p>
    <p class="start-hint-line">水面をゆっくり上へなぞると、はじまります。</p>
  </div>
</div>

<div class="kl-grid" id="klGrid"></div>

<div class="kl-panel" id="klPanel">
  <div class="kl-head" id="klHead">
    <span class="kl-title">鯉 Koi button</span>
    <button class="kl-btn" id="klCompare" type="button">並べる</button>
    <button class="kl-btn" id="klFold" type="button">–</button>
  </div>
  <div class="kl-body">
    <div class="kl-opts" id="klOpts"></div>
    <div id="klControls"></div>
    <div class="kl-foot">
      <button class="kl-btn" id="klStartle" type="button">Touch the koi</button>
      <button class="kl-btn" id="klDive" type="button">Dive</button>
      <button class="kl-btn" id="klReset" type="button">Reset this style</button>
      <button class="kl-btn" id="klCopy" type="button">Copy values</button>
    </div>
    <div class="kl-fps" id="klFps"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     1. STYLES
     Each style is a set of values. The panel's sliders change the
     chosen style's values; they are saved per style in localStorage.
     ============================================================ */
  var STYLES = {
    A: {
      name: 'A 紅白・ふたり', note: 'Two orange koi chasing in a circle, like today\'s picture, but swimming.',
      look: 'pair', path: 'orbit', count: 2,
      length: 1, girth: 1, orbit: 0.38, speed: 1, wave: 1, fins: 1, shadow: 1, wanderSpread: 0.55
    },
    B: {
      name: 'B 錦・自由に', note: 'Kohaku and gold ogon swim the pond like real koi: to the edge and back, around each other, one diving now and then, one coming up for air.',
      look: 'nishiki', path: 'pool', count: 2,
      length: 0.88, girth: 1, orbit: 0.48, speed: 1.7, wave: 1.2, fins: 0.8, shadow: 1.75, wanderSpread: 0.78,
      eventEvery: 5, airShare: 0.45, deepTime: 7, deepSize: 0.57, deepBlur: 3, deepFade: 0.35
    },
    C: {
      name: 'C 墨と朱', note: 'Sumi-e: ink-brush koi with a vermilion crown, matching the ink reveal.',
      look: 'sumi', path: 'orbit', count: 2,
      length: 1, girth: 0.95, orbit: 0.38, speed: 0.8, wave: 1, fins: 1, shadow: 0, wanderSpread: 0.55
    },
    D: {
      name: 'D 光の線', note: 'Line drawing in the ring\'s own white, leaving a faint trail of light.',
      look: 'line', path: 'orbit', count: 2,
      length: 1, girth: 1, orbit: 0.38, speed: 1, wave: 1, fins: 1, shadow: 1, wanderSpread: 0.55
    },
    P: {
      name: '現在 Current (PNG)', note: 'Today\'s bitmap, turning once every 30 s. For comparison only.',
      look: 'png'
    }
  };
  var ORDER = ['A', 'B', 'C', 'D', 'P'];

  var CONTROLS = [
    { group: 'Swimming' },
    { id: 'path',   label: 'Path', type: 'seg', opts: [['orbit', '円 Circle'], ['wander', '自由 Free'], ['pool', '池 Pool']] },
    { id: 'count',  label: 'How many koi', min: 1, max: 3, step: 1 },
    { id: 'speed',  label: 'Speed (1 = a lap in about 12 s)', min: 0.3, max: 2.5, step: 0.05 },
    { id: 'orbit',  label: 'Circle size (share of the pond)', min: 0.2, max: 0.5, step: 0.01 },
    { id: 'wanderSpread', label: 'Free / Pool: how far from the middle (the pool\'s edge)', min: 0.3, max: 0.85, step: 0.01 },
    { id: 'wave',   label: 'Body wave (how much it bends)', min: 0, max: 2, step: 0.05 },
    { id: 'fins',   label: 'Fin and tail movement', min: 0, max: 2, step: 0.05 },
    { group: 'Pool: diving and air', pool: true },
    { id: 'eventEvery', label: 'A koi dives or comes up about every (s), 0 = never', min: 0, max: 20, step: 0.5, pool: true },
    { id: 'airShare', label: 'Share that come up for air (rest dive)', min: 0, max: 1, step: 0.05, pool: true },
    { id: 'deepTime', label: 'Time swimming about down deep (s)', min: 1, max: 20, step: 0.5, pool: true },
    { id: 'deepSize', label: 'Size at the deepest', min: 0.5, max: 1, step: 0.01, pool: true },
    { id: 'deepBlur', label: 'Blur at the deepest (px)', min: 0, max: 6, step: 0.25, pool: true },
    { id: 'deepFade', label: 'Fade at the deepest', min: 0, max: 0.7, step: 0.05, pool: true },
    { group: 'Look' },
    { id: 'ring',   label: 'Ring size (× today\'s; the koi stay the same size)', min: 1, max: 1.8, step: 0.05 },
    { id: 'length', label: 'Koi length (share of today\'s pond)', min: 0.6, max: 1.2, step: 0.01 },
    { id: 'girth',  label: 'Koi plumpness', min: 0.75, max: 1.3, step: 0.01 },
    { id: 'shadow', label: 'Shadow on the pond floor', min: 0, max: 2, step: 0.05 }
  ];

  var STORE = 'koiLab.v1';
  var DEF = JSON.parse(JSON.stringify(STYLES));
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) {
      for (var k in saved.styles || {}) if (STYLES[k]) for (var f in saved.styles[k]) STYLES[k][f] = saved.styles[k][f];
    }
  } catch (e) {}
  ORDER.forEach(function (key) { if (key !== 'P' && STYLES[key].ring === undefined) STYLES[key].ring = 1; });
  ['eventEvery', 'airShare', 'deepTime', 'deepSize', 'deepBlur', 'deepFade'].forEach(function (id) {
    ORDER.forEach(function (key) { if (key !== 'P' && STYLES[key][id] === undefined) STYLES[key][id] = DEF.B[id]; });
  });
  if (STYLES.B.path === 'wander') STYLES.B.path = 'pool';
  var current = 'A';
  try { var c0 = localStorage.getItem(STORE + '.cur'); if (STYLES[c0]) current = c0; } catch (e) {}
  function save() {
    var out = { styles: {} };
    ORDER.forEach(function (k) {
      if (k === 'P') return;
      out.styles[k] = {};
      CONTROLS.forEach(function (c) { if (c.id) out.styles[k][c.id] = STYLES[k][c.id]; });
    });
    try { localStorage.setItem(STORE, JSON.stringify(out)); localStorage.setItem(STORE + '.cur', current); } catch (e) {}
  }

  /* ============================================================
     2. SMALL HELPERS
     ============================================================ */
  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function angDiff(a, b) { var d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  /* Body half-width along the fish, x = 0 nose … 1 tail root. Blunt
     rounded head, widest at about a quarter, tapering to a slim
     tail root, as a koi seen from above. */
  function bodyW(x) {
    if (x <= 0) return 0;
    if (x < 0.27) return 0.5 + 0.5 * Math.sin(Math.PI / 2 * x / 0.27);
    if (x < 0.88) return 0.2 + 0.8 * (Math.cos(Math.PI * (x - 0.27) / 0.61) + 1) / 2;
    return 0.2 - 0.04 * (x - 0.88) / 0.12;
  }

  /* Smooth closed curve through points (midpoint quadratic splines). */
  function smoothClosed(ctx, pts) {
    var n = pts.length, a = pts[n - 1], b = pts[0];
    ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
    }
    ctx.closePath();
  }
  function smoothOpen(ctx, pts) {
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length - 1; i++) {
      var p = pts[i], q = pts[i + 1];
      ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
    }
    var l = pts[pts.length - 1]; ctx.lineTo(l.x, l.y);
  }

  /* ============================================================
     3. ONE KOI
     The head swims along a path; the body is laid along the trail
     the head has left (so it bends into turns like a real fish),
     then a travelling wave is added that grows toward the tail.
     ============================================================ */
  var N = 24;

  function Koi(pond, idx, seed) {
    this.pond = pond; this.idx = idx;
    this.r = rng(seed);
    this.trail = [];        // head positions, newest last
    this.phase = this.r() * TAU;
    this.finPhase = this.r() * TAU;
    this.heading = this.r() * TAU;
    this.burst = 0;         // startle: extra speed, decays
    this.turnKick = 0;
    this.n1 = this.r() * 100; this.n2 = this.r() * 100; this.n3 = this.r() * 100;
    this.P = []; this.T = []; this.Nn = []; this.W = [];
    for (var i = 0; i < N; i++) { this.P.push({ x: 0, y: 0 }); this.T.push({ x: 1, y: 0 }); this.Nn.push({ x: 0, y: 1 }); this.W.push(0); }
    this.patches = [];
    this.wake = [];
    // pool swimming
    this.v = 0; this.kick = this.r() < 0.5; this.gaitT = this.r(); this.beat = 1;
    this.wTurn = 0; this.pref = this.r() < 0.5 ? -1 : 1;
    this.z = 0.2; this.zv = 0; this.zHome = 0.12 + this.r() * 0.18; this.zT = this.zHome;
    this.mode = 'cruise'; this.modeT = 0; this.gulps = 0; this.mouth = 0; this.wrig = 0;
    this.act = null; this.actT = 0; this.actAge = 0; this.actLen = 1; this.goal = null; this.finAmp = 1;
  }

  Koi.prototype.reset = function () {
    this.trail.length = 0;
    var p = this.pond, s = p.s;
    this.theta = this.idx / p.fish.length * TAU;
    var R = s.wanderSpread * p.R;
    this.x = Math.cos(this.theta) * R * 0.5; this.y = Math.sin(this.theta) * R * 0.5;
    this.heading = this.theta + Math.PI / 2;
    if (s.path === 'pool') {
      this.heading = this.theta + (this.r() - 0.5) * 2;
      this.v = p.L * 0.3; this.z = this.zT = this.zHome; this.mode = 'cruise';
    }
  };

  Koi.prototype.step = function (dt, t) {
    var p = this.pond, s = p.s, L = p.L;
    var boost = 1 + 2.4 * this.burst;
    this.burst = Math.max(0, this.burst - dt * 1.3);
    var hx, hy;
    if (s.path === 'orbit') {
      // even chase around the circle, the radius breathing a little
      var R = s.orbit * p.R;
      var w = TAU / 12 * s.speed;
      this.theta += w * dt * boost;
      var rr = R * (1 + 0.05 * Math.sin(t * 0.7 + this.n1) + 0.03 * Math.sin(t * 1.9 + this.n2));
      hx = Math.cos(this.theta) * rr; hy = Math.sin(this.theta) * rr;
    } else if (s.path === 'pool') {
      this.stepPool(dt, boost);
      hx = this.x; hy = this.y;
    } else {
      // free swim: a wandering heading, steered back from the pond edge
      // and gently away from the other koi
      var lim = s.wanderSpread * p.R;
      var d = Math.hypot(this.x, this.y);
      var turn = 0.55 * Math.sin(t * 0.31 + this.n1) + 0.35 * Math.sin(t * 0.73 + this.n2) + 0.2 * Math.sin(t * 1.37 + this.n3);
      var home = Math.atan2(-this.y, -this.x);
      var edge = clamp((d - lim * 0.55) / (lim * 0.45), 0, 1);
      turn = turn * (1 - edge * 0.7) + angDiff(this.heading, home) * edge * 2.2;
      for (var j = 0; j < p.fish.length; j++) {
        var o = p.fish[j]; if (o === this) continue;
        var dx = this.x - o.x, dy = this.y - o.y, dd = Math.hypot(dx, dy);
        if (dd < L * 0.7 && dd > 0.01) turn += angDiff(this.heading, Math.atan2(dy, dx)) * (1 - dd / (L * 0.7)) * 0.9;
      }
      turn += this.turnKick; this.turnKick *= Math.pow(0.02, dt);
      this.heading += clamp(turn, -2.4, 2.4) * dt * (0.8 + 0.4 * s.speed);
      var v = L * 0.42 * s.speed * (0.85 + 0.25 * Math.sin(t * 0.5 + this.n3)) * boost;
      this.x += Math.cos(this.heading) * v * dt; this.y += Math.sin(this.heading) * v * dt;
      hx = this.x; hy = this.y;
    }
    if (s.path === 'orbit') { this.x = hx; this.y = hy; }
    // tail beat: faster when the koi goes faster (the pool sets its own)
    if (s.path !== 'pool') {
      this.phase += dt * TAU * (0.75 + 0.5 * s.speed) * (1 + 1.3 * this.burst);
      this.finPhase += dt * TAU * 0.45 * (1 + this.burst);
    }
    // the newest point is the live head; a new point is fixed each
    // time the head has moved a little way past the one before it

  /* Pectoral (front) and pelvic fins: paddle in and out. */

  /* Tail fin: a soft two-lobed fan that trails and flutters. */

  // C — sumi-e: soft ink wash body, brushed outline that swells and

      ctx.beginPath(); smoothClosed(ctx, k.mark.pts.map(function (q) { return k.at(q.x, q.y); }));
      ctx.fillStyle = k.mark.color; ctx.fill();

        k.fin(0.2, 1, 0.24, 0.95, fl * Math.sin(k.finPhase)),
        k.fin(0.2, -1, 0.24, 0.95, fl * Math.sin(k.finPhase + 0.6)),
        k.fin(0.52, 1, 0.13, 0.8, fl * 0.7 * Math.sin(k.finPhase + 1.3)),
        k.fin(0.52, -1, 0.13, 0.8, fl * 0.7 * Math.sin(k.finPhase + 1.9))
      ];
      // the wake: where the tail has been
      var tp = { x: k.P[N - 1].x, y: k.P[N - 1].y };
      k.wake.push(tp); if (k.wake.length > 40) k.wake.shift();
      for (var i = 1; i < k.wake.length; i++) {
        var f = i / k.wake.length;
        ctx.beginPath(); ctx.moveTo(k.wake[i - 1].x, k.wake[i - 1].y); ctx.lineTo(k.wake[i].x, k.wake[i].y);
        ctx.strokeStyle = 'rgba(255, 253, 249, ' + (0.55 * f * f).toFixed(3) + ')';
        ctx.lineWidth = L * 0.03 * f; ctx.lineCap = 'round'; ctx.stroke();
      }
      function shape() {
        ctx.beginPath(); smoothClosed(ctx, out); tailPath(ctx, tail);
        fins.forEach(function (F) { finPath(ctx, F); });
      }
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      // soft warm shadow so the white line reads on cream
      if (s.shadow > 0) {
        ctx.save();
        ctx.translate(0, L * 0.02 * s.shadow);
        ctx.filter = 'blur(' + (L * 0.02 * s.shadow).toFixed(1) + 'px)';
        shape(); ctx.strokeStyle = 'rgba(196, 78, 16, ' + (0.42 * s.shadow).toFixed(3) + ')';
        ctx.lineWidth = L * 0.05; ctx.stroke();
        ctx.restore();
      }
      // a faint body fill, fins and tail rays
      ctx.beginPath(); smoothClosed(ctx, out);
      ctx.fillStyle = 'rgba(255, 253, 249, 0.45)'; ctx.fill();
      ctx.beginPath();
      fins.forEach(function (F) { F.rays.forEach(function (p) { ctx.moveTo(F.root.x, F.root.y); ctx.lineTo(p.x, p.y); }); });
      tail.rays.forEach(function (p) { ctx.moveTo(tail.base.x, tail.base.y); ctx.lineTo(p.x, p.y); });
      ctx.strokeStyle = 'rgba(255, 253, 249, 0.75)'; ctx.lineWidth = L * 0.007; ctx.stroke();
      shape();
      ctx.strokeStyle = '#FFFDF9'; ctx.lineWidth = L * 0.03; ctx.stroke();
      // a single vermilion mark on the head, and the eyes
      var c = k.at(0.14, 0);
      ctx.beginPath(); ctx.arc(c.x, c.y, L * 0.03, 0, TAU);
      ctx.fillStyle = 'rgba(224, 92, 50, 0.85)'; ctx.fill();
      drawEyes(ctx, k, 'rgba(196, 92, 50, 0.9)', L * 0.014);
    }
  };

  /* ============================================================
     5. THE POND (one canvas, its koi, its own loop)
     ============================================================ */
  var ponds = [];
  var PAD = 240 / 174;   // canvas size ÷ pond size
  function Pond(canvas, styleKey) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.key = styleKey; this.s = STYLES[styleKey];
    this.fish = []; this.t = 0; this.acc = 0; this.rings = []; this.eventT = 3;
    this.off = document.createElement('canvas'); this.offCtx = this.off.getContext('2d');
    this.resize(); this.rebuild();
    ponds.push(this);
  }
  Pond.prototype.resize = function () {
    var r = this.canvas.getBoundingClientRect();
    this.size = r.width || 174;
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    this.canvas.width = Math.round(this.size * dpr); this.canvas.height = Math.round(this.size * dpr);
    this.off.width = this.canvas.width; this.off.height = this.canvas.height;
    this.dpr = dpr;
    this.half = this.size / 2;          // canvas centre
    this.R = this.half / PAD;           // the pond's radius (inside the ring)
    this.L = this.R / (this.ringScale || 1) * (this.s.length || 0.9);
  };
  Pond.prototype.rebuild = function () {
    this.s = STYLES[this.key];
    this.L = this.R / (this.ringScale || 1) * this.s.length;
    this.fish = [];
    for (var i = 0; i < (this.s.count || 2); i++) this.fish.push(new Koi(this, i, 1234 + i * 777));
    var look = LOOKS[this.s.look];
    this.fish.forEach(function (k) { look.setup(k); });
    this.fish.forEach(function (k) { k.reset(); });
    // warm up together, so the koi already have trails (and keep apart)
    this.rings = []; this.t = 0; this.eventT = 2 + Math.random() * 2;
    for (var w = 0; w < 500; w++) {
      this.t += 1 / 120;
      for (i = 0; i < this.fish.length; i++) this.fish[i].step(1 / 120, this.t);
    }
    this.rings = [];
  };

  /* Pool: now and then one koi (only one at a time) dives or comes up
     for air; the others stay at their own cruising depth. */
  Pond.prototype.events = function (dt) {
    var s = this.s;
    for (var i = this.rings.length - 1; i >= 0; i--) { this.rings[i].t += dt; if (this.rings[i].t > 1.6) this.rings.splice(i, 1); }
    if (!(s.eventEvery > 0) || this.leaving) return;
    // each koi decides for itself, so several can be down at once (each
    // at its own depth); only the surface is one at a time: a koi comes
    // up for air only while no other koi is up there or on its way
    var fish = this.fish, n = fish.length;
    for (var j = 0; j < n; j++) {
      var k = fish[j];
      if (k.mode !== 'cruise' || Math.abs(k.z - k.zHome) > 0.08) continue;
      if (k.restT === undefined) k.restT = s.eventEvery * n * (0.3 + Math.random() * 0.9);
      k.restT -= dt;
      if (k.restT > 0) continue;
      k.restT = s.eventEvery * n * (0.6 + Math.random() * 0.8);
      var surfaceTaken = fish.some(function (o) { return o !== k && (o.mode === 'air' || o.z < o.zHome - 0.03); });
      k.startMode(Math.random() < s.airShare && !surfaceTaken ? 'air' : 'dive');
    }
  };

  /* Pool: draw each koi at its own depth — deeper is smaller, blurrier
     and fainter; the deepest are drawn first, so nearer koi pass over. */
  Pond.prototype.drawPool = function (ctx, look, s) {
    var oc = this.offCtx, dpr = this.dpr, R = this.half, fish = this.fish.slice();
    fish.sort(function (a, b) { return b.z - a.z; });
    for (var i = 0; i < fish.length; i++) {
      // measured from the koi's own cruising depth: every koi that is
      // just cruising is drawn at full size, sharp and solid
      var k = fish[i], z = k.z;
      var gone = clamp((z - 1) / 0.5, 0, 1);       // past the deepest (swipe up): fading out
      var zd = clamp((z - k.zHome) / (1 - k.zHome), 0, 1) + gone * 0.5;
      if (gone >= 1) continue;
      var up = clamp((k.zHome - z) / (k.zHome + 0.12), 0, 1);
      var sc = up > 0 ? 1 + 0.05 * up : 1 - (1 - s.deepSize) * zd;
      var se = Object.create(s);
      se.shadow = s.shadow * (1 + 0.4 * up - 0.7 * zd);
      var c = k.P[9];
      if (zd < 0.01) {           // not diving: drawn straight onto the pond
        ctx.save();
        ctx.translate(c.x, c.y); ctx.scale(sc, sc); ctx.translate(-c.x, -c.y);
        look.draw(ctx, k, se);
        ctx.restore();
        continue;
      }
      // diving: drawn on its own layer, then laid down blurred and faded;
      // only the square around the koi is cleared and copied
      var half = this.L * 0.95, bx = Math.max(0, Math.floor((R + c.x - half) * dpr)), by = Math.max(0, Math.floor((R + c.y - half) * dpr));
      var bw = Math.min(this.off.width - bx, Math.ceil(half * 2 * dpr)), bh = Math.min(this.off.height - by, Math.ceil(half * 2 * dpr));
      if (bw <= 0 || bh <= 0) continue;
      oc.setTransform(1, 0, 0, 1, 0, 0);
      oc.clearRect(bx, by, bw, bh);
      oc.setTransform(dpr, 0, 0, dpr, 0, 0);
      oc.translate(R + c.x, R + c.y); oc.scale(sc, sc); oc.translate(-c.x, -c.y);
      oc.save(); look.draw(oc, k, se); oc.restore();
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      var blur = s.deepBlur * zd * dpr;
      if (blur > 0.15) ctx.filter = 'blur(' + blur.toFixed(2) + 'px)';
      ctx.globalAlpha = (1 - s.deepFade * Math.min(zd, 1)) * (1 - gone);
      ctx.drawImage(this.off, bx, by, bw, bh, bx, by, bw, bh);
      ctx.restore();
    }
    // rings on the water where a koi gulped air
    for (i = 0; i < this.rings.length; i++) {
      var g = this.rings[i];
      for (var j = 0; j < 2; j++) {
        var t = g.t - j * 0.28; if (t <= 0) continue;
        var f = t / 1.6, rad = this.L * (0.05 + 0.32 * (1 - Math.pow(1 - f, 2.2)));
        ctx.beginPath(); ctx.arc(g.x, g.y, rad, 0, TAU);
        ctx.lineWidth = this.L * 0.03 * (1 - f) + 0.4;
        ctx.strokeStyle = 'rgba(196, 96, 40, ' + (0.18 * (1 - f)).toFixed(3) + ')'; ctx.stroke();
        ctx.lineWidth = this.L * 0.016 * (1 - f) + 0.3;
        ctx.strokeStyle = 'rgba(255, 253, 249, ' + (0.9 * (1 - f)).toFixed(3) + ')'; ctx.stroke();
      }
    }
  };
  Pond.prototype.frame = function (dt) {
    var s = this.s, ctx = this.ctx, look = LOOKS[s.look];
    this.L = this.R / (this.ringScale || 1) * s.length;
    dt = Math.min(dt, 0.1);
    this.acc += dt;
    var steps = 0;
    while (this.acc >= 1 / 120 && steps < 16) {
      this.t += 1 / 120; this.acc -= 1 / 120; steps++;
      for (var i = 0; i < this.fish.length; i++) this.fish[i].step(1 / 120, this.t);
      if (s.path === 'pool') this.events(1 / 120);
    }
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.size, this.size);
    ctx.translate(this.half, this.half);
    for (i = 0; i < this.fish.length; i++) this.fish[i].build();
    if (s.path === 'pool') { this.drawPool(ctx, look, s); return; }
    for (i = 0; i < this.fish.length; i++) { ctx.save(); look.draw(ctx, this.fish[i], s); ctx.restore(); }
  };
  Pond.prototype.leave = function () {
    this.leaving = true;
    this.fish.forEach(function (k, i) { k.exitDive(i * 0.12); });
  };
  Pond.prototype.startle = function (px, py) {
    var best = null, bd = 1e9;
    this.fish.forEach(function (k) {
      var d = px === undefined ? 0 : Math.hypot(k.P[6].x - px, k.P[6].y - py);
      if (d < bd) { bd = d; best = k; }
    });
    this.fish.forEach(function (k) {
      k.burst = k === best ? 1 : 0.5;
      k.turnKick = (k.r() < 0.5 ? -1 : 1) * 3;
    });
  };

  /* ============================================================
     6. PAGE: main button, side-by-side view, panel
     ============================================================ */
  var mainCanvas = document.getElementById('koiCanvas');
  var png = document.getElementById('koiPng');
  var mainPond = new Pond(mainCanvas, current === 'P' ? 'A' : current);
  function showCurrent() {
    var isPng = current === 'P';
    ownDepth();
    applyRing();
    png.classList.toggle('hidden', !isPng);
    mainCanvas.classList.toggle('hidden', isPng);
    if (!isPng) { mainPond.key = current; mainPond.resize(); mainPond.rebuild(); }
  }

  var grid = document.getElementById('klGrid');
  var gridPonds = [];
  function buildGrid() {
    grid.innerHTML = '';
    gridPonds = gridPonds.filter(function () { return false; });
    ORDER.forEach(function (key) {
      var tile = document.createElement('div'); tile.className = 'kl-tile';
      var pond = document.createElement('div'); pond.className = 'kl-pond';
      if (key === 'P') {
        var im = document.createElement('img'); im.src = 'icons/44173_0c6eff.png'; im.alt = '';
        pond.appendChild(im);
      } else {
        var cv = document.createElement('canvas'); pond.appendChild(cv);
      }
      var lab = document.createElement('p'); lab.textContent = STYLES[key].name;
      tile.appendChild(pond); tile.appendChild(lab); grid.appendChild(tile);
      tile.addEventListener('click', function () { selectStyle(key); });
      if (key !== 'P') {
        var gp = new Pond(cv, key);
        pond.addEventListener('pointerdown', function (e) {
          var r = cv.getBoundingClientRect();
          gp.startle(e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2);
        });
        gridPonds.push(gp);
      }
    });
  }
  var comparing = false;
  document.getElementById('klCompare').addEventListener('click', function () {
    comparing = !comparing;
    this.classList.toggle('on', comparing);
    grid.classList.toggle('on', comparing);
    document.documentElement.classList.toggle('kl-grid-on', comparing);
    if (comparing) buildGrid();
    else { gridPonds.forEach(function (gp) { var i = ponds.indexOf(gp); if (i >= 0) ponds.splice(i, 1); }); gridPonds = []; grid.innerHTML = ''; }
  });

  // panel
  var optsEl = document.getElementById('klOpts'), ctlEl = document.getElementById('klControls');
  ORDER.forEach(function (key) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'kl-opt'; b.dataset.key = key;
    b.innerHTML = '<b>' + STYLES[key].name + '</b><small>' + STYLES[key].note + '</small>';
    b.addEventListener('click', function () { selectStyle(key); });
    optsEl.appendChild(b);
  });
  function buildControls() {
    ctlEl.innerHTML = '';
    if (current === 'P') { ctlEl.innerHTML = '<div class="kl-group">Today\'s picture has no settings here.</div>'; return; }
    var S = STYLES[current];
    CONTROLS.forEach(function (c) {
      if (c.pool && S.path !== 'pool') return;
      if (c.group) { var g = document.createElement('div'); g.className = 'kl-group'; g.textContent = c.group; ctlEl.appendChild(g); return; }
      var row = document.createElement('div'); row.className = 'kl-row';
      var lab = document.createElement('label'); lab.textContent = c.label; row.appendChild(lab);
      if (c.type === 'seg') {
        var seg = document.createElement('div'); seg.className = 'kl-seg';
        c.opts.forEach(function (o) {
          var b = document.createElement('button'); b.type = 'button'; b.textContent = o[1];
          b.classList.toggle('on', S[c.id] === o[0]);
          b.addEventListener('click', function () {
            S[c.id] = o[0]; save(); refreshPonds(true);
            if (c.id === 'path') { buildControls(); return; }
            seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
          });
          seg.appendChild(b);
        });
        row.appendChild(seg);
      } else {
        var inp = document.createElement('input'); inp.type = 'range';
        inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = S[c.id];
        var out = document.createElement('output'); out.textContent = S[c.id];
        inp.addEventListener('input', function () {
          S[c.id] = +inp.value; out.textContent = inp.value; save();
          refreshPonds(c.id === 'count' || c.id === 'length' || c.id === 'ring');
        });
        row.appendChild(inp); row.appendChild(out);
      }
      ctlEl.appendChild(row);
    });
  }
  // In the pool each koi has its own depth, so the button's breath that
  // sinks and blurs all the koi together is switched off there.
  function ownDepth() {
    document.documentElement.classList.toggle('kl-own-depth', current !== 'P' && STYLES[current].path === 'pool');
  }
  // ring size: scales the main button's ring and pond; the koi keep their size
  function applyRing() {
    var g = current === 'P' ? 1 : (+STYLES[current].ring || 1);
    document.documentElement.style.setProperty('--kl-ring', g);
    mainPond.ringScale = g;
    mainPond.resize();
  }
  function refreshPonds(rebuild) {
    ownDepth();
    applyRing();
    ponds.forEach(function (p) { p.s = STYLES[p.key]; if (rebuild && p.key === current) p.rebuild(); });
  }
  function selectStyle(key) {
    current = key; save();
    optsEl.querySelectorAll('.kl-opt').forEach(function (b) { b.classList.toggle('on', b.dataset.key === key); });
    buildControls(); showCurrent();
  }
  selectStyle(current);

  document.getElementById('klReset').addEventListener('click', function () {
    if (current === 'P') return;
    var d = DEF[current];
    CONTROLS.forEach(function (c) { if (c.id) STYLES[current][c.id] = d[c.id]; });
    save(); buildControls(); refreshPonds(true);
  });
  document.getElementById('klCopy').addEventListener('click', function () {
    var S = STYLES[current], o = { style: current, look: S.look };
    CONTROLS.forEach(function (c) { if (c.id && S[c.id] !== undefined) o[c.id] = S[c.id]; });
    var txt = 'var KOI_LOOK = ' + JSON.stringify(o, null, 2) + ';';
    var btn = this;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () {
      btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy values'; }, 1200);
    }, function () { window.prompt('Copy:', txt); });
  });
  document.getElementById('klFold').addEventListener('click', function () {
    var p = document.getElementById('klPanel'); p.classList.toggle('collapsed');
    this.textContent = p.classList.contains('collapsed') ? '+' : '–';
  });
  // drag the panel by its title bar
  (function () {
    var head = document.getElementById('klHead'), panel = document.getElementById('klPanel'), sx, sy, ox, oy, on = false;
    head.addEventListener('pointerdown', function (e) {
      if (e.target.tagName === 'BUTTON') return;
      on = true; sx = e.clientX; sy = e.clientY;
      var r = panel.getBoundingClientRect(); ox = r.left; oy = r.top;
      head.setPointerCapture(e.pointerId);
    });
    head.addEventListener('pointermove', function (e) {
      if (!on) return;
      panel.style.left = (ox + e.clientX - sx) + 'px'; panel.style.top = (oy + e.clientY - sy) + 'px'; panel.style.right = 'auto';
    });
    head.addEventListener('pointerup', function () { on = false; });
  })();

  /* Touch the koi / swipe up to dive (a small copy of the app's gesture). */
  var screen = document.getElementById('blossomScreen'), btn = document.getElementById('startBtn');
  var downY = null, downX = 0, downT = 0;
  function startleMain(clientX, clientY) {
    if (current === 'P') {
      btn.classList.remove('startling'); void btn.offsetWidth; btn.classList.add('startling');
      setTimeout(function () { btn.classList.remove('startling'); }, 260);
      return;
    }
    var r = mainCanvas.getBoundingClientRect();
    mainPond.startle(clientX === undefined ? undefined : clientX - r.left - r.width / 2,
                     clientY === undefined ? undefined : clientY - r.top - r.height / 2);
  }
  var diving = false;
  function dive() {
    if (diving) return;
    diving = true;
    // pool: the koi themselves wriggle and dive away (drawn), instead of
    // the whole koi layer sliding down and fading
    var pool = current !== 'P' && STYLES[current].path === 'pool';
    if (pool) mainPond.leave();
    btn.classList.add('diving'); screen.classList.add('diving');
    setTimeout(function () {
      btn.classList.remove('diving'); screen.classList.remove('diving');
      diving = false;
      mainPond.leaving = false;
      showCurrent();
    }, pool ? 3400 : 1600);
  }
  screen.addEventListener('pointerdown', function (e) { downY = e.clientY; downX = e.clientX; downT = performance.now(); });
  screen.addEventListener('pointerup', function (e) {
    if (downY === null) return;
    var dy = downY - e.clientY, dx = e.clientX - downX;
    if (dy > 60) dive();
    else if (Math.hypot(dx, dy) < 10 && performance.now() - downT < 400) {
      var r = mainCanvas.getBoundingClientRect();
      if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < r.width / 2) startleMain(e.clientX, e.clientY);
    }
    downY = null;
  });
  document.getElementById('klStartle').addEventListener('click', function () { startleMain(); });
  document.getElementById('klDive').addEventListener('click', dive);
  window.addEventListener('resize', function () { ponds.forEach(function (p) { p.resize(); }); });

  /* ============================================================
     7. LOOP
     ============================================================ */
  var last = performance.now(), fpsEl = document.getElementById('klFps'), frames = 0, fpsT = last, costAcc = 0;
  function loop(now) {
    var dt = (now - last) / 1000; last = now;
    var t0 = performance.now();
    ponds.forEach(function (p) {
      if (p === mainPond && (current === 'P' || comparing)) return;
      p.frame(dt);
    });
    costAcc += performance.now() - t0; frames++;
    if (now - fpsT > 1000) {
      fpsEl.textContent = frames + ' fps · drawing ' + (costAcc / frames).toFixed(2) + ' ms a frame';
      frames = 0; costAcc = 0; fpsT = now;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.KoiLab = { STYLES: STYLES, ponds: ponds, TUNE: TUNE };
})();
</script>
</body>
</html>
