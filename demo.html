<style>
  /* ── Demo-only chrome. Does not touch any .panel or ambient class. ── */

  /* Kill the ticker's reserved padding so the info bar sits vertically
     centred without an empty strip below it. */
  body.demo-page .info-inner { padding-bottom: 0; }

  /* Container: pins the demo aside top-right, out of the way of the
     centred panel content. */
  .demo-aside {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 9000;
    width: 320px;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: #231304;
    background: rgba(253, 250, 242, 0.96);
    border: 1px solid #d8b478;
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(60, 30, 10, 0.18);
    padding: 12px 14px 14px 14px;
    backdrop-filter: blur(6px);
  }
  .demo-aside.collapsed { width: auto; padding: 8px 12px; }
  .demo-aside.collapsed .demo-body { display: none; }
  .demo-aside.collapsed .demo-collapse-label { display: none; }

  .demo-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .demo-title {
    font-family: "Shippori Mincho", serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: #8f2f00;
  }
  .demo-collapse-btn {
    background: transparent;
    border: 1px solid #d8b478;
    color: #5a3818;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .demo-collapse-btn:hover { background: #fdf0c8; }

  .demo-body { display: block; }

  .demo-row {
    display: grid;
    grid-template-columns: 78px 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .demo-row label {
    font-size: 12px;
    color: #5a3818;
    letter-spacing: 0.4px;
  }
  .demo-row input[type="text"],
  .demo-row input[type="number"],
  .demo-row select {
    width: 100%;
    font: inherit;
    font-size: 12.5px;
    color: #231304;
    background: #ffffff;
    border: 1px solid #e8c88a;
    border-radius: 8px;
    padding: 5px 8px;
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
  }
  .demo-row input[type="number"] { width: 100%; }
  .demo-row select { background-image: none; }

  .demo-check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #5a3818;
    margin: 0 0 10px 0;
    user-select: none;
  }
  .demo-check input { margin: 0; }

  .demo-replay {
    width: 100%;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #ffffff;
    background: #c9600a;
    border: 1px solid #c9600a;
    border-radius: 10px;
    padding: 7px 0;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .demo-replay:active { background: #7a3208; }

  .demo-raw {
    font-family: "Shippori Mincho", serif;
    font-size: 12px;
    line-height: 1.7;
    color: #3d2410;
    background: #fdf5e0;
    border: 1px dashed #e8c88a;
    border-radius: 10px;
    padding: 8px 10px;
    word-break: break-word;
  }
  .demo-raw-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #7a5028;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .demo-raw + .demo-raw { margin-top: 8px; }
  .demo-raw-sub { color: #5a3818; }

  /* Force the panel content into view for the demo — normally driven
     by carousel activation. */
  body.demo-page .panel { }
  body.demo-page .panel .panel-content {
    opacity: 1;
    transform: translateX(0);
    filter: blur(0);
  }

  /* Hide the theme toggle and version badge — they belong to the name
     screen and would be noise here. */
  body.demo-page .theme-toggle,
  body.demo-page .app-version { display: none; }

  /* Collapse on narrow viewports so the panel isn't squashed. */
  @media (max-width: 900px) {
    .demo-aside { width: 260px; font-size: 12px; }
  }
</style>

<script>
/* ============================================================
   Greeting demo
   ------------------------------------------------------------
   Uses the exact getDynamicGreeting() priority ladder from
   app.js, driven by the demo controls instead of the network
   and the Nagoya clock. Renders into the same #panelGreetingBody
   target and plays the same two-beat + staggered-body reveal.
   ============================================================ */

/* ---- State driven by the controls ---- */
var demoName = '桜庭さん';
var demoTime = 'day';
var demoTemp = 22;
var demoWeather = 'clear';
var demoTempIsNull = false;

/* ---- Timing constants (mirrored from app.js) ---- */
var PANEL_PHRASE_MIN = 5;
var PANEL_PHRASE_MAX = 10;
var PANEL_PHRASE_DURATION = 500;
var PANEL_PHRASE_STAGGER_MAX = 600;
var PANEL_PHRASE_DELAY = 300;
var PANEL_1_POST_BEAT_DELAY = 1000;

var panelPhraseTimers = [];
function clearPanelPhraseTimers() {
  for (var i = 0; i < panelPhraseTimers.length; i++) clearTimeout(panelPhraseTimers[i]);
  panelPhraseTimers = [];
}

/* ---- The exact production greeting ladder ---- */
function getDynamicGreeting() {
  var time = demoTime;
  var weather = demoWeather;
  var temp = demoTempIsNull ? null : demoTemp;

  var isRain = (weather === 'rain' || weather === 'drizzle');
  var isCold = (temp !== null && temp <= 9);
  var isNight = (time === 'night');
  var isMorning = (time === 'morning');

  if (weather === 'snow' && isNight) {
    return '雪の降る夜遅いお時間に、お部屋まで足を運んでいただき心より感謝申し上げます。';
  }
  if (isRain && isNight) {
    return '雨で足元の悪い夜遅いお時間に、お部屋までお越しいただき誠にありがとうございます。';
  }
  if (isCold && isNight) {
    return '冷え込みの厳しい夜遅いお時間に、お部屋までお越しいただき誠にありがとうございます。';
  }
  if (isRain && isMorning) {
    return '雨の降る朝早くのお時間に、お部屋までお越しいただき誠にありがとうございます。';
  }
  if (isCold && isMorning) {
    return '朝の冷え込みが厳しい中、お部屋まで足を運んでいただき誠にありがとうございます。';
  }
  if (weather === 'thunderstorm') {
    return 'あいにくのお天気の中、無事にお部屋までお越しいただき心より感謝申し上げます。';
  }
  if (isRain) {
    return '雨で足元の悪い中、お部屋までお越しいただき誠にありがとうございます。';
  }
  if (weather === 'snow') {
    return '雪の降る大変寒い中、お部屋まで足を運んでいただき誠にありがとうございます。';
  }
  if (weather === 'fog') {
    return 'お足元の見えにくい中、無事にお越しいただきありがとうございます。';
  }
  if (isCold) {
    return '冷え込みの厳しい中、お部屋までお越しいただき誠にありがとうございます。';
  }
  if (temp !== null && temp <= 14) {
    return '風の冷たい中、お部屋まで足を運んでいただきありがとうございます。';
  }
  if (temp !== null && temp >= 28) {
    return '日差しの強い暑い中、お部屋までお越しいただき誠にありがとうございます。';
  }
  if (temp !== null) {
    if (isNight) {
      return '夜遅いお時間にもかかわらず、お部屋までお越しいただき誠にありがとうございます。';
    }
    if (isMorning) {
      return '朝早くのお時間に、お部屋までお越しいただき誠にありがとうございます。';
    }
    if (time === 'evening') {
      return '夕暮れ時のお忙しいお時間に、お越しいただき誠にありがとうございます。';
    }
    if (time === 'day') {
      return '穏やかなお天気の中、お部屋までお越しいただき誠にありがとうございます。';
    }
  }
  return '秋風の心地よい中、お部屋までお越しいただき誠にありがとうございます。';
}

/* ---- Human-readable classification label for the controls ---- */
function classify() {
  var weather = demoWeather;
  var temp = demoTempIsNull ? null : demoTemp;
  var isRain = (weather === 'rain' || weather === 'drizzle');
  var isCold = (temp !== null && temp <= 9);
  var isNight = (demoTime === 'night');
  var isMorning = (demoTime === 'morning');

  if (weather === 'snow' && isNight) return 'A · Compound (snow + night)';
  if (isRain && isNight)           return 'A · Compound (rain + night)';
  if (isCold && isNight)           return 'A · Compound (cold + night)';
  if (isRain && isMorning)         return 'A · Compound (rain + morning)';
  if (isCold && isMorning)         return 'A · Compound (cold + morning)';
  if (weather === 'thunderstorm')  return 'B · Single weather (thunderstorm)';
  if (isRain)                      return 'B · Single weather (rain/drizzle)';
  if (weather === 'snow')          return 'B · Single weather (snow)';
  if (weather === 'fog')           return 'B · Single weather (fog)';
  if (isCold)                      return 'C · Single temp (cold ≤ 9°C)';
  if (temp !== null && temp <= 14) return 'C · Single temp (chilly 10–14°C)';
  if (temp !== null && temp >= 28) return 'C · Single temp (hot ≥ 28°C)';
  if (temp !== null)               return 'D · Single time of day';
  return 'E · Offline / loading fallback';
}

/* ---- Chunker (simplified from app.js) ---- */
function isJapanesePunctuation(ch) {
  return ch === '、' || ch === '。' || ch === '！' || ch === '？';
}
function chunkPanelText(text) {
  var clean = String(text).replace(/\s+/g, '');
  if (clean === '') return [];
  var raw = [];
  var i = 0;
  while (i < clean.length) {
    var len = PANEL_PHRASE_MIN + Math.floor(Math.random() * (PANEL_PHRASE_MAX - PANEL_PHRASE_MIN + 1));
    if (i + len > clean.length) len = clean.length - i;
    raw.push(clean.substr(i, len));
    i += len;
  }
  if (raw.length >= 2) {
    var lastIdx = raw.length - 1;
    if (raw[lastIdx].length < PANEL_PHRASE_MIN) {
      raw[lastIdx - 1] = raw[lastIdx - 1] + raw[lastIdx];
      raw.pop();
    }
  }
  var out = [];
  for (var k = 0; k < raw.length; k++) {
    var piece = raw[k];
    if (k === 0 || !isJapanesePunctuation(piece.charAt(0))) {
      out.push(piece);
      continue;
    }
    var lead = '';
    var p = 0;
    while (p < piece.length && isJapanesePunctuation(piece.charAt(p))) {
      lead += piece.charAt(p);
      p++;
    }
    var rest = piece.substr(p);
    if (out.length > 0) out[out.length - 1] = out[out.length - 1] + lead;
    if (rest !== '') out.push(rest);
  }
  if (out.length >= 2) {
    var li = out.length - 1;
    if (out[li].length < PANEL_PHRASE_MIN) {
      out[li - 1] = out[li - 1] + out[li];
      out.pop();
    }
  }
  return out;
}

/* ---- Wrap a paragraph's text into .panel-phrase spans ---- */
function phraseWrapInto(el, text) {
  el.innerHTML = '';
  var chunks = chunkPanelText(text);
  for (var i = 0; i < chunks.length; i++) {
    var sp = document.createElement('span');
    sp.className = 'panel-phrase';
    sp.textContent = chunks[i];
    el.appendChild(sp);
  }
}

/* ---- Rebuild beats + body for the current greeting ---- */
function buildPanel() {
  clearPanelPhraseTimers();

  var contentEl = document.querySelector('.panel[data-panel="0"] .panel-content');
  var body = document.getElementById('panelGreetingBody');
  if (!contentEl || !body) return;

  /* Strip every sibling before #panelGreetingBody so this is idempotent. */
  var child = contentEl.firstChild;
  while (child && child !== body) {
    var nextChild = child.nextSibling;
    contentEl.removeChild(child);
    child = nextChild;
  }

  /* Beat 1: [Name]さん、 */
  var beat1 = document.createElement('span');
  beat1.className = 'panel-phrase panel-1-beat';
  beat1.setAttribute('data-beat', '1');
  var nameSpan = document.createElement('span');
  nameSpan.id = 'therapistName';
  nameSpan.className = 'therapist-name';
  nameSpan.textContent = demoName;
  beat1.appendChild(nameSpan);
  beat1.appendChild(document.createTextNode('、'));

  /* Beat 2: 初めまして。 */
  var beat2 = document.createElement('span');
  beat2.className = 'panel-phrase panel-1-beat';
  beat2.setAttribute('data-beat', '2');
  beat2.textContent = '初めまして。';

  contentEl.insertBefore(beat1, body);
  contentEl.insertBefore(beat2, body);

  /* Body: greeting + closing line */
  body.innerHTML = '';
  var p1 = document.createElement('p');
  var p2 = document.createElement('p');
  var greeting = getDynamicGreeting();
  phraseWrapInto(p1, greeting);
  phraseWrapInto(p2, 'どうぞ肩の力を抜いて、おくつろぎください。');
  body.appendChild(p1);
  body.appendChild(p2);

  /* Update raw text previews in the control panel */
  document.getElementById('demoGreetingOut').textContent = greeting;
  document.getElementById('demoClassOut').textContent = classify();
}

/* ---- Play the two-beat + staggered-body reveal ---- */
function playSequence() {
  clearPanelPhraseTimers();
  var contentEl = document.querySelector('.panel[data-panel="0"] .panel-content');
  if (!contentEl) return;
  var beat1 = contentEl.querySelector('.panel-1-beat[data-beat="1"]');
  var beat2 = contentEl.querySelector('.panel-1-beat[data-beat="2"]');
  var body = document.getElementById('panelGreetingBody');

  /* Reset visibility on everything */
  var allPhrases = contentEl.querySelectorAll('.panel-phrase');
  for (var i = 0; i < allPhrases.length; i++) {
    allPhrases[i].classList.remove('shown');
    allPhrases[i].style.transitionDelay = '0ms';
    allPhrases[i].style.removeProperty('--phrase-start-x');
  }

  function fireBeat(el) {
    if (!el) return;
    var dir = Math.random() < 0.5 ? -1 : 1;
    el.style.setProperty('--phrase-start-x', (dir * 30) + 'px');
    el.classList.add('shown');
  }

  function startBodyReveal() {
    if (!body) return;
    var phrases = body.querySelectorAll('.panel-phrase');
    for (var k = 0; k < phrases.length; k++) {
      (function(el) {
        var d = Math.random() < 0.5 ? -1 : 1;
        el.style.setProperty('--phrase-start-x', (d * 30) + 'px');
        var stagger = Math.random() * PANEL_PHRASE_STAGGER_MAX;
        var id = setTimeout(function() { el.classList.add('shown'); }, stagger);
        panelPhraseTimers.push(id);
      })(phrases[k]);
    }
  }

  /* Beat 1 shown immediately */
  fireBeat(beat1);

  /* Beat 2 after the beat-1 transition completes */
  var t1 = setTimeout(function() {
    fireBeat(beat2);
    /* Body after beat-2 transition + POST_BEAT_DELAY */
    var t2 = setTimeout(startBodyReveal, PANEL_PHRASE_DURATION + PANEL_1_POST_BEAT_DELAY);
    panelPhraseTimers.push(t2);
  }, PANEL_PHRASE_DURATION);
  panelPhraseTimers.push(t1);
}

/* ---- Update the info bar to match the demo state ---- */
function updateInfoBar() {
  var wd = ['日', '月', '火', '水', '木', '金', '土'];
  var now = new Date();
  document.getElementById('infoDate').textContent =
    (now.getMonth() + 1) + '月' + now.getDate() + '日(' + wd[now.getDay()] + ')';

  var hh = String(now.getHours()).padStart(2, '0');
  var mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('infoTime').textContent = hh + '時' + mm + '分';

  if (demoTempIsNull) {
    document.getElementById('infoTemp').textContent = '—°';
  } else {
    document.getElementById('infoTemp').textContent = demoTemp + '°';
  }

  var emoji = {
    clear: '☀',
    clouds: '☁',
    fog: '🌫',
    drizzle: '🌦',
    rain: '🌧',
    snow: '❄',
    thunderstorm: '⛈'
  };
  document.getElementById('infoWeather').textContent = emoji[demoWeather] || '—';
  document.documentElement.setAttribute('data-weather', demoWeather);
}

/* ---- Wire the controls ---- */
function refresh() {
  buildPanel();
  updateInfoBar();
  playSequence();
}

document.getElementById('demoName').addEventListener('input', function(e) {
  demoName = e.target.value || '桜庭さん';
  buildPanel();
  playSequence();
});
document.getElementById('demoTime').addEventListener('change', function(e) {
  demoTime = e.target.value;
  refresh();
});
document.getElementById('demoTemp').addEventListener('input', function(e) {
  var v = parseInt(e.target.value, 10);
  demoTemp = isNaN(v) ? 0 : v;
  refresh();
});
document.getElementById('demoTempNull').addEventListener('change', function(e) {
  demoTempIsNull = e.target.checked;
  document.getElementById('demoTemp').disabled = demoTempIsNull;
  refresh();
});
document.getElementById('demoWeather').addEventListener('change', function(e) {
  demoWeather = e.target.value;
  refresh();
});
document.getElementById('demoReplay').addEventListener('click', playSequence);

/* Collapse / expand the aside */
var aside = document.getElementById('demoAside');
document.getElementById('demoCollapse').addEventListener('click', function() {
  var collapsed = aside.classList.toggle('collapsed');
  document.getElementById('demoCollapseIcon').textContent = collapsed ? '▸' : '▾';
});

/* ---- Boot ---- */
refresh();
</script>
