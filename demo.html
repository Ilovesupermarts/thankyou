<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koi Start Button Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap');

  :root {
    --bg-base: #fdf3d8; 
    --accent: #c9600a; 
    --petal: #e88a1a; 
    --petal-soft: #fde8b8; 
    --text-dark: #231304;
  }

  body {
    margin: 0;
    height: 100vh;
    background-color: var(--bg-base);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
  }

  .blossom-screen {
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
  }

  .start-btn {
    background: none; border: none; padding: 20px; 
    display: flex; flex-direction: column;
    align-items: center; gap: 16px; cursor: pointer; 
    -webkit-appearance: none; appearance: none;
    transition: transform 0.25s ease;
  }
  
  .start-btn:active { 
    transform: scale(0.92); 
  }

  /* 
   * A new wrapper to perfectly center the expanding rings 
   * behind the koi image without affecting layout flow.
   */
  .icon-wrapper {
    position: relative;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 1. Breathing Animation (Scales the whole koi container in and out) */
  .blossom-char {
    position: relative;
    z-index: 1;
    display: block; 
    width: 100px; 
    height: 100px; 
    user-select: none; -webkit-user-select: none;
    animation: blossomBreathe 3.6s ease-in-out infinite; 
    transform-origin: 50% 50%; 
    will-change: transform, filter;
  }

  @keyframes blossomBreathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
    50% { transform: scale(1.14); filter: drop-shadow(0 4px 18px var(--petal-soft)); }
  }

  /* 2. Gentle Breeze Sway (Applied directly to the image) */
  .koi-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: center center;
    animation: idleSway 5s ease-in-out infinite;
  }

  @keyframes idleSway {
    0%, 82%, 100% { transform: rotate(0deg); }
    86% { transform: rotate(-6deg); }
    92% { transform: rotate(4deg); }
    96% { transform: rotate(-2deg); }
  }

  /* 3. Sonar Pulse Ring (SVG placed absolutely behind the image) */
  .rings-svg {
    position: absolute;
    width: 150px; 
    height: 150px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    color: var(--petal);
  }

  .pulse-ring {
    transform-origin: 50px 50px;
    animation: ringPulse 2.4s cubic-bezier(0.21, 0.53, 0.3, 1) infinite;
  }

  @keyframes ringPulse {
    0% { transform: scale(0.98); opacity: 0.9; stroke-width: 1.2px; }
    100% { transform: scale(1.45); opacity: 0; stroke-width: 0.3px; }
  }

  /* Typography */
  .start-label {
    font-size: 17px; font-weight: 600; letter-spacing: 5px; color: var(--accent);
  }
  
  .start-hint {
    margin: 8px 0 0 0; font-size: 20px; font-weight: 500; color: var(--text-dark);
    letter-spacing: 3px; line-height: 2; text-align: center; 
    animation: hintBreathe 4s ease-in-out infinite;
  }
  
  @keyframes hintBreathe { 
    0%, 100% { opacity: 0.92; } 
    50% { opacity: 1; } 
  }
</style>
</head>
<body>

  <div class="blossom-screen">
    <button type="button" class="start-btn" aria-label="はじめる">
      
      <div class="icon-wrapper">
        <!-- Background Rings -->
        <svg class="rings-svg" viewBox="-25 -25 150 150" aria-hidden="true">
          <g stroke="currentColor" stroke-width="1.2" fill="none">
            <circle cx="50" cy="50" r="66" opacity="0.4" />
            <circle cx="50" cy="50" r="66" class="pulse-ring" />
          </g>
        </svg>

        <!-- Foreground Koi Image -->
        <div class="blossom-char">
          <img src="44173_0c6eff.png" class="koi-image" alt="Koi Start">
        </div>
      </div>
      
      <span class="start-label">はじめる</span>
    </button>
    
    <!-- Updated the text to remove the specific word for 'crane' -->
    <p class="start-hint">そっとタップしてください</p>
  </div>

</body>
</html>
