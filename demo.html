<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shippō Tracer Sandbox & Geometry Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-base: #fdf3d8;
    --accent: #c9600a;
    --glow-color: #c9600a;
    --glow-shadow: rgba(143, 47, 0, 0.95);
    --stroke-width: 2.2px;
    --draw-duration: 1.5s;
    --fade-duration: 2.5s;
    --mosaic-opacity: 0.13;
  }

  html[data-theme="dark"] {
    --bg-base: #1a120b;
    --mosaic-opacity: 0.22;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background-color: var(--bg-base);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Shippori Mincho", serif;
    transition: background-color 0.6s ease;
  }

  /* ============ SHIPPO MOSAIC BACKGROUND ============ */
  .ambient-mosaic {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: var(--mosaic-opacity);
    background-repeat: repeat;
    background-size: 60px 60px;
    background-position: 0 0;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='60'%20viewBox='0%200%2060%2060'%3E%3Cg%20fill='none'%20stroke='%238f2f00'%20stroke-width='1.7'%3E%3Ccircle%20cx='0'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='0'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='30'%20cy='30'%20r='30'/%3E%3C/g%3E%3C/svg%3E");
    transition: opacity 0.3s ease;
  }

  /* ============ TRACER LAYER ============ */
  .tracer-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  .shippo-tracer {
    position: absolute;
    top: 0; left: 0;
    width: 68px; height: 68px;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .shippo-tracer svg {
    overflow: visible;
    width: 100%; height: 100%;
    display: block;
  }

  .tracer-path {
    fill: none;
    stroke: var(--accent);
    stroke-width: var(--stroke-width);
    stroke-linecap: round;
    stroke-linejoin: round;
    filter:
      drop-shadow(0 0 2px var(--glow-color))
      drop-shadow(0 0 8px var(--glow-shadow));
  }

  /* Animation classes applied dynamically */
  .shippo-tracer.drawing {
    animation: tracerFade var(--fade-duration) cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  .shippo-tracer.drawing .tracer-path {
    animation: drawStroke var(--draw-duration) cubic-bezier(0.35, 0, 0.25, 1) forwards;
  }

  @keyframes drawStroke {
    0%   { stroke-dashoffset: var(--dash-len, 189); }
    100% { stroke-dashoffset: 0; }
  }

  @keyframes tracerFade {
    0%   { opacity: 0; }
    18%  { opacity: 0.85; }
    75%  { opacity: 0.65; }
    100% { opacity: 0; }
  }

  /* ============ CONTROL PANEL UI ============ */
  .panel-toggle-btn {
    position: fixed;
    top: 18px; right: 18px;
    z-index: 100;
    background: #ffffff;
    border: 1.5px solid #d8b478;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px; font-weight: 700;
    color: #8f2f00;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(120, 70, 20, 0.15);
  }

  .control-card {
    position: fixed;
    top: 60px; right: 18px;
    width: 320px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(10px);
    border: 1.5px solid #d8b478;
    border-radius: 16px;
    padding: 18px 20px;
    z-index: 99;
    box-shadow: 0 12px 32px rgba(120, 70, 20, 0.18);
    font-size: 13px;
    color: #231304;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
  }
  .control-card.hidden {
    transform: translateY(-20px) scale(0.95);
    opacity: 0;
    pointer-events: none;
  }

  .card-title {
    font-family: "Shippori Mincho", serif;
    font-size: 16px; font-weight: 700;
    color: #8f2f00;
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #ebd4ab;
    display: flex; justify-content: space-between; align-items: center;
  }

  .section-label {
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a07a48;
    margin: 14px 0 6px 0;
  }

  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  label { font-weight: 500; }

  select, input[type="range"], input[type="color"] {
    cursor: pointer;
  }

  select {
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #d8b478;
    background: #fff;
    font-family: inherit;
    font-size: 12px;
  }

  input[type="range"] {
    width: 130px;
    accent-color: #c9600a;
  }

  .val-badge {
    font-family: monospace;
    font-size: 11px;
    color: #8f2f00;
    min-width: 38px;
    text-align: right;
  }

  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }

  .action-btn {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #c9600a;
    background: #c9600a;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.secondary {
    background: #fff;
    color: #c9600a;
  }

  .copy-notice {
    text-align: center;
    color: #2a7a2a;
    font-size: 11px;
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .copy-notice.show { opacity: 1; }
</style>
</head>
<body>

<div class="ambient-mosaic" id="mosaicBg"></div>
<div class="tracer-layer" id="tracerLayer"></div>

<button type="button" class="panel-toggle-btn" id="togglePanelBtn">⚙ 設定パネル</button>

<div class="control-card" id="controlCard">
  <div class="card-title">
    <span>七宝 幾何学ラボ</span>
    <span style="font-size: 11px; font-weight: normal; color: #a07a48;">v1.0</span>
  </div>

  <div class="section-label">形状 (Geometry Shape)</div>
  <div class="control-row">
    <label for="shapeSelect">描画パターン</label>
    <select id="shapeSelect">
      <option value="circle">円 (Circle - Default)</option>
      <option value="star">撫角星 (Concave Star)</option>
      <option value="petal">花弁 (Single Petal)</option>
      <option value="flower">七宝花 (4-Petal Flower)</option>
      <option value="crescent">円弧 (Crescent Arc)</option>
      <option value="wave">流水 (S-Curve Wave)</option>
      <option value="random">🎲 ランダム混成 (Random)</option>
    </select>
  </div>

  <div class="section-label">スタイル・色調 (Aesthetics)</div>
  <div class="control-row">
    <label for="strokeColor">線の色 (Stroke)</label>
    <input type="color" id="strokeColor" value="#c9600a">
  </div>
  <div class="control-row">
    <label for="glowColor">光彩 (Glow Color)</label>
    <input type="color" id="glowColor" value="#c9600a">
  </div>
  <div class="control-row">
    <label for="strokeWidth">線の太さ</label>
    <input type="range" id="strokeWidth" min="1.0" max="4.5" step="0.2" value="2.2">
    <span class="val-badge" id="strokeWidthVal">2.2px</span>
  </div>
  <div class="control-row">
    <label for="mosaicOpacity">背景格子の濃度</label>
    <input type="range" id="mosaicOpacity" min="0.02" max="0.35" step="0.01" value="0.13">
    <span class="val-badge" id="mosaicOpacityVal">0.13</span>
  </div>
  <div class="control-row">
    <label for="themeSelect">背景テーマ</label>
    <select id="themeSelect">
      <option value="autumn">秋 (Autumn #fdf3d8)</option>
      <option value="dark">夜 (Night Dark #1a120b)</option>
    </select>
  </div>

  <div class="section-label">アニメーション (Motion Timing)</div>
  <div class="control-row">
    <label for="drawDuration">描画速度</label>
    <input type="range" id="drawDuration" min="0.6" max="3.5" step="0.1" value="1.5">
    <span class="val-badge" id="drawDurationVal">1.5s</span>
  </div>
  <div class="control-row">
    <label for="fadeDuration">発光〜消滅</label>
    <input type="range" id="fadeDuration" min="1.2" max="5.0" step="0.1" value="2.5">
    <span class="val-badge" id="fadeDurationVal">2.5s</span>
  </div>
  <div class="control-row">
    <label for="intervalSpeed">生成間隔</label>
    <input type="range" id="intervalSpeed" min="400" max="2500" step="50" value="1000">
    <span class="val-badge" id="intervalSpeedVal">1000ms</span>
  </div>

  <div class="section-label">格子スナップ (Grid Placement)</div>
  <div class="control-row">
    <label for="gridMode">頂点タイプ</label>
    <select id="gridMode">
      <option value="even">偶数頂点 (円の中心)</option>
      <option value="odd">奇数頂点 (花弁の交点)</option>
      <option value="both">全頂点 (ランダム)</option>
    </select>
  </div>

  <div class="btn-group">
    <button type="button" class="action-btn" id="triggerBtn">今すぐ描画</button>
    <button type="button" class="action-btn secondary" id="autoBtn">一時停止</button>
  </div>
  <button type="button" class="action-btn secondary" id="copyCodeBtn" style="width: 100%; margin-top: 8px;">
    設定値をコードとしてコピー
  </button>
  <div class="copy-notice" id="copyNotice">クリップボードにコピーしました！</div>
</div>

<script>
/* ============================================================
   GEOMETRIC PATH DEFINITIONS (Centered in 68x68 Box, R=30)
   ============================================================ */
const SHAPES = {
  // 1. Full Circle (Circumference: ~188.5)
  circle: {
    svg: '<circle cx="34" cy="34" r="30" class="tracer-path" />',
    length: 189,
    rotationStep: 90
  },

  // 2. Concave 4-Point Star (Hoshi-gata / 撫角星)
  // Four inward 90-deg arcs meeting at the 4 cardinal points (Total: ~188.5)
  star: {
    svg: '<path d="M 34,4 A 30 30 0 0 0 64,34 A 30 30 0 0 0 34,64 A 30 30 0 0 0 4,34 A 30 30 0 0 0 34,4 Z" class="tracer-path" />',
    length: 189,
    rotationStep: 45
  },

  // 3. Single Petal (Hana-bira / 花弁)
  // Authentic Shippo intersection: two 90-degree arcs between points at distance 30*sqrt(2)
  petal: {
    svg: '<path d="M 34,13 A 30 30 0 0 1 34,55 A 30 30 0 0 1 34,13 Z" class="tracer-path" />',
    length: 95,
    rotationStep: 45
  },

  // 4. Four-Petaled Flower (Shippō-bana / 七宝花)
  // Continuous fluid trace around the 4 petals radiating from center
  flower: {
    svg: `<path d="M 34,34 
             A 30 30 0 0 1 34,4 A 30 30 0 0 1 34,34 
             A 30 30 0 0 1 64,34 A 30 30 0 0 1 34,34 
             A 30 30 0 0 1 34,64 A 30 30 0 0 1 34,34 
             A 30 30 0 0 1 4,34 A 30 30 0 0 1 34,34 Z" class="tracer-path" />`,
    length: 252,
    rotationStep: 45
  },

  // 5. Crescent Arc (Enko / 円弧)
  // A clean 180-degree sweep of a single circle's perimeter
  crescent: {
    svg: '<path d="M 4,34 A 30 30 0 0 1 64,34" class="tracer-path" />',
    length: 95,
    rotationStep: 90
  },

  // 6. S-Curve Stream (Ryūsui / 流水)
  // Alternating tangent arcs evoking flowing water across the lattice
  wave: {
    svg: '<path d="M 4,34 A 30 30 0 0 1 34,4 A 30 30 0 0 0 64,34" class="tracer-path" />',
    length: 95,
    rotationStep: 90
  }
};

/* ============ POOL CONTROLLER ============ */
const POOL_SIZE = 8;
const tracerLayer = document.getElementById('tracerLayer');
const tracerPool = [];
let poolIndex = 0;
let autoTimer = null;
let isAutoRunning = true;

// Build reusable node pool
for (let i = 0; i < POOL_SIZE; i++) {
  const node = document.createElement('div');
  node.className = 'shippo-tracer';
  node.innerHTML = '<svg viewBox="0 0 68 68"></svg>';
  tracerLayer.appendChild(node);
  tracerPool.push(node);
}

function getSelectedShapeKey() {
  const sel = document.getElementById('shapeSelect').value;
  if (sel === 'random') {
    const keys = Object.keys(SHAPES);
    return keys[Math.floor(Math.random() * keys.length)];
  }
  return sel;
}

function spawnTracer() {
  const shapeKey = getSelectedShapeKey();
  const shapeData = SHAPES[shapeKey];
  const tracer = tracerPool[poolIndex];
  poolIndex = (poolIndex + 1) % tracerPool.length;

  const svg = tracer.querySelector('svg');
  svg.innerHTML = shapeData.svg;

  // Set dasharray to exact path length
  tracer.style.setProperty('--dash-len', shapeData.length);
  const path = tracer.querySelector('.tracer-path');
  if (path) {
    path.style.strokeDasharray = shapeData.length;
    path.style.strokeDashoffset = shapeData.length;
  }

  // Calculate lattice position
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const maxCols = Math.floor(vw / 30);
  const maxRows = Math.floor(vh / 30);

  let j = 1 + Math.floor(Math.random() * Math.max(1, maxCols - 2));
  let k = 1 + Math.floor(Math.random() * Math.max(1, maxRows - 2));

  const gridMode = document.getElementById('gridMode').value;
  if (gridMode === 'even') {
    if ((j + k) % 2 !== 0) j += 1; // Circle / Star centers
  } else if (gridMode === 'odd') {
    if ((j + k) % 2 === 0) j += 1; // Petal nexus centers
  }

  const x = (j * 30) - 34;
  const y = (k * 30) - 34;
  const angleSteps = 360 / shapeData.rotationStep;
  const startAngle = Math.floor(Math.random() * angleSteps) * shapeData.rotationStep;

  tracer.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${startAngle}deg)`;
  tracer.classList.remove('drawing');
  void tracer.offsetWidth; // Reflow
  tracer.classList.add('drawing');
}

function scheduleNext() {
  if (!isAutoRunning) return;
  const baseInterval = parseInt(document.getElementById('intervalSpeed').value, 10);
  const jitter = (Math.random() * 0.4 - 0.2) * baseInterval;
  const delay = Math.max(200, baseInterval + jitter);
  autoTimer = setTimeout(() => {
    spawnTracer();
    scheduleNext();
  }, delay);
}

/* ============ CONTROLS BINDING ============ */
const root = document.documentElement;

document.getElementById('strokeColor').addEventListener('input', (e) => {
  root.style.setProperty('--accent', e.target.value);
});
document.getElementById('glowColor').addEventListener('input', (e) => {
  root.style.setProperty('--glow-color', e.target.value);
});
document.getElementById('strokeWidth').addEventListener('input', (e) => {
  const val = e.target.value + 'px';
  root.style.setProperty('--stroke-width', val);
  document.getElementById('strokeWidthVal').textContent = val;
});
document.getElementById('mosaicOpacity').addEventListener('input', (e) => {
  root.style.setProperty('--mosaic-opacity', e.target.value);
  document.getElementById('mosaicOpacityVal').textContent = e.target.value;
});
document.getElementById('drawDuration').addEventListener('input', (e) => {
  const val = e.target.value + 's';
  root.style.setProperty('--draw-duration', val);
  document.getElementById('drawDurationVal').textContent = val;
});
document.getElementById('fadeDuration').addEventListener('input', (e) => {
  const val = e.target.value + 's';
  root.style.setProperty('--fade-duration', val);
  document.getElementById('fadeDurationVal').textContent = val;
});
document.getElementById('intervalSpeed').addEventListener('input', (e) => {
  document.getElementById('intervalSpeedVal').textContent = e.target.value + 'ms';
});
document.getElementById('themeSelect').addEventListener('change', (e) => {
  root.setAttribute('data-theme', e.target.value);
});

// Play / Pause
const autoBtn = document.getElementById('autoBtn');
autoBtn.addEventListener('click', () => {
  isAutoRunning = !isAutoRunning;
  autoBtn.textContent = isAutoRunning ? '一時停止' : '再開';
  if (isAutoRunning) scheduleNext();
  else clearTimeout(autoTimer);
});

// Trigger Once
document.getElementById('triggerBtn').addEventListener('click', () => {
  spawnTracer();
});

// Panel Hide / Show Toggle
const togglePanelBtn = document.getElementById('togglePanelBtn');
const controlCard = document.getElementById('controlCard');
togglePanelBtn.addEventListener('click', () => {
  controlCard.classList.toggle('hidden');
});

// Code Snippet Export
document.getElementById('copyCodeBtn').addEventListener('click', () => {
  const shape = document.getElementById('shapeSelect').value;
  const stroke = document.getElementById('strokeColor').value;
  const glow = document.getElementById('glowColor').value;
  const sw = document.getElementById('strokeWidth').value;
  const drawD = document.getElementById('drawDuration').value;
  const fadeD = document.getElementById('fadeDuration').value;
  const interval = document.getElementById('intervalSpeed').value;

  const snippet = `/* --- Generated Shippō Tracer Config --- */
Shape: ${shape}
Stroke: ${stroke}
Glow: ${glow}
Stroke Width: ${sw}px
Draw Animation: drawStroke ${drawD}s cubic-bezier(0.35, 0, 0.25, 1) forwards;
Fade Animation: tracerFade ${fadeD}s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
Interval: ~${interval}ms`;

  navigator.clipboard.writeText(snippet).then(() => {
    const notice = document.getElementById('copyNotice');
    notice.classList.add('show');
    setTimeout(() => notice.classList.remove('show'), 2000);
  });
});

// Boot
scheduleNext();
</script>
</body>
</html>
