<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Focus Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #fdf3d8; 
    --text-dark: #231304; 
    --accent: #8f2f00; 
    --transition-head-color: #fdf0c8;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-base);
    color: var(--text-dark);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    height: 300vh; /* Forces a long scrollable page */
    overflow-x: hidden;
  }

  /* Fixed Control Panel for Demo Purposes */
  .demo-controls {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    padding: 12px 24px;
    border-radius: 30px;
    box-shadow: 0 4px 14px rgba(120, 70, 20, 0.15);
    z-index: 1000;
    display: flex;
    gap: 16px;
    font-family: sans-serif;
    font-size: 14px;
    font-weight: bold;
    color: #8f3f12;
  }

  .demo-controls label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Replicating the Transition Line CSS */
  .transition-line {
    text-align: center;
    padding: 0 32px;
    margin-top: 100vh; /* Pushes the text to the middle of the scroll area */
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.8px;
    line-height: 2.2;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    word-break: auto-phrase;
  }

  .transition-line-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0 0 20px 0;
  }

  .transition-line-mark {
    flex-shrink: 0;
    font-size: 1.1em;
    line-height: 1;
    color: var(--transition-head-color);
  }

  .transition-line-rule {
    flex: 1;
    height: 1px;
    background: var(--transition-head-color);
    min-width: 24px;
  }

  .transition-line-title {
    flex-shrink: 0;
    font-size: 1.1em;
    color: var(--transition-head-color);
    letter-spacing: 5px;
    white-space: nowrap;
    text-shadow: 0 1px 4px rgba(143, 47, 0, 0.2);
  }

  .transition-line-body {
    position: relative;
    will-change: filter, transform, text-shadow;
    transform-origin: 50% 50%;
  }

  .transition-line-body p {
    margin: 0 0 0.9em 0;
  }

  .transition-line-body p:last-child {
    margin-bottom: 0;
  }

  .hint {
    position: fixed;
    bottom: 40px;
    width: 100%;
    text-align: center;
    font-family: sans-serif;
    color: #a07a48;
    font-size: 14px;
    letter-spacing: 2px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="demo-controls">
  <label>
    <input type="radio" name="effectType" value="cinematic" checked>
    Cinematic (Smooth Swell)
  </label>
  <label>
    <input type="radio" name="effectType" value="snap">
    Layout-Safe Snap (Click-in)
  </label>
</div>

<div class="transition-line" id="transitionLine">
  <div class="transition-line-divider">
    <span class="transition-line-mark">❀</span>
    <span class="transition-line-rule"></span>
    <span class="transition-line-title">大切なお知らせ</span>
    <span class="transition-line-rule"></span>
    <span class="transition-line-mark">❀</span>
  </div>
  <div class="transition-line-body" id="transitionLineBody">
    <p>それでは、本日の癒しのオプションをご覧ください。</p>
    <p>ご無理のない範囲で、ご対応いただけるものがございましたら、横の○をタップしてお選びください。</p>
    <p>表に表示されている料金は、必要に応じて変更していただいても構いません。また、ご自身が難しいと感じるものは、無理にお選びいただかなくても大丈夫です。すべて見送っていただいても大丈夫です。</p>
    <p>一覧にないものでも、もしご自身からご提案いただけるものがございましたら、下の欄にご記入ください。</p>
    <p>ありがとうございます。</p>
  </div>
</div>

<div class="hint">↓ スクロールして効果を確認 ↓</div>

<script>
  // Simplified metrics gatherer for the demo
  var bodyEl = document.getElementById('transitionLineBody');
  var tbMetrics = {
    downMax: window.innerHeight / 1.5,
    upMax: window.innerHeight / 1.5
  };

  var TB_MAX_BLUR = 6;
  var TB_SCALE_TRIGGER_BLUR = 1.0;
  var TB_MAX_SCALE = 1.07;

  function updateEffects() {
    var vh = window.innerHeight;
    var vc = vh / 2;
    var rect = bodyEl.getBoundingClientRect();
    var bodyCentre = rect.top + rect.height / 2;
    var d = bodyCentre - vc;

    var rawProgress;
    if (d >= 0) rawProgress = Math.min(1, d / tbMetrics.downMax);
    else rawProgress = Math.min(1, -d / tbMetrics.upMax);

    // Read the selected radio button
    var effectType = document.querySelector('input[name="effectType"]:checked').value;

    if (effectType === 'cinematic') {
      // --- CINEMATIC MATH ---
      var focusCurve = Math.pow(rawProgress, 2.5); // Sweet spot curve
      var blurVal = TB_MAX_BLUR * focusCurve;
      var scaleVal = 1.0 + (0.04 * (1 - focusCurve));
      var bloomVal = 1 - focusCurve;

      bodyEl.style.filter = blurVal > 0.05 ? 'blur(' + blurVal.toFixed(2) + 'px)' : 'none';
      bodyEl.style.transform = 'scale(' + scaleVal.toFixed(4) + ')';
      bodyEl.style.textShadow = '0 0 ' + (bloomVal * 0.8).toFixed(2) + 'px currentColor';
      
    } else {
      // --- SNAP MATH ---
      var blurVal = TB_MAX_BLUR * rawProgress;
      var scaleVal = 1.0;
      if (blurVal < TB_SCALE_TRIGGER_BLUR) {
        scaleVal = 1.0 + (TB_MAX_SCALE - 1.0) * (1 - blurVal / TB_SCALE_TRIGGER_BLUR);
      }

      bodyEl.style.filter = blurVal > 0.05 ? 'blur(' + blurVal.toFixed(2) + 'px)' : 'none';
      bodyEl.style.transform = scaleVal > 1.001 ? 'scaleX(' + scaleVal.toFixed(4) + ')' : '';
      
      // Widened threshold so smooth scrolling catches it, using text-shadow to avoid layout jumping
      if (blurVal <= 0.4) {
        bodyEl.style.textShadow = '0 0 0.8px currentColor';
      } else {
        bodyEl.style.textShadow = 'none';
      }
    }
  }

  // Bind to scroll
  var rafPending = false;
  window.addEventListener('scroll', function() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function() {
      rafPending = false;
      updateEffects();
    });
  }, { passive: true });

  // Initial trigger
  updateEffects();
</script>
</body>
</html>
