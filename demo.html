<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Audio Reactive Swell Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">

<style>
  /* Demo Canvas Overrides */
  body {
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Audio Swell Reactive Hooks */
  .ambient-stage {
    filter: brightness(calc(1 + var(--audio-swell, 0) * var(--ctrl-bright-boost, 0.25)))
            saturate(calc(1 + var(--audio-swell, 0) * var(--ctrl-sat-boost, 0.20)));
    will-change: transform, filter;
  }

  .ambient-mesh {
    opacity: calc(var(--ctrl-mesh-base, 0.55) + var(--audio-swell, 0) * var(--ctrl-mesh-swell, 0.45)) !important;
    transition: opacity 100ms ease-out;
  }

  .orb-1 {
    transform: scale(calc(1 + var(--audio-swell, 0) * var(--ctrl-orb-scale, 0.28))) !important;
    transition: transform 120ms ease-out;
  }
  .orb-2 {
    transform: scale(calc(1 + var(--audio-swell, 0) * (var(--ctrl-orb-scale, 0.28) * 1.15))) !important;
    transition: transform 120ms ease-out;
  }
  .orb-3 {
    transform: scale(calc(1 + var(--audio-swell, 0) * (var(--ctrl-orb-scale, 0.28) * 0.90))) !important;
    transition: transform 120ms ease-out;
  }

  html[data-theme="autumn"] .ambient-primary {
    opacity: calc(0.70 + var(--audio-swell, 0) * 0.30) !important;
    transition: opacity 120ms ease-out;
  }

  /* Floating Control HUD */
  .hud-container {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 320px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    background: rgba(253, 243, 216, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(143, 47, 0, 0.3);
    border-radius: 18px;
    box-shadow: 0 12px 36px rgba(100, 35, 10, 0.18);
    padding: 20px;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    color: #231304;
    box-sizing: border-box;
  }

  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(143, 47, 0, 0.15);
    padding-bottom: 10px;
  }

  .hud-title {
    font-size: 15px;
    font-weight: 700;
    color: #8f2f00;
    letter-spacing: 1px;
    margin: 0;
  }

  .hud-group {
    margin-bottom: 14px;
  }

  .hud-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: #5a3818;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .hud-val {
    color: #8f2f00;
    font-weight: 700;
  }

  .hud-slider {
    width: 100%;
    margin: 0;
    accent-color: #c9600a;
    cursor: pointer;
  }

  /* Audio Meter */
  .vu-meter-wrap {
    height: 10px;
    background: rgba(143, 47, 0, 0.12);
    border-radius: 5px;
    overflow: hidden;
    margin-top: 4px;
    position: relative;
  }

  .vu-meter-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e59b24, #c9600a, #8f2229);
    border-radius: 5px;
    transition: width 50ms linear;
  }

  /* Action Buttons */
  .hud-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }

  .hud-btn {
    background: #c9600a;
    border: none;
    color: #fff;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    text-align: center;
  }

  .hud-btn:active {
    transform: scale(0.97);
    background: #8f2f00;
  }

  .hud-btn.secondary {
    background: rgba(255, 255, 255, 0.8);
    color: #8f2f00;
    border: 1px solid rgba(143, 47, 0, 0.25);
  }

  .hud-btn.secondary:active {
    background: #fff;
  }

  .hud-copy-btn {
    width: 100%;
    background: #8f2f00;
    color: #fff;
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }

  .center-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Shippori Mincho", serif;
    font-size: 24px;
    color: #8f2f00;
    letter-spacing: 6px;
    pointer-events: none;
    text-align: center;
    opacity: 0.85;
    text-shadow: 0 2px 14px rgba(253, 243, 216, 0.9);
  }
</style>
</head>

    <div class="light-orb orb-3"></div>
  </div>
  <div class="ambient-layer ambient-primary"></div>

</div>

</div>

<div class="center-label">音の呼吸・調律室</div>

<!-- Control HUD -->
<div class="hud-container">
  <div class="hud-header">
    <h3 class="hud-title">Swell Tuner</h3>
    <span id="statusIndicator" style="font-size: 11px; font-weight: 700; color: #8f2f00;">PAUSED</span>
  </div>

  <div class="hud-btn-row">
    <button class="hud-btn" id="btnPlayPause">Play Music</button>
    <button class="hud-btn secondary" id="btnToggleTrack">Morning.mp3</button>
  </div>

  <!-- Real-time Energy Gauge -->
  <div class="hud-group">
    <div class="hud-label">
      <span>Audio Swell Energy</span>
      <span class="hud-val" id="valSwellEnergy">0.00</span>
    </div>
    <div class="vu-meter-wrap">
      <div class="vu-meter-bar" id="vuMeterBar"></div>
    </div>
  </div>

  <!-- Dynamic Swell Settings -->
  <div class="hud-group">
    <div class="hud-label">
      <span>Sensitivity Multiplier</span>
      <span class="hud-val" id="valGainMult">1.6x</span>
    </div>
    <input type="range" class="hud-slider" id="sliderGainMult" min="0.5" max="3.5" step="0.1" value="1.6">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Noise Floor Gate</span>
      <span class="hud-val" id="valNoiseFloor">35</span>
    </div>
    <input type="range" class="hud-slider" id="sliderNoiseFloor" min="10" max="80" step="1" value="35">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Attack Speed (Inhale)</span>
      <span class="hud-val" id="valAttack">0.14</span>
    </div>
    <input type="range" class="hud-slider" id="sliderAttack" min="0.04" max="0.35" step="0.01" value="0.14">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Decay Speed (Exhale)</span>
      <span class="hud-val" id="valDecay">0.035</span>
    </div>
    <input type="range" class="hud-slider" id="sliderDecay" min="0.01" max="0.10" step="0.005" value="0.035">
  </div>

  <!-- Visual Swell Bounds -->
  <div class="hud-group">
    <div class="hud-label">
      <span>Orb Scale Expansion</span>
      <span class="hud-val" id="valOrbScale">+30%</span>
    </div>
    <input type="range" class="hud-slider" id="sliderOrbScale" min="0.05" max="0.60" step="0.01" value="0.30">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Mesh Base Opacity</span>
      <span class="hud-val" id="valMeshBase">0.55</span>
    </div>
    <input type="range" class="hud-slider" id="sliderMeshBase" min="0.20" max="0.80" step="0.05" value="0.55">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Stage Brightness Lift</span>
      <span class="hud-val" id="valBrightBoost">+25%</span>
    </div>
    <input type="range" class="hud-slider" id="sliderBrightBoost" min="0.05" max="0.50" step="0.05" value="0.25">
  </div>

  <button class="hud-copy-btn" id="btnCopyConfig">Copy Tuned Configuration</button>
</div>

<script>
  var TRACKS = [
    { name: 'Morning', url: 'Sound/Morning.mp3' },
    { name: 'Early Evening', url: 'Sound/Earlyevening.mp3' }
  ];
  var currentTrackIdx = 0;

  var audioCtx = null;
  var audioSourceNode = null;
  var audioGainNode = null;
  var analyserNode = null;
  var isPlaying = false;

  var audioEl = new Audio();
  audioEl.loop = true;
  audioEl.crossOrigin = 'anonymous';

  var swellEnergy = 0.0;
  var rafId = null;
  var freqData = new Uint8Array(256);

  // Calibration Parameters (Live reactive)
  var config = {
    gainMult: 1.6,
    noiseFloor: 35,
    attack: 0.14,
    decay: 0.035,
    orbScale: 0.30,
    meshBase: 0.55,
    meshSwell: 0.45,
    brightBoost: 0.25,
    satBoost: 0.20
  };

  // DOM elements
  var stageEl = document.getElementById('ambientStage');
  var btnPlayPause = document.getElementById('btnPlayPause');
  var btnToggleTrack = document.getElementById('btnToggleTrack');
  var statusIndicator = document.getElementById('statusIndicator');
  var valSwellEnergy = document.getElementById('valSwellEnergy');
  var vuMeterBar = document.getElementById('vuMeterBar');

  function initAudioPipeline() {
    if (audioCtx) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();

    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 512;
    analyserNode.smoothingTimeConstant = 0.8;

    audioGainNode = audioCtx.createGain();
    audioGainNode.gain.value = 0.8;

    audioSourceNode = audioCtx.createMediaElementSource(audioEl);

    // Audio Pipeline: Source -> Analyser -> Gain -> Speakers
    audioSourceNode.connect(analyserNode);
    analyserNode.connect(audioGainNode);
    audioGainNode.connect(audioCtx.destination);
  }

  function startSwellLoop() {
    if (rafId) cancelAnimationFrame(rafId);

    function tick() {
      if (!isPlaying || !analyserNode) {
        swellEnergy += (0 - swellEnergy) * 0.05;
        applySwellToCSS(swellEnergy);
        if (swellEnergy > 0.005) {
          rafId = requestAnimationFrame(tick);
        } else {
          applySwellToCSS(0);
          rafId = null;
        }
        return;
      }

      analyserNode.getByteFrequencyData(freqData);

      // Extract mid/vocal/melodic range (bins 4 to 34 approx 170Hz - 1500Hz)
      var sum = 0;
      var count = 30;
      for (var i = 4; i < 34; i++) {
        sum += freqData[i];
      }
      var avg = sum / count;

      // Noise floor gate
      var clean = Math.max(0, avg - config.noiseFloor);
      var normalized = Math.min(1.0, (clean / (140 / config.gainMult)));

      // Organic perceptual curve
      var target = Math.pow(normalized, 1.35);

      // Attack vs Decay envelope filter
      if (target > swellEnergy) {
        swellEnergy += (target - swellEnergy) * config.attack;
      } else {
        swellEnergy += (target - swellEnergy) * config.decay;
      }

      applySwellToCSS(swellEnergy);

      // Update HUD Gauges
      valSwellEnergy.textContent = swellEnergy.toFixed(2);
      vuMeterBar.style.width = (swellEnergy * 100).toFixed(1) + '%';

      rafId = requestAnimationFrame(tick);
    }

    rafId = requestAnimationFrame(tick);
  }

  function applySwellToCSS(val) {
    if (!stageEl) return;
    stageEl.style.setProperty('--audio-swell', val.toFixed(3));
  }

  function applyConfigToCSS() {
    if (!stageEl) return;
    stageEl.style.setProperty('--ctrl-orb-scale', config.orbScale);
    stageEl.style.setProperty('--ctrl-mesh-base', config.meshBase);
    stageEl.style.setProperty('--ctrl-mesh-swell', config.meshSwell);
    stageEl.style.setProperty('--ctrl-bright-boost', config.brightBoost);
    stageEl.style.setProperty('--ctrl-sat-boost', config.satBoost);
  }

  // Play / Pause Control
  btnPlayPause.addEventListener('click', function() {
    initAudioPipeline();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (!isPlaying) {
      if (!audioEl.src) {
        audioEl.src = TRACKS[currentTrackIdx].url;
      }
      audioEl.play().then(function() {
        isPlaying = true;
        btnPlayPause.textContent = 'Pause Music';
        statusIndicator.textContent = 'PLAYING';
        statusIndicator.style.color = '#c9600a';
        startSwellLoop();
      }).catch(function(e) {
        alert('Audio play error: Ensure files exist in Sound/ folder.');
      });
    } else {
      audioEl.pause();
      isPlaying = false;
      btnPlayPause.textContent = 'Play Music';
      statusIndicator.textContent = 'PAUSED';
      statusIndicator.style.color = '#8f2f00';
    }
  });

  // Track Swap
  btnToggleTrack.addEventListener('click', function() {
    currentTrackIdx = (currentTrackIdx + 1) % TRACKS.length;
    var t = TRACKS[currentTrackIdx];
    btnToggleTrack.textContent = t.name + '.mp3';
    var wasPlaying = isPlaying;
    audioEl.src = t.url;
    if (wasPlaying) {
      audioEl.play();
    }
  });

  // Slider bindings
  function bindSlider(id, key, valElId, formatter, cssUpdater) {
    var s = document.getElementById(id);
    var v = document.getElementById(valElId);
    s.addEventListener('input', function() {
      var val = parseFloat(s.value);
      config[key] = val;
      if (formatter) v.textContent = formatter(val);
      else v.textContent = val;
      if (cssUpdater) cssUpdater(val);
      applyConfigToCSS();
    });
  }

  bindSlider('sliderGainMult', 'gainMult', 'valGainMult', function(v){ return v.toFixed(1) + 'x'; });
  bindSlider('sliderNoiseFloor', 'noiseFloor', 'valNoiseFloor', function(v){ return v; });
  bindSlider('sliderAttack', 'attack', 'valAttack', function(v){ return v.toFixed(2); });
  bindSlider('sliderDecay', 'decay', 'valDecay', function(v){ return v.toFixed(3); });
  bindSlider('sliderOrbScale', 'orbScale', 'valOrbScale', function(v){ return '+' + Math.round(v * 100) + '%'; });
  bindSlider('sliderMeshBase', 'meshBase', 'valMeshBase', function(v){
    config.meshSwell = parseFloat((1 - v).toFixed(2));
    return v.toFixed(2);
  });
  bindSlider('sliderBrightBoost', 'brightBoost', 'valBrightBoost', function(v){ return '+' + Math.round(v * 100) + '%'; });

  // Copy Config Button
  document.getElementById('btnCopyConfig').addEventListener('click', function() {
    var out = [
      '/* Tuned Audio Swell Configuration */',
      'gainMult: ' + config.gainMult + ',',
      'noiseFloor: ' + config.noiseFloor + ',',
      'attack: ' + config.attack + ',',
      'decay: ' + config.decay + ',',
      '--ctrl-orb-scale: ' + config.orbScale + ',',
      '--ctrl-mesh-base: ' + config.meshBase + ',',
      '--ctrl-bright-boost: ' + config.brightBoost
    ].join('\n');
    navigator.clipboard.writeText(out).then(function() {
      alert('Tuned configuration copied to clipboard!');
    });
  });

  applyConfigToCSS();
</script>
</body>
</html>
