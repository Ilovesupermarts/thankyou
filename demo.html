<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Receipt Landing — Diagnostic Demo v3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  /* ---------- Demo chrome ---------- */
  .demo-controls {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 6px 24px var(--shadow-rose-2);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 13px;
    color: var(--text-dark);
    max-width: 96vw;
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .demo-label { font-size: 11px; color: var(--text-faint); letter-spacing: 1px; margin-right: 4px; }
  .demo-controls button {
    border-radius: 16px;
    border: 1.5px solid var(--border-1);
    background: #fff;
    color: var(--text-dark);
    font-size: 11.5px;
    font-weight: 600;
    padding: 7px 10px;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    transition: background 0.2s, border-color 0.2s, transform 0.1s, color 0.2s;
    white-space: nowrap;
  }
  .demo-controls button:active { transform: scale(0.96); background: var(--soft-1); border-color: var(--accent); }
  .demo-controls button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .demo-controls button.run { background: var(--text-dark); border-color: var(--text-dark); color: #fff; }
  .demo-controls button.run:active { background: #000; }
  .demo-readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0;
    text-align: center;
    line-height: 1.5;
  }
  .demo-readout strong { color: var(--accent); font-weight: 700; }
  .demo-readout strong.smooth { color: #2a7a3a; }
  .demo-readout strong.stutter { color: #b03030; }

  /* ---------- Injection root ---------- */
  /* Sits below the receipt screen, above the ambient stage. Holds the
     cloned real-app DOM so its compositing cost is present. */
  #fakeAppRoot {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #fakeAppRoot.hide-under { visibility: hidden; }

  /* Force off the injected info-bar's own visibility so its ticker can
     be enabled / disabled by a toggle rather than by the real app's
     body class. */
  #fakeAppRoot .info-bar { display: none; }
  body.ticker-on #fakeAppRoot .info-bar { display: block; }
  body.ticker-on #fakeAppRoot .info-bar.shown { opacity: 1; transform: translateY(0); }

  /* Hide the injected name screen and blossom screen that would
     otherwise paint over things — those are in the "closed" state
     during the real app's receipt view. */
  #fakeAppRoot .name-screen { opacity: 0; visibility: hidden; }
  #fakeAppRoot .blossom-screen { opacity: 0; visibility: hidden; }
  #fakeAppRoot .intro-overlay { opacity: 0; visibility: hidden; }
  #fakeAppRoot .thankyou-screen { opacity: 0; visibility: hidden; }

  /* Injected ambient-stage: not used here — we have our own. */
  #fakeAppRoot #ambientStage { display: none !important; }

  /* ---------- Opaque receipt toggle ---------- */
  body.receipt-opaque .receipt-screen { background: #faf7f5 !important; }
  html[data-theme="autumn"] body.receipt-opaque .receipt-screen { background: #fdf3d8 !important; }
</style>
</head>
<body>

<div class="demo-controls">
  <div class="demo-row">
    <span class="demo-label">STACK:</span>
    <button type="button" id="btnRealApp">Real app DOM</button>
    <button type="button" id="btnHideUnder">Hide under</button>
    <button type="button" id="btnAmbient">Ambient stage</button>
    <button type="button" id="btnTicker">Info bar ticker</button>
    <button type="button" id="btnOpaque">Opaque receipt</button>
  </div>
  <div class="demo-row">
    <span class="demo-label">ACTION:</span>
    <button type="button" class="run" id="runBtn">Run landing</button>
    <button type="button" id="clearBtn">Reset all</button>
  </div>
  <div class="demo-readout" id="readout">Start with nothing on. Then add layers one at a time and re-run.</div>
</div>

<div id="fakeAppRoot"></div>

<div class="ambient-stage" id="ambientStage" style="display:none;">
  <div class="ambient-layer ambient-image">
    <video class="ambient-video" id="ambientVideo" muted loop playsinline preload="auto">
      <source src="icons/VID-20260929-WA0002.mp4" type="video/mp4">
    </video>
  </div>
  <div class="ambient-layer ambient-primary"></div>
  <div class="ambient-layer ambient-secondary"></div>
  <div class="ambient-layer caustics caustics-1"></div>
  <div class="ambient-layer caustics caustics-2"></div>
  <div class="mote-field" id="moteField"></div>
</div>

<div class="receipt-screen visible" id="receiptScreen">
  <div class="receipt-paper-wrap" id="paperWrap">
    <div class="receipt-paper">
      <div class="receipt-header">
        <div class="receipt-thanks">ご確認いただきありがとうございます。</div>
        <div class="receipt-subthanks">無理のない範囲でお選びいただき、ありがとうございます。</div>
      </div>
      <div class="receipt-to-row">
        <span class="receipt-to-mark">❀</span>
        <span class="receipt-to-name">桜庭さんへ</span>
        <span class="receipt-to-mark">❀</span>
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-title">
        <span>本日の内容：</span>
        <span class="item-count">6 項目</span>
      </div>
      <div class="receipt-items" id="receiptItems"></div>

      <div class="receipt-total-line">
        <span class="receipt-total-label">合計</span>
        <span class="receipt-total-value">
          <span class="yen-symbol">¥</span>
          <span id="receiptTotalText">31,500</span>
        </span>
      </div>

      <button type="button" class="receipt-confirm-btn">こちらの内容でお願いいたします。</button>
      <button type="button" class="receipt-back-btn">サービスの選択に戻る</button>

      <div class="receipt-footer">
        <span class="receipt-footer-mark">❀</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ SAMPLE ITEMS ============ */
var SAMPLE_ITEMS = [
  { name: 'ダミーテキスト1', price: 5000 },
  { name: 'ダミーテキスト2', price: 5500 },
  { name: 'ダミーテキスト3', price: 6000 },
  { name: 'ダミーテキスト4', price: 4500 },
  { name: 'ダミーテキスト5', price: 5000 },
  { name: 'ダミーテキスト6', price: 5500 }
];
function renderItems() {
  var wrap = document.getElementById('receiptItems');
  wrap.innerHTML = '';
  var total = 0;
  for (var i = 0; i < SAMPLE_ITEMS.length; i++) {
    var it = SAMPLE_ITEMS[i];
    total += it.price;
    var div = document.createElement('div');
    div.className = 'receipt-item';
    div.style.animationDelay = Math.min(i * 0.08, 0.4) + 's';
    div.innerHTML =
      '<span class="receipt-item-name">' + it.name + '</span>' +
      '<span class="receipt-item-price-wrap">' +
        '<span class="yen-symbol">¥</span>' +
        '<input type="text" class="receipt-price-input" value="' + it.price.toLocaleString() + '" readonly tabindex="-1">' +
      '</span>';
    wrap.appendChild(div);
  }
  var el = document.getElementById('receiptTotalText');
  if (el) el.textContent = total.toLocaleString();
}

/* ============ AMBIENT ============ */
function buildMotes() {
  var field = document.getElementById('moteField');
  if (!field) return;
  field.innerHTML = '';
  for (var i = 0; i < 8; i++) {
    var m = document.createElement('div');
    m.className = 'mote';
    var size = 14 + Math.random() * 16;
    m.style.width = size + 'px'; m.style.height = size + 'px';
    m.style.left = (Math.random() * 100) + '%';
    m.style.top  = (Math.random() * 100) + '%';
    var dur = 18 + Math.random() * 20;
    m.style.setProperty('--mote-dur', dur + 's');
    m.style.setProperty('--mote-delay', (-Math.random() * dur) + 's');
    m.style.setProperty('--mote-ax', (Math.random() * 26 - 13).toFixed(1) + 'px');
    m.style.setProperty('--mote-ay', (Math.random() * 22 - 11).toFixed(1) + 'px');
    m.style.setProperty('--mote-peak', (0.16 + Math.random() * 0.22).toFixed(2));
    field.appendChild(m);
  }
}

/* ============ REAL APP DOM INJECTION ============ */
var realAppLoaded = false;
function loadRealAppDom() {
  if (realAppLoaded) return Promise.resolve();
  return fetch('index.html?v=' + Date.now())
    .then(function(r) { return r.text(); })
    .then(function(html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var root = document.getElementById('fakeAppRoot');
      var children = Array.prototype.slice.call(doc.body.children);
      children.forEach(function(el) {
        if (el.id === 'receiptScreen') return;
        if (el.id === 'ambientStage') return;
        if (el.id === 'rippleLayer') return;
        if (el.classList && el.classList.contains('demo-controls')) return;
        root.appendChild(document.importNode(el, true));
      });
      realAppLoaded = true;
    });
}

/* ============ FRAME COUNTER ============ */
var frameRafId = null;
var frameDeltas = [];

function startFrameCount() {
  frameDeltas = [];
  var last = performance.now();
  function tick(now) {
    frameDeltas.push(now - last);
    last = now;
    frameRafId = requestAnimationFrame(tick);
  }
  frameRafId = requestAnimationFrame(tick);
}

function stopFrameCount() {
  if (frameRafId) cancelAnimationFrame(frameRafId);
  frameRafId = null;
  if (frameDeltas.length < 2) return null;
  var sum = 0, worst = 0;
  for (var i = 1; i < frameDeltas.length; i++) {
    sum += frameDeltas[i];
    if (frameDeltas[i] > worst) worst = frameDeltas[i];
  }
  var avgMs = sum / (frameDeltas.length - 1);
  var over20 = 0, over33 = 0;
  for (var j = 1; j < frameDeltas.length; j++) {
    if (frameDeltas[j] > 20) over20++;
    if (frameDeltas[j] > 33) over33++;
  }
  return {
    frames: frameDeltas.length - 1,
    avgMs: avgMs,
    avgFps: 1000 / avgMs,
    worstMs: worst,
    over20: over20,
    over33: over33
  };
}

/* ============ RUN LANDING ============ */
function runLanding() {
  var paperWrap = document.getElementById('paperWrap');
  var readout = document.getElementById('readout');
  if (!paperWrap) return;

  paperWrap.classList.remove('landing');
  void paperWrap.offsetWidth;

  var layers = [];
  if (document.getElementById('btnRealApp').classList.contains('on')) {
    layers.push(document.getElementById('btnHideUnder').classList.contains('on') ? 'realapp(hidden)' : 'realapp');
  }
  if (document.getElementById('btnAmbient').classList.contains('on')) layers.push('ambient');
  if (document.getElementById('btnTicker').classList.contains('on')) layers.push('ticker');
  if (document.getElementById('btnOpaque').classList.contains('on')) layers.push('opaque');
  var label = layers.length ? layers.join('+') : 'baseline';

  readout.textContent = 'running: ' + label + ' — measuring…';

  startFrameCount();
  void paperWrap.offsetWidth;
  paperWrap.classList.add('landing');

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    paperWrap.removeEventListener('animationend', finish);
    paperWrap.classList.remove('landing');
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var r = stopFrameCount();
        if (!r) { readout.textContent = 'no frames captured'; return; }
        var verdict, cls;
        if (r.over33 === 0 && r.avgMs < 22) { verdict = 'SMOOTH'; cls = 'smooth'; }
        else if (r.over33 > 3) { verdict = 'STUTTER'; cls = 'stutter'; }
        else { verdict = 'borderline'; cls = ''; }
        readout.innerHTML =
          '<strong>' + label + '</strong>' +
          ' · avg <strong>' + r.avgFps.toFixed(1) + '</strong> fps' +
          ' · frame <strong>' + r.avgMs.toFixed(1) + '</strong> ms' +
          ' · worst <strong>' + r.worstMs.toFixed(1) + '</strong> ms' +
          ' · &gt;20ms: <strong>' + r.over20 + '</strong>' +
          ' · &gt;33ms: <strong>' + r.over33 + '</strong>' +
          ' · <strong class="' + cls + '">' + verdict + '</strong>';
      });
    });
  }
  paperWrap.addEventListener('animationend', finish);
  setTimeout(finish, 2600);
}

/* ============ TOGGLE WIRING ============ */
function toggle(btn) { btn.classList.toggle('on'); }

document.getElementById('btnRealApp').addEventListener('click', function() {
  var b = this;
  toggle(b);
  if (b.classList.contains('on')) {
    loadRealAppDom().then(function() {
      document.getElementById('fakeAppRoot').classList.toggle(
        'hide-under',
        document.getElementById('btnHideUnder').classList.contains('on')
      );
    });
  } else {
    // Turning off: empty the root.
    document.getElementById('fakeAppRoot').innerHTML = '';
    realAppLoaded = false;
  }
});

document.getElementById('btnHideUnder').addEventListener('click', function() {
  toggle(this);
  document.getElementById('fakeAppRoot').classList.toggle('hide-under', this.classList.contains('on'));
});

document.getElementById('btnAmbient').addEventListener('click', function() {
  toggle(this);
  var on = this.classList.contains('on');
  var stage = document.getElementById('ambientStage');
  stage.style.display = on ? '' : 'none';
  var v = document.getElementById('ambientVideo');
  if (v) {
    if (on) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
    else { try { v.pause(); } catch(e) {} }
  }
  if (on) buildMotes();
});

document.getElementById('btnTicker').addEventListener('click', function() {
  toggle(this);
  document.body.classList.toggle('ticker-on', this.classList.contains('on'));
});

document.getElementById('btnOpaque').addEventListener('click', function() {
  toggle(this);
  document.body.classList.toggle('receipt-opaque', this.classList.contains('on'));
});

document.getElementById('runBtn').addEventListener('click', runLanding);

document.getElementById('clearBtn').addEventListener('click', function() {
  ['btnRealApp','btnHideUnder','btnAmbient','btnTicker','btnOpaque'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b && b.classList.contains('on')) b.click();
  });
});

window.addEventListener('load', function() {
  renderItems();
});
</script>

</body>
</html>
