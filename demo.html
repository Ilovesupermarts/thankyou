<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf3d8">
<title>Koi Water — Demo (real assets)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ============================================================
     REAL APP STYLESHEET — same file the app loads
     ============================================================ -->
<link rel="stylesheet" href="main.css">

<!-- ============================================================
     DEMO-ONLY ADDITIONS
     Everything below is new. Nothing overrides main.css's
     start-button block; the koi, rings, label, hint keep their
     authored styling. These rules only ADD the water effects.
     ============================================================ -->
<style>
  /* ---------- CAUSTICS ----------
     Two screen-blended drifting pools. Appended as extra
     ambient-layer divs inside .ambient-stage, so they inherit
     the wind transform the app already drives. */
  .caustics {
    mix-blend-mode: screen;
    pointer-events: none;
    will-change: transform;
  }
  .caustics-1 {
    opacity: 0.36;
    background:
      radial-gradient(ellipse 42% 32% at 28% 42%, rgba(255, 232, 160, 0.75) 0%, rgba(255, 232, 160, 0.20) 40%, transparent 72%),
      radial-gradient(ellipse 30% 40% at 72% 58%, rgba(255, 198, 100, 0.65) 0%, rgba(255, 198, 100, 0.15) 42%, transparent 72%);
    animation: caustic1 48s ease-in-out infinite;
  }
  .caustics-2 {
    opacity: 0.28;
    background:
      radial-gradient(ellipse 36% 28% at 62% 32%, rgba(255, 244, 214, 0.55) 0%, transparent 70%),
      radial-gradient(ellipse 28% 36% at 38% 68%, rgba(255, 214, 130, 0.55) 0%, transparent 70%);
    animation: caustic2 62s ease-in-out infinite;
  }
  @keyframes caustic1 {
    0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    33%      { transform: translate(3.5%, -2%) scale(1.08) rotate(2deg); }
    66%      { transform: translate(-2.5%, 3%) scale(0.95) rotate(-1.5deg); }
  }
  @keyframes caustic2 {
    0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    50%      { transform: translate(-4%, 3.5%) scale(1.12) rotate(-3deg); }
  }

  /* ---------- RIPPLES ----------
     Fixed overlay above the ambient stage, below the koi button. */
  .ripple-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .ripple {
    position: absolute;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.6px solid currentColor;
    box-shadow: 0 0 14px currentColor, inset 0 0 10px currentColor;
    transform: translate(-50%, -50%) scale(0.25);
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    animation: rippleExpand 750ms cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes rippleExpand {
    0%   { transform: translate(-50%, -50%) scale(0.25); opacity: 0.95; }
    60%  { opacity: 0.55; }
    100% { transform: translate(-50%, -50%) scale(5.2); opacity: 0; }
  }

  /* ---------- KOI DIVE WRAPPER ----------
     Wraps .blossom-char so the koi's existing koiDive keyframe
     and swimCircle rotation are untouched. The wrapper carries
     the dive transform. */
  .koi-dive-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 900ms cubic-bezier(0.5, 0, 0.5, 1),
                opacity 800ms cubic-bezier(0.4, 0, 0.6, 1);
    will-change: transform, opacity;
  }
  .start-btn.diving .koi-dive-wrap {
    transform: translateY(260px) scale(0.75);
    opacity: 0;
  }

  /* ---------- KOI STARTLE ----------
     Brief fast spin on tap, replacing swimCircle for 200ms.
     Preserves the koi's own koiDive breath animation on
     .blossom-char — we only override the inner <img>. */
  .start-btn.startling .koi-image {
    animation: koiStartleSpin 200ms cubic-bezier(0.34, 1.15, 0.64, 1);
  }
  @keyframes koiStartleSpin {
    0%   { transform: rotate(0deg) scale(1); }
    55%  { transform: rotate(200deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* ---------- DIVE COMPANIONS ----------
     The rings and label fade out as the koi leaves the surface. */
  .start-btn.diving .rings-svg {
    opacity: 0;
    transition: opacity 700ms ease;
  }
  .start-btn.diving .start-label {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 500ms ease, transform 500ms ease;
  }
  .blossom-screen.diving .start-hint {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 500ms ease, transform 500ms ease;
  }

  /* ---------- RESET BUTTON (demo chrome only) ---------- */
  .demo-reset {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 500;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.72);
    border: 1.5px solid var(--border-1);
    color: var(--accent);
    font-family: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px var(--shadow-rose);
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.2s ease, background 0.2s ease;
    opacity: 0.55;
  }
  .demo-reset:hover { opacity: 0.9; }
  .demo-reset:active {
    transform: scale(0.92);
    background: #fff;
    border-color: var(--accent);
  }

  /* ---------- DEMO HUD ---------- */
  .demo-hud {
    position: fixed;
    top: 14px;
    left: 16px;
    z-index: 500;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--accent-2);
    opacity: 0.55;
    pointer-events: none;
    line-height: 1.6;
  }
  .demo-hud strong { font-weight: 600; color: var(--accent); }

  /* ---------- ACCESSIBILITY ---------- */
  @media (prefers-reduced-motion: reduce) {
    .caustics-1, .caustics-2 { animation: none; }
    .ripple { animation-duration: 300ms; }
  }
</style>
</head>
<body>

<!-- ============================================================
     AMBIENT STAGE — same structure as the real app,
     with the two caustics layers appended after ambient-
     secondary so they sit above the gradient and below motes.
     ============================================================ -->
<div class="ambient-stage" id="ambientStage" aria-hidden="true">
  <div class="ambient-layer ambient-image">
    <video class="ambient-video" id="ambientVideo"
           autoplay muted loop playsinline preload="auto">
      <source src="icons/VID-20260929-WA0002.mp4" type="video/mp4">
    </video>
  </div>
  <div class="ambient-layer ambient-primary"></div>
  <div class="ambient-layer ambient-secondary"></div>
  <div class="ambient-layer caustics caustics-1"></div>
  <div class="ambient-layer caustics caustics-2"></div>
  <div class="mote-field" id="moteField"></div>
</div>

<!-- RIPPLE LAYER — sits above the ambient stage, below the koi -->
<div class="ripple-layer" id="rippleLayer" aria-hidden="true"></div>

<!-- ============================================================
     BLOSSOM SCREEN — the real markup from index.html, with
     .blossom-char wrapped in .koi-dive-wrap for the dive
     transition. main.css styles .start-btn, .icon-wrapper,
     .rings-svg, .blossom-char, .koi-image, .start-label,
     .start-hint exactly as in production.
     ============================================================ -->
<div class="blossom-screen" id="blossomScreen">
  <button type="button" class="start-btn" id="startBtn" aria-label="はじめる">
    <div class="icon-wrapper">
      <svg class="rings-svg" viewBox="0 0 360 360" aria-hidden="true">
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-1" />
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-2" />
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-3" />
        <circle cx="180" cy="180" r="90" class="gold-band" />
      </svg>
      <div class="koi-dive-wrap">
        <div class="blossom-char">
          <img src="icons/44173_0c6eff.png" class="koi-image" alt="">
        </div>
      </div>
    </div>
    <span class="start-label">はじめる</span>
  </button>
  <p class="start-hint" id="startHint">水面の鯉を、そっとタップしてください。</p>
</div>

<!-- ============================================================
     INTRO OVERLAY — real structure from index.html.
     The .name-column is populated with .name-char spans at
     dive time, exactly as confirmName() does in the app.
     ============================================================ -->
<div class="intro-overlay" id="introOverlay">
  <div class="name-column" id="nameColumn"></div>
</div>

<!-- Demo chrome -->
<button type="button" class="demo-reset" id="resetBtn" aria-label="リセット">↺</button>
<div class="demo-hud">
  <div>state: <strong id="hudState">idle</strong></div>
  <div>ripples: <strong id="hudRipples">0</strong></div>
</div>

<script>
(function() {
  'use strict';

  var startBtn       = document.getElementById('startBtn');
  var blossomScreen  = document.getElementById('blossomScreen');
  var startHint      = document.getElementById('startHint');
  var introOverlay   = document.getElementById('introOverlay');
  var nameColumn     = document.getElementById('nameColumn');
  var rippleLayer    = document.getElementById('rippleLayer');
  var resetBtn       = document.getElementById('resetBtn');
  var hudState       = document.getElementById('hudState');
  var hudRipples     = document.getElementById('hudRipples');
  var ambientVideo   = document.getElementById('ambientVideo');

  var state = 'idle';       /* idle | startling | diving | done */
  var rippleCount = 0;
  var activeTimers = [];

  var RIPPLE_COLOURS = [
    'rgba(253, 243, 216, 0.95)',
    'rgba(247, 185, 60, 0.85)',
    'rgba(255, 240, 200, 0.70)'
  ];

  function pushTimer(id) { activeTimers.push(id); return id; }
  function clearTimers() {
    for (var i = 0; i < activeTimers.length; i++) clearTimeout(activeTimers[i]);
    activeTimers = [];
  }
  function setState(s) { state = s; hudState.textContent = s; }
  function bumpRippleCount(n) {
    rippleCount += n;
    hudRipples.textContent = rippleCount;
  }

  /* ----------------------------------------------------------
     Ripples — 3 concentric rings, small per-ring jitter so the
     pattern reads as a natural disturbance rather than a stack
     of perfect circles.
     ---------------------------------------------------------- */
  function spawnRipples(clientX, clientY) {
    for (var i = 0; i < 3; i++) {
      (function(idx) {
        var r = document.createElement('div');
        r.className = 'ripple';
        var jitterX = (idx - 1) * 3 + (Math.random() * 4 - 2);
        var jitterY = (idx - 1) * 3 + (Math.random() * 4 - 2);
        r.style.left = (clientX + jitterX) + 'px';
        r.style.top  = (clientY + jitterY) + 'px';
        r.style.color = RIPPLE_COLOURS[idx];
        r.style.animationDelay = (idx * 90) + 'ms';
        r.style.width  = (30 + idx * 6) + 'px';
        r.style.height = (30 + idx * 6) + 'px';
        rippleLayer.appendChild(r);
        pushTimer(setTimeout(function() {
          if (r.parentNode) r.parentNode.removeChild(r);
        }, 900 + idx * 90));
      })(i);
    }
    bumpRippleCount(3);
  }

  /* ----------------------------------------------------------
     Intro glyph — same pattern as confirmName(): clear
     .name-column, spawn .name-char spans with staggered
     animation-delay. main.css handles the arrival keyframe.
     ---------------------------------------------------------- */
  function renderIntroGlyph(text) {
    nameColumn.innerHTML = '';
    var chars = (text || '桜').split('');
    for (var i = 0; i < chars.length; i++) {
      var span = document.createElement('span');
      span.className = 'name-char';
      span.textContent = chars[i];
      span.style.animationDelay = (i * 0.22) + 's';
      nameColumn.appendChild(span);
    }
  }

  /* ----------------------------------------------------------
     Start flow:
       idle -> startling (200ms fast spin)
            -> diving    (900ms koi descends; rings + label fade;
                          intro glyph appears at 420ms)
            -> done
     ---------------------------------------------------------- */
  function handleStart(e) {
    if (state !== 'idle') return;

    var x, y;
    if (e && e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
    else if (e && typeof e.clientX === 'number' && (e.clientX || e.clientY)) { x = e.clientX; y = e.clientY; }
    else { var r = startBtn.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }

    spawnRipples(x, y);

    setState('startling');
    startBtn.classList.add('startling');

    pushTimer(setTimeout(function() {
      startBtn.classList.remove('startling');
      startBtn.classList.add('diving');
      blossomScreen.classList.add('diving');
      setState('diving');

      /* Intro glyph appears mid-dive, timing matched to the app's
         charArrive onset after the overlay starts fading in. */
      pushTimer(setTimeout(function() {
        renderIntroGlyph('桜');
        introOverlay.classList.add('active');
      }, 420));

      pushTimer(setTimeout(function() {
        startBtn.classList.add('done');
        setState('done');
      }, 950));
    }, 200));
  }

  /* ----------------------------------------------------------
     Reset — clear state so the demo replays cleanly.
     ---------------------------------------------------------- */
  function reset() {
    clearTimers();
    startBtn.classList.remove('startling', 'diving', 'done');
    blossomScreen.classList.remove('diving');
    introOverlay.classList.remove('active');
    nameColumn.innerHTML = '';
    rippleLayer.innerHTML = '';
    void startBtn.offsetWidth;   /* reflow so transitions restart cleanly */
    setState('idle');
  }

  /* ----------------------------------------------------------
     Wiring
     ---------------------------------------------------------- */
  startBtn.addEventListener('click', handleStart);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state === 'idle') handleStart({ clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 });
      else if (state === 'done') reset();
    }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  /* ----------------------------------------------------------
     Boot — show blossom screen, ensure ambient video plays.
     main.css hides .blossom-screen until .visible is present.
     ---------------------------------------------------------- */
  blossomScreen.classList.add('visible');
  setState('idle');
  hudRipples.textContent = '0';

  if (ambientVideo) {
    var p = ambientVideo.play();
    if (p && typeof p.catch === 'function') p.catch(function() { /* autoplay blocked; first frame shows */ });
  }
})();
</script>

</body>
</html>
