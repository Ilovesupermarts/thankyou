<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf3d8">
<title>Koi Water — Demo (swipe up)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  /* Demo override — no scrolling, all touches captured by our gesture layer */
  body { touch-action: none; }

  /* ---------- CAUSTICS ---------- */
  .caustics {
    mix-blend-mode: screen;
    pointer-events: none;
    will-change: transform;
  }
  .caustics-1 {
    opacity: 0.36;
    background:
      radial-gradient(ellipse 42% 32% at 28% 42%, rgba(255, 232, 160, 0.75) 0%, rgba(255, 232, 160, 0.20) 40%, transparent 72%),
      radial-gradient(ellipse 30% 40% at 72% 58%, rgba(255, 198, 100, 0.65) 0%, rgba(255, 198, 100, 0.15) 42%, transparent 72%);
    animation: caustic1 48s ease-in-out infinite;
  }
  .caustics-2 {
    opacity: 0.28;
    background:
      radial-gradient(ellipse 36% 28% at 62% 32%, rgba(255, 244, 214, 0.55) 0%, transparent 70%),
      radial-gradient(ellipse 28% 36% at 38% 68%, rgba(255, 214, 130, 0.55) 0%, transparent 70%);
    animation: caustic2 62s ease-in-out infinite;
  }
  @keyframes caustic1 {
    0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    33%      { transform: translate(3.5%, -2%) scale(1.08) rotate(2deg); }
    66%      { transform: translate(-2.5%, 3%) scale(0.95) rotate(-1.5deg); }
  }
  @keyframes caustic2 {
    0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    50%      { transform: translate(-4%, 3.5%) scale(1.12) rotate(-3deg); }
  }

  /* ---------- RIPPLES ---------- */
  .ripple-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .ripple {
    position: absolute;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.6px solid currentColor;
    box-shadow: 0 0 14px currentColor, inset 0 0 10px currentColor;
    transform: translate(-50%, -50%) scale(0.25);
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    animation: rippleExpand 750ms cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  .ripple.subtle { animation-name: rippleExpandSubtle; }
  .ripple.trail  { animation-name: rippleExpandTrail; }
  @keyframes rippleExpand {
    0%   { transform: translate(-50%, -50%) scale(0.25); opacity: 0.95; }
    60%  { opacity: 0.55; }
    100% { transform: translate(-50%, -50%) scale(5.2); opacity: 0; }
  }
  @keyframes rippleExpandSubtle {
    0%   { transform: translate(-50%, -50%) scale(0.25); opacity: 0.55; }
    55%  { opacity: 0.30; }
    100% { transform: translate(-50%, -50%) scale(3.4); opacity: 0; }
  }
  @keyframes rippleExpandTrail {
    0%   { transform: translate(-50%, -50%) scale(0.25); opacity: 0.45; }
    100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }

  /* ---------- KOI DIVE / RISE WRAPPER ---------- */
  .koi-dive-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    /* --koi-rise-y is set by JS during a swipe; defaults to 0 */
    transform: translateY(var(--koi-rise-y, 0px));
    transition: transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 800ms cubic-bezier(0.4, 0, 0.6, 1);
    will-change: transform, opacity;
  }
  .koi-dive-wrap.dragging {
    transition: none;
  }
  .start-btn.diving .koi-dive-wrap {
    transform: translateY(260px) scale(0.75);
    opacity: 0;
    transition: transform 900ms cubic-bezier(0.5, 0, 0.5, 1),
                opacity 800ms cubic-bezier(0.4, 0, 0.6, 1);
  }

  /* ---------- KOI STARTLE ---------- */
  .start-btn.startling .koi-image {
    animation: koiStartleSpin 200ms cubic-bezier(0.34, 1.15, 0.64, 1);
  }
  @keyframes koiStartleSpin {
    0%   { transform: rotate(0deg) scale(1); }
    55%  { transform: rotate(200deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* ---------- DIVE COMPANIONS ---------- */
  .start-btn.diving .rings-svg {
    opacity: 0;
    transition: opacity 700ms ease;
  }
  .start-btn.diving .start-label {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 500ms ease, transform 500ms ease;
  }
  .blossom-screen.diving .start-hint {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 500ms ease, transform 500ms ease;
  }

  /* ---------- READY FEEDBACK ----------
     Fires once the swipe crosses the release threshold. */
  .start-btn .gold-band {
    transition: filter 250ms ease;
  }
  .start-btn.ready .gold-band {
    filter: drop-shadow(0 0 28px rgba(253, 240, 200, 1));
  }
  .start-btn.ready .start-label {
    color: #ffffff;
    text-shadow: 0 0 16px rgba(253, 240, 200, 1);
    transition: color 250ms ease, text-shadow 250ms ease;
  }

  /* ---------- DEMO CHROME ---------- */
  .demo-reset {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 500;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.72);
    border: 1.5px solid var(--border-1);
    color: var(--accent);
    font-family: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px var(--shadow-rose);
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.2s ease, background 0.2s ease;
    opacity: 0.55;
    touch-action: manipulation;
  }
  .demo-reset:hover { opacity: 0.9; }
  .demo-reset:active {
    transform: scale(0.92);
    background: #fff;
    border-color: var(--accent);
  }

  .demo-hud {
    position: fixed;
    top: 14px;
    left: 16px;
    z-index: 500;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--accent-2);
    opacity: 0.55;
    pointer-events: none;
    line-height: 1.6;
  }
  .demo-hud strong { font-weight: 600; color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .caustics-1, .caustics-2 { animation: none; }
    .ripple { animation-duration: 300ms; }
  }
</style>
</head>
<body>

<div class="ambient-stage" id="ambientStage" aria-hidden="true">
  <div class="ambient-layer ambient-image">
    <video class="ambient-video" id="ambientVideo"
           autoplay muted loop playsinline preload="auto">
      <source src="icons/VID-20260929-WA0002.mp4" type="video/mp4">
    </video>
  </div>
  <div class="ambient-layer ambient-primary"></div>
  <div class="ambient-layer ambient-secondary"></div>
  <div class="ambient-layer caustics caustics-1"></div>
  <div class="ambient-layer caustics caustics-2"></div>
  <div class="mote-field" id="moteField"></div>
</div>

<div class="ripple-layer" id="rippleLayer" aria-hidden="true"></div>

<div class="blossom-screen" id="blossomScreen">
  <button type="button" class="start-btn" id="startBtn" aria-label="上へスワイプしてはじめる">
    <div class="icon-wrapper">
      <svg class="rings-svg" viewBox="0 0 360 360" aria-hidden="true">
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-1" />
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-2" />
        <circle cx="180" cy="180" r="90" class="pulse-ring ripple-3" />
        <circle cx="180" cy="180" r="90" class="gold-band" />
      </svg>
      <div class="koi-dive-wrap" id="koiDiveWrap">
        <div class="blossom-char">
          <img src="icons/44173_0c6eff.png" class="koi-image" alt="">
        </div>
      </div>
    </div>
    <span class="start-label">はじめる</span>
  </button>
  <p class="start-hint" id="startHint">水面を、そっと上へなぞってください。</p>
</div>

<div class="intro-overlay" id="introOverlay">
  <div class="name-column" id="nameColumn"></div>
</div>

<button type="button" class="demo-reset" id="resetBtn" aria-label="リセット">↺</button>
<div class="demo-hud">
  <div>state: <strong id="hudState">idle</strong></div>
  <div>swipe: <strong id="hudSwipe">0 px</strong></div>
  <div>ripples: <strong id="hudRipples">0</strong></div>
</div>

<script>
(function() {
  'use strict';

  var startBtn      = document.getElementById('startBtn');
  var blossomScreen = document.getElementById('blossomScreen');
  var introOverlay  = document.getElementById('introOverlay');
  var nameColumn    = document.getElementById('nameColumn');
  var koiDiveWrap   = document.getElementById('koiDiveWrap');
  var rippleLayer   = document.getElementById('rippleLayer');
  var resetBtn      = document.getElementById('resetBtn');
  var hudState      = document.getElementById('hudState');
  var hudSwipe      = document.getElementById('hudSwipe');
  var hudRipples    = document.getElementById('hudRipples');
  var ambientVideo  = document.getElementById('ambientVideo');

  var state = 'idle';            /* idle | swiping | startling | diving | done */
  var rippleCount = 0;
  var activeTimers = [];

  var activePointerId = null;
  var startX = 0, startY = 0;
  var currentX = 0, currentY = 0;
  var riseY = 0;                 /* negative when koi is lifted */
  var lastTrailRippleAt = 0;

  /* Tuning knobs */
  var RISE_MAX = 40;             /* maximum koi lift, px */
  var RISE_FACTOR = 0.35;        /* koi lift / finger travel */
  var SWIPE_THRESHOLD = 60;      /* upward px to arm the release */
  var TRAIL_RIPPLE_INTERVAL = 90; /* ms between trail ripples */
  var TRAIL_RIPPLE_MIN_TRAVEL = 18; /* px before a trail ripple may fire */

  /* Ripple palettes */
  var PALETTE_STRONG = ['rgba(253, 243, 216, 0.95)', 'rgba(247, 185, 60, 0.85)', 'rgba(255, 240, 200, 0.70)'];
  var PALETTE_SUBTLE = ['rgba(247, 185, 60, 0.55)',  'rgba(255, 240, 200, 0.40)'];
  var PALETTE_TRAIL  = ['rgba(247, 185, 60, 0.40)'];

  function pushTimer(id) { activeTimers.push(id); return id; }
  function clearTimers() {
    for (var i = 0; i < activeTimers.length; i++) clearTimeout(activeTimers[i]);
    activeTimers = [];
  }
  function setState(s) { state = s; hudState.textContent = s; }
  function bumpRippleCount(n) {
    rippleCount += n;
    hudRipples.textContent = rippleCount;
  }

  /* ----------------------------------------------------------
     Ripples — intensity is 'strong' | 'subtle' | 'trail'.
     ---------------------------------------------------------- */
  function spawnRipples(clientX, clientY, intensity) {
    var palette, cls, baseSize;
    if (intensity === 'strong') {
      palette = PALETTE_STRONG;
      cls = '';
      baseSize = 30;
    } else if (intensity === 'trail') {
      palette = PALETTE_TRAIL;
      cls = ' trail';
      baseSize = 22;
    } else {
      palette = PALETTE_SUBTLE;
      cls = ' subtle';
      baseSize = 26;
    }

    for (var i = 0; i < palette.length; i++) {
      (function(idx) {
        var r = document.createElement('div');
        r.className = 'ripple' + cls;
        var jitterX = (idx - (palette.length - 1) / 2) * 3 + (Math.random() * 4 - 2);
        var jitterY = (idx - (palette.length - 1) / 2) * 3 + (Math.random() * 4 - 2);
        r.style.left = (clientX + jitterX) + 'px';
        r.style.top  = (clientY + jitterY) + 'px';
        r.style.color = palette[idx];
        r.style.animationDelay = (idx * 80) + 'ms';
        r.style.width  = (baseSize + idx * 6) + 'px';
        r.style.height = (baseSize + idx * 6) + 'px';
        rippleLayer.appendChild(r);
        pushTimer(setTimeout(function() {
          if (r.parentNode) r.parentNode.removeChild(r);
        }, 900 + idx * 80));
      })(i);
    }
    bumpRippleCount(palette.length);
  }

  /* ----------------------------------------------------------
     Intro glyph — matches the app's confirmName() pattern.
     ---------------------------------------------------------- */
  function renderIntroGlyph(text) {
    nameColumn.innerHTML = '';
    var chars = (text || '桜').split('');
    for (var i = 0; i < chars.length; i++) {
      var span = document.createElement('span');
      span.className = 'name-char';
      span.textContent = chars[i];
      span.style.animationDelay = (i * 0.22) + 's';
      nameColumn.appendChild(span);
    }
  }

  /* ----------------------------------------------------------
     Gesture layer — listens on document, works from anywhere
     on screen.
     ---------------------------------------------------------- */
  function onPointerDown(e) {
    if (state !== 'idle') return;
    if (activePointerId !== null) return;
    if (e.target.closest && e.target.closest('.demo-reset')) return;

    activePointerId = e.pointerId;
    startX = currentX = e.clientX;
    startY = currentY = e.clientY;
    riseY = 0;
    lastTrailRippleAt = Date.now();

    var onButton = !!(e.target.closest && e.target.closest('.start-btn'));
    spawnRipples(e.clientX, e.clientY, onButton ? 'strong' : 'subtle');

    koiDiveWrap.classList.add('dragging');
    koiDiveWrap.style.setProperty('--koi-rise-y', '0px');
    setState('swiping');
  }

  function onPointerMove(e) {
    if (e.pointerId !== activePointerId) return;
    if (state !== 'swiping') return;

    currentX = e.clientX;
    currentY = e.clientY;

    var deltaY = currentY - startY;
    var upward = Math.max(0, -deltaY);

    /* Lift koi proportional to upward travel */
    riseY = -Math.min(RISE_MAX, upward * RISE_FACTOR);
    koiDiveWrap.style.setProperty('--koi-rise-y', riseY + 'px');

    /* Arm the release feedback past threshold */
    if (upward >= SWIPE_THRESHOLD) {
      startBtn.classList.add('ready');
    } else {
      startBtn.classList.remove('ready');
    }

    /* Trail ripples behind a moving finger */
    var now = Date.now();
    if (upward > TRAIL_RIPPLE_MIN_TRAVEL &&
        (now - lastTrailRippleAt) > TRAIL_RIPPLE_INTERVAL) {
      lastTrailRippleAt = now;
      spawnRipples(currentX, currentY, 'trail');
    }

    hudSwipe.textContent = Math.round(upward) + ' px';
  }

  function onPointerUp(e) {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;

    if (state !== 'swiping') {
      /* e.g. pointercancel after we already moved on */
      koiDiveWrap.classList.remove('dragging');
      return;
    }

    var deltaY = currentY - startY;
    var upward = Math.max(0, -deltaY);

    koiDiveWrap.classList.remove('dragging');

    if (upward >= SWIPE_THRESHOLD) {
      startBtn.classList.remove('ready');
      triggerStart();
    } else {
      /* Spring back, stay in idle */
      koiDiveWrap.style.setProperty('--koi-rise-y', '0px');
      startBtn.classList.remove('ready');
      setState('idle');
      hudSwipe.textContent = '0 px';
    }
  }

  /* ----------------------------------------------------------
     Start sequence — startle, dive, intro glyph.
     ---------------------------------------------------------- */
  function triggerStart() {
    setState('startling');
    startBtn.classList.add('startling');

    pushTimer(setTimeout(function() {
      startBtn.classList.remove('startling');
      startBtn.classList.add('diving');
      blossomScreen.classList.add('diving');
      setState('diving');

      pushTimer(setTimeout(function() {
        renderIntroGlyph('桜');
        introOverlay.classList.add('active');
      }, 420));

      pushTimer(setTimeout(function() {
        startBtn.classList.add('done');
        setState('done');
      }, 950));
    }, 200));
  }

  /* ----------------------------------------------------------
     Reset
     ---------------------------------------------------------- */
  function reset() {
    clearTimers();
    activePointerId = null;
    startBtn.classList.remove('startling', 'diving', 'done', 'ready');
    blossomScreen.classList.remove('diving');
    introOverlay.classList.remove('active');
    nameColumn.innerHTML = '';
    rippleLayer.innerHTML = '';
    koiDiveWrap.classList.remove('dragging');
    koiDiveWrap.style.removeProperty('--koi-rise-y');
    riseY = 0;
    hudSwipe.textContent = '0 px';
    void startBtn.offsetWidth;
    setState('idle');
  }

  /* ----------------------------------------------------------
     Wiring
     ---------------------------------------------------------- */
  document.addEventListener('pointerdown', onPointerDown, { passive: true });
  document.addEventListener('pointermove', onPointerMove, { passive: true });
  document.addEventListener('pointerup', onPointerUp, { passive: true });
  document.addEventListener('pointercancel', onPointerUp, { passive: true });
  resetBtn.addEventListener('click', reset);

  /* Keyboard — desktop / accessibility path */
  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state === 'idle') {
        spawnRipples(window.innerWidth / 2, window.innerHeight / 2, 'strong');
        triggerStart();
      } else if (state === 'done') {
        reset();
      }
    }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  /* ----------------------------------------------------------
     Boot
     ---------------------------------------------------------- */
  blossomScreen.classList.add('visible');
  setState('idle');
  hudSwipe.textContent = '0 px';
  hudRipples.textContent = '0';

  if (ambientVideo) {
    var p = ambientVideo.play();
    if (p && typeof p.catch === 'function') p.catch(function() { /* autoplay blocked; first frame shows */ });
  }
})();
</script>

</body>
</html>
