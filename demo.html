<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Receipt Landing — Diagnostic Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  /* ============================================================
     DEMO-ONLY OVERRIDES
     Everything below is scoped to this page. Nothing here is
     meant for production.
     ============================================================ */

  /* Control bar sits above the receipt screen (which is z-index 300). */
  .demo-controls {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 6px 24px var(--shadow-rose-2);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 13px;
    color: var(--text-dark);
    max-width: 96vw;
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .demo-controls button {
    border-radius: 18px;
    border: 1.5px solid var(--border-1);
    background: #fff;
    color: var(--text-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .demo-controls button:active {
    transform: scale(0.96);
    background: var(--soft-1);
    border-color: var(--accent);
  }
  .demo-controls button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .demo-controls button.primary:active {
    background: var(--accent-3);
  }
  .demo-readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0;
    min-width: 220px;
    text-align: center;
  }
  .demo-readout strong {
    color: var(--accent);
    font-weight: 700;
  }
  .demo-status {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 1px;
    text-align: center;
  }

  /* ============================================================
     TEST CLASSES — each isolates one suspect.
     Applied to <body> by JS when the corresponding button is
     pressed.
     ============================================================ */

  /* Test A: kill overflow-y on the paper. */
  body.test-no-scroll-paper .receipt-paper {
    overflow: hidden !important;
  }

  /* Test B: kill overflow-y on the screen. */
  body.test-no-scroll-screen .receipt-screen {
    overflow: hidden !important;
  }

  /* Test C: kill the SVG mask on the paper. */
  body.test-no-mask .receipt-paper {
    -webkit-mask-image: none !important;
    mask-image: none !important;
  }

  /* Test D: kill the wrapper's filter entirely (baseline). */
  body.test-no-filter .receipt-paper-wrap {
    filter: none !important;
  }
</style>
</head>
<body>

<div class="demo-controls">
  <div class="demo-row">
    <button type="button" class="primary" data-test="baseline">Baseline (no test)</button>
    <button type="button" data-test="no-scroll-paper">A · no paper scroll</button>
    <button type="button" data-test="no-scroll-screen">B · no screen scroll</button>
    <button type="button" data-test="no-mask">C · no SVG mask</button>
    <button type="button" data-test="no-filter">D · no filter</button>
  </div>
  <div class="demo-readout" id="readout">Tap a button to run the landing animation.</div>
  <div class="demo-status" id="status">ready</div>
</div>

<div class="receipt-screen visible" id="receiptScreen">
  <div class="receipt-paper-wrap" id="paperWrap">
    <div class="receipt-paper">
      <div class="receipt-header">
        <div class="receipt-thanks">ご確認いただきありがとうございます。</div>
        <div class="receipt-subthanks">無理のない範囲でお選びいただき、ありがとうございます。</div>
      </div>
      <div class="receipt-to-row">
        <span class="receipt-to-mark">❀</span>
        <span class="receipt-to-name">桜庭さんへ</span>
        <span class="receipt-to-mark">❀</span>
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-title">
        <span>本日の内容：</span>
        <span class="item-count">6 項目</span>
      </div>
      <div class="receipt-items" id="receiptItems"></div>

      <div class="receipt-total-line">
        <span class="receipt-total-label">合計</span>
        <span class="receipt-total-value">
          <span class="yen-symbol">¥</span>
          <span id="receiptTotalText">31,500</span>
        </span>
      </div>

      <button type="button" class="receipt-confirm-btn">こちらの内容でお願いいたします。</button>
      <button type="button" class="receipt-back-btn">サービスの選択に戻る</button>

      <div class="receipt-footer">
        <span class="receipt-footer-mark">❀</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ITEMS
   ============================================================ */
var SAMPLE_ITEMS = [
  { name: 'ダミーテキスト1', price: 5000 },
  { name: 'ダミーテキスト2', price: 5500 },
  { name: 'ダミーテキスト3', price: 6000 },
  { name: 'ダミーテキスト4', price: 4500 },
  { name: 'ダミーテキスト5', price: 5000 },
  { name: 'ダミーテキスト6', price: 5500 }
];

function renderItems() {
  var wrap = document.getElementById('receiptItems');
  wrap.innerHTML = '';
  var total = 0;
  for (var i = 0; i < SAMPLE_ITEMS.length; i++) {
    var it = SAMPLE_ITEMS[i];
    total += it.price;
    var div = document.createElement('div');
    div.className = 'receipt-item';
    div.style.animationDelay = Math.min(i * 0.08, 0.4) + 's';
    div.innerHTML =
      '<span class="receipt-item-name">' + it.name + '</span>' +
      '<span class="receipt-item-price-wrap">' +
        '<span class="yen-symbol">¥</span>' +
        '<input type="text" class="receipt-price-input" value="' + it.price.toLocaleString() + '" readonly tabindex="-1">' +
      '</span>';
    wrap.appendChild(div);
  }
  var totalEl = document.getElementById('receiptTotalText');
  if (totalEl) totalEl.textContent = total.toLocaleString();
}

/* ============================================================
   FRAME COUNTER
   ------------------------------------------------------------
   Measures actual inter-frame intervals during the animation.
   Reports average FPS and worst single frame. If the fall is
   smooth, worst frame should be close to avg frame (~16.7ms at
   60Hz, ~8.3ms at 120Hz). A worst frame of 40ms+ means a
   dropped frame — that is the stutter you are seeing.
   ============================================================ */
var frameRafId = null;
var frameDeltas = [];
var frameStartTime = 0;

function startFrameCount() {
  frameDeltas = [];
  frameStartTime = performance.now();
  var last = frameStartTime;
  function tick(now) {
    frameDeltas.push(now - last);
    last = now;
    frameRafId = requestAnimationFrame(tick);
  }
  frameRafId = requestAnimationFrame(tick);
}

function stopFrameCount() {
  if (frameRafId) cancelAnimationFrame(frameRafId);
  frameRafId = null;
  if (frameDeltas.length < 2) return null;
  var sum = 0;
  var worst = 0;
  var worstIdx = -1;
  for (var i = 1; i < frameDeltas.length; i++) {
    sum += frameDeltas[i];
    if (frameDeltas[i] > worst) {
      worst = frameDeltas[i];
      worstIdx = i;
    }
  }
  var avgMs = sum / (frameDeltas.length - 1);
  var over20 = 0;
  var over33 = 0;
  for (var j = 1; j < frameDeltas.length; j++) {
    if (frameDeltas[j] > 20) over20++;
    if (frameDeltas[j] > 33) over33++;
  }
  return {
    frames: frameDeltas.length - 1,
    avgMs: avgMs,
    avgFps: 1000 / avgMs,
    worstMs: worst,
    over20: over20,
    over33: over33
  };
}

/* ============================================================
   RUN THE LANDING ANIMATION WITH A GIVEN TEST CLASS
   ============================================================ */
var TEST_CLASSES = [
  'test-no-scroll-paper',
  'test-no-scroll-screen',
  'test-no-mask',
  'test-no-filter'
];

function clearTestClasses() {
  for (var i = 0; i < TEST_CLASSES.length; i++) {
    document.body.classList.remove(TEST_CLASSES[i]);
  }
}

function runLanding(testName) {
  var paperWrap = document.getElementById('paperWrap');
  var readout = document.getElementById('readout');
  var status = document.getElementById('status');
  if (!paperWrap) return;

  /* Clear any in-flight animation and test class. */
  paperWrap.classList.remove('landing');
  void paperWrap.offsetWidth;
  clearTestClasses();

  /* Apply the selected test class (if any). */
  var applied = '(baseline)';
  if (testName && testName !== 'baseline') {
    document.body.classList.add('test-' + testName);
    applied = 'test-' + testName;
  }

  status.textContent = 'running: ' + applied;
  readout.textContent = 'measuring frames…';

  /* Start the frame counter just before the animation. */
  startFrameCount();

  /* Kick off the landing. */
  void paperWrap.offsetWidth;
  paperWrap.classList.add('landing');

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    paperWrap.removeEventListener('animationend', finish);
    paperWrap.classList.remove('landing');

    /* Let one more frame settle, then stop the counter. */
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var r = stopFrameCount();
        if (!r) {
          readout.textContent = 'no frames captured';
          return;
        }
        var verdict;
        if (r.over33 === 0 && r.avgMs < 22) verdict = 'smooth';
        else if (r.over33 > 3) verdict = 'stutter';
        else verdict = 'borderline';

        readout.innerHTML =
          'test: <strong>' + applied + '</strong>' +
          ' · avg <strong>' + r.avgFps.toFixed(1) + '</strong> fps' +
          ' · avg frame <strong>' + r.avgMs.toFixed(1) + '</strong> ms' +
          ' · worst <strong>' + r.worstMs.toFixed(1) + '</strong> ms' +
          ' · &gt;20ms: <strong>' + r.over20 + '</strong>' +
          ' · &gt;33ms: <strong>' + r.over33 + '</strong>' +
          ' · verdict: <strong>' + verdict + '</strong>';

        status.textContent = 'done — ' + r.frames + ' frames captured';
      });
    });
  }

  paperWrap.addEventListener('animationend', finish);
  /* Fallback in case animationend does not fire (some embedded
     webviews). Duration is 2400ms; cut off at 2600ms. */
  setTimeout(finish, 2600);
}

/* ============================================================
   WIRING
   ============================================================ */
document.querySelector('.demo-controls').addEventListener('click', function(e) {
  var btn = e.target.closest('button[data-test]');
  if (!btn) return;
  runLanding(btn.getAttribute('data-test'));
});

window.addEventListener('load', function() {
  renderItems();
});
</script>

</body>
</html>
