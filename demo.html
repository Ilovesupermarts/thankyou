<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koi Water Ripple Button - Autumn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap');

  :root {
    --bg-base: #fdf3d8; 
    --accent: #c9600a; 
    --petal: #e88a1a; 
    --petal-soft: #fde8b8; 
    --text-dark: #231304;
  }

  body {
    margin: 0;
    height: 100vh;
    background-color: var(--bg-base);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
  }

  .blossom-screen {
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
  }

  .start-btn {
    background: none; border: none; padding: 20px; 
    display: flex; flex-direction: column;
    align-items: center; gap: 16px; cursor: pointer; 
    -webkit-appearance: none; appearance: none;
    transition: transform 0.25s ease;
  }
  
  .start-btn:active { 
    transform: scale(0.94); 
  }

  .icon-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blossom-char {
    position: relative;
    z-index: 2;
    display: block; 
    width: 100px; 
    height: 100px; 
    user-select: none; -webkit-user-select: none;
    animation: blossomBreathe 3.6s ease-in-out infinite; 
    transform-origin: 50% 50%; 
    will-change: transform, filter;
  }

  @keyframes blossomBreathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
    50% { transform: scale(1.14); filter: drop-shadow(0 4px 18px var(--petal-soft)); }
  }

  .koi-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: center center;
    animation: idleSway 5s ease-in-out infinite;
  }

  @keyframes idleSway {
    0%, 82%, 100% { transform: rotate(0deg); }
    86% { transform: rotate(-6deg); }
    92% { transform: rotate(4deg); }
    96% { transform: rotate(-2deg); }
  }

  .rings-svg {
    position: absolute;
    width: 260px; 
    height: 260px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
  }

  .gold-band {
    stroke: var(--accent);
    stroke-width: 6px;
    fill: none;
    filter: drop-shadow(0 0 16px var(--petal));
  }

  /* Base styling for all ripples */
  .pulse-ring {
    stroke: var(--petal);
    fill: none;
    transform-origin: 130px 130px;
    animation: ringPulse 3s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  }

  /* Staggering the animation delays to create continuous waves */
  .ripple-1 { animation-delay: 0s; }
  .ripple-2 { animation-delay: 1s; }
  .ripple-3 { animation-delay: 2s; }

  /* Expanded ripple radius and thinner fade-out */
  @keyframes ringPulse {
    0% { transform: scale(0.95); opacity: 0.8; stroke-width: 3px; }
    100% { transform: scale(1.6); opacity: 0; stroke-width: 0px; }
  }

  .start-label {
    font-size: 17px; font-weight: 600; letter-spacing: 5px; color: var(--accent);
  }
  
  .start-hint {
    margin: 8px 0 0 0; font-size: 20px; font-weight: 500; color: var(--text-dark);
    letter-spacing: 3px; line-height: 2; text-align: center; 
    animation: hintBreathe 4s ease-in-out infinite;
  }
  
  @keyframes hintBreathe { 
    0%, 100% { opacity: 0.92; } 
    50% { opacity: 1; } 
  }
</style>
</head>
<body>

  <div class="blossom-screen">
    <button type="button" class="start-btn" aria-label="はじめる">
      
      <div class="icon-wrapper">
        <svg class="rings-svg" viewBox="0 0 260 260" aria-hidden="true">
          <!-- The 3 Continuous Water Ripples -->
          <circle cx="130" cy="130" r="90" class="pulse-ring ripple-1" />
          <circle cx="130" cy="130" r="90" class="pulse-ring ripple-2" />
          <circle cx="130" cy="130" r="90" class="pulse-ring ripple-3" />
          
          <!-- The Static Glowing Band (Rendered last so it sits on top of the ripples) -->
          <circle cx="130" cy="130" r="90" class="gold-band" />
        </svg>

        <!-- Foreground Koi Image -->
        <div class="blossom-char">
          <img src="44173_0c6eff.png" class="koi-image" alt="Koi Start">
        </div>
      </div>
      
      <span class="start-label">はじめる</span>
    </button>
    
    <p class="start-hint">そっとタップしてください</p>
  </div>

</body>
</html>
