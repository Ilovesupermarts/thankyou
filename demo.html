<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Receipt Demo — 本日の内容 counter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  /* ============================================================
     DEMO-ONLY OVERRIDES
     These reproduce the proposed changes to the 本日の内容 line.
     Not part of main.css. Scoped to this page.
     ============================================================ */

  /* 1. Label and counter sit flush — no flex gap. */
  .receipt-title { gap: 0; }

  /* 2. Counter loses every piece of badge chrome. Inherits
        everything (colour, size, family, letter-spacing) from
        .receipt-title. */
  .receipt-title .item-count {
    display: inline-flex;
    align-items: center;
    background: none;
    border: none;
    border-radius: 0;
    padding: 0;
    color: inherit;
    font-size: inherit;
    font-weight: inherit;
    font-family: inherit;
    letter-spacing: inherit;
  }

  /* 3. Digit cell height tracks the label's font-size, and the
        whole counter pulls left by --counter-pull. The value of
        --counter-pull is driven live by the slider in the demo
        control bar. */
  .counter-digit-roll {
    --digit-h: 1.4em;
    margin-left: var(--counter-pull, 0px);
  }

  /* 4. Column width comes from a CSS variable measured at runtime
        (one digit advance + one letter-space). Fallback is a
        generous guess used only before JS measures. */
  .counter-digit-roll .digit-col {
    width: var(--counter-cell-w, 1.4em);
    transition: width 300ms cubic-bezier(0.34, 1.15, 0.64, 1),
                opacity 200ms ease;
  }
  .counter-digit-roll .digit-strip {
    transition: transform 500ms cubic-bezier(0.34, 1.15, 0.64, 1);
  }

  /* 5. The digit inherits letter-spacing like every other character. */
  .counter-digit-roll .digit {
    font-weight: 600;
    letter-spacing: inherit;
  }

  /* ============================================================
     DEMO CHROME (controls, stage). Not relevant to the change.
     ============================================================ */
  .demo-stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 180px 20px 80px 20px;
  }
  .demo-controls {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--border-2);
    border-radius: 16px;
    padding: 12px 16px;
    box-shadow: 0 6px 24px var(--shadow-rose-2);
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 14px;
    color: var(--text-dark);
    z-index: 100;
    max-width: 92vw;
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .demo-controls button {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--border-1);
    background: #fff;
    color: var(--accent);
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    -webkit-appearance: none; appearance: none;
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .demo-controls button:active { transform: scale(0.92); background: var(--soft-1); border-color: var(--accent); }
  .demo-controls input[type="number"] {
    width: 56px;
    text-align: center;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    background: #fff;
    border: 1.5px solid var(--border-1);
    border-radius: 10px;
    padding: 6px 4px;
    -webkit-appearance: none;
    appearance: none;
  }
  .demo-controls input[type="number"]::-webkit-outer-spin-button,
  .demo-controls input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .demo-controls input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .demo-label {
    font-size: 12px;
    color: var(--text-mute);
    letter-spacing: 2px;
    flex-shrink: 0;
  }
  .demo-slider {
    flex: 1;
    min-width: 200px;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--border-2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .demo-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 2px 6px var(--shadow-accent);
    cursor: pointer;
  }
  .demo-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 2px 6px var(--shadow-accent);
    cursor: pointer;
  }
  .demo-readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    min-width: 60px;
    text-align: right;
    letter-spacing: 0;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="demo-controls">
  <div class="demo-row">
    <button type="button" id="decBtn" aria-label="減らす">−</button>
    <input type="number" id="countInput" value="3" min="0" max="20" step="1" aria-label="件数">
    <button type="button" id="incBtn" aria-label="増やす">＋</button>
    <span class="demo-label">項目</span>
  </div>
  <div class="demo-row">
    <span class="demo-label">PULL</span>
    <input type="range" id="pullSlider" class="demo-slider" min="-20" max="4" step="0.5" value="-12">
    <span class="demo-readout" id="pullReadout">-12.0px</span>
  </div>
</div>

<div class="demo-stage">
  <div class="receipt-paper-wrap">
    <div class="receipt-paper">
      <div class="receipt-header">
        <div class="receipt-thanks">ご確認いただきありがとうございます。</div>
        <div class="receipt-subthanks">無理のない範囲でお選びいただき、ありがとうございます。</div>
      </div>
      <div class="receipt-to-row">
        <span class="receipt-to-mark">❀</span>
        <span class="receipt-to-name">桜庭さんへ</span>
        <span class="receipt-to-mark">❀</span>
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-title">
        <span>本日の内容：</span>
        <span class="item-count" id="itemCount">
          <span class="digit-roll counter-digit-roll" id="itemCountDigits"></span>
          <span class="item-count-unit">項目</span>
        </span>
      </div>
      <div class="receipt-items" id="receiptItems"></div>

      <div class="receipt-total-line">
        <span class="receipt-total-label">合計</span>
        <span class="receipt-total-value"><span class="yen-symbol">¥</span><span class="digit-roll receipt-digit-roll" id="receiptTotalNumber"></span></span>
      </div>

      <button type="button" class="receipt-confirm-btn">こちらの内容でお願いいたします。</button>
      <button type="button" class="receipt-back-btn">サービスの選択に戻る</button>

      <div class="receipt-footer">
        <span class="receipt-footer-mark">❀</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   RUNTIME DIGIT ADVANCE MEASUREMENT
   ============================================================ */
function measureDigitAdvance() {
  var titleEl = document.querySelector('.receipt-title');
  if (!titleEl) return null;
  var cs = window.getComputedStyle(titleEl);

  var probe = document.createElement('span');
  probe.textContent = '0000000000';
  probe.style.position = 'absolute';
  probe.style.visibility = 'hidden';
  probe.style.pointerEvents = 'none';
  probe.style.whiteSpace = 'nowrap';
  probe.style.fontFamily = cs.fontFamily;
  probe.style.fontSize = cs.fontSize;
  probe.style.fontWeight = cs.fontWeight;
  probe.style.fontStyle = cs.fontStyle;
  probe.style.letterSpacing = cs.letterSpacing;
  probe.style.lineHeight = '1';
  document.body.appendChild(probe);

  var w = probe.getBoundingClientRect().width;
  document.body.removeChild(probe);

  if (!w || w <= 0) return null;
  return w / 10;
}

function applyCounterCellWidth() {
  var advance = measureDigitAdvance();
  if (!advance) return;
  var container = document.getElementById('itemCountDigits');
  if (!container) return;
  container.style.setProperty('--counter-cell-w', advance.toFixed(3) + 'px');
}

/* ============================================================
   COUNTER ODOMETER
   ============================================================ */
var COUNTER_COLS = 2;

function counterIsColVisible(value, colIndex) {
  if (value === 0) return colIndex === COUNTER_COLS - 1;
  var placeValue = Math.pow(10, COUNTER_COLS - 1 - colIndex);
  return value >= placeValue;
}
function counterGetDigitAt(value, colIndex) {
  var placeValue = Math.pow(10, COUNTER_COLS - 1 - colIndex);
  return Math.floor(value / placeValue) % 10;
}
function buildCounterColumns(container, initialValue) {
  if (!container) return;
  container.innerHTML = '';
  for (var i = 0; i < COUNTER_COLS; i++) {
    var col = document.createElement('span');
    col.className = 'digit-col hidden';
    col.setAttribute('data-digit', '0');
    var strip = document.createElement('span');
    strip.className = 'digit-strip';
    for (var d = 0; d <= 9; d++) {
      var de = document.createElement('span');
      de.className = 'digit';
      de.textContent = d;
      strip.appendChild(de);
    }
    strip.style.transform = 'translateY(0)';
    col.appendChild(strip);
    container.appendChild(col);
  }
  container.classList.add('no-transition');
  applyCounterValue(container, initialValue, { instant: true });
  void container.offsetWidth;
  container.classList.remove('no-transition');
}
function applyCounterValue(container, value, opts) {
  if (!container) return;
  opts = opts || {};
  var instant = !!opts.instant;
  if (instant) container.classList.add('no-transition');
  var cols = container.querySelectorAll('.digit-col');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i];
    var strip = col.querySelector('.digit-strip');
    var visible = counterIsColVisible(value, i);
    var newDigit = counterGetDigitAt(value, i);
    var oldDigit = parseInt(col.getAttribute('data-digit') || '0', 10);
    var delay = instant ? 0 : (COUNTER_COLS - 1 - i) * 40;
    if (instant) {
      strip.style.transitionDelay = '0ms';
      strip.style.transform = 'translateY(' + (-newDigit * 10) + '%)';
    } else if (newDigit !== oldDigit) {
      strip.style.transitionDelay = delay + 'ms';
      strip.style.transform = 'translateY(' + (-newDigit * 10) + '%)';
    }
    col.classList.toggle('hidden', !visible);
    col.setAttribute('data-digit', newDigit);
  }
  if (instant) {
    void container.offsetWidth;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        container.classList.remove('no-transition');
      });
    });
  }
}

/* ============================================================
   MONEY ODOMETER
   ============================================================ */
var NUM_COLS = 6;
var COMMA_AFTER = 2;

function isColVisible(value, colIndex) {
  if (value === 0) return colIndex === NUM_COLS - 1;
  var placeValue = Math.pow(10, NUM_COLS - 1 - colIndex);
  return value >= placeValue;
}
function getDigitAt(value, colIndex) {
  var placeValue = Math.pow(10, NUM_COLS - 1 - colIndex);
  return Math.floor(value / placeValue) % 10;
}
function buildDigitColumns(container, initialValue) {
  if (!container) return;
  container.innerHTML = '';
  for (var i = 0; i < NUM_COLS; i++) {
    var col = document.createElement('span');
    col.className = 'digit-col hidden';
    col.setAttribute('data-digit', '0');
    var strip = document.createElement('span');
    strip.className = 'digit-strip';
    for (var d = 0; d <= 9; d++) {
      var de = document.createElement('span');
      de.className = 'digit';
      de.textContent = d;
      strip.appendChild(de);
    }
    strip.style.transform = 'translateY(0)';
    col.appendChild(strip);
    container.appendChild(col);
    if (i === COMMA_AFTER) {
      var comma = document.createElement('span');
      comma.className = 'digit-static hidden';
      comma.setAttribute('data-comma', '1');
      comma.textContent = ',';
      container.appendChild(comma);
    }
  }
  container.classList.add('no-transition');
  applyDigitValue(container, initialValue, { instant: true, stagger: 0 });
  void container.offsetWidth;
  container.classList.remove('no-transition');
}
function applyDigitValue(container, value, opts) {
  if (!container) return;
  opts = opts || {};
  var instant = !!opts.instant;
  var stagger = opts.stagger != null ? opts.stagger : 45;
  if (instant) container.classList.add('no-transition');
  var cols = container.querySelectorAll('.digit-col');
  var comma = container.querySelector('.digit-static[data-comma]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i];
    var strip = col.querySelector('.digit-strip');
    var visible = isColVisible(value, i);
    var newDigit = getDigitAt(value, i);
    var oldDigit = parseInt(col.getAttribute('data-digit') || '0', 10);
    var fromRight = NUM_COLS - 1 - i;
    var delay = instant ? 0 : fromRight * stagger;
    if (instant) {
      strip.style.transitionDelay = '0ms';
      strip.style.transform = 'translateY(' + (-newDigit * 10) + '%)';
    } else if (newDigit !== oldDigit) {
      strip.style.transitionDelay = delay + 'ms';
      strip.style.transform = 'translateY(' + (-newDigit * 10) + '%)';
    }
    col.classList.toggle('hidden', !visible);
    col.setAttribute('data-digit', newDigit);
  }
  if (comma) comma.classList.toggle('hidden', value < 1000);
  if (instant) {
    void container.offsetWidth;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        container.classList.remove('no-transition');
      });
    });
  }
}

/* ============================================================
   DEMO STATE
   ============================================================ */
var MAX_COUNT = 20;
var currentCount = 3;

var SAMPLE_ITEMS = [
  'ダミーテキスト1', 'ダミーテキスト2', 'ダミーテキスト3',
  'ダミーテキスト4', 'ダミーテキスト5', 'ダミーテキスト6',
  'ダミーテキスト7', 'ダミーテキスト8', 'ダミーテキスト9',
  'ダミーテキスト10', 'ダミーテキスト11', 'ダミーテキスト12',
  'ダミーテキスト13', 'ダミーテキスト14', 'ダミーテキスト15',
  'ダミーテキスト16', 'ダミーテキスト17', 'ダミーテキスト18',
  'ダミーテキスト19', 'ダミーテキスト20'
];
var SAMPLE_PRICES = [1500, 2000, 3000, 4500, 5000,
                     1500, 2000, 3000, 4500, 5000,
                     1500, 2000, 3000, 4500, 5000,
                     1500, 2000, 3000, 4500, 5000];

function renderItems(n) {
  var wrap = document.getElementById('receiptItems');
  wrap.innerHTML = '';
  var total = 0;
  for (var i = 0; i < n; i++) {
    var price = SAMPLE_PRICES[i % SAMPLE_PRICES.length];
    total += price;
    var item = document.createElement('div');
    item.className = 'receipt-item';
    item.style.animationDelay = Math.min(i * 0.06, 0.4) + 's';
    item.innerHTML =
      '<span class="receipt-item-name">' + SAMPLE_ITEMS[i] + '</span>' +
      '<span class="receipt-item-price-wrap">' +
        '<span class="yen-symbol">¥</span>' +
        '<input type="text" class="receipt-price-input" value="' + price.toLocaleString() + '" readonly tabindex="-1">' +
      '</span>' +
      '<button type="button" class="receipt-item-remove" aria-label="削除">×</button>' +
      '<button type="button" class="receipt-item-undo" aria-label="元に戻す">↺ 元に戻す</button>';
    wrap.appendChild(item);
  }
  applyDigitValue(document.getElementById('receiptTotalNumber'), total, { instant: false, stagger: 80 });
}

function setCount(n) {
  n = Math.max(0, Math.min(MAX_COUNT, Math.floor(n)));
  if (n === currentCount) return;
  currentCount = n;
  applyCounterValue(document.getElementById('itemCountDigits'), n, { instant: false });
  renderItems(n);
  document.getElementById('countInput').value = n;
}

function setPull(px) {
  var container = document.getElementById('itemCountDigits');
  if (!container) return;
  container.style.setProperty('--counter-pull', px.toFixed(1) + 'px');
  var readout = document.getElementById('pullReadout');
  if (readout) readout.textContent = (px > 0 ? '+' : '') + px.toFixed(1) + 'px';
}

window.addEventListener('load', function() {
  buildCounterColumns(document.getElementById('itemCountDigits'), currentCount);
  buildDigitColumns(document.getElementById('receiptTotalNumber'), 0);
  renderItems(currentCount);

  applyCounterCellWidth();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(applyCounterCellWidth);
  }
  window.addEventListener('resize', applyCounterCellWidth);

  document.getElementById('incBtn').addEventListener('click', function() {
    setCount(currentCount + 1);
  });
  document.getElementById('decBtn').addEventListener('click', function() {
    setCount(currentCount - 1);
  });
  document.getElementById('countInput').addEventListener('change', function(e) {
    setCount(parseInt(e.target.value, 10) || 0);
  });

  var slider = document.getElementById('pullSlider');
  if (slider) {
    setPull(parseFloat(slider.value));
    slider.addEventListener('input', function() {
      setPull(parseFloat(slider.value));
    });
  }
});
</script>

</body>
</html>
