<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Hint Positioning — Demo</title>
<style>
  :root {
    --bg-page:       #f5d89a;
    --bg-base:       #fdf3d8;
    --accent:        #c9600a;
    --accent-3:      #7a3208;
    --text-dark:     #231304;
    --text-med:      #3d2410;
    --text-mute:     #5a3818;
    --text-faint:    #7a5028;
    --border:        #e8c88a;
    --border-soft:   #f0d8a0;
    --shadow-warm:   rgba(120, 70, 20, 0.14);
    --glow:          #f7b93c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    color: var(--text-dark);
    background: var(--bg-page);
    overflow: hidden;
  }

  /* ============================================================
     Control panel
     ============================================================ */
  .controls {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(253, 243, 216, 0.94);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 16px 10px 16px;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    letter-spacing: 0.3px;
    color: var(--text-med);
  }
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 6px 14px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .ctrl { display: flex; align-items: center; gap: 6px; }
  .ctrl label {
    flex: 1; color: var(--text-mute);
    letter-spacing: 1px; font-weight: 600;
    white-space: nowrap; font-size: 10px;
  }
  .ctrl input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .ctrl .readout {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px; color: var(--text-mute);
    min-width: 52px; text-align: right;
  }
  .ctrl select {
    flex: 1; font-family: inherit; font-size: 10.5px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    background: #fff; color: var(--text-med);
    border-radius: 5px;
  }
  .ctrl.actions {
    grid-column: 1 / -1;
    justify-content: center; gap: 10px;
    padding-top: 2px;
  }
  .ctrl.actions button {
    font-family: inherit; font-size: 10.5px;
    letter-spacing: 1px; padding: 4px 12px;
    border: 1px solid var(--border);
    background: #fff; color: var(--text-med);
    border-radius: 12px; cursor: pointer;
  }
  .ctrl.actions button:hover { border-color: var(--accent); }

  /* ============================================================
     Receipt screen + paper
     ============================================================ */
  .receipt-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(253, 243, 216, 0.94);
    display: flex; align-items: center; justify-content: center;
    padding: 130px 20px 40px 20px;
    overflow: hidden;
  }

  .receipt-paper {
    max-width: 400px; width: 100%;
    max-height: calc(100vh - 180px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 32px 30px 26px 30px;
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(120, 70, 20, 0.18);
    border: 1px solid var(--border-soft);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    position: relative;
    scroll-behavior: auto;

    background-color: var(--bg-base);
    background-image: url('icons/1790835034553.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  .receipt-header { text-align: center; margin-bottom: 20px; }
  .receipt-thanks {
    font-size: 16px; font-weight: 600; color: var(--accent);
    line-height: 1.9; letter-spacing: 1px; margin-bottom: 12px;
  }
  .receipt-subthanks {
    font-size: 12px; color: var(--text-mute);
    line-height: 1.9; letter-spacing: 0.5px;
  }
  .receipt-to-row {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 14px 8px 10px 8px;
  }
  .receipt-to-mark { font-size: 12px; color: var(--glow); }
  .receipt-to-name {
    font-size: 17px; font-weight: 700; color: var(--accent);
    letter-spacing: 2px;
  }
  .receipt-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
    margin: 18px 0;
  }
  .receipt-title {
    font-size: 11px; color: var(--text-faint);
    letter-spacing: 6px; text-align: center; margin-bottom: 18px;
  }
  .receipt-items {
    display: flex; flex-direction: column; gap: 11px;
    margin-bottom: 8px;
  }
  .receipt-item {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding-bottom: 8px;
    border-bottom: 1px dashed var(--border-soft);
  }
  .receipt-item:last-child { border-bottom: none; padding-bottom: 0; }
  .receipt-item-name {
    flex: 1; font-size: 13px; color: var(--text-med);
  }
  .receipt-item-price-wrap {
    flex-shrink: 0; padding: 3px 9px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid var(--border-soft);
    color: var(--accent); font-weight: 600; font-size: 13px;
  }

  .receipt-total-line {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 4px; margin-top: 10px;
    border-top: 1.5px solid var(--border);
    border-bottom: 1.5px solid var(--border);
  }
  .receipt-total-label {
    font-size: 15px; font-weight: 600; color: var(--text-mute);
    letter-spacing: 4px;
  }
  .receipt-total-value {
    font-size: 18px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.5px;
  }

  .receipt-actions-row {
    position: relative;
    margin-top: 22px;
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    min-height: 90px;
  }
  .receipt-confirm-btn {
    display: block; width: 100%; max-width: 260px;
    background: var(--accent);
    border: 1.5px solid var(--accent);
    color: #fff; font-family: inherit;
    font-size: 12px; font-weight: 600;
    letter-spacing: 2px; padding: 11px 20px;
    border-radius: 22px; cursor: pointer;
  }
  .receipt-back-btn {
    display: block; width: 100%; max-width: 260px;
    background: #fff; border: 1.5px solid var(--border);
    color: var(--accent); font-family: inherit;
    font-size: 12px; font-weight: 600;
    letter-spacing: 2px; padding: 11px 20px;
    border-radius: 22px; cursor: pointer;
  }

  /* ============================================================
     Scroll hints
     ============================================================ */
  .scroll-hint {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    transition: opacity 0.35s ease, background 0.2s ease;
    z-index: 20;
  }
  .scroll-hint:active { background: rgba(255, 255, 255, 0.95); }
  .scroll-hint .hint-arrow {
    display: inline-block;
    animation: hintBounce 2s ease-in-out infinite;
  }
  @keyframes hintBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-hint .hint-arrow { animation: none; }
  }

  .scroll-hint.hidden { opacity: 0; pointer-events: none; }

  /* Sticky mode: fixed-positioned outside the paper */
  .scroll-hint.sticky-mode {
    position: fixed;
    top: auto;
  }
  body.mode-scroll .scroll-hint.sticky-mode { display: none; }

  /* Scroll mode: absolute-positioned inside actions-row */
  .scroll-hint.scroll-mode {
    position: absolute;
    top: auto;
  }
  body.mode-sticky .scroll-hint.scroll-mode { display: none; }

  .readout-bar {
    position: fixed; bottom: 8px; left: 12px; right: 12px;
    z-index: 100;
    display: flex; justify-content: center; gap: 24px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--text-mute);
    background: rgba(253, 243, 216, 0.9);
    padding: 6px 14px; border-radius: 20px;
    pointer-events: none; user-select: none;
    max-width: 700px; margin: 0 auto;
  }
  .readout-bar b { color: var(--accent); font-weight: 700; }
</style>
</head>
<body class="mode-sticky">

<div class="controls">
  <div class="controls-grid">

    <div class="ctrl">
      <label>Position mode</label>
      <select id="posMode">
        <option value="sticky" selected>sticky (visible on open)</option>
        <option value="scroll">scroll with buttons</option>
      </select>
    </div>

    <div class="ctrl">
      <label>X method</label>
      <select id="xMethod">
        <option value="computed" selected>computed (gap / 2)</option>
        <option value="fixed">fixed</option>
      </select>
    </div>

    <div class="ctrl">
      <label>X fixed</label>
      <input type="range" id="xFixed" min="8" max="80" step="2" value="40">
      <span class="readout" id="xFixedV">40 px</span>
    </div>

    <div class="ctrl">
      <label>Tap behaviour</label>
      <select id="tapMode">
        <option value="page" selected>70% of visible height</option>
        <option value="bottom">straight to bottom</option>
        <option value="fixed">fixed 300 px</option>
      </select>
    </div>

    <div class="ctrl">
      <label>Item count</label>
      <input type="range" id="itemCount" min="2" max="20" step="1" value="14">
      <span class="readout" id="itemCountV">14</span>
    </div>

    <div class="ctrl actions">
      <button id="resetBtn">Reset scroll</button>
    </div>

  </div>
</div>

<div class="receipt-screen">
  <div class="receipt-paper" id="receiptPaper">

    <div class="receipt-header">
      <div class="receipt-thanks">ご確認いただきありがとうございます。</div>
      <div class="receipt-subthanks">無理のない範囲でお選びいただき、ありがとうございます。</div>
    </div>

    <div class="receipt-to-row">
      <span class="receipt-to-mark">❀</span>
      <span class="receipt-to-name">桜庭さんへ</span>
      <span class="receipt-to-mark">❀</span>
    </div>

    <div class="receipt-divider"></div>
    <div class="receipt-title">本日の内容</div>

    <div class="receipt-items" id="receiptItems"></div>

    <div class="receipt-total-line">
      <span class="receipt-total-label">合計</span>
      <span class="receipt-total-value" id="receiptTotal">¥0</span>
    </div>

    <div class="receipt-actions-row" id="actionsRow">
      <!-- Scroll-mode hints: sit inside the row, absolute-positioned -->
      <button class="scroll-hint scroll-mode hidden" id="scrollHintL" aria-label="下へスクロール">
        <span class="hint-arrow">↓</span>
      </button>
      <button class="scroll-hint scroll-mode hidden" id="scrollHintR" aria-label="下へスクロール">
        <span class="hint-arrow">↓</span>
      </button>

      <button type="button" class="receipt-confirm-btn" id="primaryBtn">
        こちらの内容でお願いいたします。
      </button>
      <button type="button" class="receipt-back-btn">
        サービスの選択に戻る
      </button>
    </div>

  </div>

  <!-- Sticky-mode hints: fixed-positioned in the receipt-screen -->
  <button class="scroll-hint sticky-mode hidden" id="stickyHintL" aria-label="下へスクロール">
    <span class="hint-arrow">↓</span>
  </button>
  <button class="scroll-hint sticky-mode hidden" id="stickyHintR" aria-label="下へスクロール">
    <span class="hint-arrow">↓</span>
  </button>
</div>

<div class="readout-bar">
  <span>X applied: <b id="xReadout">—</b></span>
  <span>scrollable: <b id="scrollableReadout">—</b></span>
  <span>at bottom: <b id="atBottomReadout">—</b></span>
</div>

<script>
(function() {
  'use strict';

  var paper      = document.getElementById('receiptPaper');
  var actionsRow = document.getElementById('actionsRow');
  var itemsEl    = document.getElementById('receiptItems');
  var totalEl    = document.getElementById('receiptTotal');
  var primaryBtn = document.getElementById('primaryBtn');

  var stickyL = document.getElementById('stickyHintL');
  var stickyR = document.getElementById('stickyHintR');
  var scrollL = document.getElementById('scrollHintL');
  var scrollR = document.getElementById('scrollHintR');

  var posModeEl    = document.getElementById('posMode');
  var xMethodEl    = document.getElementById('xMethod');
  var xFixedEl     = document.getElementById('xFixed');
  var tapModeEl    = document.getElementById('tapMode');
  var itemCountEl  = document.getElementById('itemCount');

  var xFixedV      = document.getElementById('xFixedV');
  var itemCountV   = document.getElementById('itemCountV');
  var xReadout     = document.getElementById('xReadout');
  var scrollableRO = document.getElementById('scrollableReadout');
  var atBottomRO   = document.getElementById('atBottomReadout');

  var HINT_W = 34;

  /* ============================================================
     Items
     ============================================================ */
  var SAMPLE_NAMES = [
    'ダミーテキスト1','ダミーテキスト2','ダミーテキスト3',
    'ダミーテキスト4','ダミーテキスト5','ダミーテキスト6',
    'ダミーテキスト7','ダミーテキスト8','ダミーテキスト9',
    'ダミーテキスト10','ダミーテキスト11','ダミーテキスト12',
    'ダミーテキスト13','ダミーテキスト14','ダミーテキスト15',
    'ダミーテキスト16','ダミーテキスト17','ダミーテキスト18',
    'ダミーテキスト19','ダミーテキスト20'
  ];

  function renderItems(n) {
    itemsEl.innerHTML = '';
    var total = 0;
    for (var i = 0; i < n; i++) {
      var price = 1000 + (i * 500);
      total += price;
      var div = document.createElement('div');
      div.className = 'receipt-item';
      var nm = document.createElement('span');
      nm.className = 'receipt-item-name';
      nm.textContent = SAMPLE_NAMES[i] || ('サービス' + (i + 1));
      var pr = document.createElement('span');
      pr.className = 'receipt-item-price-wrap';
      pr.textContent = '¥' + price.toLocaleString();
      div.appendChild(nm);
      div.appendChild(pr);
      itemsEl.appendChild(div);
    }
    totalEl.textContent = '¥' + total.toLocaleString();
  }

  /* ============================================================
     Position the hints
     ============================================================ */
  function computeX() {
    if (xMethodEl.value === 'fixed') {
      return parseInt(xFixedEl.value, 10);
    }
    /* Computed: half the gap between paper edge and button edge */
    var paperRect  = paper.getBoundingClientRect();
    var buttonRect = primaryBtn.getBoundingClientRect();
    var gap = (paperRect.width - buttonRect.width) / 2;
    return Math.max(8, Math.round(gap / 2));
  }

  function positionHints() {
    var paperRect  = paper.getBoundingClientRect();
    var buttonRect = primaryBtn.getBoundingClientRect();
    var rowRect    = actionsRow.getBoundingClientRect();
    var X = computeX();
    xReadout.textContent = X + ' px';

    /* --- Sticky mode (viewport-relative, fixed positioning) --- */
    /* Horizontal: centre of indicator at paperEdge + X */
    var stickyLX = paperRect.left + X - HINT_W / 2;
    var stickyRX = paperRect.right - X - HINT_W / 2;
    stickyL.style.left = stickyLX + 'px';
    stickyR.style.left = stickyRX + 'px';

    /* Vertical: indicator's bottom X above paper's bottom */
    var stickyB = (window.innerHeight - paperRect.bottom) + X;
    stickyL.style.bottom = stickyB + 'px';
    stickyR.style.bottom = stickyB + 'px';

    /* --- Scroll mode (row-relative, absolute positioning) --- */
    /* Horizontally, we want the same viewport-space position as sticky;
       convert to be relative to the actions row. */
    var scrollLX = (paperRect.left + X) - rowRect.left - HINT_W / 2;
    var scrollRX = (paperRect.right - X) - rowRect.left - HINT_W / 2;
    scrollL.style.left = scrollLX + 'px';
    scrollR.style.left = scrollRX + 'px';

    /* Vertically, anchor X from the row's bottom */
    scrollL.style.bottom = X + 'px';
    scrollR.style.bottom = X + 'px';
  }

  /* ============================================================
     Visibility
     ============================================================ */
  function updateVisibility() {
    var scrollable = paper.scrollHeight > paper.clientHeight + 4;
    var atBottom   = paper.scrollTop + paper.clientHeight >= paper.scrollHeight - 4;
    var show       = scrollable && !atBottom;

    scrollableRO.textContent = scrollable ? 'yes' : 'no';
    atBottomRO.textContent   = atBottom ? 'yes' : 'no';

    [stickyL, stickyR, scrollL, scrollR].forEach(function(el) {
      el.classList.toggle('hidden', !show);
    });
  }

  function updateAll() {
    positionHints();
    updateVisibility();
  }

  /* ============================================================
     Tap behaviour
     ============================================================ */
  function handleHintTap() {
    var mode = tapModeEl.value;
    if (mode === 'page') {
      paper.scrollBy({ top: paper.clientHeight * 0.7, behavior: 'smooth' });
    } else if (mode === 'bottom') {
      paper.scrollTo({ top: paper.scrollHeight, behavior: 'smooth' });
    } else {
      paper.scrollBy({ top: 300, behavior: 'smooth' });
    }
  }

  [stickyL, stickyR, scrollL, scrollR].forEach(function(el) {
    el.addEventListener('click', handleHintTap);
  });

  /* ============================================================
     Event wiring
     ============================================================ */
  paper.addEventListener('scroll', function() {
    updateVisibility();
    /* Scroll-mode hints stay anchored to the row; no reposition needed. */
  }, { passive: true });

  window.addEventListener('resize', updateAll);

  posModeEl.addEventListener('change', function() {
    document.body.classList.toggle('mode-sticky', posModeEl.value === 'sticky');
    document.body.classList.toggle('mode-scroll', posModeEl.value === 'scroll');
    updateAll();
  });

  xMethodEl.addEventListener('change', updateAll);

  xFixedEl.addEventListener('input', function() {
    xFixedV.textContent = xFixedEl.value + ' px';
    updateAll();
  });

  itemCountEl.addEventListener('input', function() {
    itemCountV.textContent = itemCountEl.value;
    renderItems(parseInt(itemCountEl.value, 10));
    requestAnimationFrame(updateAll);
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    paper.scrollTop = 0;
    updateAll();
  });

  /* Re-evaluate position whenever the row's size changes */
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(updateAll);
    ro.observe(paper);
    ro.observe(actionsRow);
  }

  /* ============================================================
     Boot
     ============================================================ */
  renderItems(parseInt(itemCountEl.value, 10));
  xFixedV.textContent = xFixedEl.value + ' px';
  itemCountV.textContent = itemCountEl.value;

  /* Give layout a tick to settle before measuring */
  requestAnimationFrame(function() {
    requestAnimationFrame(updateAll);
  });

})();
</script>

</body>
</html>
