<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Receipt Landing — Diagnostic Demo v2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  /* ============================================================
     DEMO-ONLY CHROME (controls). Not for production.
     ============================================================ */
  .demo-controls {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 6px 24px var(--shadow-rose-2);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 13px;
    color: var(--text-dark);
    max-width: 96vw;
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .demo-label {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .demo-controls button {
    border-radius: 16px;
    border: 1.5px solid var(--border-1);
    background: #fff;
    color: var(--text-dark);
    font-size: 11.5px;
    font-weight: 600;
    padding: 7px 10px;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .demo-controls button:active {
    transform: scale(0.96);
    background: var(--soft-1);
    border-color: var(--accent);
  }
  .demo-controls button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .demo-controls button.run {
    background: var(--text-dark);
    border-color: var(--text-dark);
    color: #fff;
  }
  .demo-controls button.run:active { background: #000; }
  .demo-readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0;
    text-align: center;
    line-height: 1.5;
  }
  .demo-readout strong { color: var(--accent); font-weight: 700; }
  .demo-readout strong.smooth { color: #2a7a3a; }
  .demo-readout strong.stutter { color: #b03030; }
</style>
</head>
<body>

<div class="demo-controls">
  <div class="demo-row">
    <span class="demo-label">AMBIENT:</span>
    <button type="button" class="amb" data-amb="video">Video</button>
    <button type="button" class="amb" data-amb="gradient">Gradient</button>
    <button type="button" class="amb" data-amb="caustics">Caustics</button>
    <button type="button" class="amb" data-amb="motes">Motes</button>
    <button type="button" class="amb" data-amb="track">Carousel track</button>
  </div>
  <div class="demo-row">
    <span class="demo-label">ACTION:</span>
    <button type="button" class="run" id="runBtn">Run landing</button>
    <button type="button" id="clearBtn">Clear all ambient</button>
  </div>
  <div class="demo-readout" id="readout">Toggle ambient layers, then Run. Baseline first.</div>
</div>

<!-- ============================================================
     AMBIENT STAGE — mirrors the real app exactly.
     Hidden until the corresponding toggle is enabled.
     ============================================================ -->
<div class="ambient-stage" id="ambientStage" aria-hidden="true" style="display:none;">
  <div class="ambient-layer ambient-image" id="ambientImage">
    <video class="ambient-video" id="ambientVideo"
           autoplay muted loop playsinline preload="auto">
      <source src="icons/VID-20260929-WA0002.mp4" type="video/mp4">
    </video>
  </div>
  <div class="ambient-layer ambient-primary" id="ambientPrimary"></div>
  <div class="ambient-layer ambient-secondary"></div>
  <div class="ambient-layer caustics caustics-1" id="caustic1"></div>
  <div class="ambient-layer caustics caustics-2" id="caustic2"></div>
  <div class="mote-field" id="moteField"></div>
</div>

<!-- Fake carousel track: matches the real app's 500%-wide will-change
     layer, so we can test whether the persistent promoted layer is
     what eats GPU budget. -->
<div class="stage" id="fakeStage" style="display:none; position:fixed; top:0; left:0; width:100%; height:100vh; z-index:-1; pointer-events:none;">
  <div class="track" id="fakeTrack">
    <div class="panel" data-panel="0"></div>
    <div class="panel" data-panel="1"></div>
    <div class="panel" data-panel="2"></div>
    <div class="panel" data-panel="3"></div>
    <div class="panel" data-panel="4"></div>
  </div>
</div>

<!-- ============================================================
     RECEIPT — same as the real app.
     ============================================================ -->
<div class="receipt-screen visible" id="receiptScreen">
  <div class="receipt-paper-wrap" id="paperWrap">
    <div class="receipt-paper">
      <div class="receipt-header">
        <div class="receipt-thanks">ご確認いただきありがとうございます。</div>
        <div class="receipt-subthanks">無理のない範囲でお選びいただき、ありがとうございます。</div>
      </div>
      <div class="receipt-to-row">
        <span class="receipt-to-mark">❀</span>
        <span class="receipt-to-name">桜庭さんへ</span>
        <span class="receipt-to-mark">❀</span>
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-title">
        <span>本日の内容：</span>
        <span class="item-count">6 項目</span>
      </div>
      <div class="receipt-items" id="receiptItems"></div>

      <div class="receipt-total-line">
        <span class="receipt-total-label">合計</span>
        <span class="receipt-total-value">
          <span class="yen-symbol">¥</span>
          <span id="receiptTotalText">31,500</span>
        </span>
      </div>

      <button type="button" class="receipt-confirm-btn">こちらの内容でお願いいたします。</button>
      <button type="button" class="receipt-back-btn">サービスの選択に戻る</button>

      <div class="receipt-footer">
        <span class="receipt-footer-mark">❀</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SAMPLE ITEMS
   ============================================================ */
var SAMPLE_ITEMS = [
  { name: 'ダミーテキスト1', price: 5000 },
  { name: 'ダミーテキスト2', price: 5500 },
  { name: 'ダミーテキスト3', price: 6000 },
  { name: 'ダミーテキスト4', price: 4500 },
  { name: 'ダミーテキスト5', price: 5000 },
  { name: 'ダミーテキスト6', price: 5500 }
];

function renderItems() {
  var wrap = document.getElementById('receiptItems');
  wrap.innerHTML = '';
  var total = 0;
  for (var i = 0; i < SAMPLE_ITEMS.length; i++) {
    var it = SAMPLE_ITEMS[i];
    total += it.price;
    var div = document.createElement('div');
    div.className = 'receipt-item';
    div.style.animationDelay = Math.min(i * 0.08, 0.4) + 's';
    div.innerHTML =
      '<span class="receipt-item-name">' + it.name + '</span>' +
      '<span class="receipt-item-price-wrap">' +
        '<span class="yen-symbol">¥</span>' +
        '<input type="text" class="receipt-price-input" value="' + it.price.toLocaleString() + '" readonly tabindex="-1">' +
      '</span>';
    wrap.appendChild(div);
  }
  var totalEl = document.getElementById('receiptTotalText');
  if (totalEl) totalEl.textContent = total.toLocaleString();
}

/* ============================================================
   AMBIENT STATE
   ============================================================ */
var ambient = {
  video: false,
  gradient: false,
  caustics: false,
  motes: false,
  track: false
};

function buildMotes() {
  var field = document.getElementById('moteField');
  if (!field) return;
  field.innerHTML = '';
  var count = 8;
  for (var i = 0; i < count; i++) {
    var m = document.createElement('div');
    m.className = 'mote';
    var size = 14 + Math.random() * 16;
    m.style.width = size + 'px';
    m.style.height = size + 'px';
    m.style.left = (Math.random() * 100) + '%';
    m.style.top  = (Math.random() * 100) + '%';
    var dur = 18 + Math.random() * 20;
    m.style.setProperty('--mote-dur', dur + 's');
    m.style.setProperty('--mote-delay', (-Math.random() * dur) + 's');
    m.style.setProperty('--mote-ax', (Math.random() * 26 - 13).toFixed(1) + 'px');
    m.style.setProperty('--mote-ay', (Math.random() * 22 - 11).toFixed(1) + 'px');
    m.style.setProperty('--mote-peak', (0.16 + Math.random() * 0.22).toFixed(2));
    field.appendChild(m);
  }
}

function applyAmbient() {
  var stage = document.getElementById('ambientStage');
  var img = document.getElementById('ambientImage');
  var primary = document.getElementById('ambientPrimary');
  var c1 = document.getElementById('caustic1');
  var c2 = document.getElementById('caustic2');
  var moteField = document.getElementById('moteField');
  var fakeStage = document.getElementById('fakeStage');

  var anyAmbient = ambient.video || ambient.gradient || ambient.caustics || ambient.motes;
  stage.style.display = anyAmbient ? '' : 'none';

  /* Video */
  img.style.display = ambient.video ? '' : 'none';
  var video = document.getElementById('ambientVideo');
  if (video) {
    if (ambient.video) {
      var p = video.play();
      if (p && typeof p.catch === 'function') p.catch(function() {});
      /* Force the autumn theme to show the video (same as real app). */
      document.documentElement.setAttribute('data-theme', 'autumn');
    } else {
      try { video.pause(); } catch (e) {}
    }
  }

  /* Gradient */
  primary.style.display = ambient.gradient ? '' : 'none';

  /* Caustics */
  c1.style.display = ambient.caustics ? '' : 'none';
  c2.style.display = ambient.caustics ? '' : 'none';

  /* Motes */
  if (ambient.motes) {
    buildMotes();
    moteField.style.display = '';
  } else {
    moteField.innerHTML = '';
    moteField.style.display = 'none';
  }

  /* Carousel track */
  fakeStage.style.display = ambient.track ? '' : 'none';
}

/* ============================================================
   FRAME COUNTER
   ============================================================ */
var frameRafId = null;
var frameDeltas = [];
var frameStartTime = 0;

function startFrameCount() {
  frameDeltas = [];
  frameStartTime = performance.now();
  var last = frameStartTime;
  function tick(now) {
    frameDeltas.push(now - last);
    last = now;
    frameRafId = requestAnimationFrame(tick);
  }
  frameRafId = requestAnimationFrame(tick);
}

function stopFrameCount() {
  if (frameRafId) cancelAnimationFrame(frameRafId);
  frameRafId = null;
  if (frameDeltas.length < 2) return null;
  var sum = 0, worst = 0;
  for (var i = 1; i < frameDeltas.length; i++) {
    sum += frameDeltas[i];
    if (frameDeltas[i] > worst) worst = frameDeltas[i];
  }
  var avgMs = sum / (frameDeltas.length - 1);
  var over20 = 0, over33 = 0;
  for (var j = 1; j < frameDeltas.length; j++) {
    if (frameDeltas[j] > 20) over20++;
    if (frameDeltas[j] > 33) over33++;
  }
  return {
    frames: frameDeltas.length - 1,
    avgMs: avgMs,
    avgFps: 1000 / avgMs,
    worstMs: worst,
    over20: over20,
    over33: over33
  };
}

/* ============================================================
   RUN LANDING WITH CURRENT AMBIENT STATE
   ============================================================ */
function runLanding() {
  var paperWrap = document.getElementById('paperWrap');
  var readout = document.getElementById('readout');
  if (!paperWrap) return;

  paperWrap.classList.remove('landing');
  void paperWrap.offsetWidth;

  var active = [];
  if (ambient.video) active.push('video');
  if (ambient.gradient) active.push('gradient');
  if (ambient.caustics) active.push('caustics');
  if (ambient.motes) active.push('motes');
  if (ambient.track) active.push('track');
  var label = active.length ? active.join('+') : 'baseline';

  readout.textContent = 'running: ' + label + ' — measuring…';

  startFrameCount();
  void paperWrap.offsetWidth;
  paperWrap.classList.add('landing');

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    paperWrap.removeEventListener('animationend', finish);
    paperWrap.classList.remove('landing');

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var r = stopFrameCount();
        if (!r) { readout.textContent = 'no frames captured'; return; }

        var verdict, cls;
        if (r.over33 === 0 && r.avgMs < 22) { verdict = 'SMOOTH'; cls = 'smooth'; }
        else if (r.over33 > 3) { verdict = 'STUTTER'; cls = 'stutter'; }
        else { verdict = 'borderline'; cls = ''; }

        readout.innerHTML =
          '<strong>' + label + '</strong>' +
          ' · avg <strong>' + r.avgFps.toFixed(1) + '</strong> fps' +
          ' · frame <strong>' + r.avgMs.toFixed(1) + '</strong> ms' +
          ' · worst <strong>' + r.worstMs.toFixed(1) + '</strong> ms' +
          ' · &gt;20ms: <strong>' + r.over20 + '</strong>' +
          ' · &gt;33ms: <strong>' + r.over33 + '</strong>' +
          ' · <strong class="' + cls + '">' + verdict + '</strong>';
      });
    });
  }

  paperWrap.addEventListener('animationend', finish);
  setTimeout(finish, 2600);
}

/* ============================================================
   WIRING
   ============================================================ */
document.querySelectorAll('.amb[data-amb]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var key = btn.getAttribute('data-amb');
    ambient[key] = !ambient[key];
    btn.classList.toggle('active', ambient[key]);
    applyAmbient();
  });
});

document.getElementById('runBtn').addEventListener('click', runLanding);

document.getElementById('clearBtn').addEventListener('click', function() {
  ambient.video = false;
  ambient.gradient = false;
  ambient.caustics = false;
  ambient.motes = false;
  ambient.track = false;
  document.querySelectorAll('.amb[data-amb]').forEach(function(b) {
    b.classList.remove('active');
  });
  applyAmbient();
});

window.addEventListener('load', function() {
  renderItems();
  applyAmbient();
});
</script>

</body>
</html>
