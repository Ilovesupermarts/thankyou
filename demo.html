<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dual-Layer Audio Reactive Swell Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    background-color: var(--bg-base);
  }

  /* LAYER 1: audio-reactive diffuse mesh, unmasked, full viewport. */
  .layer-diffuse {
    filter: brightness(calc(1 + var(--audio-swell, 0) * var(--ctrl-bright-boost, 0.22)))
            saturate(calc(1 + var(--audio-swell, 0) * var(--ctrl-sat-boost, 0.20)));
    will-change: transform, filter;
  }

  .layer-diffuse .ambient-mesh {
    opacity: calc(var(--ctrl-mesh-base, 0.55) + var(--audio-swell, 0) * var(--ctrl-mesh-swell, 0.45)) !important;
    transition: opacity 100ms ease-out;
  }

  .layer-diffuse .orb-1 {
    transform: scale(calc(1 + var(--audio-swell, 0) * var(--ctrl-orb-scale, 0.28))) !important;
    transition: transform 120ms ease-out;
  }
  .layer-diffuse .orb-2 {
    transform: scale(calc(1 + var(--audio-swell, 0) * (var(--ctrl-orb-scale, 0.28) * 1.15))) !important;
    transition: transform 120ms ease-out;
  }
  .layer-diffuse .orb-3 {
    transform: scale(calc(1 + var(--audio-swell, 0) * (var(--ctrl-orb-scale, 0.28) * 0.90))) !important;
    transition: transform 120ms ease-out;
  }

  /* ============================================================
     LAYER 2: the same mesh, mirrored horizontally, masked by the
     Shippō tile.

     Two nested masks produce the final reveal:

       · .shippo-mask-window carries the Shippō tile mask. Same
         60×60 tile, same 1.7 stroke, same (0,0) grid position as
         .ambient-mosaic. Layer 2's content shows through only
         where the tile has strokes.

       · .ambient-stage.layer-mirrored (the inner element) carries
         a radial mask centred on the viewport. The reveal fades
         from full at centre to nothing by the edges, so the
         masked effect radiates outward from screen centre.

     Nested masks multiply: Layer 2's visible content = tile
     strokes ∩ centre ellipse. No paint layer, no filter — the
     flicker source from the previous version is gone.

     No opacity control on this wrapper. Layer 2 runs at full
     opacity and simply adds its mirrored mesh inside the line
     positions. The base mosaic underneath is always visible.

     Colour: shibu-kaki (deep persimmon) palette applied by
     overriding the mesh's own gradient stops further down, not
     by a CSS filter. No offscreen composite, no flicker. */
  .shippo-mask-window {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;
    overflow: hidden;

    -webkit-mask-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='60'%20viewBox='0%200%2060%2060'%3E%3Cg%20fill='none'%20stroke='white'%20stroke-width='1.7'%3E%3Ccircle%20cx='0'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='0'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='30'%20cy='30'%20r='30'/%3E%3C/g%3E%3C/svg%3E");
    -webkit-mask-repeat: repeat;
    -webkit-mask-size: 60px 60px;
    -webkit-mask-position: 0 0;
    mask-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='60'%20viewBox='0%200%2060%2060'%3E%3Cg%20fill='none'%20stroke='white'%20stroke-width='1.7'%3E%3Ccircle%20cx='0'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='0'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='30'%20cy='30'%20r='30'/%3E%3C/g%3E%3C/svg%3E");
    mask-repeat: repeat;
    mask-size: 60px 60px;
    mask-position: 0 0;

    opacity: 1.0;
  }

  .shippo-mask-window .ambient-stage.layer-mirrored {
    position: absolute;
    top: -25%; left: -25%;
    width: 150%; height: 150%;
    transform-origin: 50% 50%;
    transform: scaleX(-1);
    pointer-events: none;
    will-change: transform;

    /* Centre-weighted reveal. Symmetric radial, so the mirror flip
       does not shift it off-centre. */
    -webkit-mask-image: radial-gradient(ellipse 60% 66% at 50% 50%,
        black 0%, black 30%, rgba(0,0,0,0.55) 60%, transparent 92%);
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    -webkit-mask-position: 0 0;
    mask-image: radial-gradient(ellipse 60% 66% at 50% 50%,
        black 0%, black 30%, rgba(0,0,0,0.55) 60%, transparent 92%);
    mask-repeat: no-repeat;
    mask-size: 100% 100%;
    mask-position: 0 0;
  }

  .shippo-mask-window .ambient-mesh {
    opacity: 1.0 !important;
  }

  .shippo-mask-window.disabled {
    display: none !important;
  }

  /* ---- Shibu-kaki colour override for Layer 2's mesh only ---- */
  html[data-theme="autumn"] .shippo-mask-window .ambient-primary {
    background:
      radial-gradient(circle at 25% 30%, rgba(168, 66, 10, 0.85) 0%, rgba(168, 66, 10, 0.40) 30%, rgba(168, 66, 10, 0) 60%),
      radial-gradient(circle at 75% 40%, rgba(201, 96, 10, 0.80) 0%, rgba(201, 96, 10, 0.38) 32%, rgba(201, 96, 10, 0) 62%),
      radial-gradient(circle at 50% 70%, rgba(143, 47, 0, 0.72) 0%, rgba(143, 47, 0, 0.34) 28%, rgba(143, 47, 0, 0) 58%),
      radial-gradient(circle at 20% 85%, rgba(107, 47, 14, 0.55) 0%, rgba(107, 47, 14, 0.26) 26%, rgba(107, 47, 14, 0) 56%),
      radial-gradient(circle at 80% 90%, rgba(107, 31, 10, 0.45) 0%, rgba(107, 31, 10, 0.20) 25%, rgba(107, 31, 10, 0) 54%),
      radial-gradient(circle at 65% 25%, rgba(143, 47, 0, 0.30) 0%, rgba(107, 47, 14, 0.16) 35%, rgba(107, 47, 14, 0) 65%);
  }
  html[data-theme="autumn"] .shippo-mask-window .orb-1 {
    background: radial-gradient(circle, rgba(168, 66, 10, 0.50) 0%, rgba(201, 96, 10, 0.18) 42%, transparent 70%);
  }
  html[data-theme="autumn"] .shippo-mask-window .orb-2 {
    background: radial-gradient(circle, rgba(143, 47, 0, 0.68) 0%, rgba(143, 47, 0, 0.41) 48%, transparent 72%);
  }
  html[data-theme="autumn"] .shippo-mask-window .orb-3 {
    background: radial-gradient(circle, rgba(168, 66, 10, 0.28) 0%, rgba(180, 82, 24, 0.48) 39%, transparent 60%);
  }

  /* ---- HUD ---- */
  .hud-container {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 330px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: rgba(253, 243, 216, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1.5px solid rgba(143, 47, 0, 0.32);
    border-radius: 20px;
    box-shadow: 0 14px 40px rgba(100, 35, 10, 0.22);
    padding: 18px 20px;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    color: #231304;
    box-sizing: border-box;
  }

  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(143, 47, 0, 0.18);
    padding-bottom: 10px;
  }

  .hud-title {
    font-size: 15px;
    font-weight: 700;
    color: #8f2f00;
    letter-spacing: 0.8px;
    margin: 0;
  }

  .hud-section-divider {
    font-size: 11px;
    font-weight: 700;
    color: #8f2f00;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 16px 0 10px 0;
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(143, 47, 0, 0.25);
  }

  .hud-group {
    margin-bottom: 12px;
  }

  .hud-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: #5a3818;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }

  .hud-val {
    color: #8f2f00;
    font-weight: 700;
  }

  .hud-slider {
    width: 100%;
    margin: 0;
    accent-color: #c9600a;
    cursor: pointer;
  }

  .vu-meter-wrap {
    height: 10px;
    background: rgba(143, 47, 0, 0.12);
    border-radius: 5px;
    overflow: hidden;
    margin-top: 4px;
  }

  .vu-meter-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e59b24, #c9600a, #8f2229);
    border-radius: 5px;
    transition: width 50ms linear;
  }

  .hud-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .hud-btn {
    background: #c9600a;
    border: none;
    color: #fff;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    text-align: center;
  }

  .hud-btn:active {
    transform: scale(0.97);
    background: #8f2f00;
  }

  .hud-btn.secondary {
    background: rgba(255, 255, 255, 0.8);
    color: #8f2f00;
    border: 1px solid rgba(143, 47, 0, 0.25);
  }

  .hud-btn.toggle-active {
    background: #8f2f00;
    color: #fff;
  }

  .center-label {
    position: absolute;
    top: 50%;
    left: 45%;
    transform: translate(-50%, -50%);
    font-family: "Shippori Mincho", serif;
    font-size: 26px;
    color: #8f2f00;
    letter-spacing: 8px;
    pointer-events: none;
    text-align: center;
    opacity: 0.85;
    text-shadow: 0 2px 14px rgba(253, 243, 216, 0.95);
  }
</style>

<script>
  var TRACKS = [
    { name: 'Morning', url: 'Sound/Morning.mp3' },
    { name: 'Early Evening', url: 'Sound/Earlyevening.mp3' }
  ];
  var currentTrackIdx = 0;

  var audioCtx = null;
  var audioSourceNode = null;
  var audioGainNode = null;
  var analyserNode = null;
  var isPlaying = false;

  var audioEl = new Audio();
  audioEl.loop = true;
  audioEl.crossOrigin = 'anonymous';

  var swellEnergy = 0.0;
  var rafId = null;
  var freqData = new Uint8Array(256);

  var config = {
    gainMult: 1.6,
    noiseFloor: 35,
    attack: 0.14,
    decay: 0.035,
    orbScale: 0.28,
    meshBase: 0.55,
    meshSwell: 0.45,
    brightBoost: 0.22,
    satBoost: 0.20
  };

  var stageDiffuse = document.getElementById('stageDiffuse');
  var stageLattice = document.getElementById('stageLattice');
  var btnPlayPause = document.getElementById('btnPlayPause');
  var btnToggleTrack = document.getElementById('btnToggleTrack');
  var btnToggleLattice = document.getElementById('btnToggleLattice');
  var btnSoloLattice = document.getElementById('btnSoloLattice');
  var statusIndicator = document.getElementById('statusIndicator');
  var valSwellEnergy = document.getElementById('valSwellEnergy');
  var vuMeterBar = document.getElementById('vuMeterBar');

  var latticeEnabled = true;
  var soloLattice = false;

  function initAudioPipeline() {
    if (audioCtx) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();

    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 512;
    analyserNode.smoothingTimeConstant = 0.8;

    audioGainNode = audioCtx.createGain();
    audioGainNode.gain.value = 0.8;

    audioSourceNode = audioCtx.createMediaElementSource(audioEl);
    audioSourceNode.connect(analyserNode);
    analyserNode.connect(audioGainNode);
    audioGainNode.connect(audioCtx.destination);
  }

  function startSwellLoop() {
    if (rafId) cancelAnimationFrame(rafId);

    function tick() {
      if (!isPlaying || !analyserNode) {
        swellEnergy += (0 - swellEnergy) * 0.05;
        applySwellToCSS(swellEnergy);
        if (swellEnergy > 0.005) {
          rafId = requestAnimationFrame(tick);
        } else {
          applySwellToCSS(0);
          rafId = null;
        }
        return;
      }

      analyserNode.getByteFrequencyData(freqData);

      var sum = 0;
      var count = 30;
      for (var i = 4; i < 34; i++) {
        sum += freqData[i];
      }
      var avg = sum / count;

      var clean = Math.max(0, avg - config.noiseFloor);
      var normalized = Math.min(1.0, (clean / (140 / config.gainMult)));
      var target = Math.pow(normalized, 1.35);

      if (target > swellEnergy) {
        swellEnergy += (target - swellEnergy) * config.attack;
      } else {
        swellEnergy += (target - swellEnergy) * config.decay;
      }

      applySwellToCSS(swellEnergy);

      valSwellEnergy.textContent = swellEnergy.toFixed(2);
      vuMeterBar.style.width = (swellEnergy * 100).toFixed(1) + '%';

      rafId = requestAnimationFrame(tick);
    }

    rafId = requestAnimationFrame(tick);
  }

  function applySwellToCSS(val) {
    var vStr = val.toFixed(3);
    if (stageDiffuse) stageDiffuse.style.setProperty('--audio-swell', vStr);
    if (stageLattice) stageLattice.style.setProperty('--audio-swell', vStr);
  }

  function applyConfigToCSS() {
    [stageDiffuse, stageLattice].forEach(function(el) {
      if (!el) return;
      el.style.setProperty('--ctrl-orb-scale', config.orbScale);
      el.style.setProperty('--ctrl-mesh-base', config.meshBase);
      el.style.setProperty('--ctrl-mesh-swell', config.meshSwell);
      el.style.setProperty('--ctrl-bright-boost', config.brightBoost);
      el.style.setProperty('--ctrl-sat-boost', config.satBoost);
    });
  }

  btnPlayPause.addEventListener('click', function() {
    initAudioPipeline();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (!isPlaying) {
      if (!audioEl.src) {
        audioEl.src = TRACKS[currentTrackIdx].url;
      }
      audioEl.play().then(function() {
        isPlaying = true;
        btnPlayPause.textContent = 'Pause Music';
        statusIndicator.textContent = 'PLAYING';
        statusIndicator.style.color = '#c9600a';
        startSwellLoop();
      }).catch(function() {
        alert('Audio play error: Ensure audio files exist in Sound/ folder.');
      });
    } else {
      audioEl.pause();
      isPlaying = false;
      btnPlayPause.textContent = 'Play Music';
      statusIndicator.textContent = 'PAUSED';
      statusIndicator.style.color = '#8f2f00';
    }
  });

  btnToggleTrack.addEventListener('click', function() {
    currentTrackIdx = (currentTrackIdx + 1) % TRACKS.length;
    var t = TRACKS[currentTrackIdx];
    btnToggleTrack.textContent = t.name + '.mp3';
    var wasPlaying = isPlaying;
    audioEl.src = t.url;
    if (wasPlaying) {
      audioEl.play();
    }
  });

  btnToggleLattice.addEventListener('click', function() {
    latticeEnabled = !latticeEnabled;
    btnToggleLattice.classList.toggle('toggle-active', latticeEnabled);
    btnToggleLattice.textContent = latticeEnabled ? 'Layer 2: On' : 'Layer 2: Off';
    stageLattice.classList.toggle('disabled', !latticeEnabled);
  });

  /* Solo Layer 2: hide Layer 1 so only the base mosaic + Layer 2's
     masked motion is visible. The base mosaic stays — it is the
     pattern, always visible, per design. */
  btnSoloLattice.addEventListener('click', function() {
    soloLattice = !soloLattice;
    btnSoloLattice.classList.toggle('toggle-active', soloLattice);
    btnSoloLattice.textContent = soloLattice ? 'Unsolo Layer 2' : 'Solo Layer 2';
    stageDiffuse.style.display = soloLattice ? 'none' : '';
    if (soloLattice && !latticeEnabled) {
      btnToggleLattice.click();
    }
  });

  function bindSlider(id, key, valElId, formatter, cssUpdater) {
    var s = document.getElementById(id);
    var v = document.getElementById(valElId);
    s.addEventListener('input', function() {
      var val = parseFloat(s.value);
      config[key] = val;
      if (formatter) v.textContent = formatter(val);
      else v.textContent = val;
      if (cssUpdater) cssUpdater(val);
      applyConfigToCSS();
    });
  }

  bindSlider('sliderGainMult', 'gainMult', 'valGainMult', function(v){ return v.toFixed(1) + 'x'; });
  bindSlider('sliderNoiseFloor', 'noiseFloor', 'valNoiseFloor', function(v){ return v; });
  bindSlider('sliderAttack', 'attack', 'valAttack', function(v){ return v.toFixed(2); });
  bindSlider('sliderDecay', 'decay', 'valDecay', function(v){ return v.toFixed(3); });
  bindSlider('sliderOrbScale', 'orbScale', 'valOrbScale', function(v){ return '+' + Math.round(v * 100) + '%'; });
  bindSlider('sliderMeshBase', 'meshBase', 'valMeshBase', function(v){
    config.meshSwell = parseFloat((1 - v).toFixed(2));
    return v.toFixed(2);
  });
  bindSlider('sliderBrightBoost', 'brightBoost', 'valBrightBoost', function(v){ return '+' + Math.round(v * 100) + '%'; });

  applyConfigToCSS();
</script>
</body>
</html>
