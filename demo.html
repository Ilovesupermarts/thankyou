<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dual-Layer Audio Reactive Swell Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">

<style>
  body {
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    background-color: var(--bg-base);
  }

  /* ------------------------------------------------------------
     LAYER 1: Diffuse Base Mesh
     Native @keyframes orbDrift1-3 and autumnDrift1 run unhindered.
     ------------------------------------------------------------ */
  .layer-diffuse {
    z-index: -3 !important;
    filter: brightness(calc(1 + var(--audio-swell, 0) * 0.16));
    will-change: transform, filter;
  }

  .layer-diffuse .ambient-mesh {
    opacity: calc(0.60 + var(--audio-swell, 0) * 0.40) !important;
    transform: scale(calc(1 + var(--audio-swell, 0) * 0.08));
    transform-origin: 50% 50%;
    transition: opacity 120ms ease-out, transform 160ms ease-out;
  }

  /* ------------------------------------------------------------
     LAYER 2: Mirrored & Shippō-Masked Lattice
     Aligned to (0, 0), delicate 2.2px lines, warm amber palette.
     ------------------------------------------------------------ */
  .shippo-mask-window {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;
    overflow: hidden;

    /* 2.2px Shippō mask, locked to viewport (0, 0) */
    -webkit-mask-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='60'%20viewBox='0%200%2060%2060'%3E%3Cg%20fill='none'%20stroke='white'%20stroke-width='2.2'%3E%3Ccircle%20cx='0'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='0'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='30'%20cy='30'%20r='30'/%3E%3C/g%3E%3C/svg%3E");
    -webkit-mask-repeat: repeat;
    -webkit-mask-size: 60px 60px;
    -webkit-mask-position: 0 0;
    mask-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='60'%20viewBox='0%200%2060%2060'%3E%3Cg%20fill='none'%20stroke='white'%20stroke-width='2.2'%3E%3Ccircle%20cx='0'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='0'%20r='30'/%3E%3Ccircle%20cx='0'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='60'%20cy='60'%20r='30'/%3E%3Ccircle%20cx='30'%20cy='30'%20r='30'/%3E%3C/g%3E%3C/svg%3E");
    mask-repeat: repeat;
    mask-size: 60px 60px;
    mask-position: 0 0;

    /* Driven purely by opacity: 0.30 resting -> 0.90 peak swell */
    opacity: calc(var(--ctrl-lattice-base, 0.30) + var(--audio-swell, 0) * var(--ctrl-lattice-swell, 0.60));
    filter: brightness(calc(1.0 + var(--audio-swell, 0) * 0.15));
    transition: opacity 120ms ease-out;
  }

  .shippo-mask-window .stage-mirrored {
    position: absolute;
    top: -25%; left: -25%;
    width: 150%; height: 150%;
    transform-origin: 50% 50%;
    transform: scaleX(-1);
    pointer-events: none;
  }

  .shippo-mask-window .ambient-mesh {
    opacity: 1.0 !important;
  }

  /* Warm Amber, Persimmon, and Cinnabar (No Neon Yellow) */
  .shippo-mask-window .orb-1 {
    background: radial-gradient(circle, rgba(224, 110, 28, 0.75) 0%, rgba(195, 80, 20, 0.30) 45%, transparent 70%) !important;
  }

  .shippo-mask-window .orb-2 {
    background: radial-gradient(circle, rgba(210, 95, 24, 0.80) 0%, rgba(180, 65, 18, 0.35) 48%, transparent 72%) !important;
  }

  .shippo-mask-window .orb-3 {
    background: radial-gradient(circle, rgba(220, 105, 26, 0.68) 0%, rgba(170, 60, 15, 0.28) 40%, transparent 60%) !important;
  }

  .shippo-mask-window .ambient-primary {
    background:
      radial-gradient(circle at 25% 30%, rgba(225, 115, 28, 0.70) 0%, transparent 55%),
      radial-gradient(circle at 75% 40%, rgba(195, 80, 20, 0.65) 0%, transparent 58%),
      radial-gradient(circle at 50% 70%, rgba(175, 65, 18, 0.60) 0%, transparent 52%),
      radial-gradient(circle at 20% 85%, rgba(140, 45, 12, 0.50) 0%, transparent 50%) !important;
    opacity: 0.90 !important;
  }

  .shippo-mask-window.disabled {
    display: none !important;
  }

  /* ------------------------------------------------------------
     HUD Control Panel
     ------------------------------------------------------------ */
  .hud-container {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 310px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: rgba(253, 243, 216, 0.92);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1.5px solid rgba(143, 47, 0, 0.32);
    border-radius: 20px;
    box-shadow: 0 14px 40px rgba(100, 35, 10, 0.22);
    padding: 16px 18px;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    color: #231304;
    box-sizing: border-box;
  }

  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(143, 47, 0, 0.18);
    padding-bottom: 8px;
  }

  .hud-title {
    font-size: 14px;
    font-weight: 700;
    color: #8f2f00;
    letter-spacing: 0.8px;
    margin: 0;
  }

  .hud-section-divider {
    font-size: 10.5px;
    font-weight: 700;
    color: #8f2f00;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin: 14px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(143, 47, 0, 0.25);
  }

  .hud-group {
    margin-bottom: 10px;
  }

  .hud-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: #5a3818;
    margin-bottom: 4px;
  }

  .hud-val {
    color: #8f2f00;
    font-weight: 700;
  }

  .hud-slider {
    width: 100%;
    margin: 0;
    accent-color: #c9600a;
    cursor: pointer;
  }

  .vu-meter-wrap {
    height: 8px;
    background: rgba(143, 47, 0, 0.12);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }

  .vu-meter-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e59b24, #c9600a, #8f2229);
    border-radius: 4px;
    transition: width 40ms linear;
  }

  .hud-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .hud-btn {
    background: #c9600a;
    border: none;
    color: #fff;
    padding: 8px 10px;
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    text-align: center;
  }

  .hud-btn:active {
    transform: scale(0.97);
    background: #8f2f00;
  }

  .hud-btn.secondary {
    background: rgba(255, 255, 255, 0.85);
    color: #8f2f00;
    border: 1px solid rgba(143, 47, 0, 0.25);
  }

  .hud-btn.toggle-active {
    background: #8f2f00;
    color: #fff;
  }

  .center-label {
    position: absolute;
    top: 50%;
    left: 45%;
    transform: translate(-50%, -50%);
    font-family: "Shippori Mincho", serif;
    font-size: 26px;
    color: #8f2f00;
    letter-spacing: 8px;
    pointer-events: none;
    text-align: center;
    opacity: 0.85;
    text-shadow: 0 2px 14px rgba(253, 243, 216, 0.95);
  }
</style>
</head>

<div class="center-label">双層・七宝調律室</div>

<!-- HUD -->
<div class="hud-container">
  <div class="hud-header">
    <h3 class="hud-title">Dual Swell Tuner</h3>
    <span id="statusIndicator" style="font-size: 11px; font-weight: 700; color: #8f2f00;">PAUSED</span>
  </div>

  <div class="hud-btn-row">
    <button class="hud-btn" id="btnPlayPause">Play Music</button>
    <button class="hud-btn secondary" id="btnToggleTrack">Morning.mp3</button>
  </div>

  <div class="hud-btn-row">
    <button class="hud-btn secondary toggle-active" id="btnToggleLattice">Layer 2: On</button>
    <button class="hud-btn secondary" id="btnSoloLattice">Solo Layer 2</button>
  </div>

  <button class="hud-btn secondary" id="btnSimulateSwell" style="width: 100%; margin-bottom: 8px;">Simulate Swell (Hold)</button>

  <div class="hud-group">
    <div class="hud-label">
      <span>Audio Swell Energy</span>
      <span class="hud-val" id="valSwellEnergy">0.00</span>
    </div>
    <div class="vu-meter-wrap">
      <div class="vu-meter-bar" id="vuMeterBar"></div>
    </div>
  </div>

  <div class="hud-section-divider">Layer 2: Shippō Lines</div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Line Base Opacity</span>
      <span class="hud-val" id="valLatticeBase">0.30</span>
    </div>
    <input type="range" class="hud-slider" id="sliderLatticeBase" min="0.05" max="0.60" step="0.01" value="0.30">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Line Peak Swell</span>
      <span class="hud-val" id="valLatticeSwell">0.60</span>
    </div>
    <input type="range" class="hud-slider" id="sliderLatticeSwell" min="0.20" max="0.80" step="0.02" value="0.60">
  </div>

  <div class="hud-section-divider">Audio Envelope Engine</div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Sensitivity Multiplier</span>
      <span class="hud-val" id="valGainMult">1.6x</span>
    </div>
    <input type="range" class="hud-slider" id="sliderGainMult" min="0.5" max="3.5" step="0.1" value="1.6">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Noise Floor Gate</span>
      <span class="hud-val" id="valNoiseFloor">35</span>
    </div>
    <input type="range" class="hud-slider" id="sliderNoiseFloor" min="10" max="80" step="1" value="35">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Inhale Speed (Attack)</span>
      <span class="hud-val" id="valAttack">0.14</span>
    </div>
    <input type="range" class="hud-slider" id="sliderAttack" min="0.04" max="0.35" step="0.01" value="0.14">
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Exhale Speed (Decay)</span>
      <span class="hud-val" id="valDecay">0.035</span>
    </div>
    <input type="range" class="hud-slider" id="sliderDecay" min="0.005" max="0.08" step="0.005" value="0.035">
  </div>
</div>

<script>
  var TRACKS = [
    { name: 'Morning', url: 'Sound/Morning.mp3' },
    { name: 'Early Evening', url: 'Sound/Earlyevening.mp3' }
  ];
  var currentTrackIdx = 0;

  var audioCtx = null;
  var audioSourceNode = null;
  var audioGainNode = null;
  var analyserNode = null;
  var isPlaying = false;
  var isSimulating = false;

  var audioEl = new Audio();
  audioEl.loop = true;
  audioEl.crossOrigin = 'anonymous';

  var swellEnergy = 0.0;
  var rafId = null;
  var freqData = new Uint8Array(256);

  var config = {
    latticeBase: 0.30,
    latticeSwell: 0.60,
    gainMult: 1.6,
    noiseFloor: 35,
    attack: 0.14,
    decay: 0.035
  };

  var stageDiffuse = document.getElementById('stageDiffuse');
  var stageLattice = document.getElementById('stageLattice');
  var btnPlayPause = document.getElementById('btnPlayPause');
  var btnToggleTrack = document.getElementById('btnToggleTrack');
  var btnToggleLattice = document.getElementById('btnToggleLattice');
  var btnSoloLattice = document.getElementById('btnSoloLattice');
  var btnSimulateSwell = document.getElementById('btnSimulateSwell');
  var statusIndicator = document.getElementById('statusIndicator');
  var valSwellEnergy = document.getElementById('valSwellEnergy');
  var vuMeterBar = document.getElementById('vuMeterBar');

  var latticeEnabled = true;
  var soloLattice = false;

  function initAudioPipeline() {
    if (audioCtx) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();

    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 512;
    analyserNode.smoothingTimeConstant = 0.82;

    audioGainNode = audioCtx.createGain();
    audioGainNode.gain.value = 0.8;

    audioSourceNode = audioCtx.createMediaElementSource(audioEl);
    audioSourceNode.connect(analyserNode);
    analyserNode.connect(audioGainNode);
    audioGainNode.connect(audioCtx.destination);
  }

  function startSwellLoop() {
    if (rafId) cancelAnimationFrame(rafId);

    function tick() {
      var target = 0;

      if (isSimulating) {
        target = 1.0;
      } else if (isPlaying && analyserNode) {
        analyserNode.getByteFrequencyData(freqData);

        var sum = 0;
        var count = 30;
        for (var i = 4; i < 34; i++) {
          sum += freqData[i];
        }
        var avg = sum / count;

        var clean = Math.max(0, avg - config.noiseFloor);
        var normalized = Math.min(1.0, (clean / (140 / config.gainMult)));
        target = Math.pow(normalized, 1.35);
      }

      // Attack / Decay filter
      if (target > swellEnergy) {
        swellEnergy += (target - swellEnergy) * config.attack;
      } else {
        swellEnergy += (target - swellEnergy) * config.decay;
      }

      applySwell(swellEnergy);

      valSwellEnergy.textContent = swellEnergy.toFixed(2);
      vuMeterBar.style.width = (swellEnergy * 100).toFixed(1) + '%';

      if (isPlaying || isSimulating || swellEnergy > 0.005) {
        rafId = requestAnimationFrame(tick);
      } else {
        applySwell(0);
        rafId = null;
      }
    }

    rafId = requestAnimationFrame(tick);
  }

  function applySwell(val) {
    var vStr = val.toFixed(3);
    if (stageDiffuse) stageDiffuse.style.setProperty('--audio-swell', vStr);
    if (stageLattice) stageLattice.style.setProperty('--audio-swell', vStr);
  }

  function applyConfig() {
    if (stageLattice) {
      stageLattice.style.setProperty('--ctrl-lattice-base', config.latticeBase);
      stageLattice.style.setProperty('--ctrl-lattice-swell', config.latticeSwell);
    }
  }

  btnPlayPause.addEventListener('click', function() {
    initAudioPipeline();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (!isPlaying) {
      if (!audioEl.src) {
        audioEl.src = TRACKS[currentTrackIdx].url;
      }
      audioEl.play().then(function() {
        isPlaying = true;
        btnPlayPause.textContent = 'Pause Music';
        statusIndicator.textContent = 'PLAYING';
        statusIndicator.style.color = '#c9600a';
        startSwellLoop();
      }).catch(function() {
        alert('Could not start playback. Verify that Sound/Morning.mp3 is available.');
      });
    } else {
      audioEl.pause();
      isPlaying = false;
      btnPlayPause.textContent = 'Play Music';
      statusIndicator.textContent = 'PAUSED';
      statusIndicator.style.color = '#8f2f00';
    }
  });

  btnToggleTrack.addEventListener('click', function() {
    currentTrackIdx = (currentTrackIdx + 1) % TRACKS.length;
    var t = TRACKS[currentTrackIdx];
    btnToggleTrack.textContent = t.name + '.mp3';
    var wasPlaying = isPlaying;
    audioEl.src = t.url;
    if (wasPlaying) {
      audioEl.play();
    }
  });

  btnToggleLattice.addEventListener('click', function() {
    latticeEnabled = !latticeEnabled;
    btnToggleLattice.classList.toggle('toggle-active', latticeEnabled);
    btnToggleLattice.textContent = latticeEnabled ? 'Layer 2: On' : 'Layer 2: Off';
    stageLattice.classList.toggle('disabled', !latticeEnabled);
  });

  btnSoloLattice.addEventListener('click', function() {
    soloLattice = !soloLattice;
    btnSoloLattice.classList.toggle('toggle-active', soloLattice);
    btnSoloLattice.textContent = soloLattice ? 'Unsolo Layer 2' : 'Solo Layer 2';
    stageDiffuse.style.display = soloLattice ? 'none' : '';
    if (soloLattice && !latticeEnabled) {
      btnToggleLattice.click();
    }
  });

  // Hold-to-simulate swell button
  function onStartSim() {
    isSimulating = true;
    btnSimulateSwell.classList.add('toggle-active');
    startSwellLoop();
  }
  function onEndSim() {
    isSimulating = false;
    btnSimulateSwell.classList.remove('toggle-active');
  }

  btnSimulateSwell.addEventListener('mousedown', onStartSim);
  window.addEventListener('mouseup', onEndSim);
  btnSimulateSwell.addEventListener('touchstart', function(e) { e.preventDefault(); onStartSim(); });
  window.addEventListener('touchend', onEndSim);

  // Sliders
  function bindSlider(id, key, valElId, formatter) {
    var s = document.getElementById(id);
    var v = document.getElementById(valElId);
    s.addEventListener('input', function() {
      var val = parseFloat(s.value);
      config[key] = val;
      if (formatter) v.textContent = formatter(val);
      else v.textContent = val;
      applyConfig();
    });
  }

  bindSlider('sliderLatticeBase', 'latticeBase', 'valLatticeBase', function(v){ return v.toFixed(2); });
  bindSlider('sliderLatticeSwell', 'latticeSwell', 'valLatticeSwell', function(v){ return v.toFixed(2); });
  bindSlider('sliderGainMult', 'gainMult', 'valGainMult', function(v){ return v.toFixed(1) + 'x'; });
  bindSlider('sliderNoiseFloor', 'noiseFloor', 'valNoiseFloor', function(v){ return v; });
  bindSlider('sliderAttack', 'attack', 'valAttack', function(v){ return v.toFixed(2); });
  bindSlider('sliderDecay', 'decay', 'valDecay', function(v){ return v.toFixed(3); });

  applyConfig();
</script>
</body>
</html>
