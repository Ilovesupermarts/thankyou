<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calligraphy Reveal Demo</title>
  <style>
    /* Pulls in your specific brush font */
    @import url('https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap');

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fdf3d8; /* Autumn base */
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .controls {
      margin-bottom: 40px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    input {
      padding: 12px 16px;
      font-size: 18px;
      border: 2px solid #d8b478;
      border-radius: 8px;
      background: #fff;
      font-family: "Yuji Syuku", serif;
      text-align: center;
      outline: none;
      width: 140px;
    }
    
    input:focus {
      border-color: #c9600a;
    }

    button {
      padding: 0 24px;
      font-size: 16px;
      font-weight: 600;
      background: #c9600a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }

    button:active {
      transform: scale(0.96);
      background: #8f3f12;
    }

    .stage {
      width: 100%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ink-text {
      font-family: "Yuji Syuku", serif;
      font-size: 140px;
      fill: transparent;
      stroke: #8f2f00; /* Deep autumn accent */
      stroke-width: 1.5px;
      
      /* 
         Setting a massive dasharray ensures it covers the total perimeter of any character.
         We animate the offset from this max value down to 0 to "draw" it. 
      */
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      
      /* Applies the wet ink bleed effect */
      filter: url(#ink-bleed);
    }

    .animate .ink-text {
      /* 1. Trace the outline over 2.5s */
      /* 2. Fade in the solid ink starting at 1.2s */
      animation: 
        drawOutline 2.5s cubic-bezier(0.34, 1.15, 0.64, 1) forwards,
        fillInk 1.2s 1.2s ease-in-out forwards;
    }

    @keyframes drawOutline {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fillInk {
      to { fill: #8f2f00; stroke-width: 0; }
    }
  </style>
</head>
<body>

  <div class="controls">
    <input type="text" id="nameInput" value="桜庭" maxlength="6">
    <button onclick="playReveal()">描く</button>
  </div>

  <div class="stage" id="stage">
    <svg>
      <defs>
        <!-- Simulates the rough edge of wet ink bleeding into paper -->
        <filter id="ink-bleed">
          <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
      <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="ink-text" id="svgText">桜庭</text>
    </svg>
  </div>

  <script>
    function playReveal() {
      const stage = document.getElementById('stage');
      const svgText = document.getElementById('svgText');
      const input = document.getElementById('nameInput');
      
      if (!input.value.trim()) return;

      svgText.textContent = input.value.trim();
      
      // Remove the class, force a browser reflow, then re-add to instantly restart the animation
      stage.classList.remove('animate');
      void stage.offsetWidth;
      stage.classList.add('animate');
    }

    // Run once on load
    window.onload = () => playReveal();
  </script>
</body>
</html>
