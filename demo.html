<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>七宝文様・ランダム輪郭線アニメーション検証</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============ EXACT AUTUMN PALETTE ============ */
  :root {
    --bg-base: #fdf3d8;
    --bg-warm: #f5d89a;
    --accent: #c9600a;
    --accent-2: #8f3f12;
    --border-1: #e8c88a;
    --border-3: #f0d8a0;
    --text-dark: #231304;
    --text-mute: #5a3818;
    --text-faint: #7a5028;

    /* Tracer Live Variables */
    --tracer-color: #c9600a;
    --tracer-stroke-width: 2.2px;
    --tracer-peak-opacity: 0.65;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background-color: var(--bg-base);
    color: var(--text-dark);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    overflow-x: hidden;
  }

  /* ============ AMBIENT LIGHT MESH ============ */
  .ambient-stage {
    position: fixed;
    top: -25%; left: -25%;
    width: 150%; height: 150%;
    z-index: -3;
    pointer-events: none;
  }

  .ambient-mesh {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0.90;
  }

  .light-orb {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
  }

  .orb-1 {
    width: 70vw; height: 70vw; max-width: 900px; max-height: 900px;
    top: 10%; left: 15%;
    background: radial-gradient(circle, rgba(201, 86, 27, 0.50) 0%, rgba(247, 185, 60, 0.18) 42%, transparent 70%);
    animation: orbDrift1 11.58s ease-in-out infinite alternate;
  }
  .orb-2 {
    width: 80vw; height: 80vw; max-width: 1050px; max-height: 1050px;
    top: 35%; right: 5%;
    background: radial-gradient(circle, rgba(212, 106, 21, 0.68) 0%, rgba(217, 94, 26, 0.41) 48%, transparent 72%);
    animation: orbDrift2 15.26s ease-in-out infinite alternate;
  }
  .orb-3 {
    width: 55vw; height: 55vw; max-width: 700px; max-height: 700px;
    bottom: 10%; left: 30%;
    background: radial-gradient(circle, rgba(201, 86, 27, 0.28) 0%, rgba(221, 132, 24, 0.48) 39%, transparent 60%);
    animation: orbDrift3 10.00s ease-in-out infinite alternate;
  }

  @keyframes orbDrift1 { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-13.75%, 22%, 0); } }
  @keyframes orbDrift2 { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(16.5%, -22%, 0); } }
  @keyframes orbDrift3 { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-19.25%, -11%, 0); } }

  .ambient-primary {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 25% 30%, rgba(247, 185, 60, 0.85) 0%, rgba(247, 185, 60, 0.40) 30%, transparent 60%),
      radial-gradient(circle at 75% 40%, rgba(240, 138, 30, 0.80) 0%, rgba(240, 138, 30, 0.38) 32%, transparent 62%),
      radial-gradient(circle at 50% 70%, rgba(217, 94, 26, 0.72) 0%, rgba(217, 94, 26, 0.34) 28%, transparent 58%);
  }

  /* ============ SHIPPO STATIC BACKGROUND ============ */
  .ambient-mosaic {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;
    opacity: 0.08; /* User chosen opacity */
  }

  /* ============ TRACER OVERLAYS (Fixed Pool of 3) ============ */
  .tracer-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;
    overflow: hidden;
  }

  .shippo-tracer {
    position: absolute;
    top: 0;
    left: 0;
    width: 68px;
    height: 68px;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .tracer-circle {
    fill: none;
    stroke: var(--tracer-color);
    stroke-width: var(--tracer-stroke-width);
    stroke-linecap: round;
    /* Circumference = 2 * PI * 30 ≈ 188.5 */
    stroke-dasharray: 189;
    stroke-dashoffset: 189;
    filter: drop-shadow(0 0 5px rgba(247, 185, 60, 0.5));
  }

  /* Animation state */
  .shippo-tracer.drawing {
    animation: tracerFade 2.4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  .shippo-tracer.drawing .tracer-circle {
    animation: drawStroke 1.5s cubic-bezier(0.35, 0, 0.25, 1) forwards;
  }

  @keyframes drawStroke {
    0%   { stroke-dashoffset: 189; }
    100% { stroke-dashoffset: 0; }
  }

  @keyframes tracerFade {
    0%   { opacity: 0; }
    18%  { opacity: var(--tracer-peak-opacity); }
    75%  { opacity: calc(var(--tracer-peak-opacity) * 0.8); }
    100% { opacity: 0; }
  }

  /* ============ PREVIEW CARD ============ */
  .content-container {
    max-width: 580px;
    margin: 40px auto 360px auto;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }

  .header-box {
    text-align: center;
    margin-bottom: 24px;
  }
  .header-box h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent);
    margin: 0 0 8px 0;
  }
  .header-box p {
    font-size: 13.5px;
    color: var(--text-mute);
    line-height: 1.8;
    margin: 0;
  }

  .preview-card {
    background-color: #fdf3d8;
    background-image: url('icons/1790835034553.jpg');
    background-size: cover;
    background-position: center;
    border-radius: 18px;
    padding: 6px 0;
    box-shadow: 0 8px 30px rgba(120, 70, 20, 0.12);
    border: 1px solid var(--border-3);
  }

  .preview-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(216, 180, 120, 0.3);
  }
  .preview-row:last-child { border-bottom: none; }
  .preview-price {
    background: rgba(255, 255, 255, 0.75);
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-1);
    color: var(--accent);
    font-weight: 700;
  }

  /* ============ FLOATING CONTROL PANEL ============ */
  .control-panel {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(720px, calc(100vw - 32px));
    max-height: 80vh;
    overflow-y: auto;
    background: rgba(253, 243, 216, 0.95);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid var(--border-1);
    border-radius: 22px;
    padding: 18px 22px;
    box-shadow: 0 10px 35px rgba(80, 40, 10, 0.22);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-label {
    font-size: 12px;
    letter-spacing: 2.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    font-weight: 600;
  }

  .btn-trigger {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(201, 96, 10, 0.25);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn-trigger:active { transform: scale(0.95); background: var(--accent-2); }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
  }

  .control-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .control-field label {
    font-size: 12px;
    color: var(--text-mute);
    display: flex;
    justify-content: space-between;
  }

  .color-presets {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .color-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  input[type="color"] {
    width: 32px;
    height: 26px;
    padding: 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: none;
  }

  input[type="range"] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  .code-output {
    background: rgba(35, 19, 4, 0.92);
    color: #fdf3d8;
    border-radius: 10px;
    padding: 10px 14px;
    font-family: Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    user-select: all;
  }
</style>
</head>
<body>

<!-- EXACT AMBIENT LIGHT MESH FROM APP -->
<div class="ambient-stage" aria-hidden="true">
  <div class="ambient-mesh">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
  </div>
  <div class="ambient-primary"></div>
</div>

<!-- CHOSEN SHIPPO MOSAIC BACKGROUND (#8f2f00, 1.7px, opacity 0.08) -->
<svg class="ambient-mosaic" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <pattern id="pat-shippo" width="60" height="60" patternUnits="userSpaceOnUse">
      <g stroke="#8f2f00" stroke-width="1.7" fill="none">
        <circle cx="0" cy="0" r="30" />
        <circle cx="60" cy="0" r="30" />
        <circle cx="0" cy="60" r="30" />
        <circle cx="60" cy="60" r="30" />
        <circle cx="30" cy="30" r="30" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pat-shippo)" />
</svg>

<!-- TRACER POOL (3 reusable nodes so quick intervals don't cut off previous animations) -->
<div class="tracer-layer" id="tracerLayer" aria-hidden="true">
  <div class="shippo-tracer" id="tracer0">
    <svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" class="tracer-circle" /></svg>
  </div>
  <div class="shippo-tracer" id="tracer1">
    <svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" class="tracer-circle" /></svg>
  </div>
  <div class="shippo-tracer" id="tracer2">
    <svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" class="tracer-circle" /></svg>
  </div>
</div>

<!-- PREVIEW CONTENT -->
<div class="content-container">
  <div class="header-box">
    <h1>七宝・手描きサークル効果</h1>
    <p>背景の七宝グリッドの交点に呼応して、<br>ランダムな円が一筆書きのように浮かび上がります。</p>
  </div>

  <div class="preview-card">
    <div style="padding:14px 18px; text-align:center; font-size:13.5px; border-bottom:1px solid rgba(216,180,120,0.3); background:rgba(255,255,255,0.5);">
      背景の輪郭線がコンテンツ背後で自然に調和するか確認できます
    </div>
    <div class="preview-row">
      <div style="font-size:15px;">ダミーテキスト1</div>
      <div class="preview-price">1,000 円</div>
    </div>
    <div class="preview-row">
      <div style="font-size:15px;">ダミーテキスト2</div>
      <div class="preview-price">2,000 円</div>
    </div>
    <div class="preview-row">
      <div style="font-size:15px;">ダミーテキスト3</div>
      <div class="preview-price">5,000 円</div>
    </div>
  </div>
</div>

<!-- FLOATING CONTROLS -->
<div class="control-panel">
  <div class="panel-header">
    <span class="section-label">アニメーション設定</span>
    <button type="button" class="btn-trigger" id="manualTriggerBtn">今すぐ描画 (Trigger Now)</button>
  </div>

  <div class="controls-grid">
    <div class="control-field">
      <label>描画間隔: <span id="freqVal">4.5 秒</span></label>
      <input type="range" id="freqSlider" min="1.0" max="10.0" step="0.5" value="4.5">
    </div>

    <div class="control-field">
      <label>輪郭線の色 (Stroke Color)</label>
      <div class="color-presets">
        <input type="color" id="colorPicker" value="#c9600a">
        <span class="color-dot" style="background:#c9600a;" data-color="#c9600a" title="柿色 (Amber Accent)"></span>
        <span class="color-dot" style="background:#8f2f00;" data-color="#8f2f00" title="紅鳶 (Deep Rust)"></span>
        <span class="color-dot" style="background:#f7b93c;" data-color="#f7b93c" title="黄金 (Gold Glow)"></span>
        <span class="color-dot" style="background:#ffffff;" data-color="#ffffff" title="白磁 (Washi White)"></span>
      </div>
    </div>

    <div class="control-field">
      <label>最大透明度: <span id="opacityVal">0.65</span></label>
      <input type="range" id="opacitySlider" min="0.15" max="1.0" step="0.05" value="0.65">
    </div>

    <div class="control-field">
      <label>線の太さ: <span id="strokeVal">2.2px</span></label>
      <input type="range" id="strokeSlider" min="1.0" max="4.0" step="0.2" value="2.2">
    </div>
  </div>

  <div>
    <div class="section-label" style="margin-bottom:6px;">生成されたコード (クリックで全選択)</div>
    <div class="code-output" id="codeSnippet"></div>
  </div>
</div>

<script>
  var root = document.documentElement;
  var freqSlider = document.getElementById('freqSlider');
  var colorPicker = document.getElementById('colorPicker');
  var opacitySlider = document.getElementById('opacitySlider');
  var strokeSlider = document.getElementById('strokeSlider');
  var freqVal = document.getElementById('freqVal');
  var opacityVal = document.getElementById('opacityVal');
  var strokeVal = document.getElementById('strokeVal');
  var codeSnippet = document.getElementById('codeSnippet');
  var manualBtn = document.getElementById('manualTriggerBtn');
  var colorDots = document.querySelectorAll('.color-dot');

  var tracers = [
    document.getElementById('tracer0'),
    document.getElementById('tracer1'),
    document.getElementById('tracer2')
  ];
  var tracerIndex = 0;
  var timerId = null;

  /* ============ MATHEMATICAL SNAP ENGINE ============ */
  function triggerShippoCircle() {
    var tracer = tracers[tracerIndex];
    tracerIndex = (tracerIndex + 1) % tracers.length;

    var vw = window.innerWidth;
    var vh = window.innerHeight;

    // Grid interval is 30px
    var maxCols = Math.floor(vw / 30);
    var maxRows = Math.floor(vh / 30);

    var j = 1 + Math.floor(Math.random() * Math.max(1, maxCols - 2));
    var k = 1 + Math.floor(Math.random() * Math.max(1, maxRows - 2));

    // Shippo center constraint: (j + k) must be even
    if ((j + k) % 2 !== 0) {
      j += 1;
    }

    // Exact tile center = (j * 30, k * 30). Offset by 34px radius center
    var x = (j * 30) - 34;
    var y = (k * 30) - 34;
    var startAngle = Math.floor(Math.random() * 4) * 90;

    tracer.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0) rotate(' + startAngle + 'deg)';

    // Trigger keyframe
    tracer.classList.remove('drawing');
    void tracer.offsetWidth; // Force reflow
    tracer.classList.add('drawing');
  }

  function scheduleNext() {
    if (timerId) clearTimeout(timerId);
    var baseSec = parseFloat(freqSlider.value);
    // Add ±25% natural organic jitter
    var jitter = (Math.random() * 0.5 - 0.25) * baseSec;
    var ms = Math.max(800, (baseSec + jitter) * 1000);

    timerId = setTimeout(function() {
      triggerShippoCircle();
      scheduleNext();
    }, ms);
  }

  function updateSettings() {
    var c = colorPicker.value;
    var o = opacitySlider.value;
    var s = strokeSlider.value + 'px';
    var f = freqSlider.value + ' 秒';

    root.style.setProperty('--tracer-color', c);
    root.style.setProperty('--tracer-peak-opacity', o);
    root.style.setProperty('--tracer-stroke-width', s);

    freqVal.textContent = f;
    opacityVal.textContent = o;
    strokeVal.textContent = s;

    codeSnippet.textContent =
      '/* main.css 設定値 */\n' +
      '.tracer-circle {\n' +
      '  stroke: ' + c + ';\n' +
      '  stroke-width: ' + s + ';\n' +
      '}\n' +
      '@keyframes tracerFade {\n' +
      '  0%   { opacity: 0; }\n' +
      '  18%  { opacity: ' + o + '; }\n' +
      '  75%  { opacity: ' + (o * 0.8).toFixed(2) + '; }\n' +
      '  100% { opacity: 0; }\n' +
      '}\n' +
      '/* app.js 間隔設定: 平均 ' + freqSlider.value + ' 秒 */';
  }

  freqSlider.addEventListener('input', function() {
    updateSettings();
    scheduleNext();
  });

  colorPicker.addEventListener('input', updateSettings);
  opacitySlider.addEventListener('input', updateSettings);
  strokeSlider.addEventListener('input', updateSettings);

  colorDots.forEach(function(dot) {
    dot.addEventListener('click', function() {
      colorPicker.value = dot.getAttribute('data-color');
      updateSettings();
    });
  });

  manualBtn.addEventListener('click', function() {
    triggerShippoCircle();
  });

  // Init
  updateSettings();
  scheduleNext();
  // Fire once at start after a short delay
  setTimeout(triggerShippoCircle, 600);
</script>
</body>
</html>
