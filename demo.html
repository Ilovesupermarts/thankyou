<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Koi Water Ripple - Autumn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap');

  :root {
    --bg-base: #fdf3d8; 
    --accent: #c9600a; 
    --petal: #e88a1a; 
    --petal-soft: #fde8b8; 
    --text-dark: #231304;
  }

  body {
    margin: 0;
    height: 100vh;
    background-color: var(--bg-base);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
  }

  .blossom-screen {
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    gap: 30px; /* Ensures clean spacing between button and text */
  }

  .start-btn {
    background: none; border: none; padding: 0; 
    display: flex; flex-direction: column;
    align-items: center; cursor: pointer; 
    -webkit-appearance: none; appearance: none;
    transition: transform 0.4s ease;
  }
  
  .start-btn:active { 
    transform: scale(0.94); 
  }

  /* Compact wrapper to preserve layout while SVG floats behind */
  .icon-wrapper {
    position: relative;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  /* Breathing Animation (Scales the fish) */
  .blossom-char {
    position: relative;
    z-index: 2;
    display: block; 
    width: 100px; 
    height: 100px; 
    user-select: none; -webkit-user-select: none;
    animation: blossomBreathe 3.6s ease-in-out infinite; 
    will-change: transform, filter;
  }

  @keyframes blossomBreathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
    50% { transform: scale(1.12); filter: drop-shadow(0 4px 18px var(--petal-soft)); }
  }

  /* Gentle Water Current Sway */
  .koi-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: center center;
    animation: idleSway 5s ease-in-out infinite;
  }

  @keyframes idleSway {
    0%, 82%, 100% { transform: rotate(0deg); }
    86% { transform: rotate(-5deg); }
    92% { transform: rotate(3deg); }
    96% { transform: rotate(-2deg); }
  }

  /* 
   * Massive 360x360 SVG canvas placed absolutely 
   * so ripples never clip at the edges. 
   */
  .rings-svg {
    position: absolute;
    width: 360px; 
    height: 360px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
  }

  .gold-band {
    stroke: var(--accent);
    stroke-width: 6px;
    fill: none;
    filter: drop-shadow(0 0 16px var(--petal));
  }

  /* Slow, Zen Water Ripples */
  .pulse-ring {
    stroke: var(--petal);
    fill: none;
    transform-origin: 180px 180px;
    /* 9-second slow linear travel */
    animation: ringPulse 9s linear infinite; 
  }

  /* Perfectly staggered spacing */
  .ripple-1 { animation-delay: 0s; }
  .ripple-2 { animation-delay: 3s; }
  .ripple-3 { animation-delay: 6s; }

  @keyframes ringPulse {
    0% { 
      transform: scale(0.95); 
      opacity: 0.6; 
      stroke-width: 2px; 
    }
    100% { 
      transform: scale(1.9); 
      opacity: 0; 
      stroke-width: 0px; 
    }
  }

  /* Typography */
  .start-label {
    font-size: 17px; font-weight: 600; letter-spacing: 5px; color: var(--accent);
  }
  
  .start-hint {
    margin: 0; font-size: 20px; font-weight: 500; color: var(--text-dark);
    letter-spacing: 3px; line-height: 2; text-align: center; 
    animation: hintBreathe 4s ease-in-out infinite;
  }
  
  @keyframes hintBreathe { 
    0%, 100% { opacity: 0.85; } 
    50% { opacity: 1; } 
  }
</style>
</head>
<body>

  <div class="blossom-screen">
    <button type="button" class="start-btn" aria-label="はじめる">
      
      <div class="icon-wrapper">
        <!-- 360x360 SVG Canvas (Center is 180) -->
        <svg class="rings-svg" viewBox="0 0 360 360" aria-hidden="true">
          <!-- The 3 Slow Staggered Water Ripples -->
          <circle cx="180" cy="180" r="90" class="pulse-ring ripple-1" />
          <circle cx="180" cy="180" r="90" class="pulse-ring ripple-2" />
          <circle cx="180" cy="180" r="90" class="pulse-ring ripple-3" />
          
          <!-- The Static Gold Band -->
          <circle cx="180" cy="180" r="90" class="gold-band" />
        </svg>

        <!-- Foreground Koi Image -->
        <div class="blossom-char">
          <img src="44173_0c6eff.png" class="koi-image" alt="Koi Start">
        </div>
      </div>
      
      <span class="start-label">はじめる</span>
    </button>
    
    <p class="start-hint">そっとタップしてください</p>
  </div>

</body>
</html>
