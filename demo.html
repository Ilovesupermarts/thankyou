<!DOCTYPE html>
<html lang="ja" data-theme="autumn" data-time="day" data-weather="clear">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUD 外観テスト v3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Yuji+Mai&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<style>
  body {
    padding-bottom: 0;
    min-height: 100vh;
  }

  .test-play-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 200;
    padding: 10px 22px;
    border-radius: 22px;
    background: var(--accent);
    color: #ffffff;
    border: 1.5px solid var(--accent);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 4px 14px var(--shadow-accent);
    transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .test-play-btn:active { transform: scale(0.97); }
  .test-play-btn.playing {
    background: var(--secondary-accent, #882E47);
    border-color: var(--secondary-accent, #882E47);
    box-shadow: 0 4px 14px rgba(136, 46, 71, 0.28);
  }

  .test-stage {
    max-width: 480px;
    margin: 0 auto;
    padding: 100px 20px 220px 20px;
    text-align: center;
  }
  .test-stage .panel-content {
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
    transition: none !important;
  }

  /* ============================================================
     AUDIO SPECTRUM & METADATA HUD
     Background image borrowed from .tanzaku-card.
     ============================================================ */
  .audio-spectrum-hud {
    position: fixed;
    left: calc(26px + env(safe-area-inset-left, 0px));
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    z-index: 40;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    width: 318px;
    padding: 24px 14px 10px 14px;
    border-radius: 18px;

    /* --- Same paper as .tanzaku-card --- */
    background-color: #fcfbf9;
    background-image: url('icons/1790678998862.jpg');
    background-size: cover;
    background-position: bottom right;
    background-repeat: no-repeat;

    border: 1px solid rgba(222, 192, 172, 0.50);
    box-shadow:
      0 6px 22px rgba(68, 52, 48, 0.08),
      0 1px 3px rgba(68, 52, 48, 0.05);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  body.info-visible .audio-spectrum-hud.shown {
    opacity: 1;
    transform: translateY(0);
  }

  /* ============================================================
     Badges — absolutely positioned, no flex.
     .hud-status-badge is hard-pinned to the card's top-left corner.
     .hud-dl-badge is hard-pinned to the card's top-right corner.
     ============================================================ */
  .hud-top-row {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0;
    pointer-events: none;
  }

  .hud-status-badge,
  .hud-dl-badge {
    position: absolute;
    top: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 8px;
    line-height: 1.2;
    transition: background-color 0.3s ease, color 0.3s ease, opacity 0.3s ease;
  }

  .hud-status-badge {
    left: 8px;
    background: rgba(176, 74, 90, 0.12);
    color: var(--accent);
  }
  .hud-dl-badge {
    right: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: rgba(222, 192, 172, 0.28);
    color: var(--text-mute);
  }

  .hud-status-badge.loading {
    background: rgba(247, 185, 60, 0.22);
    color: #8f3f12;
  }
  .hud-status-badge.decoding {
    background: rgba(247, 185, 60, 0.38);
    color: #7a3208;
    animation: statusPulse 1.2s ease-in-out infinite;
  }
  .hud-status-badge.ready {
    background: rgba(42, 63, 26, 0.14);
    color: #2a3f1a;
  }
  html[data-theme="autumn"] .hud-status-badge {
    background: rgba(230, 104, 38, 0.12);
    color: var(--accent);
  }
  html[data-theme="autumn"] .hud-status-badge.loading {
    background: rgba(255, 162, 89, 0.25);
    color: #C44E10;
  }
  html[data-theme="autumn"] .hud-status-badge.decoding {
    background: rgba(255, 162, 89, 0.40);
    color: #9E3B06;
  }
  html[data-theme="autumn"] .hud-status-badge.ready {
    background: rgba(136, 46, 71, 0.14);
    color: #882E47;
  }

  .hud-dl-badge.decoding {
    background: rgba(255, 162, 89, 0.32);
    color: #9E3B06;
    animation: statusPulse 1.2s ease-in-out infinite;
  }
  .hud-dl-badge.ready {
    background: rgba(154, 62, 77, 0.12);
    color: var(--secondary-accent, #9a3e4d);
  }
  html[data-theme="autumn"] .hud-dl-badge.ready {
    background: rgba(136, 46, 71, 0.12);
    color: var(--secondary-accent, #882E47);
  }

  @keyframes statusPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  /* ============================================================
     Meta row — title · artist
     ============================================================ */
  .hud-meta-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 1.2;
    margin: 0;
    min-width: 0;
  }
  .hud-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: 1.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  html[data-theme="autumn"] .hud-title { color: var(--text-med); }
  .hud-sep {
    font-size: 11px;
    color: var(--text-placeholder);
    flex-shrink: 0;
  }
  .hud-artist {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-mute);
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .hud-wave-gauge-stack {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin-top: 0;
  }
  .hud-visualizer-block {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 0;
    margin-top: -2px;
  }
  .hud-canvas {
    width: 100%;
    height: 44px;
    display: block;
  }

  .hud-gauge-bar {
    position: relative;
    width: 100%;
    height: 5px;
    background: rgba(222, 192, 172, 0.38);
    border-radius: 999px;
  }
  .hud-gauge-fill {
    position: relative;
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--glow), var(--accent));
    border-radius: 999px;
    transition: width 0.15s cubic-bezier(0.2, 0, 0.3, 1), background 0.3s ease;
  }
  .hud-gauge-fill::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #FFFDF9;
    box-shadow: 0 0 8px var(--glow);
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }
  .hud-gauge-fill.decoding {
    background: #FFA259;
    animation: gaugeGlow 1s ease-in-out infinite alternate;
  }
  .hud-gauge-fill.ready {
    background: linear-gradient(90deg, var(--accent), #882E47);
  }
  .hud-gauge-fill.ready::after {
    background: #882E47;
    box-shadow: 0 0 8px rgba(136, 46, 71, 0.45);
  }
  html[data-theme="autumn"] .hud-gauge-fill.decoding { background: #FFA259; }
  html[data-theme="autumn"] .hud-gauge-fill.ready {
    background: linear-gradient(90deg, var(--accent), #882E47);
  }
  @keyframes gaugeGlow {
    from { opacity: 0.7; }
    to   { opacity: 1; }
  }

  .hud-time-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-faint);
    letter-spacing: 0.6px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    line-height: 1;
  }

  @media (max-height: 600px) and (orientation: landscape) {
    .audio-spectrum-hud { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hud-status-badge.decoding,
    .hud-dl-badge.decoding,
    .hud-gauge-fill.decoding {
      animation: none !important;
    }
    .hud-gauge-fill::after {
      box-shadow: none !important;
    }
  }
</style>
</head>
<body class="info-visible">

<div class="ambient-stage layer-diffuse" id="ambientStage" aria-hidden="true">
  <div class="ambient-layer ambient-mesh">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
  </div>
  <div class="ambient-layer ambient-primary"></div>
</div>

<div class="shippo-mask-window" id="stageLattice" aria-hidden="true">
  <div class="ambient-stage layer-mirrored">
    <div class="ambient-layer ambient-mesh">
      <div class="light-orb orb-1"></div>
      <div class="light-orb orb-2"></div>
      <div class="light-orb orb-3"></div>
    </div>
  </div>
</div>

<div class="ambient-mosaic" aria-hidden="true"></div>

<button type="button" class="test-play-btn" id="playBtn">▶ 再生</button>

<main class="test-stage">
  <div class="panel-inner">
    <div class="panel-content">
      <span class="therapist-name">桜庭さん</span>、初めまして。
      <p>それでは、本日の癒しのオプションをご覧ください。</p>
      <p>ご無理のない範囲で、ご対応いただけるものがございましたら、横の○をタップしてお選びください。</p>
      <p>ありがとうございます。</p>
    </div>
  </div>
</main>

<div class="audio-spectrum-hud shown" id="audioSpectrumHud" aria-hidden="true">
  <div class="hud-top-row">
    <span class="hud-status-badge" id="hudStatusBadge">待機中</span>
    <span class="hud-dl-badge" id="hudPctStatus">DL 0%</span>
  </div>

  <div class="hud-meta-row">
    <span class="hud-title" id="hudTrackTitle">草原の風</span>
    <span class="hud-sep">·</span>
    <span class="hud-artist" id="hudTrackArtist">小久保隆</span>
  </div>

  <div class="hud-wave-gauge-stack">
    <div class="hud-visualizer-block">
      <canvas class="hud-canvas" id="hudCanvas" width="282" height="44"></canvas>
    </div>

    <div class="hud-gauge-bar">
      <div class="hud-gauge-fill" id="hudGaugeFill"></div>
    </div>

    <div class="hud-time-row">
      <span id="hudTimeElapsed">00:00</span>
      <span id="hudTimeTotal">--:--</span>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var _prefersReducedMotion = false;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      _prefersReducedMotion = true;
    }
  } catch (e) {}

  var ambientStage   = document.getElementById('ambientStage');
  var stageLattice   = document.getElementById('stageLattice');
  var hudStatusBadge = document.getElementById('hudStatusBadge');
  var hudPctStatus   = document.getElementById('hudPctStatus');
  var hudCanvas      = document.getElementById('hudCanvas');
  var hudCtx         = hudCanvas ? hudCanvas.getContext('2d') : null;
  var hudGaugeFill   = document.getElementById('hudGaugeFill');
  var hudTimeElapsed = document.getElementById('hudTimeElapsed');
  var hudTimeTotal   = document.getElementById('hudTimeTotal');
  var playBtn        = document.getElementById('playBtn');

  var HUD_DISPLAY_W = 282;
  var HUD_DISPLAY_H = 44;
  var HUD_WAVE_PTS  = 28;
  var HUD_LAYERS    = 6;

  var LAYER_BIN_START = [3, 15, 35, 55, 75, 95];
  var LAYER_BIN_END   = [22, 42, 62, 82, 100, 120];

  var _hudMirrorValues = new Float32Array(HUD_LAYERS * HUD_WAVE_PTS);
  var _hudPhase = 0;
  var _hudLastRenderedSec = -1;

  if (hudCanvas && hudCtx) {
    var _hudDpr = window.devicePixelRatio || 1;
    hudCanvas.width  = HUD_DISPLAY_W * _hudDpr;
    hudCanvas.height = HUD_DISPLAY_H * _hudDpr;
    hudCtx.scale(_hudDpr, _hudDpr);
  }

  var soundAudioCtx       = null;
  var soundMasterGain     = null;
  var swellAnalyserNode   = null;
  var swellCompensationGain = null;
  var swellFreqData       = null;
  var swellIsRunning      = false;
  var swellRafId          = null;
  var ambientSource       = null;
  var ambientGain         = null;
  var ambientPlayStartTime = -1;
  var ambientPlayDurationSec = 0;
  var decodedBuffer       = null;
  var currentTheme        = 'autumn';

  function formatHudTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var total = Math.floor(sec);
    var m = Math.floor(total / 60);
    var s = total % 60;
    return (m < 10 ? '0' + m : String(m)) + ':' + (s < 10 ? '0' + s : String(s));
  }

  function getPlaybackElapsed() {
    if (ambientSource === null) return 0;
    if (ambientPlayStartTime < 0 || ambientPlayDurationSec <= 0) return 0;
    var elapsed = soundAudioCtx.currentTime - ambientPlayStartTime;
    if (elapsed < 0) elapsed = 0;
    if (elapsed > ambientPlayDurationSec) elapsed = ambientPlayDurationSec;
    return elapsed;
  }

  function drawHudSpectrum() {
    if (!hudCtx) return;
    hudCtx.clearRect(0, 0, HUD_DISPLAY_W, HUD_DISPLAY_H);

    var isAutumn = (currentTheme === 'autumn');
    var col0 = isAutumn ? '#882E47' : '#b04a5a';
    var col1 = isAutumn ? '#C44E10' : '#a34a56';
    var col2 = isAutumn ? '#E66826' : '#d46a7a';
    var col3 = isAutumn ? '#F07D40' : '#e8a8b0';
    var col4 = isAutumn ? '#FFA259' : '#e8b4bc';
    var col5 = '#FFFDF9';

    if (!_prefersReducedMotion) {
      _hudPhase += 0.038;
    }

    var lastIdx = HUD_WAVE_PTS - 1;
    for (var layer = 0; layer < HUD_LAYERS; layer++) {
      var binStart = LAYER_BIN_START[layer];
      var binEnd   = LAYER_BIN_END[layer];
      var base = layer * HUD_WAVE_PTS;
      for (var i = 0; i < HUD_WAVE_PTS; i++) {
        var target;
        if (swellAnalyserNode && swellFreqData && swellIsRunning) {
          var t = i / lastIdx;
          var binIdx = binStart + Math.floor(t * (binEnd - binStart));
          target = Math.max(0.08, Math.min(1.0, (swellFreqData[binIdx] / 255) * 1.35));
        } else {
          target = 0.18 + Math.sin(_hudPhase + i * 0.35 + layer * 0.9) * 0.12;
        }
        _hudMirrorValues[base + i] += (target - _hudMirrorValues[base + i]) * 0.25;
      }
    }

    drawFluidRibbon(0, col0, 0.24,  1.00, 0.0, 1.6, 1.00);
    drawFluidRibbon(1, col1, 0.30, -1.20, 1.7, 2.0, 0.96);
    drawFluidRibbon(2, col2, 0.42,  1.35, 3.4, 2.4, 0.92);
    drawFluidRibbon(3, col3, 0.50, -1.10, 5.1, 2.8, 0.86);
    drawFluidRibbon(4, col4, 0.44,  1.25, 6.8, 3.2, 0.78);
    drawFluidRibbon(5, col5, 0.32, -0.85, 8.5, 3.6, 0.62);
  }

  function drawFluidRibbon(layerIdx, fillHex, alpha, speedMul, phaseOffset, freqMul, heightScale) {
    var w = HUD_DISPLAY_W;
    var baseY = HUD_DISPLAY_H;
    var maxH = (HUD_DISPLAY_H - 2) * heightScale;
    var lastIdx = HUD_WAVE_PTS - 1;
    var stepX = w / lastIdx;
    var base = layerIdx * HUD_WAVE_PTS;

    hudCtx.fillStyle = fillHex;
    hudCtx.globalAlpha = alpha;
    hudCtx.beginPath();
    hudCtx.moveTo(0, baseY);

    var prevX = 0;
    var prevY = baseY;

    for (var i = 0; i <= lastIdx; i++) {
      var norm = i / lastIdx;
      var envelope = Math.sin(norm * Math.PI);
      envelope = envelope * envelope;

      var undulation = 0.72 + 0.28 * Math.sin(_hudPhase * speedMul + norm * Math.PI * freqMul + phaseOffset);
      var amp = _hudMirrorValues[base + i] * undulation * envelope;
      var x = i * stepX;
      var y = baseY - (amp * maxH);

      if (i === 0) {
        hudCtx.lineTo(x, y);
      } else {
        var midX = (prevX + x) * 0.5;
        var midY = (prevY + y) * 0.5;
        hudCtx.quadraticCurveTo(prevX, prevY, midX, midY);
      }
      prevX = x;
      prevY = y;
    }

    hudCtx.lineTo(prevX, prevY);
    hudCtx.lineTo(w, baseY);
    hudCtx.closePath();
    hudCtx.fill();
    hudCtx.globalAlpha = 1.0;
  }

  function renderState() {
    var isPlaying = (ambientSource !== null);
    var elapsed = getPlaybackElapsed();

    if (isPlaying) {
      hudStatusBadge.textContent = '再生中';
      hudStatusBadge.classList.remove('loading', 'decoding');
      hudStatusBadge.classList.add('ready');

      hudPctStatus.textContent = 'DL 100%';
      hudPctStatus.classList.remove('decoding');
      hudPctStatus.classList.add('ready');

      hudGaugeFill.classList.remove('decoding');
      hudGaugeFill.classList.add('ready');

      hudTimeElapsed.textContent = formatHudTime(elapsed);
      hudTimeTotal.textContent = formatHudTime(ambientPlayDurationSec);
    } else {
      hudStatusBadge.textContent = '待機中';
      hudStatusBadge.classList.remove('ready', 'decoding');
      hudStatusBadge.classList.add('loading');

      hudPctStatus.textContent = 'DL 0%';
      hudPctStatus.classList.remove('ready', 'decoding');

      hudGaugeFill.classList.remove('ready', 'decoding');
      hudGaugeFill.style.width = '0%';

      hudTimeElapsed.textContent = '00:00';
      hudTimeTotal.textContent = '--:--';
    }
  }

  function updateHudProgress() {
    if (!hudGaugeFill) return;
    if (ambientSource === null) return;
    if (ambientPlayStartTime < 0 || ambientPlayDurationSec <= 0) return;

    var elapsed = getPlaybackElapsed();
    var pct = (elapsed / ambientPlayDurationSec) * 100;
    hudGaugeFill.style.width = pct.toFixed(2) + '%';

    var elapsedSec = Math.floor(elapsed);
    if (elapsedSec !== _hudLastRenderedSec) {
      _hudLastRenderedSec = elapsedSec;
      if (hudTimeElapsed) hudTimeElapsed.textContent = formatHudTime(elapsed);
      if (hudTimeTotal)   hudTimeTotal.textContent   = formatHudTime(ambientPlayDurationSec);
    }
  }

  var _lastAppliedSwell = -1;
  var _swellEnergy = 0;

  function applySwellToCSS(val) {
    if (_lastAppliedSwell === val || (val !== 0 && Math.abs(val - _lastAppliedSwell) < 0.005)) return;
    _lastAppliedSwell = val;
    var vStr = val.toFixed(3);
    if (ambientStage) ambientStage.style.setProperty('--audio-swell', vStr);
    if (stageLattice) stageLattice.style.setProperty('--audio-swell', vStr);
  }

  function swellTick() {
    if (!swellIsRunning) {
      swellRafId = null;
      return;
    }

    if (swellAnalyserNode && swellFreqData) {
      swellAnalyserNode.getByteFrequencyData(swellFreqData);

      var sum = 0;
      for (var i = 4; i < 34; i++) sum += swellFreqData[i];
      var avg = sum / 30;
      var cleanEnergy = Math.max(0, avg - 80);
      var normalized = Math.min(1.0, cleanEnergy / (140 / 3.5));
      var targetEnergy = Math.pow(normalized, 1.35);

      if (targetEnergy > _swellEnergy) {
        _swellEnergy += (targetEnergy - _swellEnergy) * 0.06;
      } else {
        _swellEnergy += (targetEnergy - _swellEnergy) * 0.010;
      }
    }

    applySwellToCSS(_swellEnergy);
    drawHudSpectrum();
    updateHudProgress();

    swellRafId = requestAnimationFrame(swellTick);
  }

  function initSound() {
    if (soundAudioCtx) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;

    soundAudioCtx = new Ctx();
    soundMasterGain = soundAudioCtx.createGain();
    soundMasterGain.gain.value = 0.5;
    soundMasterGain.connect(soundAudioCtx.destination);

    swellCompensationGain = soundAudioCtx.createGain();
    swellCompensationGain.gain.value = 2.0;
    swellAnalyserNode = soundAudioCtx.createAnalyser();
    swellAnalyserNode.fftSize = 512;
    swellAnalyserNode.smoothingTimeConstant = 0.8;
    swellFreqData = new Uint8Array(swellAnalyserNode.frequencyBinCount);
    soundMasterGain.connect(swellCompensationGain);
    swellCompensationGain.connect(swellAnalyserNode);

    if (soundAudioCtx.state === 'suspended') {
      try { soundAudioCtx.resume(); } catch (e) {}
    }
  }

  function loadBufferAndPlay() {
    if (!soundAudioCtx) return;

    hudStatusBadge.textContent = '展開中';
    hudStatusBadge.classList.add('decoding');
    hudPctStatus.textContent = 'DL 0%';

    fetch('Sound/Morning.mp3')
      .then(function(r) {
        if (!r.ok) throw new Error('fetch failed');
        return r.arrayBuffer();
      })
      .then(function(ab) {
        hudPctStatus.textContent = 'PCM展開中';
        hudPctStatus.classList.add('decoding');
        return new Promise(function(resolve, reject) {
          soundAudioCtx.decodeAudioData(ab, resolve, reject);
        });
      })
      .then(function(buffer) {
        decodedBuffer = buffer;
        hudPctStatus.textContent = 'DL 100%';
        hudPctStatus.classList.remove('decoding');
        hudPctStatus.classList.add('ready');
        startPlayback();
      })
      .catch(function(err) {
        hudStatusBadge.textContent = '読込失敗';
        hudStatusBadge.classList.remove('decoding', 'ready');
        hudPctStatus.textContent = 'ERR';
        hudPctStatus.classList.remove('decoding', 'ready');
        console.error(err);
      });
  }

  function startPlayback() {
    if (!decodedBuffer) return;
    stopPlayback();

    var now = soundAudioCtx.currentTime;
    var src = soundAudioCtx.createBufferSource();
    src.buffer = decodedBuffer;

    var gain = soundAudioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.8, now + 2.0);

    src.connect(gain);
    gain.connect(soundMasterGain);
    src.start(now);

    ambientSource = src;
    ambientGain = gain;
    ambientPlayStartTime = now;
    ambientPlayDurationSec = decodedBuffer.duration;
    _hudLastRenderedSec = -1;

    swellIsRunning = true;
    if (!swellRafId) swellRafId = requestAnimationFrame(swellTick);

    playBtn.textContent = '■ 停止';
    playBtn.classList.add('playing');

    renderState();
  }

  function stopPlayback() {
    if (ambientSource && ambientGain && soundAudioCtx) {
      try {
        var now = soundAudioCtx.currentTime;
        ambientGain.gain.cancelScheduledValues(now);
        ambientGain.gain.setTargetAtTime(0, now, 0.08);
        ambientSource.stop(now + 0.4);
      } catch (e) {}
    }
    ambientSource = null;
    ambientGain = null;
    ambientPlayStartTime = -1;
    ambientPlayDurationSec = 0;
    _hudLastRenderedSec = -1;
    swellIsRunning = false;

    playBtn.textContent = '▶ 再生';
    playBtn.classList.remove('playing');
    renderState();
  }

  playBtn.addEventListener('click', function(e) {
    e.preventDefault();

    if (!soundAudioCtx) {
      initSound();
    } else if (soundAudioCtx.state === 'suspended') {
      try { soundAudioCtx.resume(); } catch (e) {}
    }

    if (ambientSource !== null) { stopPlayback(); return; }
    if (!decodedBuffer) { loadBufferAndPlay(); } else { startPlayback(); }
  });

  renderState();
})();
</script>
