<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>和柄・日本の幾何学模様モザイク（秋テーマ）</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============ EXACT AUTUMN PALETTE FROM MAIN.CSS ============ */
  :root {
    --bg-base: #fdf3d8;
    --bg-warm: #f5d89a;
    --accent: #c9600a;
    --accent-2: #8f3f12;
    --accent-3: #7a3208;
    --glow: #f7b93c;
    --text-dark: #231304;
    --text-med: #3d2410;
    --text-mute: #5a3818;
    --text-faint: #7a5028;
    --border-1: #e8c88a;
    --border-2: #d8b478;
    --border-3: #f0d8a0;
    --soft-1: #fdf0c8;
    --soft-2: #fdf5e0;

    /* Live Pattern Variables */
    --pat-color: #8f2f00;
    --pat-stroke-width: 1.2px;
    --pat-opacity: 0.08;
    --pat-scale: 64px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--bg-base);
    color: var(--text-dark);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    overflow-x: hidden;
  }

  /* ============ AMBIENT LIGHT MESH & GRADIENTS ============ */
  .ambient-stage {
    position: fixed;
    top: -25%; left: -25%;
    width: 150%; height: 150%;
    z-index: -3;
    pointer-events: none;
  }

  .ambient-mesh {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0.90;
  }

  .light-orb {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
  }

  .orb-1 {
    width: 70vw; height: 70vw; max-width: 900px; max-height: 900px;
    top: 10%; left: 15%;
    background: radial-gradient(circle, rgba(201, 86, 27, 0.50) 0%, rgba(247, 185, 60, 0.18) 42%, transparent 70%);
    animation: orbDrift1 11.58s ease-in-out infinite alternate;
  }
  .orb-2 {
    width: 80vw; height: 80vw; max-width: 1050px; max-height: 1050px;
    top: 35%; right: 5%;
    background: radial-gradient(circle, rgba(212, 106, 21, 0.68) 0%, rgba(217, 94, 26, 0.41) 48%, transparent 72%);
    animation: orbDrift2 15.26s ease-in-out infinite alternate;
  }
  .orb-3 {
    width: 55vw; height: 55vw; max-width: 700px; max-height: 700px;
    bottom: 10%; left: 30%;
    background: radial-gradient(circle, rgba(201, 86, 27, 0.28) 0%, rgba(221, 132, 24, 0.48) 39%, transparent 60%);
    animation: orbDrift3 10.00s ease-in-out infinite alternate;
  }

  @keyframes orbDrift1 {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(-13.75%, 22%, 0) scale(0.928); }
  }
  @keyframes orbDrift2 {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(16.5%, -22%, 0) scale(0.952); }
  }
  @keyframes orbDrift3 {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(-19.25%, -11%, 0) scale(0.904); }
  }

  .ambient-primary {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 25% 30%, rgba(247, 185, 60, 0.85) 0%, rgba(247, 185, 60, 0.40) 30%, transparent 60%),
      radial-gradient(circle at 75% 40%, rgba(240, 138, 30, 0.80) 0%, rgba(240, 138, 30, 0.38) 32%, transparent 62%),
      radial-gradient(circle at 50% 70%, rgba(217, 94, 26, 0.72) 0%, rgba(217, 94, 26, 0.34) 28%, transparent 58%);
  }

  /* ============ FULLSCREEN MOSAIC CANVAS ============ */
  .mosaic-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
    opacity: var(--pat-opacity);
    transition: opacity 0.2s ease;
  }

  /* ============ DEMO CONTENT & PREVIEW CARDS ============ */
  .content-container {
    max-width: 600px;
    margin: 40px auto 320px auto;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }

  .header-box {
    text-align: center;
    margin-bottom: 28px;
  }

  .header-box h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--accent);
    margin: 0 0 10px 0;
  }

  .header-box p {
    font-size: 14px;
    color: var(--text-mute);
    line-height: 1.8;
    margin: 0;
  }

  /* Table Card Preview from Main App */
  .preview-card {
    background-color: #fdf3d8;
    background-image: url('icons/1790835034553.jpg');
    background-size: cover;
    background-position: center;
    border-radius: 18px;
    padding: 6px 0;
    box-shadow: 0 8px 30px rgba(120, 70, 20, 0.12);
    border: 1px solid var(--border-3);
    overflow: hidden;
  }

  .preview-note {
    padding: 16px 20px;
    text-align: center;
    font-size: 13.5px;
    line-height: 1.8;
    background: rgba(255, 255, 255, 0.6);
    border-bottom: 1px solid rgba(216, 180, 120, 0.4);
  }

  .preview-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(216, 180, 120, 0.3);
  }

  .preview-row:last-child { border-bottom: none; }

  .preview-row-check {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border-1);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-size: 14px;
  }

  .preview-row-title {
    flex: 1;
    margin: 0 12px;
    font-size: 15px;
    font-weight: 500;
  }

  .preview-price {
    background: rgba(255, 255, 255, 0.7);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-1);
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
  }

  /* ============ FLOATING CONTROL PANEL ============ */
  .control-panel {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(720px, calc(100vw - 32px));
    max-height: 80vh;
    overflow-y: auto;
    background: rgba(253, 243, 216, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid var(--border-1);
    border-radius: 22px;
    padding: 18px 22px;
    box-shadow: 0 10px 35px rgba(80, 40, 10, 0.22);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .section-label {
    font-size: 11.5px;
    letter-spacing: 2.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .pattern-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 8px;
  }

  .btn-choice {
    background: #fff;
    border: 1.5px solid var(--border-1);
    border-radius: 12px;
    padding: 9px 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-choice:hover { background: var(--soft-1); }

  .btn-choice.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 3px 10px rgba(201, 96, 10, 0.3);
  }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
  }

  .control-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .control-field label {
    font-size: 12px;
    color: var(--text-mute);
    display: flex;
    justify-content: space-between;
  }

  .color-presets {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .color-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  input[type="color"] {
    width: 32px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: none;
  }

  input[type="range"] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  .code-output {
    background: rgba(35, 19, 4, 0.90);
    color: #fdf3d8;
    border-radius: 10px;
    padding: 10px 14px;
    font-family: Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    user-select: all;
  }
</style>
</head>
<body>

<!-- EXACT AMBIENT LIGHT MESH FROM MAIN APP -->
<div class="ambient-stage" aria-hidden="true">
  <div class="ambient-mesh">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
  </div>
  <div class="ambient-primary"></div>
</div>

<!-- MOSAIC SVG BACKDROP -->
<svg class="mosaic-overlay" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- 1. ASANOHA (麻の葉 - Hemp Leaf Crystal Mosaic) -->
    <pattern id="pat-asanoha" width="60" height="104" patternUnits="userSpaceOnUse">
      <g stroke="var(--pat-color)" stroke-width="var(--pat-stroke-width)" fill="none" stroke-linejoin="round">
        <path d="M30 0 L60 17.32 L60 52 L30 69.28 L0 52 L0 17.32 Z M30 104 L60 86.68 L60 52 L30 34.72 L0 52 L0 86.68 Z" />
        <path d="M30 0 L30 104 M0 17.32 L60 86.68 M0 86.68 L60 17.32 M0 52 L60 52" />
        <path d="M0 17.32 L30 52 L60 17.32 M0 86.68 L30 52 L60 86.68" />
      </g>
    </pattern>

    <!-- 2. SHIPPO (七宝 - Seven Treasures Petal/Star Mosaic) -->
    <pattern id="pat-shippo" width="60" height="60" patternUnits="userSpaceOnUse">
      <g stroke="var(--pat-color)" stroke-width="var(--pat-stroke-width)" fill="none">
        <circle cx="0" cy="0" r="30" />
        <circle cx="60" cy="0" r="30" />
        <circle cx="0" cy="60" r="30" />
        <circle cx="60" cy="60" r="30" />
        <circle cx="30" cy="30" r="30" />
      </g>
    </pattern>

    <!-- 3. KIKKO (亀甲 - Tortoise Shell Honeycomb Mosaic) -->
    <pattern id="pat-kikko" width="60" height="104" patternUnits="userSpaceOnUse">
      <g stroke="var(--pat-color)" stroke-width="var(--pat-stroke-width)" fill="none">
        <path d="M30 0 L60 17.32 L60 52 L30 69.28 L0 52 L0 17.32 Z M30 104 L60 86.68 L60 52 L30 34.72 L0 52 L0 86.68 Z" />
        <!-- Nested inner honeycomb ring for luxury Karakami finish -->
        <path d="M30 8 L54 21.8 L54 48 L30 61.8 L6 48 L6 21.8 Z M30 96 L54 82.2 L54 56 L30 42.2 L6 56 L6 82.2 Z" opacity="0.6"/>
      </g>
    </pattern>

    <!-- 4. UROKO (鱗 - Sacred Triangle Scale Mosaic) -->
    <pattern id="pat-uroko" width="60" height="52" patternUnits="userSpaceOnUse">
      <g stroke="var(--pat-color)" stroke-width="var(--pat-stroke-width)" fill="none">
        <polygon points="30,0 60,52 0,52" />
        <polygon points="0,0 30,52 -30,52" />
        <polygon points="60,0 90,52 30,52" />
      </g>
    </pattern>

    <!-- 5. SEIGAIHA (青海波 - Overlapping Sacred Wave Mosaic) -->
    <pattern id="pat-seigaiha" width="80" height="40" patternUnits="userSpaceOnUse">
      <g stroke="var(--pat-color)" stroke-width="var(--pat-stroke-width)" fill="none">
        <circle cx="40" cy="40" r="38" />
        <circle cx="40" cy="40" r="28" />
        <circle cx="40" cy="40" r="18" />
        <circle cx="40" cy="40" r="8" />

        <circle cx="0" cy="0" r="38" />
        <circle cx="0" cy="0" r="28" />
        <circle cx="0" cy="0" r="18" />
        <circle cx="0" cy="0" r="8" />

        <circle cx="80" cy="0" r="38" />
        <circle cx="80" cy="0" r="28" />
        <circle cx="80" cy="0" r="18" />
        <circle cx="80" cy="0" r="8" />
      </g>
    </pattern>

    <!-- 6. ICHIMATSU (市松 - Classic Checkered Tile Mosaic) -->
    <pattern id="pat-ichimatsu" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="var(--pat-color)" />
      <rect x="20" y="20" width="20" height="20" fill="var(--pat-color)" />
    </pattern>
  </defs>

  <rect id="mosaicSurface" width="100%" height="100%" fill="url(#pat-asanoha)" />
</svg>

<!-- SAMPLE PAGE CONTENT TO TEST READABILITY -->
<div class="content-container">
  <div class="header-box">
    <h1>和柄モザイクの選定</h1>
    <p>背景の文様と文字の視認性をご確認ください。<br>下のコントロールバーで柄、色、線幅を調整できます。</p>
  </div>

  <div class="preview-card">
    <div class="preview-note">
      <p style="margin:0 0 6px 0; font-weight:600; color:var(--accent);">大切なお知らせ</p>
      お部屋の光加減と調和する、自然で控えめな質感をお確かめいただけます。
    </div>
    <div class="preview-row">
      <div class="preview-row-check">❀</div>
      <div class="preview-row-title">ダミーテキスト1</div>
      <div class="preview-price">1,000 円</div>
    </div>
    <div class="preview-row">
      <div class="preview-row-check">❀</div>
      <div class="preview-row-title">ダミーテキスト2</div>
      <div class="preview-price">2,000 円</div>
    </div>
    <div class="preview-row">
      <div class="preview-row-check">❀</div>
      <div class="preview-row-title">ダミーテキスト3</div>
      <div class="preview-price">5,000 円</div>
    </div>
  </div>
</div>

<!-- FLOATING CONTROLS -->
<div class="control-panel">
  <div>
    <div class="section-label">和柄パターンを選択</div>
    <div class="pattern-buttons">
      <button type="button" class="btn-choice active" data-pattern="asanoha">麻の葉 (Asanoha)</button>
      <button type="button" class="btn-choice" data-pattern="shippo">七宝 (Shippō)</button>
      <button type="button" class="btn-choice" data-pattern="kikko">亀甲 (Kikkō)</button>
      <button type="button" class="btn-choice" data-pattern="uroko">鱗 (Uroko)</button>
      <button type="button" class="btn-choice" data-pattern="seigaiha">青海波 (Seigaiha)</button>
      <button type="button" class="btn-choice" data-pattern="ichimatsu">市松 (Ichimatsu)</button>
    </div>
  </div>

  <div class="controls-grid">
    <div class="control-field">
      <label>線の色 (Stroke Color)</label>
      <div class="color-presets">
        <input type="color" id="colorPicker" value="#8f2f00">
        <span class="color-dot" style="background:#8f2f00;" data-color="#8f2f00" title="紅鳶 (Deep Rust)"></span>
        <span class="color-dot" style="background:#c9600a;" data-color="#c9600a" title="柿色 (Amber Accent)"></span>
        <span class="color-dot" style="background:#5a3818;" data-color="#5a3818" title="焦茶 (Sepia)"></span>
        <span class="color-dot" style="background:#231304;" data-color="#231304" title="漆黒 (Ink Dark)"></span>
        <span class="color-dot" style="background:#ffffff;" data-color="#ffffff" title="胡粉 (Washi White)"></span>
      </div>
    </div>

    <div class="control-field">
      <label>線の太さ: <span id="strokeVal">1.2px</span></label>
      <input type="range" id="strokeSlider" min="0.4" max="3.0" step="0.1" value="1.2">
    </div>

    <div class="control-field">
      <label>透明度 (Opacity): <span id="opacityVal">0.08</span></label>
      <input type="range" id="opacitySlider" min="0.02" max="0.30" step="0.01" value="0.08">
    </div>
  </div>

  <div>
    <div class="section-label">書き出し用 CSS コード (クリックして全選択)</div>
    <div class="code-output" id="cssSnippet"></div>
  </div>
</div>

<script>
  var root = document.documentElement;
  var surface = document.getElementById('mosaicSurface');
  var colorPicker = document.getElementById('colorPicker');
  var strokeSlider = document.getElementById('strokeSlider');
  var opacitySlider = document.getElementById('opacitySlider');
  var strokeVal = document.getElementById('strokeVal');
  var opacityVal = document.getElementById('opacityVal');
  var cssSnippet = document.getElementById('cssSnippet');
  var patternBtns = document.querySelectorAll('.btn-choice');
  var colorDots = document.querySelectorAll('.color-dot');

  var currentPattern = 'asanoha';

  function updateOutput() {
    var c = colorPicker.value;
    var s = strokeSlider.value + 'px';
    var o = opacitySlider.value;

    root.style.setProperty('--pat-color', c);
    root.style.setProperty('--pat-stroke-width', s);
    root.style.setProperty('--pat-opacity', o);

    strokeVal.textContent = s;
    opacityVal.textContent = o;

    surface.setAttribute('fill', 'url(#pat-' + currentPattern + ')');

    // Generate cleanly encoded CSS data-uri string for easy transfer into main.css
    cssSnippet.textContent =
      '/* main.css にそのまま貼り付け可能な設定 */\n' +
      '.ambient-mosaic {\n' +
      '  position: fixed;\n' +
      '  inset: 0;\n' +
      '  pointer-events: none;\n' +
      '  z-index: -2;\n' +
      '  opacity: ' + o + ';\n' +
      '  /* 選択中: ' + currentPattern + ' | 線色: ' + c + ' | 線幅: ' + s + ' */\n' +
      '}\n' +
      'html[data-theme="default"] .ambient-mosaic { display: none; }';
  }

  patternBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      patternBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentPattern = btn.getAttribute('data-pattern');
      updateOutput();
    });
  });

  colorDots.forEach(function(dot) {
    dot.addEventListener('click', function() {
      var col = dot.getAttribute('data-color');
      colorPicker.value = col;
      updateOutput();
    });
  });

  colorPicker.addEventListener('input', updateOutput);
  strokeSlider.addEventListener('input', updateOutput);
  opacitySlider.addEventListener('input', updateOutput);

  updateOutput();
</script>
</body>
</html>
