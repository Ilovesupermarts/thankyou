<!DOCTYPE html>
<html lang="ja" data-theme="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFDF9">
<title>Quotes Preview</title>

<!-- ============================================================
     quotes-preview.html — standalone preview of the rotating quotes
     shown inside the start screen's ring, like a round window (丸窓).

     Loads the real main.css and uses the real markup and class names
     from index.html (.blossom-screen, .icon-wrapper, .soft-glow,
     .pond-surface, .pond-caustic, .rings-svg, .pulse-ring, .gold-band,
     .gold-band-shadow, .quote-wrap, .quote-line), so the halo, the
     breath, the ring ripples, the pond light and the background are
     the app's own. It does NOT load app.js.

     Quotes are read from quotes.json, the same file the app uses.

     What is new:
       .quote-window      — the ring, enlarged, with the quote inside
       .quote-timer-arc   — a 金木犀 arc on the ring: it sweeps back to
                            full as a quote arrives, then unwinds until
                            the next one. The quotes change on their
                            own when it runs out. No gestures.
       .quote-timer-bead  — a small glowing bead at the arc's tip
       .quote-count       — a faint "3 / 16" under the window
       横書き / 縦書き     — switch in the panel to compare

     The generated <style id="pvLive"> block holds every proposed
     rule. "Copy values" copies exactly that text.

     Not part of the app: not linked from index.html and not in the
     service worker's ASSETS list.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="main.css">

<!-- Preview-only chrome: the tuning panel. Nothing here is part of
     the copied CSS. -->
<style>
  body { overflow: hidden; height: 100vh; padding-bottom: 0; }

  .pv-panel {
    position: fixed; top: 16px; right: 16px; z-index: 1000;
    width: 340px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px); overflow-y: auto;
    touch-action: pan-y;
    background: rgba(255, 253, 249, 0.96);
    border: 1px solid var(--border-1);
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(68, 52, 48, 0.14);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--text-med);
    -webkit-user-select: none; user-select: none;
  }
  .pv-panel.collapsed { width: auto; overflow: hidden; }
  .pv-panel.collapsed .pv-body { display: none; }
  .pv-head {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; background: rgba(255, 253, 249, 0.98);
    border-bottom: 1px solid var(--border-4);
  }
  .pv-panel.collapsed .pv-head { border-bottom: none; }
  .pv-title { font-weight: 600; color: var(--text-dark); letter-spacing: 0.5px; flex: 1; white-space: nowrap; }
  .pv-seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 999px; overflow: hidden; }
  .pv-seg button {
    border: 0; background: transparent; padding: 5px 11px; font: inherit; color: var(--text-mute); cursor: pointer;
  }
  .pv-seg button.on { background: var(--accent); color: #FFFDF9; }
  .pv-icon-btn {
    border: 1px solid var(--border-2); background: transparent; border-radius: 999px;
    width: 30px; height: 30px; font: inherit; color: var(--text-mute); cursor: pointer;
  }
  .pv-body { padding: 4px 14px 14px; }
  .pv-note { margin: 10px 0 0; color: var(--text-mute); font-size: 12px; }
  .pv-source { margin: 6px 0 0; font-size: 12px; color: var(--accent-2); }
  .pv-transport { display: flex; gap: 6px; margin-top: 12px; }
  .pv-transport button {
    flex: 1; border: 1px solid var(--border-2); background: #FFFDF9; color: var(--text-dark);
    border-radius: 10px; padding: 8px 6px; font: inherit; cursor: pointer;
  }
  .pv-transport button:active { transform: scale(0.97); }
  .pv-group { margin-top: 14px; }
  .pv-group-title {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--secondary-accent); margin-bottom: 4px;
  }
  .pv-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 8px; padding: 6px 0; }
  .pv-row label { color: var(--text-soft); }
  .pv-val { font-variant-numeric: tabular-nums; color: var(--accent-2); font-weight: 600; }
  .pv-row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
  .pv-was { grid-column: 1 / -1; font-size: 11px; color: var(--text-faint); margin-top: -2px; }
  .pv-check { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--text-soft); }
  .pv-check input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  .pv-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .pv-btn {
    flex: 1; border: 1px solid var(--border-2); background: #FFFDF9; color: var(--text-dark);
    border-radius: 12px; padding: 10px 12px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .pv-btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFDF9; }
  .pv-btn:active { transform: scale(0.97); }
  .pv-status { margin-top: 8px; min-height: 18px; color: var(--accent-2); font-size: 12px; }
  .pv-out {
    display: none; margin: 8px 0 0; padding: 10px; max-height: 320px; overflow: auto;
    background: var(--soft-2); border: 1px solid var(--border-4); border-radius: 10px;
    font: 11px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text-soft);
    white-space: pre; -webkit-user-select: text; user-select: text;
  }
  .pv-out.shown { display: block; }
</style>

<!-- The generated proposed CSS goes here. Rewritten by the script. -->
<style id="pvLive"></style>
</head>
<body>

<!-- ============ AMBIENT BACKGROUND (same markup as index.html) ============ -->
<div class="ambient-stage layer-diffuse" id="ambientStage" aria-hidden="true">
  <div class="ambient-layer ambient-primary"></div>
  <div class="ambient-layer mist-soft">
    <div class="mist-band" style="--y:39.9%; --h:40.1vh; --d:-0.92s;  --c:230, 104, 38; --a:0.50"></div>
    <div class="mist-band" style="--y:58.5%; --h:38.0vh; --d:-39.05s; --c:136, 46, 71;  --a:0.50"></div>
  </div>
  <div class="mote-field" id="moteField"></div>
</div>

<div class="shippo-mask-window" id="stageLattice" aria-hidden="true">
  <div class="mist-lit-stage" id="mistLitStage">
    <div class="mist-band" style="--y:39.9%; --h:40.1vh; --d:-0.92s;  --c:230, 104, 38; --a:0.95"></div>
    <div class="mist-band" style="--y:58.5%; --h:38.0vh; --d:-39.05s; --c:136, 46, 71;  --a:0.95"></div>
  </div>
  <div class="lantern-layer" id="lanternLit"></div>
</div>
<div class="lantern-bloom-layer" id="lanternBloom" aria-hidden="true"></div>

<div class="ambient-mosaic" aria-hidden="true"></div>
<div class="ambient-mosaic-pond" aria-hidden="true"></div>

<div class="ripple-layer" id="rippleLayer" aria-hidden="true"></div>
<div class="floret-layer" id="floretLayer" aria-hidden="true"></div>

<!-- ============ ROUND WINDOW (real markup and class names) ============ -->
<div class="blossom-screen visible" id="blossomScreen">

  <div class="icon-wrapper quote-window" id="quoteWindow">
    <div class="soft-glow" aria-hidden="true"></div>
    <div class="pond-surface" aria-hidden="true">
      <div class="pond-caustic"></div>
      <div class="pond-caustic c2"></div>
    </div>
    <svg class="rings-svg" viewBox="0 0 360 360" aria-hidden="true">
      <defs>
        <filter id="bandShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur id="bandShadowBlurAmount" stdDeviation="3.5"/>
        </filter>
      </defs>
      <circle cx="180" cy="180" r="90" class="pulse-ring ripple-1" />
      <circle cx="180" cy="180" r="90" class="pulse-ring ripple-2" />
      <circle cx="180" cy="180" r="90" class="pulse-ring ripple-3" />
      <circle cx="180" cy="180" r="91" class="gold-band-shadow" />
      <circle cx="180" cy="180" r="90" class="gold-band" />
      <!-- New: the countdown, drawn on the ring itself. -->
      <circle cx="180" cy="180" r="90" class="quote-timer-arc" id="quoteTimerArc" transform="rotate(-90 180 180)" />
      <circle cx="180" cy="90" r="2" class="quote-timer-bead" id="quoteTimerBead" />
    </svg>
    <div class="quote-wrap" aria-live="polite">
      <div class="quote-line" id="quoteLine"></div>
    </div>
  </div>

  <div class="quote-meta" id="quoteMeta">
    <span class="quote-count" id="quoteCount">— / —</span>
    <span class="quote-meta-sep">·</span>
    <span class="quote-remain">次の言葉まで <span class="quote-remain-num" id="quoteRemainNum">—</span>秒</span>
  </div>
</div>

<!-- ============ TUNING PANEL (preview only) ============ -->
<div class="pv-panel" id="pvPanel">
  <div class="pv-head">
    <span class="pv-title">Quotes</span>
    <span class="pv-seg" role="group" aria-label="Writing direction">
      <button type="button" id="pvHoriz">横書き</button>
      <button type="button" id="pvVert">縦書き</button>
    </span>
    <button type="button" class="pv-icon-btn" id="pvCollapse" aria-label="Hide panel">–</button>
  </div>
  <div class="pv-body">
    <p class="pv-note">The quotes change on their own when the ring's countdown runs out. Switch 横書き / 縦書き above to compare. Fold this panel with – to see the whole window. Grey "app:" notes show today's value.</p>
    <p class="pv-source" id="pvSource">Loading quotes.json…</p>
    <div class="pv-transport">
      <button type="button" id="pvPrev">← 前へ (preview only)</button>
      <button type="button" id="pvNext">次へ → (preview only)</button>
    </div>
    <div id="pvControls"></div>
    <div class="pv-actions">
      <button type="button" class="pv-btn" id="pvReset">Reset</button>
      <button type="button" class="pv-btn primary" id="pvCopy">Copy values</button>
    </div>
    <div class="pv-status" id="pvStatus"></div>
    <pre class="pv-out" id="pvOut"></pre>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SETTINGS
     Each entry is one slider (or a checkbox when type is 'check').
     "was" is today's value in main.css / app.js, shown for comparison.
     The 横書き / 縦書き switch lives in the panel header.
     ============================================================ */
  var CONTROLS = [
    { group: 'Timing' },
    { id: 'seconds',   label: 'Seconds per quote',          min: 6,   max: 40,  step: 1,    def: 14,   was: '≈12.9s (10 blossoms × 1s, 1s hold, 1.5s fade)' },
    { id: 'fade',      label: 'Fade in / out (s)',          min: 0.6, max: 3,   step: 0.1,  def: 1.6,  was: '1.5' },
    { id: 'refill',    label: 'Ring refills as a quote arrives (s)', min: 0, max: 3, step: 0.1, def: 1.2, was: 'none' },
    { id: 'align',     label: 'New quote arrives on the breath (with the ring ripples)', type: 'check', def: true },
    { id: 'shuffle',   label: 'Shuffle the order (no repeats in a row)', type: 'check', def: false },

    { group: 'Window' },
    { id: 'size',      label: 'Window size (px across)',    min: 360, max: 720, step: 10,   def: 560,  was: 'ring 180px across, koi inside' },
    { id: 'band',      label: 'Ring thickness (px)',        min: 2,   max: 10,  step: 0.5,  def: 5,    was: '6' },
    { id: 'reach',     label: 'Halo reach (× ring radius)', min: 1.1, max: 2.2, step: 0.05, def: 1.45, was: '2.13 (on the small ring)' },
    { id: 'ripReach',  label: 'Ring ripples spread (×)',    min: 1.1, max: 2.2, step: 0.05, def: 1.4,  was: '2' },
    { id: 'pond',      label: 'Water inside the window',    min: 0,   max: 1,   step: 0.05, def: 0.7,  was: '1 (small pond)' },

    { group: 'Words' },
    { id: 'maxSize',   label: 'Largest text size (px)',     min: 26,  max: 64,  step: 1,    def: 44,   was: '34 on the tablet' },
    { id: 'minSize',   label: 'Smallest text size (px)',    min: 18,  max: 40,  step: 1,    def: 26,   was: '—' },
    { id: 'fit',       label: 'Room around the words (inside the ring)', min: 0.6, max: 0.95, step: 0.01, def: 0.82, was: '—' },
    { id: 'spacing',   label: 'Letter spacing (px)',        min: 0,   max: 10,  step: 0.5,  def: 4,    was: '4' },
    { id: 'lineH',     label: 'Line height',                min: 1.4, max: 2.6, step: 0.05, def: 1.9,  was: '2.1' },
    { id: 'blur',      label: 'Blur as it arrives (px)',    min: 0,   max: 20,  step: 1,    def: 10,   was: '12' },
    { id: 'ink',       label: 'Ink: delay per character (ms), 0 = whole line', min: 0, max: 160, step: 5, def: 70, was: '0 (whole line at once)' },

    { group: 'Timer' },
    { id: 'arcWidth',  label: 'Arc width (px)',             min: 1,   max: 8,   step: 0.5,  def: 3,    was: 'none' },
    { id: 'arcAlpha',  label: 'Arc strength',               min: 0.2, max: 1,   step: 0.05, def: 0.85, was: 'none' },
    { id: 'bead',      label: 'Glowing bead at the arc tip', type: 'check', def: true },
    { id: 'count',     label: 'Faint "3 / 16" under the window', type: 'check', def: true },
    { id: 'text',      label: '"次の言葉まで 12秒" under the window', type: 'check', def: false },

    { group: 'Florets' },
    { id: 'floret',    label: 'A floret lands on the ring as each quote arrives', type: 'check', def: true }
  ];

  var STORE_KEY = 'quotesPreviewValues.v2';
  var DEFAULTS = { vertical: false };
  CONTROLS.forEach(function (c) { if (c.id) DEFAULTS[c.id] = c.def; });
  var v = loadValues();

  function loadValues() {
    var out = {};
    for (var k in DEFAULTS) out[k] = DEFAULTS[k];
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved) for (var s in saved) if (s in out) out[s] = saved[s];
    } catch (e) {}
    return out;
  }
  function saveValues() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) {}
  }

  /* ============================================================
     CSS GENERATOR
     Builds the proposed CSS from the current values. The preview
     shows exactly this text, and "Copy values" copies it.

     The ring's SVG keeps its 360 × 360 viewBox with r = 90, and is
     simply drawn larger. k is how much larger, so line widths are
     divided by k to stay the same on screen.
     ============================================================ */
  function n(x, d) { return (+x).toFixed(d === undefined ? 2 : d).replace(/\.?0+$/, '') || '0'; }
  var EASE = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  function scale() { return v.size / 180; }

  function buildCSS() {
    var D = +v.size, R = D / 2, k = scale();
    var F = n(v.fade, 2) + 's';
    var B = n(v.blur, 1) + 'px';
    var halo = Math.round(R * v.reach);
    var rim = (R - 3) / halo * 100;
    var after = function (f) { return rim + (100 - rim) * f; };
    var css = [];
    css.push(
'/* ============================================================',
'   QUOTES IN THE ROUND WINDOW — PROPOSED DISPLAY (' + (v.vertical ? '縦書き' : '横書き') + ')',
'   Generated by quotes-preview.html. Paste after the .quote-line',
'   rules in main.css (same selectors, so these win by order).',
'',
'   Markup this needs (in place of the quote area):',
'     <div class="icon-wrapper quote-window">',
'       <div class="soft-glow"></div>',
'       <div class="pond-surface"><div class="pond-caustic"></div>',
'         <div class="pond-caustic c2"></div></div>',
'       <svg class="rings-svg" viewBox="0 0 360 360"> … the same',
'         rings as the start button, then:',
'         <circle cx="180" cy="180" r="90" class="quote-timer-arc"',
'                 transform="rotate(-90 180 180)" />',
'         <circle cx="180" cy="90" r="' + n(4 / k, 2) + '" class="quote-timer-bead" />',
'       </svg>',
'       <div class="quote-wrap"><div class="quote-line' + (v.vertical ? ' vertical' : '') + '"></div></div>',
'     </div>',
'     <div class="quote-meta"><span class="quote-count">3 / 16</span>',
'       <span class="quote-meta-sep">·</span>',
'       <span class="quote-remain">次の言葉まで',
'         <span class="quote-remain-num">12</span>秒</span></div>',
'     bandShadowBlur stdDeviation: ' + n(3.5 / k, 2) + ' (the ring is drawn ' + n(k, 2) + '× larger)',
'',
'   Numbers for app.js:',
'     one quote             ' + v.seconds + 's from arrival to the next (was ≈12.9s)',
'                           changes on its own, no gestures',
'     QUOTE_FADE            ' + Math.round(v.fade * 1000) + 'ms (was 1500)',
'     ring refill           ' + (v.refill > 0 ? Math.round(v.refill * 1000) + 'ms sweep back to full, then unwinds' : 'none: starts full'),
'     arc                   set stroke-dashoffset = 565.49 × (1 − part left)',
'                           every frame; move the bead to the arc tip',
'     breath alignment      ' + (v.align ? 'on: each quote arrives at a glow peak\n                           (1.44s into each 4s breath)' : 'off'),
'     order                 ' + (v.shuffle ? 'shuffled, never the same quote twice in a row' : 'in quotes.json order'),
'     text size             fitted per quote: start at ' + v.maxSize + 'px and step down',
'                           (to ' + v.minSize + 'px at least) until the text box fits',
'                           inside ' + Math.round(v.fit * 100) + '% of the ring radius',
'     ink                   ' + (v.ink > 0 ? 'wrap each character in <span class="quote-char" style="--i:N">\n                           and add .ink to .quote-line' : 'off (whole line at once)'),
'     florets               ' + (v.floret ? 'one lands on the ring as each quote arrives' : 'ambient only'),
'     blossom counter       removed',
'   ============================================================ */',
''
    );

    /* --- Window --- */
    css.push(
'/* The window: the start button\'s ring, drawn ' + D + 'px across. */',
'.quote-window {',
'  width: ' + D + 'px;',
'  height: ' + D + 'px;',
'  margin: 0;',
'}',
'.quote-window .rings-svg {',
'  width: ' + (D * 2) + 'px;',
'  height: ' + (D * 2) + 'px;',
'}',
'.quote-window .gold-band { stroke-width: ' + n(v.band / k, 3) + 'px; }',
'.quote-window .gold-band-shadow { stroke-width: ' + n((v.band + 3) / k, 3) + 'px; }',
'',
'/* Halo: the same white-to-金木犀 glow, reaching ' + n(v.reach) + '× the ring radius. */',
'.quote-window .soft-glow {',
'  width: ' + (halo * 2) + 'px; height: ' + (halo * 2) + 'px;',
'  margin-top: -' + halo + 'px; margin-left: -' + halo + 'px;',
'  background: radial-gradient(circle closest-side,',
'    rgba(255, 255, 255, 0) 0%,',
'    rgba(255, 255, 255, 0) ' + n(rim - 1.5) + '%,',
'    rgba(255, 255, 255, 0.35) ' + n(rim - 0.6) + '%,',
'    rgba(255, 255, 255, 0.95) ' + n(rim) + '%,',
'    rgba(255, 232, 214, 0.60) ' + n(after(0.14)) + '%,',
'    rgba(255, 190, 139, 0.38) ' + n(after(0.36)) + '%,',
'    rgba(238, 149, 103, 0.17) ' + n(after(0.62)) + '%,',
'    rgba(238, 149, 103, 0.04) ' + n(after(0.85)) + '%,',
'    rgba(238, 149, 103, 0) 100%);',
'}',
'',
'/* Water inside the window: the pond light keeps drifting behind the words. */',
'.quote-window .pond-surface {',
'  width: ' + (D - 6) + 'px; height: ' + (D - 6) + 'px;',
'  margin: -' + (R - 3) + 'px 0 0 -' + (R - 3) + 'px;',
'  opacity: ' + n(v.pond) + ';',
'}',
'',
'/* Ring ripples: on a ring this size they only need to travel ' + n(v.ripReach) + '×. */',
'@keyframes ringGrow {',
'  0%   { transform: scale(1); animation-timing-function: cubic-bezier(0.15, 0.55, 0.3, 1); }',
'  99%  { transform: scale(' + n(v.ripReach) + '); }',
'  100% { transform: scale(' + n(v.ripReach) + '); }',
'}',
''
    );

    /* --- Words --- */
    css.push(
'/* Words: centred inside the ring. app.js sets font-size per quote so',
'   the text always fits; the size here is only the starting point. */',
'.quote-window .quote-wrap {',
'  position: absolute;',
'  inset: 0;',
'  z-index: 2;',
'  min-height: 0;',
'  padding: 0;',
'  display: flex;',
'  align-items: center;',
'  justify-content: center;',
'}',
'.quote-window .quote-line {',
'  width: fit-content;',
'  text-align: center;',
'  max-width: ' + Math.round(D * 0.8) + 'px;',
'  font-size: ' + v.maxSize + 'px;',
'  letter-spacing: ' + n(v.spacing, 1) + 'px;',
'  line-height: ' + n(v.lineH) + ';',
'  transform: translateY(12px) scale(0.98);',
'  filter: blur(' + B + ');',
'  transition: opacity ' + F + ' ' + EASE + ',',
'              transform ' + F + ' ' + EASE + ',',
'              filter ' + F + ' ' + EASE + ';',
'}',
'.quote-window .quote-line.shown { transform: none; filter: none; opacity: 1; }',
'.quote-window .quote-line.leaving {',
'  opacity: 0;',
'  transform: translateY(-12px) scale(1.01);',
'  filter: blur(' + B + ');',
'}',
''
    );

    if (v.vertical) {
      css.push(
'/* 縦書き: top-to-bottom, right-to-left, like a hanging scroll seen',
'   through the window. Columns fit a circle naturally. */',
'.quote-window .quote-line.vertical {',
'  writing-mode: vertical-rl;',
'  text-orientation: mixed;',
'  max-width: none;',
'  max-height: ' + Math.round(D * 0.66) + 'px;',
'  text-align: start;',
'}',
''
      );
    }

    if (v.ink > 0) {
      css.push(
'/* Ink: each character bleeds in out of a soft blur, ' + v.ink + 'ms apart,',
'   like a brush working across the paper. The line only fades as a',

'  opacity: 0;',

      );

  function applyCSS() {
    live.textContent = buildCSS();

    blurAmount.setAttribute('stdDeviation', n(3.5 / k, 3));

  /* ============================================================
     QUOTES — read from the same quotes.json the app uses
     ============================================================ */
  var FALLBACK = [
    '静かな時間も、また大切な時間です。',
    'お茶の香りも、どうぞごゆっくりお楽しみください。',
    '窓の外の音に、そっと耳を澄ましてみてください。',
    'どうぞ、心穏やかな時間をお過ごしください。'
  ];
  var quotes = FALLBACK.slice();
  var order = [];

  function buildOrder() {
    var keep = order.length ? order[S.pos] : -1;
    order = quotes.map(function (_, i) { return i; });
    if (v.shuffle) {
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }
      if (order.length > 1 && order[0] === keep) order.push(order.shift());
    }
  }

  function loadQuotes() {
    return fetch('quotes.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        if (data && Array.isArray(data.quotes) && data.quotes.length) {
          quotes = data.quotes.map(function (q) { return String(q).trim(); }).filter(Boolean);
          sourceEl.textContent = quotes.length + ' quotes read from quotes.json.';
        }
      })
      .catch(function () {
        sourceEl.textContent = 'Could not read quotes.json (open this page from the web server, not as a file). Showing the app\'s built-in lines.';
      });
  }

  /* ============================================================
     QUOTE CYCLE
     One clock drives the arc, the bead, the fade out and the next
     quote. The ring sweeps back to full as a quote arrives, then
     unwinds; when it reaches the top the quote leaves.
     ============================================================ */
  var S = { pos: 0, start: 0, D: 0, frozen: false, frozenAt: 0, phase: 'idle', nextPos: null, lastSec: -1, fromFrac: 0 };

  function now() { return performance.now(); }
  function elapsed() { return (S.frozen ? S.frozenAt : now()) - S.start; }

  /* Where the 4s breath is right now, read from the halo's own
     animation, so the new quote lands with the ring ripples. */
  function breathPhase() {
    var anims = softGlow.getAnimations ? softGlow.getAnimations() : [];
    for (var i = 0; i < anims.length; i++) {
      if (anims[i].animationName === 'glowBreath' && anims[i].currentTime != null) {
        return anims[i].currentTime % BREATH;
      }
    }
    return null;
  }
  function quoteLength() {
    var N = v.seconds * 1000;
    if (!v.align) return N;
    var p = breathPhase();
    if (p === null) return N;
    var shift = (PEAK - (p + N) % BREATH + BREATH) % BREATH;
    if (shift > BREATH / 2) shift -= BREATH;      /* nearest peak, ±2s */
    return N + shift;
  }

  /* Fit the words inside the ring: start at the largest size and step
     down until the box around the actual text has its corners inside
     the circle. A Range measures the text itself, not the line box. */
  var range = document.createRange();
  function fitText() {
    var R = v.size / 2 * v.fit;
    var size = +v.maxSize;
    var min = Math.min(+v.minSize, size);
    for (; size >= min; size -= 1) {
      quoteLine.style.fontSize = size + 'px';
      range.selectNodeContents(quoteLine);
      var box = range.getBoundingClientRect();
      if (Math.hypot(box.width / 2, box.height / 2) <= R) break;
    }
    if (size < min) quoteLine.style.fontSize = min + 'px';
  }

  function renderText(text) {
    quoteLine.textContent = '';
    quoteLine.classList.toggle('ink', v.ink > 0);
    quoteLine.classList.toggle('vertical', !!v.vertical);
    if (v.ink > 0) {
      var chars = Array.from(text);
      for (var i = 0; i < chars.length; i++) {
        var s = document.createElement('span');
        s.className = 'quote-char';
        s.style.setProperty('--i', i);
        s.textContent = chars[i];
        quoteLine.appendChild(s);
      }
    } else {
      quoteLine.textContent = text;
    }
    fitText();
  }

  function showQuote(pos) {
    if (!order.length) buildOrder();
    S.pos = (pos + order.length) % order.length;
    quoteLine.classList.remove('shown', 'leaving');
    renderText(quotes[order[S.pos]]);
    void quoteLine.offsetWidth;
    quoteLine.classList.add('shown');
    S.start = now();
    if (S.frozen) S.frozenAt = S.start;
    S.D = quoteLength();
    S.phase = 'showing';
    S.nextPos = null;
    S.lastSec = -1;
    countEl.textContent = (S.pos + 1) + ' / ' + order.length;
    if (v.floret) floretOnRing();
  }

  function startLeaving(fromFrac) {
    S.fromFrac = fromFrac;
    S.phase = 'leaving';
    quoteLine.classList.remove('shown');
    quoteLine.classList.add('leaving');
  }

  /* Preview-only shortcut: fade the current quote and show another. */
  function goTo(pos) {
    S.nextPos = pos;
    if (S.phase !== 'showing') return;
    var from = currentFrac();
    S.D = elapsed() + v.fade * 1000 * 0.7;
    startLeaving(from);
  }

  var easeInOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };

  /* How much of the ring the arc covers right now (0 to 1). */
  function currentFrac() {
    var e = elapsed();
    var fill = v.refill * 1000;
    if (fill > 0 && e < fill) return easeInOut(Math.max(0, e) / fill);
    var run = Math.max(1, S.D - fill);
    return Math.max(0, Math.min(1, (S.D - e) / run));
  }

  function drawArc(frac) {
    arc.style.strokeDashoffset = (RING * (1 - frac)).toFixed(2);
    var a = frac * 2 * Math.PI;
    bead.setAttribute('cx', (180 + 90 * Math.sin(a)).toFixed(2));
    bead.setAttribute('cy', (180 - 90 * Math.cos(a)).toFixed(2));
    bead.style.visibility = frac > 0.002 ? 'visible' : 'hidden';
  }

  function tick() {
    requestAnimationFrame(tick);
    if (S.phase === 'idle') return;
    var e = elapsed();
    var rem = S.D - e;
    var fadeMs = v.fade * 1000;

    if (S.phase === 'showing') {
      var frac = currentFrac();
      drawArc(frac);
      if (rem <= fadeMs) startLeaving(frac);
    } else {
      /* While the words fade, the last of the arc runs out. */
      drawArc(Math.max(0, S.fromFrac * Math.min(1, Math.max(0, rem) / fadeMs)));
    }

    var sec = Math.max(0, Math.ceil(rem / 1000));
    if (sec !== S.lastSec) { remainNum.textContent = sec; S.lastSec = sec; }

    if (rem <= 0 && S.phase === 'leaving') {
      showQuote(S.nextPos != null ? S.nextPos : S.pos + 1);
    }
  }

    if (document.hidden && !S.frozen) { S.frozenAt = now(); S.frozen = true; }
    else if (!document.hidden && S.frozen) { S.start += now() - S.frozenAt; S.frozen = false; }
  });

  /* ============================================================
     WATER: rain drops and 金木犀 florets (app.js numbers)
     ============================================================ */
  var RIPPLE_COLOURS_SUBTLE = ['rgba(255, 162, 89, 0.55)', 'rgba(253, 232, 218, 0.40)'];
  var RIPPLE_COLOURS_TRAIL  = ['rgba(255, 162, 89, 0.40)'];
  var RIPPLE_LIFE = 1900, RIPPLE_STAGGER = 150;

  function spawnRipples(x, y, intensity) {
    var palette, cls, baseSize;
    if (intensity === 'trail') { palette = RIPPLE_COLOURS_TRAIL; cls = ' trail'; baseSize = 22; }
    else { palette = RIPPLE_COLOURS_SUBTLE; cls = ' subtle'; baseSize = 26; }
    for (var i = 0; i < palette.length; i++) {
      (function (idx) {
        var r = document.createElement('div');
        r.className = 'ripple' + cls;
        var jx = (idx - (palette.length - 1) / 2) * 3 + (Math.random() * 4 - 2);
        var jy = (idx - (palette.length - 1) / 2) * 3 + (Math.random() * 4 - 2);
        r.style.left = (x + jx) + 'px';
        r.style.top = (y + jy) + 'px';
        r.style.color = palette[idx];
        r.style.animationDelay = (idx * RIPPLE_STAGGER) + 'ms';
        r.style.width = (baseSize + idx * 6) + 'px';
        r.style.height = (baseSize + idx * 6) + 'px';
        rippleLayer.appendChild(r);
        setTimeout(function () { if (r.parentNode) r.parentNode.removeChild(r); }, RIPPLE_LIFE + 210 + idx * RIPPLE_STAGGER);
      })(i);

  }
  function scheduleRain() {
    setTimeout(function () {
      if (!document.hidden && !reduced) {
        var p = randomSpot();
        spawnRipples(p.x, p.y, 'subtle');
        if (Math.random() < 0.25) {
          setTimeout(function () { var q = randomSpot(); spawnRipples(q.x, q.y, 'subtle'); }, 400 + Math.random() * 500);
        }
      }
      scheduleRain();
    }, 500 * (0.7 + Math.random() * 0.6));
  }

  /* 金木犀 florets: tiny four-petal flowers drift down with a gentle
     sway, land on the water with a small ripple, float, then fade. */
  var FLORET_SVG = '<svg viewBox="-7 -7 14 14" width="14" height="14">' +
    '<g fill="#F07D40"><circle cx="0" cy="-3" r="2.9"/><circle cx="3" cy="0" r="2.9"/>' +
    '<circle cx="0" cy="3" r="2.9"/><circle cx="-3" cy="0" r="2.9"/></g>' +
    '<circle r="1.5" fill="#C44E10"/></svg>';

  function scheduleFlorets(first) {
    setTimeout(function () {
      if (!document.hidden && !reduced) spawnFloret();
      scheduleFlorets(false);
    }, first ? 1800 : 4000 * (0.7 + Math.random() * 0.6));
  }
  /* One floret settles on the lower half of the ring as a quote arrives. */
  function floretOnRing() {
    var r = win.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2;
    var a = (25 + Math.random() * 130) * Math.PI / 180;
    spawnFloret(cx + R * Math.cos(a) - 7, cy + R * Math.sin(a) - 7, 4200);
  }
  function spawnFloret(tx, ty, fallMs) {
    if (reduced) return;
    var f = document.createElement('div');
    f.className = 'kinmokusei-floret';
    f.innerHTML = FLORET_SVG;
    floretLayer.appendChild(f);
    var W = innerWidth, H = innerHeight;
    var x1 = tx != null ? tx : W * (0.12 + Math.random() * 0.76);
    var y1 = ty != null ? ty : H * (0.3 + Math.random() * 0.55);
    var x0 = Math.min(W - 30, Math.max(30, x1 + (Math.random() * 160 - 80)));
    var s = 0.8 + Math.random() * 0.5;
    var r0 = Math.random() * 360;
    var sway = 22 + Math.random() * 18;
    var fall = fallMs || 7000 + Math.random() * 3000;
    var steps = [];
    for (var i = 0; i <= 6; i++) {
      var t = i / 6;
      var x = x0 + (x1 - x0) * t + Math.sin(t * Math.PI * 3) * sway * (1 - t * 0.6);
      var y = -20 + (y1 + 20) * t;
      steps.push({
        transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + (r0 + t * 220).toFixed(0) + 'deg) scale(' + s.toFixed(2) + ')',
        opacity: i === 0 ? 0 : 1
      });
    }
    var a = f.animate(steps, { duration: fall, easing: 'cubic-bezier(0.3, 0, 0.55, 1)', fill: 'forwards' });
    a.onfinish = function () {
      if (!f.parentNode) return;
      spawnRipples(x1 + 7 * s, y1 + 7 * s, 'trail');
      var end = 'translate(' + (x1 + 10).toFixed(1) + 'px,' + (y1 + 4).toFixed(1) + 'px) rotate(' + (r0 + 250).toFixed(0) + 'deg) scale(' + (s * 0.9).toFixed(2) + ')';
      var b = f.animate([steps[6], { transform: end, opacity: 0 }], { duration: 6000, easing: 'ease-in', fill: 'forwards' });
      b.onfinish = function () { if (f.parentNode) f.parentNode.removeChild(f); };
    };
  }

  /* ============================================================
     LANTERNS (copied from app.js so the background is the same)
     ============================================================ */
  var LANTERN_COUNT = 10, LANTERN_TILE = 60;
  var lanternLit = document.getElementById('lanternLit');
  var lanternBloom = document.getElementById('lanternBloom');
  function lanternBounds() {
    var half = LANTERN_TILE / 2;
    return { maxI: Math.floor(innerWidth / half), maxJ: Math.floor(innerHeight / half) };
  }
  function lanternPlace(L) {
    var half = LANTERN_TILE / 2, dot = LANTERN_TILE * 1.5, glow = LANTERN_TILE * 4;
    L.dot.style.transform = 'translate3d(' + (L.i * half - dot / 2) + 'px,' + (L.j * half - dot / 2) + 'px,0)';
    L.glow.style.transform = 'translate3d(' + (L.i * half - glow / 2) + 'px,' + (L.j * half - glow / 2) + 'px,0)';
  }
  function lanternRandomSpot() {
    var b = lanternBounds();
    var i = 1 + Math.floor(Math.random() * Math.max(1, b.maxI - 1));
    var j = 1 + Math.floor(Math.random() * Math.max(1, b.maxJ - 1));
    if ((i + j) % 2) j += 1;
    return { i: i, j: j };
  }
  function lanternStep(L) {
    var b = lanternBounds();
    var all = [[1, 1], [1, -1], [-1, 1], [-1, -1]], open = [];
    for (var t = 0; t < all.length; t++) {
      var ni = L.i + all[t][0], nj = L.j + all[t][1];
      if (ni > 0 && nj > 0 && ni < b.maxI && nj < b.maxJ) open.push(all[t]);
    }
    if (!open.length) { var s = lanternRandomSpot(); L.i = s.i; L.j = s.j; L.dir = null; return; }
    var pick = null;
    if (L.dir && Math.random() < 0.6) {
      for (var k = 0; k < open.length; k++) if (open[k][0] === L.dir[0] && open[k][1] === L.dir[1]) pick = open[k];
    }
    if (!pick) pick = open[Math.floor(Math.random() * open.length)];
    L.i += pick[0]; L.j += pick[1]; L.dir = pick;
  }
  function buildLanterns() {
    lanternLit.innerHTML = '';
    lanternBloom.innerHTML = '';
    if (reduced) return;
    for (var k = 0; k < LANTERN_COUNT; k++) {
      var delay = (-7 * k / LANTERN_COUNT).toFixed(2) + 's';
      var dot = document.createElement('div');
      var glow = document.createElement('div');
      dot.className = 'lantern';
      glow.className = 'lantern-bloom';
      dot.style.setProperty('--d', delay);
      glow.style.setProperty('--d', delay);
      dot.style.width = dot.style.height = (LANTERN_TILE * 1.5) + 'px';
      glow.style.width = glow.style.height = (LANTERN_TILE * 4) + 'px';
      lanternLit.appendChild(dot);
      lanternBloom.appendChild(glow);
      var spot = lanternRandomSpot();
      var L = { dot: dot, glow: glow, i: spot.i, j: spot.j, dir: null };
      lanternPlace(L);
      dot.addEventListener('animationiteration', (function (L) {
        return function () { lanternStep(L); lanternPlace(L); };
      })(L));
    }
  }
  var lanternResize = null;
  addEventListener('resize', function () {
    clearTimeout(lanternResize);
    lanternResize = setTimeout(buildLanterns, 250);
  });

  /* ============================================================
     START
     ============================================================ */
  applyCSS();
  drawArc(0);
  buildLanterns();
  scheduleRain();
  scheduleFlorets(true);
  requestAnimationFrame(tick);
  var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.all([loadQuotes(), fontsReady]).then(function () {
    buildOrder();
    setTimeout(function () { showQuote(0); }, 700);
  });
})();
</script>
